item-liquid-teleport.displayName = Тэлепартацыя прадметаў і вадкасцей
item-liquid-teleport.subtitle = v1.3.4: пераклады на ўсе 35 моў Mindustry, праверка лакалізацыі
item-liquid-teleport.description = Дадае чыт-узроўневыя Хроно-блокі для глабальнай транспартоўкі прадметаў і вадкасцей, пераўтварэння ландшафту, канвертацыі прадметаў, рамонту, будаўніцтва, паскарэння, узмацнення юнітаў, аслаблення юнітаў і размяшчэння ядра, а таксама базу дронаў-шахцёраў Форпост.\nАбнаўленне: кожны радок блокаў, юнітаў, статусаў і меню перакладзены на ўсе 35 моў, якія падтрымлівае Mindustry; праверка блакуе каміты без перакладу.\nАбнаўленне: новы Малы форпост — версія 2x2 на mono са зніжанымі лімітамі паляпшэнняў; выбар руды паказвае адзін радок на планету; колеры кошту паляпшэнняў абнаўляюцца ў рэальным часе.\nАбнаўленне: новы блок Форпост будуе лятучых дронаў-шахцёраў, якія дастаўляюць абраную руду ў ядро; траціце прадметы з ядра на паляпшэнне ліміту юнітаў, хуткасці, хуткасці здабычы, грузападъёмнасці і ўзроўню здабычы.
block.item-liquid-teleport-chrono-unloader.name = Хроно-разгрузнік
block.item-liquid-teleport-chrono-unloader.description = Выцягвае абраны прадмет з усіх звязаных будынкаў глабальна і выводзіць яго праз канвееры.
block.item-liquid-teleport-chrono-pusher.name = Хроно-загрузнік
block.item-liquid-teleport-chrono-pusher.description = Адпраўляе ўсе захаваныя прадметы ў звязаныя будынкі глабальна.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно-вадкасны разгрузнік
block.item-liquid-teleport-chrono-liquid-unloader.description = Выцягвае абраную вадкасць з усіх звязаных будынкаў глабальна і выводзіць яе праз трубы.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно-вадкасны загрузнік
block.item-liquid-teleport-chrono-liquid-pusher.description = Адпраўляе абраную вадкасць ва ўсе звязаныя будынкі глабальна.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно-вадкасны ўкладчык
block.item-liquid-teleport-chrono-liquid-tiler.description = Пераўтварае бліжэйшы ландшафт у абранае вадкаснае пакрыццё па адным тайле за раз.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно-рудны ўкладчык
block.item-liquid-teleport-chrono-item-tiler.description = Пераўтварае бліжэйшы ландшафт у абранае руднае пакрыццё па адным тайле за раз.
block.item-liquid-teleport-chrono-item-converter.name = Хроно-канвертар
block.item-liquid-teleport-chrono-item-converter.description = Канвертуе абраны ўваходны прадмет у абраны выхадны прадмет з каэфіцыентам, хуткасцю і энергазатратамі ў залежнасці ад рэдкасці.
block.item-liquid-teleport-chrono-core.name = Хроно-ядро
block.item-liquid-teleport-chrono-core.description = Чыт-ядро памерам 1x1, заўсёды разблакіраванае, вырабляе юнітаў гама.
block.item-liquid-teleport-chrono-mender.name = Хроно-рамонтнік
block.item-liquid-teleport-chrono-mender.description = Бесперапынна лечыць усе сяброўскія будынкі глабальна. Малыя базы цалкам аднаўляюцца некалькі разоў на секунду; вялікія базы лечацца паслядоўным праходам. Не патрабуе энергіі ці рэсурсаў.
block.item-liquid-teleport-chrono-repair-point.name = Хроно-рамонтная кропка
block.item-liquid-teleport-chrono-repair-point.description = Рамантуе пашкоджаных сяброўскіх юнітаў глабальна, аднаўляючы 50% макс. здароўя за секунду бесперапынным прамянём.
block.item-liquid-teleport-chrono-build-tower.name = Хроно-будаўнічая вежа
block.item-liquid-teleport-chrono-build-tower.description = Аўтаматычна аднаўляе пабудовы глабальна і дапамагае будаўніцтву паводле логікі стандартнай будаўнічай вежы.
block.item-liquid-teleport-chrono-booster.name = Хроно-паскаральнік
block.item-liquid-teleport-chrono-booster.description = Купал паскарэння 1x1, які прымае дадатковыя прадметы і вадкасці для дадання радыусу і хуткасці.
block.item-liquid-teleport-chrono-buffer.name = Хроно-ўзмацняльнік
block.item-liquid-teleport-chrono-buffer.description = Накладае станоўчыя эфекты на сяброўскіх юнітаў у радыусе. Дадатковыя прадметы і вадкасці павялічваюць радыус, працягласць і колькасць даступных статусаў.
block.item-liquid-teleport-chrono-debuffer.name = Хроно-аслабляльнік
block.item-liquid-teleport-chrono-debuffer.description = Накладае адмоўныя эфекты на варожых юнітаў у радыусе. Дадатковыя прадметы і вадкасці павялічваюць радыус і працягласць эфектаў.
status.item-liquid-teleport-chrono-conductive.name = Хроно-правадзімасць
status.item-liquid-teleport-chrono-conductive.description = Павялічвае хуткасць юніта.
status.item-liquid-teleport-chrono-dense.name = Хроно-шчыльнасць
status.item-liquid-teleport-chrono-dense.description = Павялічвае здароўе юніта.
status.item-liquid-teleport-chrono-focus.name = Хроно-фокус
status.item-liquid-teleport-chrono-focus.description = Павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-precision.name = Хроно-дакладнасць
status.item-liquid-teleport-chrono-precision.description = Павялічвае хуткасць перазарадкі юніта.
status.item-liquid-teleport-chrono-slip.name = Хроно-слізганне
status.item-liquid-teleport-chrono-slip.description = Павялічвае хуткасць юніта.
status.item-liquid-teleport-chrono-ignite.name = Хроно-займанне
status.item-liquid-teleport-chrono-ignite.description = Павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-alloyed.name = Хроно-сплаў
status.item-liquid-teleport-chrono-alloyed.description = Павялічвае здароўе юніта.
status.item-liquid-teleport-chrono-jagged.name = Хроно-зазубрына
status.item-liquid-teleport-chrono-jagged.description = Павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-elastic.name = Хроно-пругкасць
status.item-liquid-teleport-chrono-elastic.description = Павялічвае здароўе юніта.
status.item-liquid-teleport-chrono-surge.name = Хроно-імпульс
status.item-liquid-teleport-chrono-surge.description = Павялічвае хуткасць перазарадкі юніта.
status.item-liquid-teleport-chrono-pyro.name = Хроно-піра
status.item-liquid-teleport-chrono-pyro.description = Значна павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-blast.name = Хроно-выбух
status.item-liquid-teleport-chrono-blast.description = Шматразова павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-cooled.name = Хроно-астуджэнне
status.item-liquid-teleport-chrono-cooled.description = Павялічвае хуткасць перазарадкі юніта.
status.item-liquid-teleport-chrono-molten.name = Хроно-расплаў
status.item-liquid-teleport-chrono-molten.description = Павялічвае ўрон юніта.
status.item-liquid-teleport-chrono-lubed.name = Хроно-змазка
status.item-liquid-teleport-chrono-lubed.description = Павялічвае хуткасць юніта.
status.item-liquid-teleport-chrono-cryo.name = Хроно-крыё
status.item-liquid-teleport-chrono-cryo.description = Значна павялічвае хуткасць перазарадкі юніта.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Будуе дронаў-шахцёраў, па аднаму кожныя 5 секунд, да ліміту юнітаў. Абярыце тып руды ў меню блока; дроны здабываюць бліжэйшую руду гэтага тыпу і дастаўляюць у ядро. Траціце прадметы з ядра для паляпшэння пяці незалежных галін: ліміт юнітаў, хуткасць дронаў, хуткасць здабычы, грузападъёмнасць і ўзровень здабычы. Дроны гінуць пры знішчэнні Форпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Лятучы дрон-шахцёр, выраблены Форпостам. Яго характарыстыкі залежаць ад узроўняў паляпшэнняў Форпоста.
block.item-liquid-teleport-outpost-small.name = Малы форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2, які будуе малых дронаў-шахцёраў, па аднаму кожныя 5 секунд, да ліміту юнітаў. Абярыце тып руды ў меню блока; дроны здабываюць бліжэйшую руду гэтага тыпу і дастаўляюць у ядро. Пяць галін паляпшэнняў са зніжанымі лімітамі: ліміт юнітаў, хуткасць дронаў, хуткасць здабычы, грузападъёмнасць і ўзровень здабычы (макс. 2). Дроны гінуць пры знішчэнні Малога форпоста.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малога форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Малы лятучы дрон-шахцёр, выраблены Малым форпостам. Яго характарыстыкі залежаць ад узроўняў паляпшэнняў Малога форпоста.
