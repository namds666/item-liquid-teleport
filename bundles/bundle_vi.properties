status.item-liquid-teleport-chrono-molten.description = Tăng sát thương đơn vị.
status.item-liquid-teleport-chrono-lubed.name = Thời Không Bôi Trơn
status.item-liquid-teleport-chrono-lubed.description = Tăng tốc độ đơn vị.
status.item-liquid-teleport-chrono-cryo.name = Thời Không Đông Lạnh
status.item-liquid-teleport-chrono-cryo.description = Tăng mạnh tốc độ nạp đạn đơn vị.
block.item-liquid-teleport-outpost.name = Tiền Đồn
block.item-liquid-teleport-outpost.description = Xây drone khai thác mỗi 5 giây cho đến giới hạn đơn vị. Chọn loại quặng trong menu khối; drone đào quặng gần nhất thuộc loại đó và giao về lõi. Dùng vật phẩm từ lõi để nâng cấp 5 nhánh độc lập: giới hạn đơn vị, tốc độ drone, tốc độ đào, sức chứa và cấp đào. Drone chết khi Tiền Đồn bị phá hủy.
unit.item-liquid-teleport-outpost-drone.name = Drone Tiền Đồn
unit.item-liquid-teleport-outpost-drone.description = Drone khai thác bay do Tiền Đồn sản xuất. Chỉ số theo cấp nâng cấp của Tiền Đồn.
block.item-liquid-teleport-outpost-small.name = Tiền Đồn Nhỏ
block.item-liquid-teleport-outpost-small.description = Tiền Đồn 2x2 xây drone khai thác nhỏ mỗi 5 giây cho đến giới hạn đơn vị. Chọn loại quặng trong menu khối; drone đào quặng gần nhất thuộc loại đó và giao về lõi. 5 nhánh nâng cấp có giới hạn thấp hơn Tiền Đồn: giới hạn đơn vị, tốc độ drone, tốc độ đào, sức chứa và cấp đào (tối đa 2). Drone chết khi Tiền Đồn Nhỏ bị phá hủy.
unit.item-liquid-teleport-outpost-small-drone.name = Drone Tiền Đồn Nhỏ
unit.item-liquid-teleport-outpost-small-drone.description = Drone khai thác bay nhỏ do Tiền Đồn Nhỏ sản xuất. Chỉ số theo cấp nâng cấp của Tiền Đồn Nhỏ.
block.item-liquid-teleport-outpost-mega.name = Tiền Đồn Mega
block.item-liquid-teleport-outpost-mega.description = Tự hình thành khi bốn Tiền Đồn Nhỏ đứng thành ô vuông 2x2. Xây drone khai thác Mega với chỉ số gấp 4 lần drone Tiền Đồn Nhỏ và thang nâng cấp đạt tới 16 lần. Đào quặng cấp 3 ngay từ đầu, cấp 4 sau một lần nâng cấp. Không thể xây trực tiếp. Tháo dỡ hoàn lại bốn Tiền Đồn Nhỏ.
unit.item-liquid-teleport-outpost-mega-drone.name = Drone Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Drone khai thác hạng nặng do Tiền Đồn Mega xây. Đào loại quặng đã chọn và giao về lõi.
block.item-liquid-teleport-outpost-quad.name = Tiền Đồn Quad
block.item-liquid-teleport-outpost-quad.description = Tự hình thành khi bốn Tiền Đồn đứng thành ô vuông 2x2. Xây drone khai thác Quad với chỉ số gấp 4 lần drone Tiền Đồn và thang nâng cấp đạt tới 16 lần. Mỗi Quad thả một trợ thủ Mono cho mỗi cấp giới hạn đơn vị, tối đa bốn, cùng đào loại quặng đó. Đào quặng cấp 3 ngay từ đầu, cấp 4 sau một lần nâng cấp. Không thể xây trực tiếp. Tháo dỡ hoàn lại bốn Tiền Đồn.
unit.item-liquid-teleport-outpost-quad-drone.name = Drone Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Drone khai thác hạng nặng do Tiền Đồn Quad xây. Đào loại quặng đã chọn, giao về lõi và thả tối đa bốn trợ thủ Mono cùng đào bên nó.
