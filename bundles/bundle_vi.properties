item-liquid-teleport.displayName = Dịch Chuyển Vật Phẩm & Chất Lỏng
item-liquid-teleport.subtitle = v1.3.4: bản dịch cho toàn bộ 35 ngôn ngữ của Mindustry, kiểm tra bản địa hóa
item-liquid-teleport.description = Thêm các khối Thời Không cấp gian lận cho vận chuyển vật phẩm và chất lỏng toàn cầu, chuyển đổi địa hình, chuyển đổi vật phẩm, sửa chữa, xây dựng, tăng tốc, tăng cường đơn vị, giảm sức đơn vị và đặt lõi, cùng với căn cứ khai thác drone Tiền Đồn.\nCập nhật: mọi chuỗi của khối, đơn vị, trạng thái và menu đã được dịch sang toàn bộ 35 ngôn ngữ mà Mindustry hỗ trợ; một bước kiểm tra chặn commit thiếu bản dịch.\nCập nhật: Tiền Đồn Nhỏ mới, Tiền Đồn dựa trên mono 2x2 với giới hạn nâng cấp thấp hơn; bộ chọn quặng hiển thị một hàng mỗi hành tinh; màu chi phí nâng cấp cập nhật trực tiếp.\nCập nhật: khối Tiền Đồn mới xây drone khai thác bay giao quặng đã chọn về lõi; nâng cấp giới hạn đơn vị, tốc độ, tốc độ đào, sức chứa và cấp đào bằng vật phẩm từ lõi.
block.item-liquid-teleport-chrono-unloader.name = Bộ Dỡ Thời Không
block.item-liquid-teleport-chrono-unloader.description = Kéo vật phẩm đã chọn từ tất cả tòa nhà liên kết trên toàn bản đồ và xuất qua băng chuyền.
block.item-liquid-teleport-chrono-pusher.name = Bộ Đẩy Thời Không
block.item-liquid-teleport-chrono-pusher.description = Đẩy tất cả vật phẩm đã lưu vào các tòa nhà liên kết trên toàn bản đồ.
block.item-liquid-teleport-chrono-liquid-unloader.name = Bộ Dỡ Chất Lỏng Thời Không
block.item-liquid-teleport-chrono-liquid-unloader.description = Kéo chất lỏng đã chọn từ tất cả tòa nhà liên kết trên toàn bản đồ và xuất qua ống dẫn.
block.item-liquid-teleport-chrono-liquid-pusher.name = Bộ Đẩy Chất Lỏng Thời Không
block.item-liquid-teleport-chrono-liquid-pusher.description = Đẩy chất lỏng đã chọn vào tất cả tòa nhà liên kết trên toàn bản đồ.
block.item-liquid-teleport-chrono-liquid-tiler.name = Bộ Lát Chất Lỏng Thời Không
block.item-liquid-teleport-chrono-liquid-tiler.description = Chuyển đổi địa hình lân cận thành sàn chất lỏng đã chọn từng ô một.
block.item-liquid-teleport-chrono-item-tiler.name = Bộ Lát Quặng Thời Không
block.item-liquid-teleport-chrono-item-tiler.description = Chuyển đổi địa hình lân cận thành lớp phủ quặng đã chọn từng ô một.
block.item-liquid-teleport-chrono-item-converter.name = Bộ Chuyển Đổi Vật Phẩm Thời Không
block.item-liquid-teleport-chrono-item-converter.description = Chuyển đổi vật phẩm đầu vào đã chọn thành vật phẩm đầu ra đã chọn với tỉ lệ dựa trên độ hiếm, tốc độ và chi phí năng lượng.
block.item-liquid-teleport-chrono-core.name = Lõi Thời Không
block.item-liquid-teleport-chrono-core.description = Lõi cấp gian lận 1x1 luôn mở khóa và sản xuất đơn vị gamma.
block.item-liquid-teleport-chrono-mender.name = Bộ Hàn Gắn Thời Không
block.item-liquid-teleport-chrono-mender.description = Liên tục hồi phục tất cả tòa nhà đồng minh trên toàn bản đồ. Căn cứ nhỏ được phục hồi hoàn toàn nhiều lần mỗi giây; căn cứ lớn được hồi phục theo quét xoay vòng. Không cần năng lượng hay tài nguyên.
block.item-liquid-teleport-chrono-repair-point.name = Điểm Sửa Chữa Thời Không
block.item-liquid-teleport-chrono-repair-point.description = Sửa chữa đơn vị đồng minh bị hư hại trên toàn bản đồ với tia liên tục phục hồi 50% máu tối đa mỗi giây.
block.item-liquid-teleport-chrono-build-tower.name = Tháp Xây Dựng Thời Không
block.item-liquid-teleport-chrono-build-tower.description = Tự động xây lại công trình trên toàn bản đồ và hỗ trợ xây dựng bằng logic tháp xây dựng gốc.
block.item-liquid-teleport-chrono-booster.name = Bộ Tăng Tốc Thời Không
block.item-liquid-teleport-chrono-booster.description = Vòm tăng tốc 1x1 nhận thêm vật phẩm và chất lỏng để tăng thêm tầm xa và tốc độ.
block.item-liquid-teleport-chrono-buffer.name = Bộ Tăng Cường Thời Không
block.item-liquid-teleport-chrono-buffer.description = Áp dụng tăng cường cho đơn vị đồng minh trong phạm vi. Vật phẩm và chất lỏng bổ sung tăng bán kính, thời lượng và số trạng thái tùy chỉnh được mở khóa.
block.item-liquid-teleport-chrono-debuffer.name = Bộ Giảm Sức Thời Không
block.item-liquid-teleport-chrono-debuffer.description = Áp dụng hiệu ứng trạng thái tiêu cực chồng chất lên đơn vị địch trong phạm vi. Vật phẩm và chất lỏng bổ sung tăng bán kính và thời lượng trạng thái.
