block.item-liquid-teleport-outpost.name = 前哨基地
block.item-liquid-teleport-outpost.description = 5秒ごとに採掘ドローンを1機生産し、ユニット上限まで増やします。ブロックメニューで鉱石の種類を選択すると、ドローンが最寄りの鉱石を採掘してコアに届けます。コアのアイテムを消費して5つの独立パスをアップグレード：ユニット上限、ドローン速度、採掘速度、積載量、採掘ティア。前哨基地が破壊されるとドローンも消滅します。
unit.item-liquid-teleport-outpost-drone.name = 前哨ドローン
unit.item-liquid-teleport-outpost-drone.description = 前哨基地が生産する飛行採掘ドローン。ステータスは所属する前哨基地のアップグレードレベルに従います。
block.item-liquid-teleport-outpost-small.name = 小型前哨基地
block.item-liquid-teleport-outpost-small.description = 小型の採掘ドローンを5秒ごとに1機生産する2x2の前哨基地です。ブロックメニューで鉱石を選択すると、ドローンが最寄りの鉱石を採掘してコアに届けます。前哨基地より上限の低い5つのアップグレードパス：ユニット上限、ドローン速度、採掘速度、積載量、採掘ティア（最大2）。小型前哨基地が破壊されるとドローンも消滅します。
unit.item-liquid-teleport-outpost-small-drone.name = 小型前哨ドローン
unit.item-liquid-teleport-outpost-small-drone.description = 小型前哨基地が生産する小型飛行採掘ドローン。ステータスは所属する小型前哨基地のアップグレードレベルに従います。
block.item-liquid-teleport-outpost-mega.name = メガ前哨基地
block.item-liquid-teleport-outpost-mega.description = 小型前哨基地が4基、2x2の正方形に並ぶと自動的に形成される。小型前哨基地ドローンの4倍のステータスと最大16倍に達する強化段階を持つメガ採掘ドローンを生産する。最初からティア3の鉱石を採掘でき、1回の強化でティア4になる。直接建設はできない。解体すると小型前哨基地4基分が返却される。
unit.item-liquid-teleport-outpost-mega-drone.name = メガドローン
unit.item-liquid-teleport-outpost-mega-drone.description = メガ前哨基地が生産する重採掘ドローン。選択した鉱石を採掘してコアへ届ける。
block.item-liquid-teleport-outpost-quad.name = クアッド前哨基地
block.item-liquid-teleport-outpost-quad.description = 前哨基地が4基、2x2の正方形に並ぶと自動的に形成される。前哨基地ドローンの4倍のステータスと最大16倍に達する強化段階を持つクアッド採掘ドローンを生産する。各クアッドはユニット上限レベルごとに1体、最大4体のモノ補助機を展開し、同じ鉱石を採掘する。最初からティア3の鉱石を採掘でき、1回の強化でティア4になる。直接建設はできない。解体すると前哨基地4基分が返却される。
unit.item-liquid-teleport-outpost-quad-drone.name = クアッドドローン
unit.item-liquid-teleport-outpost-quad-drone.description = クアッド前哨基地が生産する重採掘ドローン。選択した鉱石を採掘してコアへ届け、最大4体のモノ補助機を展開して共に採掘する。
