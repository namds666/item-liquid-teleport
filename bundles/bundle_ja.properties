block.item-liquid-teleport-chrono-item-converter.name = クロノアイテム変換器
block.item-liquid-teleport-chrono-item-converter.description = 選択した入力アイテムを希少度に基づく比率・速度・電力コストで選択した出力アイテムに変換します。
block.item-liquid-teleport-chrono-core.name = クロノコア
block.item-liquid-teleport-chrono-core.description = 常時解放のチート級1x1コアで、ガンマユニットを生産します。
block.item-liquid-teleport-chrono-mender.name = クロノメンダー
block.item-liquid-teleport-chrono-mender.description = グローバルに全味方建造物を継続的に回復します。小規模基地は毎秒数回完全回復し、大規模基地はローリングスイープで回復します。電力や資源は不要です。
block.item-liquid-teleport-chrono-repair-point.name = クロノ修復ポイント
block.item-liquid-teleport-chrono-repair-point.description = グローバルに損傷した味方ユニットを連続ビームで毎秒最大HPの50%修復します。
block.item-liquid-teleport-chrono-build-tower.name = クロノ建設タワー
block.item-liquid-teleport-chrono-build-tower.description = バニラの建設タワーロジックで、グローバルに構造物を自動再建し建設を支援します。
block.item-liquid-teleport-chrono-booster.name = クロノブースター
block.item-liquid-teleport-chrono-booster.description = 追加のアイテムと液体で範囲と速度を加算的に強化する1x1オーバードライブドームです。
block.item-liquid-teleport-chrono-buffer.name = クロノバッファー
block.item-liquid-teleport-chrono-buffer.description = 範囲内の味方ユニットにバフを付与します。追加のアイテムと液体で範囲・持続時間が増加し、カスタムステータスが解放されます。
block.item-liquid-teleport-chrono-debuffer.name = クロノデバッファー
block.item-liquid-teleport-chrono-debuffer.description = 範囲内の敵ユニットに重複する負のステータス効果を付与します。追加のアイテムと液体で範囲と持続時間が増加します。
