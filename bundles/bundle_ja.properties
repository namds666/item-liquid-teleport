block.item-liquid-teleport-chrono-hypno.name = クロノ催眠
block.item-liquid-teleport-chrono-hypno.description = ユーリを1体維持します。ユーリが倒れると10秒待ち、貯蔵庫のシリコン25を使って復活させます。ユーリは20タイルの範囲で敵のユニットか建物を1つずつ拘束し、2秒後に味方へ変えます。拘束は距離に関係なく、対象が変換されるか倒れるまで続きます。コアは変換できません。コアのアイテムでアップグレードでき、10段階それぞれで範囲が1タイル伸び、チャネル時間が最短1秒まで短縮されます。クロノ催眠が破壊されるとユーリも倒れます。
unit.item-liquid-teleport-yuri.name = ユーリ
unit.item-liquid-teleport-yuri.description = 武器を持たない念動メック。敵を1体ずつ拘束して味方に変えます。他のユニットと同じく命令を受けます。クロノ催眠が生成します。
hypno.path = 催眠の力
hypno.value = {0}タイル, {1}s
