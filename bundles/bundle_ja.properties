item-liquid-teleport.displayName = アイテム液体テレポート
item-liquid-teleport.subtitle = v1.4.1：メガ／クアッド前哨基地の新外観
item-liquid-teleport.description = チート級のクロノブロックを追加。グローバルなアイテム・液体の輸送、地形変換、アイテム変換、修復、建設、オーバードライブ、ユニットバフ・デバフ、コア設置、そして前哨基地ドローン採掘拠点。\n更新：メガ前哨基地とクアッド前哨基地に、格納パッド、支柱、中央リアクターを備えた独自の建物デザインを追加。\n更新：2x2に並んだ小型前哨基地4基はメガ前哨基地（4x4）に、前哨基地4基はクアッド前哨基地（6x6）に合体する。どちらも4倍のステータスと最大16倍の強化段階を持つ重ドローンを生産し、クアッドドローンはモノ補助機を展開する。\n更新：前哨基地の鉱石選択は採掘ティアの強化直後に鉱石を解放する。新しい「最少」ボタンで、前哨基地はコアの保有量が最も少ない採掘可能な鉱石を採掘する。\n更新: 自動奪取をオンにすると、アンローダーは放棄済みを含む他チームの建物のみをリンクし、自チームの建物はスキップします。オンにすると自チームへのリンクが削除され、オフにすると他チームへのリンクが削除されます。\n更新: 自動リンクは選択したアイテムを出力する供給元のみを接続するようになりました。カテゴリ判定をアイテムフィルタより先に行い、ラグを軽減します。アンローダーとプッシャーのアイテム選択は8x2グリッドになりました。\n更新: ブロック、ユニット、ステータス、メニューのすべての文字列を Mindustry が対応する全35言語に翻訳。翻訳が欠けたコミットはチェックでブロックされます。\n更新：小型前哨基地を追加。2x2のmono版前哨基地でアップグレード上限が低め。鉱石選択が惑星ごとに1行ずつ表示。アップグレードコストの色がリアルタイム更新。\n更新：前哨基地ブロックを追加。飛行採掘ドローンを生産し、選択した鉱石をコアに届ける。コアのアイテムを消費してユニット上限・速度・採掘速度・積載量・採掘ティアの5つをアップグレード可能。
block.item-liquid-teleport-chrono-unloader.name = クロノアンローダー
block.item-liquid-teleport-chrono-unloader.description = グローバルにリンクされた全建造物から選択したアイテムを取り出し、コンベアから出力します。
block.item-liquid-teleport-chrono-pusher.name = クロノプッシャー
block.item-liquid-teleport-chrono-pusher.description = 保管中の全アイテムをグローバルにリンクされた建造物に送り込みます。
block.item-liquid-teleport-chrono-liquid-unloader.name = クロノ液体アンローダー
block.item-liquid-teleport-chrono-liquid-unloader.description = グローバルにリンクされた全建造物から選択した液体を取り出し、パイプから出力します。
block.item-liquid-teleport-chrono-liquid-pusher.name = クロノ液体プッシャー
block.item-liquid-teleport-chrono-liquid-pusher.description = 選択した液体をグローバルにリンクされた全建造物に送り込みます。
block.item-liquid-teleport-chrono-liquid-tiler.name = クロノ液体タイラー
block.item-liquid-teleport-chrono-liquid-tiler.description = 周囲の地形を選択した液体の床に1タイルずつ変換します。
block.item-liquid-teleport-chrono-item-tiler.name = クロノ鉱石タイラー
block.item-liquid-teleport-chrono-item-tiler.description = 周囲の地形を選択した鉱石オーバーレイに1タイルずつ変換します。
block.item-liquid-teleport-chrono-item-converter.name = クロノアイテム変換器
block.item-liquid-teleport-chrono-item-converter.description = 選択した入力アイテムを希少度に基づく比率・速度・電力コストで選択した出力アイテムに変換します。
block.item-liquid-teleport-chrono-core.name = クロノコア
block.item-liquid-teleport-chrono-core.description = 常時解放のチート級1x1コアで、ガンマユニットを生産します。
block.item-liquid-teleport-chrono-mender.name = クロノメンダー
block.item-liquid-teleport-chrono-mender.description = グローバルに全味方建造物を継続的に回復します。小規模基地は毎秒数回完全回復し、大規模基地はローリングスイープで回復します。電力や資源は不要です。
block.item-liquid-teleport-chrono-repair-point.name = クロノ修復ポイント
block.item-liquid-teleport-chrono-repair-point.description = グローバルに損傷した味方ユニットを連続ビームで毎秒最大HPの50%修復します。
block.item-liquid-teleport-chrono-build-tower.name = クロノ建設タワー
block.item-liquid-teleport-chrono-build-tower.description = バニラの建設タワーロジックで、グローバルに構造物を自動再建し建設を支援します。
block.item-liquid-teleport-chrono-booster.name = クロノブースター
block.item-liquid-teleport-chrono-booster.description = 追加のアイテムと液体で範囲と速度を加算的に強化する1x1オーバードライブドームです。
block.item-liquid-teleport-chrono-buffer.name = クロノバッファー
block.item-liquid-teleport-chrono-buffer.description = 範囲内の味方ユニットにバフを付与します。追加のアイテムと液体で範囲・持続時間が増加し、カスタムステータスが解放されます。
block.item-liquid-teleport-chrono-debuffer.name = クロノデバッファー
block.item-liquid-teleport-chrono-debuffer.description = 範囲内の敵ユニットに重複する負のステータス効果を付与します。追加のアイテムと液体で範囲と持続時間が増加します。
