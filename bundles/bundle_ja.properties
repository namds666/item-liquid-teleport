item-liquid-teleport.displayName = アイテム液体テレポート
item-liquid-teleport.subtitle = v1.4.16: MOD説明を短くし、変更をバージョン別に表示
item-liquid-teleport.description = アイテムと液体のグローバル輸送、地形とアイテムの変換、修理、建設、オーバードライブ、ユニットの強化と弱体化、マインドコントロール、コア設置を行うチート級のクロノブロック。採掘ドローンを作る拠点前哨基地も追加します。\n\n[accent]v1.4.16[]\nMOD説明を短くし、変更をバージョン別に表示。\n\n[accent]v1.4.15[]\n前哨基地、クアッド前哨基地、メガ前哨基地: 採掘ティア4アップグレードはチタンとシリコンを消費します。\n\n[accent]v1.4.14[]\n新ブロッククロノ催眠: ユーリが敵のユニットと建物を味方に変えます。\n\n[accent]v1.4.13[]\n前哨基地の追加採掘ビームは別々の鉱石タイルを狙います。\n\n[accent]v1.4.11 - 1.4.12[]\nクロノ鉱石タイラーとクロノ液体タイラーは正方形を塗り、半径を表示します。
block.item-liquid-teleport-chrono-unloader.name = クロノアンローダー
block.item-liquid-teleport-chrono-unloader.description = グローバルにリンクされた全建造物から選択したアイテムを取り出し、コンベアから出力します。
