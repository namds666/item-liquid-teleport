block.item-liquid-teleport-chrono-repair-point.description = ซ่อมแซมยูนิตฝ่ายเดียวกันที่เสียหายทั่วโลกด้วยลำแสงต่อเนื่องที่ฟื้นฟู 50% ของพลังชีวิตสูงสุดต่อวินาที
