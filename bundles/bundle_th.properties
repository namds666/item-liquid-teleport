item-liquid-teleport.displayName = ส่งไอเท็มและของเหลว
item-liquid-teleport.subtitle = v1.3.4: คำแปลครบทั้ง 35 ภาษาของ Mindustry, ระบบตรวจสอบการแปล
item-liquid-teleport.description = เพิ่มบล็อกโครโนระดับโกงสำหรับขนส่งไอเท็มและของเหลวทั่วโลก แปลงภูมิประเทศ แปลงไอเท็ม ซ่อมแซม ก่อสร้าง โอเวอร์ไดรฟ์ เสริมพลังยูนิต ลดพลังยูนิต และวางแกนกลาง พร้อมฐานหน้าด่านสำหรับขุดแร่ด้วยโดรน\nอัปเดต: ข้อความของบล็อก ยูนิต สถานะ และเมนูทั้งหมดถูกแปลเป็นทั้ง 35 ภาษาที่ Mindustry รองรับ; ระบบตรวจสอบจะบล็อกคอมมิตที่ขาดคำแปล\nอัปเดต: ฐานหน้าด่านขนาดเล็กใหม่ ขนาด 2x2 แบบ mono มีขีดจำกัดอัปเกรดต่ำกว่า; ตัวเลือกแร่แสดงหนึ่งแถวต่อดาวเคราะห์; สีต้นทุนอัปเกรดอัปเดตแบบสด\nอัปเดต: บล็อกฐานหน้าด่านใหม่สร้างโดรนขุดแร่บินได้ที่ส่งแร่ที่เลือกไปยังแกนกลาง; อัปเกรดจำนวนยูนิต ความเร็ว ความเร็วขุด ความจุบรรทุก และระดับการขุดด้วยไอเท็มจากแกนกลาง
block.item-liquid-teleport-chrono-unloader.name = โครโนตัวขนถ่าย
block.item-liquid-teleport-chrono-unloader.description = ดึงไอเท็มที่เลือกจากอาคารที่เชื่อมต่อทั้งหมดทั่วโลกและส่งออกผ่านสายพาน
block.item-liquid-teleport-chrono-pusher.name = โครโนตัวผลัก
block.item-liquid-teleport-chrono-pusher.description = ผลักไอเท็มที่เก็บไว้ทั้งหมดไปยังอาคารที่เชื่อมต่อทั่วโลก
block.item-liquid-teleport-chrono-liquid-unloader.name = โครโนตัวขนถ่ายของเหลว
block.item-liquid-teleport-chrono-liquid-unloader.description = ดึงของเหลวที่เลือกจากอาคารที่เชื่อมต่อทั้งหมดทั่วโลกและส่งออกผ่านท่อ
block.item-liquid-teleport-chrono-liquid-pusher.name = โครโนตัวผลักของเหลว
block.item-liquid-teleport-chrono-liquid-pusher.description = ผลักของเหลวที่เลือกไปยังอาคารที่เชื่อมต่อทั้งหมดทั่วโลก
block.item-liquid-teleport-chrono-liquid-tiler.name = โครโนตัวปูพื้นของเหลว
block.item-liquid-teleport-chrono-liquid-tiler.description = แปลงภูมิประเทศใกล้เคียงเป็นพื้นของเหลวที่เลือกทีละช่อง
block.item-liquid-teleport-chrono-item-tiler.name = โครโนตัวปูพื้นแร่
block.item-liquid-teleport-chrono-item-tiler.description = แปลงภูมิประเทศใกล้เคียงเป็นชั้นแร่ที่เลือกทีละช่อง
block.item-liquid-teleport-chrono-item-converter.name = โครโนตัวแปลงไอเท็ม
block.item-liquid-teleport-chrono-item-converter.description = แปลงไอเท็มนำเข้าที่เลือกเป็นไอเท็มส่งออกที่เลือกด้วยอัตราส่วนตามความหายาก ความเร็ว และต้นทุนพลังงาน
block.item-liquid-teleport-chrono-core.name = โครโนแกนกลาง
block.item-liquid-teleport-chrono-core.description = แกนกลาง 1x1 ระดับโกงที่ปลดล็อกตลอดเวลาและผลิตยูนิตแกมมา
block.item-liquid-teleport-chrono-mender.name = โครโนตัวซ่อม
block.item-liquid-teleport-chrono-mender.description = รักษาอาคารฝ่ายเดียวกันทั้งหมดอย่างต่อเนื่องทั่วโลก ฐานเล็กจะถูกซ่อมเต็มหลายครั้งต่อวินาที; ฐานใหญ่จะถูกรักษาแบบหมุนเวียน ไม่ต้องใช้พลังงานหรือทรัพยากร
block.item-liquid-teleport-chrono-repair-point.name = โครโนจุดซ่อมแซม
block.item-liquid-teleport-chrono-repair-point.description = ซ่อมแซมยูนิตฝ่ายเดียวกันที่เสียหายทั่วโลกด้วยลำแสงต่อเนื่องที่ฟื้นฟู 50% ของพลังชีวิตสูงสุดต่อวินาที
block.item-liquid-teleport-chrono-build-tower.name = โครโนหอก่อสร้าง
block.item-liquid-teleport-chrono-build-tower.description = สร้างโครงสร้างใหม่โดยอัตโนมัติทั่วโลกและช่วยก่อสร้างด้วยระบบหอก่อสร้างมาตรฐาน
block.item-liquid-teleport-chrono-booster.name = โครโนตัวเร่ง
block.item-liquid-teleport-chrono-booster.description = โดมโอเวอร์ไดรฟ์ขนาด 1x1 ที่รับไอเท็มและของเหลวเพิ่มเติมเพื่อเพิ่มระยะและความเร็ว
block.item-liquid-teleport-chrono-buffer.name = โครโนตัวเสริม
block.item-liquid-teleport-chrono-buffer.description = มอบบัฟให้ยูนิตฝ่ายเดียวกันในระยะ ไอเท็มและของเหลวเพิ่มเติมจะเพิ่มรัศมี ระยะเวลา และจำนวนสถานะพิเศษที่ปลดล็อก
block.item-liquid-teleport-chrono-debuffer.name = โครโนตัวลดพลัง
block.item-liquid-teleport-chrono-debuffer.description = มอบเอฟเฟกต์สถานะเชิงลบแบบซ้อนได้ให้ยูนิตศัตรูในระยะ ไอเท็มและของเหลวเพิ่มเติมจะเพิ่มรัศมีและระยะเวลาสถานะ
