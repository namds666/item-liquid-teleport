block.item-liquid-teleport-outpost.name = ฐานหน้าด่าน
block.item-liquid-teleport-outpost.description = สร้างโดรนขุดแร่ทุก 5 วินาทีจนถึงจำนวนยูนิตสูงสุด เลือกชนิดแร่ในเมนูบล็อก; โดรนจะขุดแร่ชนิดนั้นที่ใกล้ที่สุดและส่งไปยังแกนกลาง ใช้ไอเท็มจากแกนกลางเพื่ออัปเกรด 5 เส้นทางอิสระ: จำนวนยูนิต ความเร็วโดรน ความเร็วขุด ความจุบรรทุก และระดับการขุด โดรนจะตายเมื่อฐานหน้าด่านถูกทำลาย
unit.item-liquid-teleport-outpost-drone.name = โดรนฐานหน้าด่าน
unit.item-liquid-teleport-outpost-drone.description = โดรนขุดแร่บินได้ที่ผลิตโดยฐานหน้าด่าน สถิติจะตามระดับอัปเกรดของฐานหน้าด่าน
block.item-liquid-teleport-outpost-small.name = ฐานหน้าด่านขนาดเล็ก
block.item-liquid-teleport-outpost-small.description = ฐานหน้าด่าน 2x2 ที่สร้างโดรนขุดแร่ขนาดเล็กทุก 5 วินาทีจนถึงจำนวนยูนิตสูงสุด เลือกชนิดแร่ในเมนูบล็อก; โดรนจะขุดแร่ชนิดนั้นที่ใกล้ที่สุดและส่งไปยังแกนกลาง 5 เส้นทางอัปเกรดมีขีดจำกัดต่ำกว่าฐานหน้าด่าน: จำนวนยูนิต ความเร็วโดรน ความเร็วขุด ความจุบรรทุก และระดับการขุด (สูงสุด 2) โดรนจะตายเมื่อฐานหน้าด่านขนาดเล็กถูกทำลาย
unit.item-liquid-teleport-outpost-small-drone.name = โดรนฐานหน้าด่านขนาดเล็ก
unit.item-liquid-teleport-outpost-small-drone.description = โดรนขุดแร่บินได้ขนาดเล็กที่ผลิตโดยฐานหน้าด่านขนาดเล็ก สถิติจะตามระดับอัปเกรดของฐานหน้าด่านขนาดเล็ก
