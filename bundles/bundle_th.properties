block.item-liquid-teleport-outpost.name = ฐานหน้าด่าน
block.item-liquid-teleport-outpost.description = สร้างโดรนขุดแร่ทุก 5 วินาทีจนถึงจำนวนยูนิตสูงสุด เลือกชนิดแร่ในเมนูบล็อก; โดรนจะขุดแร่ชนิดนั้นที่ใกล้ที่สุดและส่งไปยังแกนกลาง ใช้ไอเท็มจากแกนกลางเพื่ออัปเกรด 5 เส้นทางอิสระ: จำนวนยูนิต ความเร็วโดรน ความเร็วขุด ความจุบรรทุก และระดับการขุด โดรนจะตายเมื่อฐานหน้าด่านถูกทำลาย
unit.item-liquid-teleport-outpost-drone.name = โดรนฐานหน้าด่าน
unit.item-liquid-teleport-outpost-drone.description = โดรนขุดแร่บินได้ที่ผลิตโดยฐานหน้าด่าน สถิติจะตามระดับอัปเกรดของฐานหน้าด่าน
block.item-liquid-teleport-outpost-micro.name = ฐานหน้าด่านไมโคร
block.item-liquid-teleport-outpost-micro.description = ฐานหน้าด่านขนาด 1x1 ที่สร้างโดรนขุดขนาดไมโคร ทุก 5 วินาทีต่อหนึ่งลำ จนถึงขีดจำกัดยูนิต เลือกชนิดแร่ในเมนูบล็อก โดรนจะขุดแร่ชนิดนั้นที่ใกล้ที่สุดแล้วส่งไปยังแกนกลาง สายอัปเกรดที่มีขีดจำกัดต่ำกว่าฐานหน้าด่านขนาดเล็ก: ขีดจำกัดยูนิต ความเร็ว ความเร็วในการขุด ความจุการขนส่ง ระดับการขุด (สูงสุด 2 ขุดถ่านหินได้) และอื่นๆ ฐานหน้าด่านไมโคร 4 แห่งในรูปสี่เหลี่ยมจัตุรัส 2x2 จะรวมกันเป็นฐานหน้าด่านขนาดเล็ก โดรนจะตายเมื่อฐานหน้าด่านไมโครถูกทำลาย
unit.item-liquid-teleport-outpost-micro-drone.name = โดรนฐานหน้าด่านไมโคร
unit.item-liquid-teleport-outpost-micro-drone.description = โดรนขุดบินได้ขนาดจิ๋วที่ผลิตโดยฐานหน้าด่านไมโคร ค่าสถานะของมันเป็นไปตามระดับอัปเกรดของฐานหน้าด่านไมโครของมัน
block.item-liquid-teleport-outpost-small.name = ฐานหน้าด่านขนาดเล็ก
block.item-liquid-teleport-outpost-small.description = ฐานหน้าด่าน 2x2 ที่สร้างโดรนขุดแร่ขนาดเล็กทุก 5 วินาทีจนถึงจำนวนยูนิตสูงสุด เลือกชนิดแร่ในเมนูบล็อก; โดรนจะขุดแร่ชนิดนั้นที่ใกล้ที่สุดและส่งไปยังแกนกลาง 5 เส้นทางอัปเกรดมีขีดจำกัดต่ำกว่าฐานหน้าด่าน: จำนวนยูนิต ความเร็วโดรน ความเร็วขุด ความจุบรรทุก และระดับการขุด (สูงสุด 2) โดรนจะตายเมื่อฐานหน้าด่านขนาดเล็กถูกทำลาย
unit.item-liquid-teleport-outpost-small-drone.name = โดรนฐานหน้าด่านขนาดเล็ก
unit.item-liquid-teleport-outpost-small-drone.description = โดรนขุดแร่บินได้ขนาดเล็กที่ผลิตโดยฐานหน้าด่านขนาดเล็ก สถิติจะตามระดับอัปเกรดของฐานหน้าด่านขนาดเล็ก
block.item-liquid-teleport-outpost-mega.name = ฐานหน้าด่านเมกา
block.item-liquid-teleport-outpost-mega.description = ก่อตัวอัตโนมัติเมื่อฐานหน้าด่านขนาดเล็ก 4 หลังวางเป็นสี่เหลี่ยม 2x2 สร้างโดรนขุด Mega ที่มีค่าพลัง 4 เท่าของโดรนฐานหน้าด่านขนาดเล็กและขั้นอัปเกรดสูงสุดถึง 16 เท่า ขุดแร่ระดับ 3 ได้ตั้งแต่แรก และระดับ 4 หลังอัปเกรดหนึ่งครั้ง สร้างโดยตรงไม่ได้ การรื้อคืนวัสดุเท่าฐานหน้าด่านขนาดเล็ก 4 หลัง
unit.item-liquid-teleport-outpost-mega-drone.name = โดรน Mega
unit.item-liquid-teleport-outpost-mega-drone.description = โดรนขุดหนักที่ฐานหน้าด่านเมกาสร้าง ขุดแร่ที่เลือกและส่งไปยังแกน
block.item-liquid-teleport-outpost-quad.name = ฐานหน้าด่านควอด
block.item-liquid-teleport-outpost-quad.description = ก่อตัวอัตโนมัติเมื่อฐานหน้าด่าน 4 หลังวางเป็นสี่เหลี่ยม 2x2 สร้างโดรนขุด Quad ที่มีค่าพลัง 4 เท่าของโดรนฐานหน้าด่านและขั้นอัปเกรดสูงสุดถึง 16 เท่า Quad แต่ละตัวปล่อยผู้ช่วย Mono 1 ตัวต่อระดับขีดจำกัดยูนิต สูงสุด 4 ตัว ซึ่งขุดแร่ชนิดเดียวกัน ขุดแร่ระดับ 3 ได้ตั้งแต่แรก และระดับ 4 หลังอัปเกรดหนึ่งครั้ง สร้างโดยตรงไม่ได้ การรื้อคืนวัสดุเท่าฐานหน้าด่าน 4 หลัง
unit.item-liquid-teleport-outpost-quad-drone.name = โดรน Quad
unit.item-liquid-teleport-outpost-quad-drone.description = โดรนขุดหนักที่ฐานหน้าด่านควอดสร้าง ขุดแร่ที่เลือก ส่งไปยังแกน และปล่อยผู้ช่วย Mono สูงสุด 4 ตัวมาขุดร่วมกัน
