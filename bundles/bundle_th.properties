unit.item-liquid-teleport-outpost-quad-drone.name = โดรน Quad
unit.item-liquid-teleport-outpost-quad-drone.description = โดรนขุดหนักที่ฐานหน้าด่านควอดสร้าง ขุดแร่ที่เลือก ส่งไปยังแกน และปล่อยผู้ช่วย Mono สูงสุด 4 ตัวมาขุดร่วมกัน
