item-liquid-teleport.displayName = ส่งไอเท็มและของเหลว
item-liquid-teleport.subtitle = v1.4.5: ลดความจุบรรทุกของฐานหน้าด่านเหลือ 1/4 โดรนผู้ช่วยเพิ่มตามโดรนแม่
item-liquid-teleport.description = เพิ่มบล็อกโครโนระดับโกงสำหรับขนส่งไอเท็มและของเหลวทั่วโลก แปลงภูมิประเทศ แปลงไอเท็ม ซ่อมแซม ก่อสร้าง โอเวอร์ไดรฟ์ เสริมพลังยูนิต ลดพลังยูนิต และวางแกนกลาง พร้อมฐานหน้าด่านสำหรับขุดแร่ด้วยโดรน\nอัปเดต: สายอัปเกรดความจุบรรทุกของฐานหน้าด่านทุกแห่งลดเหลือหนึ่งในสี่; โดรนผู้ช่วยของฐานหน้าด่านควอดตอนนี้เพิ่มความจุตามระดับความจุของโดรนแม่\nอัปเดต: โดรนผู้ช่วยของฐานหน้าด่านควอดยังเชื่อมกับโดรนแม่หลังโหลดเซฟ และไม่ตายอีกต่อไปเมื่อคุณเข้าสู่โลก\nอัปเดต: สายอัปเกรดใหม่ ระยะการขุด ทำให้ลำแสงขุดของโดรนยาวขึ้นในทุกฐานหน้าด่าน; โดรนผู้ช่วยของฐานหน้าด่านควอดตอนนี้เคลื่อนที่ด้วยความเร็วเท่ากับโดรนแม่\nอัปเดต: การอัปเกรดระดับการขุดของฐานหน้าด่านจะไม่ใช้ทรัพยากรที่สูงกว่าระดับที่ปลดล็อก; บน Erekir การอัปเกรดฐานหน้าด่านทุกอย่างใช้ทรัพยากรของ Erekir\nอัปเดต: ฐานหน้าด่านเมกาและควอดมีดีไซน์อาคารของตัวเอง พร้อมแท่นโรงเก็บ โครงค้ำ และเครื่องปฏิกรณ์กลาง\nอัปเดต: ฐานหน้าด่านขนาดเล็ก 4 หลังในสี่เหลี่ยม 2x2 รวมเป็นฐานหน้าด่านเมกา (4x4) และฐานหน้าด่าน 4 หลังรวมเป็นฐานหน้าด่านควอด (6x6); ทั้งสองสร้างโดรนหนักที่มีค่าพลัง 4 เท่าและขั้นอัปเกรดสูงสุด 16 เท่า; โดรน Quad ปล่อยผู้ช่วย Mono\nอัปเดต: ตัวเลือกแร่ของด่านหน้าปลดล็อกแร่ทันทีหลังอัปเกรดระดับการขุด; ปุ่มใหม่ น้อยที่สุด ทำให้ด่านหน้าขุดแร่ที่ขุดได้ซึ่งแกนมีน้อยที่สุด\nอัปเดต: เมื่อเปิดขโมยอัตโนมัติ ตัวถ่ายสินค้าจะเชื่อมเฉพาะสิ่งก่อสร้างของทีมอื่น รวมถึงที่ถูกทิ้งร้าง และข้ามสิ่งก่อสร้างของทีมตนเอง การเปิดจะลบการเชื่อมกับทีมตนเอง การปิดจะลบการเชื่อมกับทีมอื่น\nอัปเดต: ลิงก์อัตโนมัติจะเชื่อมเฉพาะแหล่งที่ส่งออกไอเทมที่เลือกเท่านั้น ตรวจสอบหมวดหมู่ก่อนตัวกรองไอเทมเพื่อลดอาการกระตุก ตัวเลือกไอเทมของตัวขนถ่ายและตัวผลักใช้ตาราง 8x2\nอัปเดต: ข้อความของบล็อก ยูนิต สถานะ และเมนูทั้งหมดถูกแปลเป็นทั้ง 35 ภาษาที่ Mindustry รองรับ; ระบบตรวจสอบจะบล็อกคอมมิตที่ขาดคำแปล\nอัปเดต: ฐานหน้าด่านขนาดเล็กใหม่ ขนาด 2x2 แบบ mono มีขีดจำกัดอัปเกรดต่ำกว่า; ตัวเลือกแร่แสดงหนึ่งแถวต่อดาวเคราะห์; สีต้นทุนอัปเกรดอัปเดตแบบสด\nอัปเดต: บล็อกฐานหน้าด่านใหม่สร้างโดรนขุดแร่บินได้ที่ส่งแร่ที่เลือกไปยังแกนกลาง; อัปเกรดจำนวนยูนิต ความเร็ว ความเร็วขุด ความจุบรรทุก และระดับการขุดด้วยไอเท็มจากแกนกลาง
