block.item-liquid-teleport-chrono-hypno.name = โครโนสะกดจิต
block.item-liquid-teleport-chrono-hypno.description = บล็อกขนาด 1x1 ที่ทำให้ยูริหนึ่งตัวมีชีวิตอยู่ เมื่อยูริตาย บล็อกจะรอ 10 วินาทีและใช้ซิลิคอน 25 จากคลังเพื่อชุบชีวิต ยูริผูกยูนิตหรือสิ่งก่อสร้างของศัตรูทีละหนึ่งจากระยะ 20 ช่อง และเปลี่ยนมาเป็นฝ่ายคุณหลัง 2 วินาที ยูริหลายตัวบนเป้าหมายเดียวกันเปลี่ยนได้เร็วขึ้น: ยูริสองตัวใช้เวลาครึ่งหนึ่ง สายผูกคงอยู่ทุกระยะจนกว่าเป้าหมายจะถูกเปลี่ยนหรือตาย แกนกลางเปลี่ยนไม่ได้ อัปเกรดด้วยไอเทมจากแกนกลาง: แต่ละระดับจาก 10 ระดับเพิ่มระยะ 1 ช่องและลดเวลาลงจนถึง 1 วินาที โครโนสะกดจิตสี่อันในสี่เหลี่ยม 2x2 รวมเป็นโครโนสะกดจิตใหญ่ ยูริตายเมื่อโครโนสะกดจิตถูกทำลาย
unit.item-liquid-teleport-yuri.name = ยูริ
unit.item-liquid-teleport-yuri.description = เมคพลังจิตที่ไม่มีอาวุธ ผูกศัตรูทีละหนึ่งและเปลี่ยนมาเป็นฝ่ายคุณ ยูริหลายตัวบนเป้าหมายเดียวกันเปลี่ยนได้เร็วขึ้น รับคำสั่งเหมือนยูนิตทั่วไป สร้างโดยโครโนสะกดจิต
block.item-liquid-teleport-chrono-hypno-big.name = โครโนสะกดจิตใหญ่
block.item-liquid-teleport-chrono-hypno-big.description = เกิดขึ้นเองเมื่อโครโนสะกดจิตสี่อันอยู่ในสี่เหลี่ยม 2x2 ทำให้ยูริใหญ่หนึ่งตัวมีชีวิตอยู่และชุบชีวิตด้วยซิลิคอน 50 ยูริใหญ่ผูกยูนิตหรือสิ่งก่อสร้างของศัตรูสองเป้าพร้อมกัน ระยะ เวลา และการอัปเกรดเหมือนโครโนสะกดจิต หลังรวมแล้วระดับเริ่มใหม่ที่ 1 สร้างโดยตรงไม่ได้
unit.item-liquid-teleport-yuri-big.name = ยูริใหญ่
unit.item-liquid-teleport-yuri-big.description = เมคพลังจิตขนาดใหญ่ที่ไม่มีอาวุธ ผูกศัตรูสองเป้าพร้อมกันและเปลี่ยนมาเป็นฝ่ายคุณ ยูริหลายตัวบนเป้าหมายเดียวกันเปลี่ยนได้เร็วขึ้น รับคำสั่งเหมือนยูนิตทั่วไป สร้างโดยโครโนสะกดจิตใหญ่
