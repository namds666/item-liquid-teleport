item-liquid-teleport.displayName = ส่งไอเท็มและของเหลว
item-liquid-teleport.subtitle = v1.4.17: โครโนสะกดจิตเป็น 1x1 แล้ว สี่อันรวมเป็นโครโนสะกดจิตใหญ่
item-liquid-teleport.description = บล็อก Chrono ระดับโกงสำหรับขนส่งไอเทมและของเหลวทั่วแผนที่ แปลงพื้นที่และไอเทม ซ่อมแซม ก่อสร้าง โอเวอร์ไดรฟ์ บัฟและดีบัฟยูนิต ควบคุมจิตใจ และวางแกนกลาง พร้อมฐานหน้าด่าน ฐานที่สร้างโดรนขุดแร่\n\n[accent]v1.4.17[]\nโครโนสะกดจิตเป็น 1x1 แล้ว สี่อันในสี่เหลี่ยม 2x2 รวมเป็นโครโนสะกดจิตใหญ่ ซึ่งยูริใหญ่ผูกสองเป้าพร้อมกัน ยูริหลายตัวบนเป้าเดียวเปลี่ยนได้เร็วขึ้น: ยูริสองตัวใช้เวลาครึ่งหนึ่ง\n\n[accent]v1.4.16[]\nคำอธิบายม็อดสั้นลงพร้อมรายการเปลี่ยนแปลงตามเวอร์ชัน\n\n[accent]v1.4.15[]\nฐานหน้าด่าน ฐานหน้าด่านควอด และฐานหน้าด่านเมกา: การอัปเกรดระดับขุด 4 ใช้ไทเทเนียมและซิลิคอน\n\n[accent]v1.4.14[]\nโครโนสะกดจิตใหม่: ยูริเปลี่ยนยูนิตและสิ่งก่อสร้างของศัตรูมาเป็นฝ่ายคุณ\n\n[accent]v1.4.13[]\nลำแสงขุดเพิ่มเติมของฐานหน้าด่านเล็งช่องแร่ที่ต่างกัน
