block.item-liquid-teleport-chrono-hypno.name = Chrono Hypnose
block.item-liquid-teleport-chrono-hypno.description = Un bloc 1x1 qui garde un Yuri en vie. Quand Yuri meurt, il attend 10 secondes et utilise 25 silicium de son stock pour le ramener. Yuri lie une unité ou un bâtiment ennemi à la fois depuis 20 cases et le fait passer dans votre camp après 2 secondes. Plus de Yuri sur la même cible la convertissent plus vite : deux Yuri prennent moitié moins de temps. Le lien tient à toute distance jusqu'à ce que la cible soit convertie ou meure. Les noyaux ne peuvent pas être convertis. Améliorez avec des objets du noyau : chacun des 10 niveaux ajoute 1 case de portée et réduit le temps, jusqu'à 1 seconde. Quatre Chrono Hypnose en carré 2x2 fusionnent en une Grande Chrono Hypnose. Yuri meurt quand la Chrono Hypnose est détruite.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Un mécha psychique sans armes. Lie un ennemi à la fois et le fait passer dans votre camp. Plus de Yuri sur la même cible la convertissent plus vite. Obéit aux ordres comme toute unité. Créé par une Chrono Hypnose.
block.item-liquid-teleport-chrono-hypno-big.name = Grande Chrono Hypnose
block.item-liquid-teleport-chrono-hypno-big.description = Se forme d'elle-même quand quatre Chrono Hypnose sont en carré 2x2. Garde un Grand Yuri en vie et le ramène pour 50 silicium. Grand Yuri lie deux unités ou bâtiments ennemis à la fois. Même portée, temps et améliorations que la Chrono Hypnose ; après la fusion, les niveaux repartent du niveau 1. Ne peut pas être construite directement.
unit.item-liquid-teleport-yuri-big.name = Grand Yuri
unit.item-liquid-teleport-yuri-big.description = Un grand mécha psychique sans armes. Lie deux ennemis à la fois et les fait passer dans votre camp. Plus de Yuri sur la même cible la convertissent plus vite. Obéit aux ordres comme toute unité. Créé par une Grande Chrono Hypnose.
hypno.path = Puissance d'hypnose
