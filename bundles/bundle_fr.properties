block.item-liquid-teleport-outpost.name = Avant-poste
block.item-liquid-teleport-outpost.description = Construit des drones miniers, un toutes les 5 secondes, jusqu’au plafond d’unités. Sélectionnez un type de minerai dans le menu du bloc ; les drones extraient le minerai le plus proche de ce type et le livrent au noyau. Dépensez des objets du noyau pour améliorer cinq voies indépendantes : plafond d’unités, vitesse des drones, vitesse de minage, capacité de transport et niveau de minage. Les drones meurent si l’Avant-poste est détruit.
unit.item-liquid-teleport-outpost-drone.name = Drone d’Avant-poste
unit.item-liquid-teleport-outpost-drone.description = Un drone minier volant produit par un Avant-poste. Ses statistiques suivent les niveaux d’amélioration de son Avant-poste.
block.item-liquid-teleport-outpost-micro.name = Micro Avant-poste
block.item-liquid-teleport-outpost-micro.description = Un avant-poste 1x1 qui construit des micro drones mineurs, un toutes les 5 secondes, jusqu'à sa limite d'unités. Sélectionnez un type de minerai dans le menu du bloc ; les drones extraient le minerai le plus proche de ce type et le livrent au noyau. Lignes d'amélioration avec des limites plus basses que le Petit Avant-poste : limite d'unités, vitesse, vitesse de minage, capacité de transport, niveau de minage (max. 2, atteint le charbon) et plus. Quatre Micro Avant-postes en un carré 2x2 fusionnent en un Petit Avant-poste. Les drones meurent quand le Micro Avant-poste est détruit.
unit.item-liquid-teleport-outpost-micro-drone.name = Drone de Micro Avant-poste
unit.item-liquid-teleport-outpost-micro-drone.description = Un minuscule drone mineur volant produit par un Micro Avant-poste. Ses statistiques suivent les niveaux d'amélioration de son Micro Avant-poste.
block.item-liquid-teleport-outpost-small.name = Petit Avant-poste
block.item-liquid-teleport-outpost-small.description = Un Avant-poste 2x2 qui construit de petits drones miniers, un toutes les 5 secondes, jusqu’au plafond d’unités. Sélectionnez un type de minerai dans le menu du bloc ; les drones extraient le minerai le plus proche de ce type et le livrent au noyau. Cinq voies d’amélioration avec des limites inférieures à l’Avant-poste : plafond d’unités, vitesse des drones, vitesse de minage, capacité de transport et niveau de minage (max 2). Les drones meurent si le Petit Avant-poste est détruit.
unit.item-liquid-teleport-outpost-small-drone.name = Drone de Petit Avant-poste
unit.item-liquid-teleport-outpost-small-drone.description = Un petit drone minier volant produit par un Petit Avant-poste. Ses statistiques suivent les niveaux d’amélioration de son Petit Avant-poste.
block.item-liquid-teleport-outpost-mega.name = Méga Avant-poste
block.item-liquid-teleport-outpost-mega.description = Se forme automatiquement lorsque quatre Petits Avant-postes forment un carré 2x2. Construit des drones mineurs Mega avec quatre fois les statistiques d'un drone de Petit Avant-poste et une échelle d'améliorations atteignant seize fois. Extrait du minerai de niveau 3 dès le départ, niveau 4 après une amélioration. Ne peut pas être construit directement. La déconstruction rembourse quatre Petits Avant-postes.
unit.item-liquid-teleport-outpost-mega-drone.name = Drone Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Drone mineur lourd construit par le Méga Avant-poste. Extrait le minerai sélectionné et le livre au noyau.
block.item-liquid-teleport-outpost-quad.name = Quad Avant-poste
block.item-liquid-teleport-outpost-quad.description = Se forme automatiquement lorsque quatre Avant-postes forment un carré 2x2. Construit des drones mineurs Quad avec quatre fois les statistiques d'un drone d'Avant-poste et une échelle d'améliorations atteignant seize fois. Chaque Quad déploie un assistant Mono par niveau de limite d'unités, jusqu'à quatre, qui extraient le même minerai. Extrait du minerai de niveau 3 dès le départ, niveau 4 après une amélioration. Ne peut pas être construit directement. La déconstruction rembourse quatre Avant-postes.
unit.item-liquid-teleport-outpost-quad-drone.name = Drone Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Drone mineur lourd construit par le Quad Avant-poste. Extrait le minerai sélectionné, le livre au noyau et déploie jusqu'à quatre assistants Mono qui extraient à ses côtés.
