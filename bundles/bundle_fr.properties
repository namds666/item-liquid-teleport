item-liquid-teleport.displayName = Téléportation Objets et Liquides
item-liquid-teleport.subtitle = v1.4.17: Chrono Hypnose est maintenant 1x1, quatre fusionnent en une Grande Chrono Hypnose
item-liquid-teleport.description = Blocs Chrono dignes d'un cheat pour le transport global d'objets et de liquides, la conversion de terrain et d'objets, la réparation, la construction, la surcharge, les bonus et malus d'unités, le contrôle mental et le placement de noyaux, plus l'Avant-poste, une base qui construit des drones mineurs.\n\n[accent]v1.4.17[]\nChrono Hypnose est maintenant 1x1. Quatre en carré 2x2 fusionnent en une Grande Chrono Hypnose, dont le Grand Yuri lie deux cibles à la fois. Plus de Yuri sur une cible la convertissent plus vite : deux Yuri prennent moitié moins de temps.\n\n[accent]v1.4.16[]\nDescription du mod plus courte avec les changements par version.\n\n[accent]v1.4.15[]\nAvant-poste, Quad Avant-poste et Méga Avant-poste : l'amélioration au niveau de minage 4 coûte du titane et du silicium.\n\n[accent]v1.4.14[]\nNouvelle Chrono Hypnose : Yuri convertit les unités et bâtiments ennemis à votre camp.\n\n[accent]v1.4.13[]\nLes rayons de minage supplémentaires de l'Avant-poste visent des cases de minerai différentes.
block.item-liquid-teleport-chrono-unloader.name = Chrono Déchargeur
block.item-liquid-teleport-chrono-unloader.description = Extrait un objet choisi de tous les bâtiments liés sur toute la carte et le distribue via les convoyeurs.
block.item-liquid-teleport-chrono-pusher.name = Chrono Pousseur
block.item-liquid-teleport-chrono-pusher.description = Envoie tous les objets stockés dans les bâtiments liés sur toute la carte.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Déchargeur de Liquide
block.item-liquid-teleport-chrono-liquid-unloader.description = Extrait un liquide choisi de tous les bâtiments liés sur toute la carte et le distribue via les conduits.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Pousseur de Liquide
block.item-liquid-teleport-chrono-liquid-pusher.description = Envoie un liquide choisi dans tous les bâtiments liés sur toute la carte.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Poseur de Liquide
block.item-liquid-teleport-chrono-liquid-tiler.description = Convertit le terrain environnant en sol liquide sélectionné, une case à la fois.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Poseur de Minerai
block.item-liquid-teleport-chrono-item-tiler.description = Convertit le terrain environnant en couche de minerai sélectionnée, une case à la fois.
