item-liquid-teleport.displayName = Téléportation Objets et Liquides
item-liquid-teleport.subtitle = v1.3.4 : traductions dans les 35 langues de Mindustry, contrôle de localisation
item-liquid-teleport.description = Ajoute des blocs Chrono surpuissants pour le transport global d’objets et de liquides, la conversion de terrain, la conversion d’objets, la réparation, la construction, l’overdrive, les bonus d’unités, les malus d’unités et le placement de noyaux, ainsi que l’Avant-poste, base minière à drones.\nMise à jour : tous les textes des blocs, unités, statuts et menus sont traduits dans les 35 langues prises en charge par Mindustry ; un contrôle bloque les commits sans traduction.\nMise à jour : nouveau Petit Avant-poste, un Avant-poste 2x2 basé sur mono avec des limites d’amélioration réduites ; le sélecteur de minerai affiche une ligne par planète ; les couleurs de coût d’amélioration se mettent à jour en direct.\nMise à jour : nouveau bloc Avant-poste qui construit des drones miniers volants livrant un minerai sélectionné au noyau ; dépensez des objets du noyau pour améliorer le plafond d’unités, la vitesse, la vitesse de minage, la capacité de transport et le niveau de minage.
block.item-liquid-teleport-chrono-unloader.name = Chrono Déchargeur
block.item-liquid-teleport-chrono-unloader.description = Extrait un objet choisi de tous les bâtiments liés sur toute la carte et le distribue via les convoyeurs.
block.item-liquid-teleport-chrono-pusher.name = Chrono Pousseur
block.item-liquid-teleport-chrono-pusher.description = Envoie tous les objets stockés dans les bâtiments liés sur toute la carte.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Déchargeur de Liquide
block.item-liquid-teleport-chrono-liquid-unloader.description = Extrait un liquide choisi de tous les bâtiments liés sur toute la carte et le distribue via les conduits.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Pousseur de Liquide
block.item-liquid-teleport-chrono-liquid-pusher.description = Envoie un liquide choisi dans tous les bâtiments liés sur toute la carte.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Poseur de Liquide
block.item-liquid-teleport-chrono-liquid-tiler.description = Convertit le terrain environnant en sol liquide sélectionné, une case à la fois.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Poseur de Minerai
block.item-liquid-teleport-chrono-item-tiler.description = Convertit le terrain environnant en couche de minerai sélectionnée, une case à la fois.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Convertisseur d’Objets
block.item-liquid-teleport-chrono-item-converter.description = Convertit un objet d’entrée choisi en un objet de sortie choisi selon un ratio basé sur la rareté, avec vitesse et coût énergétique variables.
block.item-liquid-teleport-chrono-core.name = Chrono Noyau
block.item-liquid-teleport-chrono-core.description = Un noyau 1x1 surpuissant, toujours déverrouillé, qui produit des unités gamma.
block.item-liquid-teleport-chrono-mender.name = Chrono Réparateur
block.item-liquid-teleport-chrono-mender.description = Soigne en continu tous les bâtiments alliés sur toute la carte. Les petites bases sont entièrement restaurées plusieurs fois par seconde ; les grandes bases sont soignées par balayage progressif. Ne nécessite ni énergie ni ressources.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Point de Réparation
block.item-liquid-teleport-chrono-repair-point.description = Répare les unités alliées endommagées sur toute la carte à hauteur de 50 % de leur vie maximale par seconde avec un faisceau continu.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Tour de Construction
block.item-liquid-teleport-chrono-build-tower.description = Reconstruit automatiquement les structures sur toute la carte et assiste la construction selon la logique standard des tours de construction.
block.item-liquid-teleport-chrono-booster.name = Chrono Amplificateur
block.item-liquid-teleport-chrono-booster.description = Un dôme d’overdrive 1x1 qui accepte des objets et liquides supplémentaires pour augmenter la portée et la vitesse.
block.item-liquid-teleport-chrono-buffer.name = Chrono Bonus
block.item-liquid-teleport-chrono-buffer.description = Applique des bonus aux unités alliées à portée. Les objets et liquides supplémentaires augmentent le rayon, la durée et le nombre de statuts personnalisés débloqués.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Malus
block.item-liquid-teleport-chrono-debuffer.description = Applique des effets négatifs cumulés aux unités ennemies à portée. Les objets et liquides supplémentaires augmentent le rayon et la durée des statuts.
