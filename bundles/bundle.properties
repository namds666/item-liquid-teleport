block.item-liquid-teleport-outpost.name = Outpost
block.item-liquid-teleport-outpost.description = Builds mining drones, one every 5 seconds, up to its unit cap. Select an ore type in the block menu; drones mine the nearest ore of that type and deliver it to the core. Spend items from the core to upgrade five independent paths: unit cap, drone speed, mine speed, carry capacity, and mine tier. Drones die when the Outpost is destroyed.
unit.item-liquid-teleport-outpost-drone.name = Outpost Drone
unit.item-liquid-teleport-outpost-drone.description = A flying mining drone produced by an Outpost. Its stats follow the upgrade levels of its Outpost.
block.item-liquid-teleport-outpost-small.name = Small Outpost
block.item-liquid-teleport-outpost-small.description = A 2x2 Outpost that builds small mining drones, one every 5 seconds, up to its unit cap. Select an ore type in the block menu; drones mine the nearest ore of that type and deliver it to the core. Five upgrade paths with lower limits than the Outpost: unit cap, drone speed, mine speed, carry capacity, and mine tier (max 2). Drones die when the Small Outpost is destroyed.
unit.item-liquid-teleport-outpost-small-drone.name = Small Outpost Drone
unit.item-liquid-teleport-outpost-small-drone.description = A small flying mining drone produced by a Small Outpost. Its stats follow the upgrade levels of its Small Outpost.
