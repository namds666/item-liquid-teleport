block.item-liquid-teleport-outpost.name = Outpost
block.item-liquid-teleport-outpost.description = Builds mining drones, one every 5 seconds, up to its unit cap. Select an ore type in the block menu; drones mine the nearest ore of that type and deliver it to the core. Spend items from the core to upgrade five independent paths: unit cap, drone speed, mine speed, carry capacity, and mine tier. Drones die when the Outpost is destroyed.
unit.item-liquid-teleport-outpost-drone.name = Outpost Drone
unit.item-liquid-teleport-outpost-drone.description = A flying mining drone produced by an Outpost. Its stats follow the upgrade levels of its Outpost.
block.item-liquid-teleport-outpost-micro.name = Micro Outpost
block.item-liquid-teleport-outpost-micro.description = A 1x1 Outpost that builds micro mining drones, one every 5 seconds, up to its unit cap. Select an ore type in the block menu; drones mine the nearest ore of that type and deliver it to the core. Upgrade lines with lower limits than the Small Outpost: unit cap, drone speed, mine speed, carry capacity, mine tier (max 2, reaches coal), and more. Four Micro Outposts in a 2x2 square merge into a Small Outpost. Drones die when the Micro Outpost is destroyed.
unit.item-liquid-teleport-outpost-micro-drone.name = Micro Outpost Drone
unit.item-liquid-teleport-outpost-micro-drone.description = A tiny flying mining drone produced by a Micro Outpost. Its stats follow the upgrade levels of its Micro Outpost.
block.item-liquid-teleport-outpost-small.name = Small Outpost
block.item-liquid-teleport-outpost-small.description = A 2x2 Outpost that builds small mining drones, one every 5 seconds, up to its unit cap. Select an ore type in the block menu; drones mine the nearest ore of that type and deliver it to the core. Five upgrade paths with lower limits than the Outpost: unit cap, drone speed, mine speed, carry capacity, and mine tier (max 2). Drones die when the Small Outpost is destroyed.
unit.item-liquid-teleport-outpost-small-drone.name = Small Outpost Drone
unit.item-liquid-teleport-outpost-small-drone.description = A small flying mining drone produced by a Small Outpost. Its stats follow the upgrade levels of its Small Outpost.
block.item-liquid-teleport-outpost-mega.name = Mega Outpost
block.item-liquid-teleport-outpost-mega.description = Forms automatically when four Small Outposts stand in a 2x2 square. Builds Mega mining drones with four times the stats of a Small Outpost drone and an upgrade ladder that reaches sixteen times. Mines tier 3 ore from the start, tier 4 after one upgrade. Cannot be built directly. Deconstruction refunds four Small Outposts.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega Drone
unit.item-liquid-teleport-outpost-mega-drone.description = Heavy mining drone built by the Mega Outpost. Mines the selected ore and delivers it to the core.
block.item-liquid-teleport-outpost-quad.name = Quad Outpost
block.item-liquid-teleport-outpost-quad.description = Forms automatically when four Outposts stand in a 2x2 square. Builds Quad mining drones with four times the stats of an Outpost drone and an upgrade ladder that reaches sixteen times. Each Quad deploys one Mono helper per unit cap level, up to four, that mine the same ore. Mines tier 3 ore from the start, tier 4 after one upgrade. Cannot be built directly. Deconstruction refunds four Outposts.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad Drone
unit.item-liquid-teleport-outpost-quad-drone.description = Heavy mining drone built by the Quad Outpost. Mines the selected ore, delivers it to the core, and deploys up to four Mono helpers that mine alongside it.
