block.item-liquid-teleport-chrono-hypno.name = Chrono Hypno
block.item-liquid-teleport-chrono-hypno.description = A 1x1 block that keeps one Yuri alive. When Yuri dies, it waits 10 seconds and uses 25 silicon from its storage to bring him back. Yuri tethers one enemy unit or building at a time from 30 tiles and turns it to your side after 2 seconds. More Yuri on the same target convert it faster: two Yuri take half the time. The tether holds at any distance until the target converts or dies. Cores cannot be converted. Upgrade with items from the core: each of 10 levels shortens the channel, down to 1 second. Four Chrono Hypno blocks in a 2x2 square merge into a Big Chrono Hypno. Yuri dies when the Chrono Hypno is destroyed.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = A psychic mech with no weapons. Tethers one enemy at a time and converts it to your side. More Yuri on the same target convert it faster. Takes commands like any unit. Spawned by a Chrono Hypno.
block.item-liquid-teleport-chrono-hypno-big.name = Big Chrono Hypno
block.item-liquid-teleport-chrono-hypno-big.description = Forms automatically when four Chrono Hypno blocks stand in a 2x2 square. Keeps one Big Yuri alive and brings him back for 50 silicon. Big Yuri tethers two enemy units or buildings at once. Same range, channel time, and upgrades as the Chrono Hypno; upgrade levels start again from level 1 after the merge. Cannot be built directly.
unit.item-liquid-teleport-yuri-big.name = Big Yuri
unit.item-liquid-teleport-yuri-big.description = A large psychic mech with no weapons. Tethers two enemies at once and converts them to your side. More Yuri on the same target convert it faster. Takes commands like any unit. Spawned by a Big Chrono Hypno.
