block.item-liquid-teleport-chrono-hypno.name = Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno.description = Holder én Yuri i live. Når Yuri dør, venter den 10 sekunder og bruger 25 silicium fra sit lager til at bringe ham tilbage. Yuri binder sig til én fjendtlig enhed eller bygning ad gangen fra 20 felter og vender den til din side efter 2 sekunder; forbindelsen holder på enhver afstand, indtil målet er konverteret eller dør. Kerner kan ikke konverteres. Opgrader med genstande fra kernen: hvert af 10 niveauer giver 1 felts rækkevidde og forkorter kanalen, ned til 1 sekund. Yuri dør, når Chrono-Hypnosen ødelægges.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = En psykisk mech uden våben. Binder sig til én fjende ad gangen og konverterer den til din side. Tager imod ordrer som enhver enhed. Skabes af en Chrono-Hypnose.
hypno.path = Hypnosekraft
hypno.value = {0} felter, {1}s
