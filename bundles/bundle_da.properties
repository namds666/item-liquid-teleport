item-liquid-teleport.displayName = Genstand-Væske-Teleport
item-liquid-teleport.subtitle = v1.3.4: oversættelser til alle 35 Mindustry-sprog, lokaliseringstjek
item-liquid-teleport.description = Tilføjer cheat-Chrono-blokke til global genstands- og væsketransport, terrænkonvertering, genstandskonvertering, reparation, konstruktion, overdrive, enhedsbuffs, enhedsdebuffs og kerneplacering samt Forpost-drone-minebasen.\nOpdatering: alle tekster for blokke, enheder, statusser og menuer er oversat til alle 35 sprog, som Mindustry understøtter; et tjek blokerer commits uden oversættelse.\nOpdatering: ny Lille Forpost, en 2x2-mono-Forpost med lavere opgraderingsgrænser; malmvælger viser én række pr. planet; opgraderingsomkostningsfarver opdateres live.\nOpdatering: ny Forpost-blok bygger flyvende minedrones, der leverer en valgt malm til kernen; opgrader enhedsgrænse, hastighed, minehastighed, bærekapacitet og mineniveau med genstande fra kernen.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Aflæsser
block.item-liquid-teleport-chrono-unloader.description = Trækker en valgt genstand fra alle forbundne bygninger globalt og sender den ud via transportbånd.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Skubber
block.item-liquid-teleport-chrono-pusher.description = Skubber alle lagrede genstande ind i forbundne bygninger globalt.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Væskeaflæsser
block.item-liquid-teleport-chrono-liquid-unloader.description = Trækker en valgt væske fra alle forbundne bygninger globalt og sender den ud via rør.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Væskeskubber
block.item-liquid-teleport-chrono-liquid-pusher.description = Skubber en valgt væske ind i alle forbundne bygninger globalt.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Væskeplacer
block.item-liquid-teleport-chrono-liquid-tiler.description = Konverterer nærliggende terræn til den valgte væskegulv felt for felt.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Malmplacer
block.item-liquid-teleport-chrono-item-tiler.description = Konverterer nærliggende terræn til det valgte malm-overlay felt for felt.
block.item-liquid-teleport-chrono-item-converter.name = Chrono-Genstandsomformer
block.item-liquid-teleport-chrono-item-converter.description = Konverterer en valgt inputgenstand til en valgt outputgenstand med sjældenhedsbaseret ratio, hastighed og energiomkostning.
block.item-liquid-teleport-chrono-core.name = Chrono-Kerne
block.item-liquid-teleport-chrono-core.description = En 1x1-cheat-kerne, der altid er ulåst og producerer gamma-enheder.
block.item-liquid-teleport-chrono-mender.name = Chrono-Reparatør
block.item-liquid-teleport-chrono-mender.description = Healer kontinuerligt alle allierede bygninger globalt. Små baser gendannes fuldt ud flere gange i sekundet; større baser heales i en rullende omgang. Kræver ingen strøm eller ressourcer.
block.item-liquid-teleport-chrono-repair-point.name = Chrono-Reparationspunkt
block.item-liquid-teleport-chrono-repair-point.description = Reparerer beskadigede allierede enheder globalt med 50 % maksimal sundhed pr. sekund via en kontinuerlig stråle.
block.item-liquid-teleport-chrono-build-tower.name = Chrono-Byggetårn
block.item-liquid-teleport-chrono-build-tower.description = Genopbygger automatisk strukturer globalt og assisterer konstruktion med standard byggetårnlogik.
block.item-liquid-teleport-chrono-booster.name = Chrono-Forstærker
block.item-liquid-teleport-chrono-booster.description = En 1x1-overdrivekuppel, der accepterer ekstra genstande og væsker til additive rækkevidde- og hastighedsboosts.
block.item-liquid-teleport-chrono-buffer.name = Chrono-Buffer
block.item-liquid-teleport-chrono-buffer.description = Giver allierede enheder i rækkevidde buffs. Ekstra genstande og væsker øger radius, varighed og antallet af ulåste brugerdefinerede statusser.
block.item-liquid-teleport-chrono-debuffer.name = Chrono-Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Påfører stablede negative statuseffekter på fjendtlige enheder i rækkevidde. Ekstra genstande og væsker øger radius og statusvarighed.
