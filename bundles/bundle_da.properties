block.item-liquid-teleport-outpost.name = Forpost
block.item-liquid-teleport-outpost.description = Bygger minedrones, én hvert 5. sekund, op til enhedsgrænsen. Vælg en malmtype i blokmenuen; drones miner den nærmeste malm af den type og leverer den til kernen. Brug genstande fra kernen til at opgradere fem uafhængige veje: enhedsgrænse, dronehastighed, minehastighed, bærekapacitet og mineniveau. Drones dør, når Forposten ødelægges.
unit.item-liquid-teleport-outpost-drone.name = Forpost-Drone
unit.item-liquid-teleport-outpost-drone.description = En flyvende minedrone produceret af en Forpost. Dens statistikker følger opgraderingsniveauerne for dens Forpost.
block.item-liquid-teleport-outpost-micro.name = Mikro Forpost
block.item-liquid-teleport-outpost-micro.description = En 1x1 forpost, der bygger mikro minedroner, én hvert 5. sekund, op til sin enhedsgrænse. Vælg en malmtype i blokmenuen; droner udvinder den nærmeste malm af den type og leverer den til kernen. Opgraderingslinjer med lavere grænser end Lille Forpost: enhedsgrænse, hastighed, mine-hastighed, bærekapacitet, minetrin (maks. 2, når kul) og flere. Fire Mikro Forposter i et 2x2-kvadrat smelter sammen til en Lille Forpost. Droner dør, når Mikro Forposten ødelægges.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Forpost-Drone
unit.item-liquid-teleport-outpost-micro-drone.description = En bitte lille flyvende minedrone produceret af en Mikro Forpost. Dens værdier følger opgraderingsniveauerne for dens Mikro Forpost.
block.item-liquid-teleport-outpost-small.name = Lille Forpost
block.item-liquid-teleport-outpost-small.description = En 2x2-Forpost, der bygger små minedrones, én hvert 5. sekund, op til enhedsgrænsen. Vælg en malmtype i blokmenuen; drones miner den nærmeste malm af den type og leverer den til kernen. Fem opgraderingsveje med lavere grænser end Forposten: enhedsgrænse, dronehastighed, minehastighed, bærekapacitet og mineniveau (maks. 2). Drones dør, når den Lille Forpost ødelægges.
unit.item-liquid-teleport-outpost-small-drone.name = Lille Forpost-Drone
unit.item-liquid-teleport-outpost-small-drone.description = En lille flyvende minedrone produceret af en Lille Forpost. Dens statistikker følger opgraderingsniveauerne for dens Lille Forpost.
block.item-liquid-teleport-outpost-mega.name = Mega Forpost
block.item-liquid-teleport-outpost-mega.description = Dannes automatisk, når fire Lille Forposter står i et 2x2-kvadrat. Bygger Mega-minedroner med fire gange statistikkerne for en Lille Forpost-drone og en opgraderingsstige, der når seksten gange. Udvinder malm af niveau 3 fra starten, niveau 4 efter én opgradering. Kan ikke bygges direkte. Nedrivning refunderer fire Lille Forposter.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega-drone
unit.item-liquid-teleport-outpost-mega-drone.description = Tung minedrone bygget af Mega Forposten. Udvinder den valgte malm og leverer den til kernen.
block.item-liquid-teleport-outpost-quad.name = Quad Forpost
block.item-liquid-teleport-outpost-quad.description = Dannes automatisk, når fire Forposter står i et 2x2-kvadrat. Bygger Quad-minedroner med fire gange statistikkerne for en Forpost-drone og en opgraderingsstige, der når seksten gange. Hver Quad udsender én Mono-hjælper pr. enhedsgrænse-niveau, op til fire, som udvinder samme malm. Udvinder malm af niveau 3 fra starten, niveau 4 efter én opgradering. Kan ikke bygges direkte. Nedrivning refunderer fire Forposter.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad-drone
unit.item-liquid-teleport-outpost-quad-drone.description = Tung minedrone bygget af Quad Forposten. Udvinder den valgte malm, leverer den til kernen og udsender op til fire Mono-hjælpere, som udvinder sammen med den.
