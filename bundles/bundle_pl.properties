block.item-liquid-teleport-outpost.name = Posterunek
block.item-liquid-teleport-outpost.description = Buduje drony wydobywcze, jednego co 5 sekund, do limitu jednostek. Wybierz typ rudy w menu bloku; drony wydobywają najbliższą rudę tego typu i dostarczają ją do rdzenia. Wydaj przedmioty z rdzenia, by ulepszyć pięć niezależnych ścieżek: limit jednostek, prędkość drona, szybkość wydobycia, pojemność ładunku i poziom wydobycia. Drony giną po zniszczeniu Posterunku.
unit.item-liquid-teleport-outpost-drone.name = Dron Posterunku
unit.item-liquid-teleport-outpost-drone.description = Latający dron wydobywczy produkowany przez Posterunek. Jego statystyki odpowiadają poziomom ulepszeń Posterunku.
block.item-liquid-teleport-outpost-small.name = Mały Posterunek
block.item-liquid-teleport-outpost-small.description = Posterunek 2x2 budujący małe drony wydobywcze, jednego co 5 sekund, do limitu jednostek. Wybierz typ rudy w menu bloku; drony wydobywają najbliższą rudę tego typu i dostarczają ją do rdzenia. Pięć ścieżek ulepszeń z niższymi limitami niż Posterunek: limit jednostek, prędkość drona, szybkość wydobycia, pojemność ładunku i poziom wydobycia (maks. 2). Drony giną po zniszczeniu Małego Posterunku.
unit.item-liquid-teleport-outpost-small-drone.name = Mały Dron Posterunku
unit.item-liquid-teleport-outpost-small-drone.description = Mały latający dron wydobywczy produkowany przez Mały Posterunek. Jego statystyki odpowiadają poziomom ulepszeń Małego Posterunku.
block.item-liquid-teleport-outpost-mega.name = Mega Posterunek
block.item-liquid-teleport-outpost-mega.description = Powstaje automatycznie, gdy cztery Małe Posterunki stoją w kwadracie 2x2. Buduje drony wydobywcze Mega o czterokrotnych statystykach drona Małego Posterunku i drabinie ulepszeń sięgającej szesnastokrotności. Od początku wydobywa rudę poziomu 3, po jednym ulepszeniu poziomu 4. Nie można go zbudować bezpośrednio. Rozbiórka zwraca cztery Małe Posterunki.
unit.item-liquid-teleport-outpost-mega-drone.name = Dron Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Ciężki dron wydobywczy budowany przez Mega Posterunek. Wydobywa wybraną rudę i dostarcza ją do rdzenia.
block.item-liquid-teleport-outpost-quad.name = Quad Posterunek
block.item-liquid-teleport-outpost-quad.description = Powstaje automatycznie, gdy cztery Posterunki stoją w kwadracie 2x2. Buduje drony wydobywcze Quad o czterokrotnych statystykach drona Posterunku i drabinie ulepszeń sięgającej szesnastokrotności. Każdy Quad wysyła jednego pomocnika Mono na poziom limitu jednostek, do czterech, którzy wydobywają tę samą rudę. Od początku wydobywa rudę poziomu 3, po jednym ulepszeniu poziomu 4. Nie można go zbudować bezpośrednio. Rozbiórka zwraca cztery Posterunki.
unit.item-liquid-teleport-outpost-quad-drone.name = Dron Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Ciężki dron wydobywczy budowany przez Quad Posterunek. Wydobywa wybraną rudę, dostarcza ją do rdzenia i wysyła do czterech pomocników Mono, którzy wydobywają razem z nim.
