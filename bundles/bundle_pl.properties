item-liquid-teleport.displayName = Teleport Przedmiotów i Cieczy
item-liquid-teleport.subtitle = v1.4.4: Drony pomocnicze Quad Posterunku przetrwają wczytanie
item-liquid-teleport.description = Dodaje bloki Chrono klasy cheat do globalnego transportu przedmiotów i cieczy, konwersji terenu, konwersji przedmiotów, naprawy, budowy, przyspieszenia, wzmocnień jednostek, osłabień jednostek i stawiania rdzeni, a także Posterunek — bazę wydobywczą z dronami.\nAktualizacja: drony pomocnicze Quad Posterunku pozostają połączone ze swoim dronem nadrzędnym po wczytaniu zapisu i nie giną już po wejściu do świata.\nAktualizacja: nowa ścieżka ulepszeń Zasięg wydobycia wydłuża promień wydobycia dronów na każdym Posterunku; drony pomocnicze Quad Posterunku poruszają się teraz z tą samą prędkością co ich dron nadrzędny.\nAktualizacja: ulepszenia poziomu wydobycia Posterunku nigdy nie kosztują surowców powyżej poziomu, który odblokowują; na Erekir każde ulepszenie Posterunku używa surowców z Erekir.\nAktualizacja: Mega i Quad Posterunki mają własny projekt budynku z płytami hangarowymi, zastrzałami i centralnym reaktorem.\nAktualizacja: cztery Małe Posterunki w kwadracie 2x2 łączą się w Mega Posterunek (4x4), a cztery Posterunki w Quad Posterunek (6x6); oba budują ciężkie drony o czterokrotnych statystykach i drabinie ulepszeń sięgającej szesnastokrotności; drony Quad wysyłają pomocników Mono.\nAktualizacja: wybór rudy Posterunku odblokowuje rudy zaraz po ulepszeniu poziomu wydobycia; nowy przycisk Najmniej sprawia, że Posterunek wydobywa dostępną rudę, której rdzeń ma najmniej.\nAktualizacja: z włączoną automatyczną kradzieżą rozładowywacze łączą tylko budynki innych drużyn, w tym opuszczone; budynki własnej drużyny są pomijane. Włączenie usuwa połączenia z własną drużyną; wyłączenie usuwa połączenia z innymi drużynami.\nAktualizacja: automatyczne łączenie łączy teraz tylko źródła, które wydają wybrany przedmiot; sprawdzenie kategorii odbywa się przed filtrem przedmiotów, aby zmniejszyć lagi; wybór przedmiotów w rozładowywaczu i popychaczu używa siatki 8x2.\nAktualizacja: każdy tekst bloków, jednostek, statusów i menu jest przetłumaczony na wszystkie 35 języków obsługiwanych przez Mindustry; kontrola blokuje commity bez tłumaczenia.\nAktualizacja: nowy Mały Posterunek, wersja 2x2 oparta na mono z niższymi limitami ulepszeń; wybór rudy wyświetla jeden wiersz na planetę; kolory kosztów ulepszeń aktualizują się na żywo.\nAktualizacja: nowy blok Posterunek buduje latające drony wydobywcze dostarczające wybraną rudę do rdzenia; ulepszaj limit jednostek, prędkość, szybkość wydobycia, pojemność i poziom wydobycia za przedmioty z rdzenia.
block.item-liquid-teleport-chrono-unloader.name = Chrono Rozładowywacz
block.item-liquid-teleport-chrono-unloader.description = Pobiera wybrany przedmiot ze wszystkich połączonych budynków globalnie i wyprowadza go przez przenośniki.
block.item-liquid-teleport-chrono-pusher.name = Chrono Popychacz
block.item-liquid-teleport-chrono-pusher.description = Wysyła wszystkie przechowywane przedmioty do połączonych budynków globalnie.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Rozładowywacz Cieczy
block.item-liquid-teleport-chrono-liquid-unloader.description = Pobiera wybraną ciecz ze wszystkich połączonych budynków globalnie i wyprowadza ją przez rury.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Popychacz Cieczy
block.item-liquid-teleport-chrono-liquid-pusher.description = Wysyła wybraną ciecz do wszystkich połączonych budynków globalnie.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Układacz Cieczy
block.item-liquid-teleport-chrono-liquid-tiler.description = Zamienia pobliski teren na wybraną podłogę ciekłą, po jednym kafelku naraz.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Układacz Rud
block.item-liquid-teleport-chrono-item-tiler.description = Zamienia pobliski teren na wybraną nakładkę rudy, po jednym kafelku naraz.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Konwerter Przedmiotów
block.item-liquid-teleport-chrono-item-converter.description = Zamienia wybrany przedmiot wejściowy na wybrany przedmiot wyjściowy z proporcją, prędkością i kosztem energii zależnym od rzadkości.
block.item-liquid-teleport-chrono-core.name = Chrono Rdzeń
block.item-liquid-teleport-chrono-core.description = Rdzeń 1x1 klasy cheat, zawsze odblokowany, produkujący jednostki gamma.
block.item-liquid-teleport-chrono-mender.name = Chrono Naprawiacz
block.item-liquid-teleport-chrono-mender.description = Ciągle leczy wszystkie zaprzyjaźnione budynki globalnie. Małe bazy są w pełni odtwarzane kilka razy na sekundę; większe bazy leczone są w cyklicznym przebiegu. Nie wymaga energii ani zasobów.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Punkt Naprawy
block.item-liquid-teleport-chrono-repair-point.description = Naprawia uszkodzone zaprzyjaźnione jednostki globalnie, przywracając 50% maks. zdrowia na sekundę ciągłą wiązką.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Wieża Budowy
block.item-liquid-teleport-chrono-build-tower.description = Automatycznie odbudowuje struktury globalnie i wspomaga budowę logiką standardowej wieży budowy.
block.item-liquid-teleport-chrono-booster.name = Chrono Wzmacniacz
block.item-liquid-teleport-chrono-booster.description = Kopuła przyspieszenia 1x1, która przyjmuje dodatkowe przedmioty i ciecze, sumując zasięg i bonus prędkości.
block.item-liquid-teleport-chrono-buffer.name = Chrono Bufor Wzmocnień
block.item-liquid-teleport-chrono-buffer.description = Nakłada wzmocnienia na sojusznicze jednostki w zasięgu. Dodatkowe przedmioty i ciecze zwiększają promień, czas trwania i liczbę odblokowanych statusów.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Osłabiacz
block.item-liquid-teleport-chrono-debuffer.description = Nakłada kumulujące się negatywne efekty na wrogie jednostki w zasięgu. Dodatkowe przedmioty i ciecze zwiększają promień i czas trwania efektów.
