block.item-liquid-teleport-chrono-hypno.name = Krono Hipnosia
block.item-liquid-teleport-chrono-hypno.description = Yuri bat bizirik mantentzen duen 1x1 blokea. Yuri hiltzen denean, 10 segundo itxaron eta bere biltegiko 25 silizio erabiltzen ditu itzultzeko. Yurik etsaien unitate edo eraikin bat lotzen du aldi berean 30 laukitik eta 2 segundoren ondoren zure aldera bihurtzen du. Helburu berean Yuri gehiagok azkarrago bihurtzen dute: bi Yurik denbora erdia behar dute. Lotura edozein distantziatan mantentzen da helburua bihurtu edo hil arte. Nukleoak ezin dira bihurtu. Hobetu nukleoko objektuekin: 10 mailetako bakoitzak denbora laburtzen du, segundo 1era arte. 2x2 karratu batean dauden lau Krono Hipnosia Krono Hipnosia Handia batean batzen dira. Yuri hiltzen da Krono Hipnosia suntsitzen denean.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Armarik gabeko mekanismo psikikoa. Etsai bat lotzen du aldi berean eta zure aldera bihurtzen du. Helburu berean Yuri gehiagok azkarrago bihurtzen dute. Aginduak hartzen ditu edozein unitatek bezala. Krono Hipnosiak sortzen du.
block.item-liquid-teleport-chrono-hypno-big.name = Krono Hipnosia Handia
block.item-liquid-teleport-chrono-hypno-big.description = Berez sortzen da lau Krono Hipnosia 2x2 karratu batean daudenean. Yuri Handia bat bizirik mantentzen du eta 50 silizioren truke itzultzen du. Yuri Handiak bi etsai, unitate edo eraikin, lotzen ditu aldi berean. Krono Hipnosiaren irismen, denbora eta hobekuntza berberak; batu ondoren mailak 1etik hasten dira berriro. Ezin da zuzenean eraiki.
unit.item-liquid-teleport-yuri-big.name = Yuri Handia
unit.item-liquid-teleport-yuri-big.description = Armarik gabeko mekanismo psikiko handia. Bi etsai lotzen ditu aldi berean eta zure aldera bihurtzen ditu. Helburu berean Yuri gehiagok azkarrago bihurtzen dute. Aginduak hartzen ditu edozein unitatek bezala. Krono Hipnosia Handiak sortzen du.
