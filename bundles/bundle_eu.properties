block.item-liquid-teleport-outpost.name = Avanpostua
block.item-liquid-teleport-outpost.description = Dron meatzariak eraikitzen ditu, bat 5 segundoro, unitate-mugara arte. Hautatu mea mota bat blokearen menuan; dronek mea mota horretako hurbilena ateratzen dute eta nukleora entregatzen dute. Gastatu nukleoko elementuak bost bide independente hobetzeko: unitate-muga, dron-abiadura, meatzaritza-abiadura, garraiatzeko gaitasuna eta meatzaritza-maila. Dronak hiltzen dira Avanpostua suntsitzen bada.
unit.item-liquid-teleport-outpost-drone.name = Avanpostuko Drona
unit.item-liquid-teleport-outpost-drone.description = Avanpostu batek ekoitzitako dron meatzari hegaldaria. Bere estatistikak Avanpostuaren hobekuntza-mailei jarraitzen die.
block.item-liquid-teleport-outpost-small.name = Avanpostu Txikia
block.item-liquid-teleport-outpost-small.description = Dron meatzari txikiak eraikitzen dituen 2x2 Avanpostua, bat 5 segundoro, unitate-mugara arte. Hautatu mea mota bat blokearen menuan; dronek mea mota horretako hurbilena ateratzen dute eta nukleora entregatzen dute. Bost hobekuntza-bide Avanpostua baino muga txikiagoekin: unitate-muga, dron-abiadura, meatzaritza-abiadura, garraiatzeko gaitasuna eta meatzaritza-maila (gehienez 2). Dronak hiltzen dira Avanpostu Txikia suntsitzen bada.
unit.item-liquid-teleport-outpost-small-drone.name = Avanpostu Txikiko Drona
unit.item-liquid-teleport-outpost-small-drone.description = Avanpostu Txiki batek ekoitzitako dron meatzari hegalari txikia. Bere estatistikak Avanpostu Txikiaren hobekuntza-mailei jarraitzen die.
block.item-liquid-teleport-outpost-mega.name = Mega Avanpostua
block.item-liquid-teleport-outpost-mega.description = Automatikoki sortzen da lau Avanpostu Txiki 2x2 karratu batean daudenean. Mega meatze-droneak eraikitzen ditu, Avanpostu Txikiaren dronearen estatistikak lau bider eta hamasei bidera iristen den hobekuntza-eskailera batekin. Hasieratik 3. mailako minerala ustiatzen du, hobekuntza baten ondoren 4. mailakoa. Ezin da zuzenean eraiki. Desegiteak lau Avanpostu Txiki itzultzen ditu.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega dronea
unit.item-liquid-teleport-outpost-mega-drone.description = Mega Avanpostuak eraikitako meatze-drone astuna. Hautatutako minerala ustiatzen du eta nukleora eramaten du.
block.item-liquid-teleport-outpost-quad.name = Quad Avanpostua
block.item-liquid-teleport-outpost-quad.description = Automatikoki sortzen da lau Avanpostu 2x2 karratu batean daudenean. Quad meatze-droneak eraikitzen ditu, Avanpostuaren dronearen estatistikak lau bider eta hamasei bidera iristen den hobekuntza-eskailera batekin. Quad bakoitzak Mono laguntzaile bat zabaltzen du unitate-mugaren maila bakoitzeko, lau arte, mineral bera ustiatzen dutenak. Hasieratik 3. mailako minerala ustiatzen du, hobekuntza baten ondoren 4. mailakoa. Ezin da zuzenean eraiki. Desegiteak lau Avanpostu itzultzen ditu.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad dronea
unit.item-liquid-teleport-outpost-quad-drone.description = Quad Avanpostuak eraikitako meatze-drone astuna. Hautatutako minerala ustiatzen du, nukleora eramaten du eta harekin ustiatzen duten lau Mono laguntzaile arte zabaltzen ditu.
