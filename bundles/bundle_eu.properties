item-liquid-teleport.displayName = Elementu eta Likido Telegarraioa
item-liquid-teleport.subtitle = v1.4.4: Quad Avanpostuaren drone laguntzaileak kargatzean bizirik daude
item-liquid-teleport.description = Krono bloke trampak gehitzen ditu elementu eta likidoen garraio globalerako, lurralde-bihurketa, elementu-bihurketa, konponketa, eraikuntza, gaindura, unitate-hobekuntzak, unitate-ahultzeak eta nukleo-kokapena, Avanpostu dron meatzaritzako basearekin batera.\nEguneraketa: Quad Avanpostuaren drone laguntzaileak beren drone gurasoari lotuta geratzen dira gordetako partida kargatu ondoren, eta ez dira hiltzen mundu batean sartzean.\nEguneraketa: Meatzaritza-irismena hobekuntza-lerro berriak droneen meatzaritza-izpia luzatzen du Avanpostu guztietan; Quad Avanpostuaren drone laguntzaileak orain beren drone gurasoaren abiadura berean mugitzen dira.\nEguneraketa: Avanpostuaren meatze-mailaren hobekuntzek ez dute inoiz desblokeatzen duten maila baino gorago dagoen baliabiderik kostatzen; Erekirren Avanpostuaren hobekuntza bakoitzak Erekirreko baliabideak erabiltzen ditu.\nEguneraketa: Mega eta Quad Avanpostuek beren eraikin-diseinua dute hangar-plataformekin, euskarriekin eta erreaktore zentral batekin.\nEguneraketa: 2x2 karratu bateko lau Avanpostu Txiki Mega Avanpostu (4x4) batean batzen dira eta lau Avanpostu Quad Avanpostu (6x6) batean; biek drone astunak eraikitzen dituzte, estatistikak lau bider eta hamasei bidera iristen den hobekuntza-eskailera batekin; Quad droneek Mono laguntzaileak zabaltzen dituzte.\nEguneraketa: Aurrepostuaren mineral hautatzaileak mineralak desblokeatzen ditu meatze maila hobetu eta berehala; Gutxiena botoi berriak nukleoak gutxien duen mineral eskuragarria ustiatzen du.\nEguneraketa: lapurreta automatikoa aktibatuta, deskargatzaileek beste taldeen eraikinak bakarrik lotzen dituzte, abandonatuak barne; norbere taldearen eraikinak saltatzen dira. Aktibatzeak norbere taldearekiko loturak kentzen ditu; desaktibatzeak beste taldeekiko loturak kentzen ditu.\nEguneraketa: lotura automatikoak orain hautatutako elementua ematen duten iturriak bakarrik lotzen ditu; kategoria-egiaztapena elementu-iragazkiaren aurretik egiten da atzerapena murrizteko; deskargatzailearen eta bultzatzailearen elementu-hautatzaileek 8x2 sareta erabiltzen dute.\nEguneraketa: bloke, unitate, egoera eta menu guztien testuak Mindustry-k onartzen dituen 35 hizkuntzetara itzulita daude; egiaztapen batek itzulpenik gabeko commit-ak blokeatzen ditu.\nAztertzea: Avanpostu Txiki berria, mono-oinarridun 2x2 Avanpostua hobekuntza-muga txikiagoekin; mea-hautatzaileak errenkada bat erakusten du planetako; hobekuntza-kostu koloreak zuzenean eguneratzen dira.\nAztertzea: Avanpostu bloke berriak dron meatzari hegalari eraiki eta hautatutako mea nukleora entregatzen dute; gastatu nukleoko elementuak unitate-muga, abiadura, meatzaritza-abiadura, garraiatzeko gaitasuna eta meatzaritza-maila hobetzeko.
block.item-liquid-teleport-chrono-unloader.name = Krono Deskargatzailea
block.item-liquid-teleport-chrono-unloader.description = Hautatutako elementua mapa osoko eraikin lotuetatik ateratzen du eta garraiagailuen bidez banatzen du.
block.item-liquid-teleport-chrono-pusher.name = Krono Bultzatzailea
block.item-liquid-teleport-chrono-pusher.description = Gordetako elementu guztiak mapa osoko eraikin lotuetara bidaltzen ditu.
block.item-liquid-teleport-chrono-liquid-unloader.name = Krono Likido Deskargatzailea
block.item-liquid-teleport-chrono-liquid-unloader.description = Hautatutako likidoa mapa osoko eraikin lotuetatik ateratzen du eta hodien bidez banatzen du.
block.item-liquid-teleport-chrono-liquid-pusher.name = Krono Likido Bultzatzailea
block.item-liquid-teleport-chrono-liquid-pusher.description = Hautatutako likidoa mapa osoko eraikin lotuetara bidaltzen du.
block.item-liquid-teleport-chrono-liquid-tiler.name = Krono Likido Jartzailea
block.item-liquid-teleport-chrono-liquid-tiler.description = Inguruko lurrazala hautatutako likido-lurrera bihurtzen du, lauki bat aldiro.
block.item-liquid-teleport-chrono-item-tiler.name = Krono Mea Jartzailea
block.item-liquid-teleport-chrono-item-tiler.description = Inguruko lurrazala hautatutako mea-geruzan bihurtzen du, lauki bat aldiro.
block.item-liquid-teleport-chrono-item-converter.name = Krono Elementu Bihurgailua
block.item-liquid-teleport-chrono-item-converter.description = Sarrerako elementu bat irteerako elementu batean bihurtzen du, urritasunean oinarritutako ratioarekin, abiadura eta energia-kostu aldakorrekin.
block.item-liquid-teleport-chrono-core.name = Krono Nukleoa
block.item-liquid-teleport-chrono-core.description = 1x1-eko nukleo trampakoa, beti desblokeatua, gamma unitateak ekoizten dituena.
block.item-liquid-teleport-chrono-mender.name = Krono Konpontzailea
block.item-liquid-teleport-chrono-mender.description = Mapa osoko eraikin aliatuak etengabe sendatzen ditu. Base txikiak segundoko hainbat aldiz guztiz leheneratzen dira; base handiak ekorketa progresiboan sendatzen dira. Ez du energiarik ez baliabiderik behar.
block.item-liquid-teleport-chrono-repair-point.name = Krono Konponketa Puntua
block.item-liquid-teleport-chrono-repair-point.description = Mapa osoko unitate aliatuak konpontzen ditu, gehienezko osasunaren %50 segundoko, izpi jarraituz.
block.item-liquid-teleport-chrono-build-tower.name = Krono Eraikuntza Dorrea
block.item-liquid-teleport-chrono-build-tower.description = Mapa osoko egiturak automatikoki berreraikitzen ditu eta eraikuntzan laguntzen du eraikuntza-dorre logika estandarrarekin.
block.item-liquid-teleport-chrono-booster.name = Krono Anplifikadorea
block.item-liquid-teleport-chrono-booster.description = 1x1-eko gaindura kupula bat, elementu eta likido gehigarriak onartzen ditu irismena eta abiadura handitzeko.
block.item-liquid-teleport-chrono-buffer.name = Krono Hobekuntza
block.item-liquid-teleport-chrono-buffer.description = Irismen barruko unitate aliatuei hobekuntzak aplikatzen dizkie. Elementu eta likido gehigarriek erradioa, iraupena eta desblokeatutako egoera pertsonalizatu kopurua handitzen dute.
block.item-liquid-teleport-chrono-debuffer.name = Krono Ahultzailea
block.item-liquid-teleport-chrono-debuffer.description = Irismen barruko etsai-unitateei eragin negatibo pilatuak aplikatzen dizkie. Elementu eta likido gehigarriek erradioa eta egoeren iraupena handitzen dute.
