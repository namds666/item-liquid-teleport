block.item-liquid-teleport-chrono-item-converter.name = Krono Elementu Bihurgailua
block.item-liquid-teleport-chrono-item-converter.description = Sarrerako elementu bat irteerako elementu batean bihurtzen du, urritasunean oinarritutako ratioarekin, abiadura eta energia-kostu aldakorrekin.
block.item-liquid-teleport-chrono-core.name = Krono Nukleoa
block.item-liquid-teleport-chrono-core.description = 1x1-eko nukleo trampakoa, beti desblokeatua, gamma unitateak ekoizten dituena.
block.item-liquid-teleport-chrono-mender.name = Krono Konpontzailea
block.item-liquid-teleport-chrono-mender.description = Mapa osoko eraikin aliatuak etengabe sendatzen ditu. Base txikiak segundoko hainbat aldiz guztiz leheneratzen dira; base handiak ekorketa progresiboan sendatzen dira. Ez du energiarik ez baliabiderik behar.
block.item-liquid-teleport-chrono-repair-point.name = Krono Konponketa Puntua
block.item-liquid-teleport-chrono-repair-point.description = Mapa osoko unitate aliatuak konpontzen ditu, gehienezko osasunaren %50 segundoko, izpi jarraituz.
block.item-liquid-teleport-chrono-build-tower.name = Krono Eraikuntza Dorrea
block.item-liquid-teleport-chrono-build-tower.description = Mapa osoko egiturak automatikoki berreraikitzen ditu eta eraikuntzan laguntzen du eraikuntza-dorre logika estandarrarekin.
block.item-liquid-teleport-chrono-booster.name = Krono Anplifikadorea
block.item-liquid-teleport-chrono-booster.description = 1x1-eko gaindura kupula bat, elementu eta likido gehigarriak onartzen ditu irismena eta abiadura handitzeko.
block.item-liquid-teleport-chrono-buffer.name = Krono Hobekuntza
block.item-liquid-teleport-chrono-buffer.description = Irismen barruko unitate aliatuei hobekuntzak aplikatzen dizkie. Elementu eta likido gehigarriek erradioa, iraupena eta desblokeatutako egoera pertsonalizatu kopurua handitzen dute.
block.item-liquid-teleport-chrono-debuffer.name = Krono Ahultzailea
block.item-liquid-teleport-chrono-debuffer.description = Irismen barruko etsai-unitateei eragin negatibo pilatuak aplikatzen dizkie. Elementu eta likido gehigarriek erradioa eta egoeren iraupena handitzen dute.
