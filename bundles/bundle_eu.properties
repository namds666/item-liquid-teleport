item-liquid-teleport.displayName = Elementu eta Likido Telegarraioa
item-liquid-teleport.subtitle = v1.4.18: Yurik bere 30 laukiko irismenean bilatzen ditu helburuak
item-liquid-teleport.description = Tranpa-mailako Chrono blokeak objektuen eta likidoen garraio globalerako, lur eta objektu bihurketarako, konponketarako, eraikuntzarako, gainkargarako, unitateen indartze eta ahultzerako, adimen kontrolerako eta nukleoak jartzeko, gehi Avanpostua, meatzari droneak eraikitzen dituen basea.\n\n[accent]v1.4.18[]\nYurik orain bere inguruko 30 laukiko irismenean bilatzen ditu helburuak, beraz doan lekuan bihurtzen du. Hobekuntzek orain denbora bakarrik laburtzen dute.\n\n[accent]v1.4.17[]\nKrono Hipnosia orain 1x1 da. 2x2 karratu bateko lauk Krono Hipnosia Handia bat osatzen dute, eta bere Yuri Handiak bi helburu lotzen ditu aldi berean. Helburu batean Yuri gehiagok azkarrago bihurtzen dute: bi Yurik denbora erdia behar dute.\n\n[accent]v1.4.16[]\nMod-aren deskribapen laburragoa, aldaketak bertsioka.\n\n[accent]v1.4.15[]\nAvanpostua, Quad Avanpostua eta Mega Avanpostua: meatzaritza-maila 4ko hobekuntzak titanioa eta silizioa balio ditu.\n\n[accent]v1.4.14[]\nKrono Hipnosia berria: Yurik etsaien unitateak eta eraikinak zure aldera bihurtzen ditu.
block.item-liquid-teleport-chrono-unloader.name = Krono Deskargatzailea
block.item-liquid-teleport-chrono-unloader.description = Hautatutako elementua mapa osoko eraikin lotuetatik ateratzen du eta garraiagailuen bidez banatzen du.
block.item-liquid-teleport-chrono-pusher.name = Krono Bultzatzailea
block.item-liquid-teleport-chrono-pusher.description = Gordetako elementu guztiak mapa osoko eraikin lotuetara bidaltzen ditu.
block.item-liquid-teleport-chrono-liquid-unloader.name = Krono Likido Deskargatzailea
block.item-liquid-teleport-chrono-liquid-unloader.description = Hautatutako likidoa mapa osoko eraikin lotuetatik ateratzen du eta hodien bidez banatzen du.
block.item-liquid-teleport-chrono-liquid-pusher.name = Krono Likido Bultzatzailea
block.item-liquid-teleport-chrono-liquid-pusher.description = Hautatutako likidoa mapa osoko eraikin lotuetara bidaltzen du.
