block.item-liquid-teleport-outpost.name = Avanpostas
block.item-liquid-teleport-outpost.description = Stato kasimo dronus, vieną kas 5 sekundes, iki vienetų limito. Pasirinkite rūdos tipą bloko meniu; dronai kasa artimiausią tos rūdos telkinį ir pristato ją į branduolį. Išleiskite branduolio daiktus penkiems nepriklausomiems tobulinimo keliams: vienetų limitas, drono greitis, kasimo greitis, krovos talpa ir kasimo lygis. Dronai žūva sunaikinus Avanpostą.
unit.item-liquid-teleport-outpost-drone.name = Avanposto Dronas
unit.item-liquid-teleport-outpost-drone.description = Skraidantis kasimo dronas, gaminamas Avanposto. Jo statistikos atitinka Avanposto tobulinimo lygius.
block.item-liquid-teleport-outpost-micro.name = Mikro Avanpostas
block.item-liquid-teleport-outpost-micro.description = 1x1 avanpostas, kuris stato mikro kasybos dronus, po vieną kas 5 sekundes, iki vienetų ribos. Bloko meniu pasirinkite rūdos tipą; dronai kasa artimiausią to tipo rūdą ir pristato ją į šerdį. Tobulinimo linijos su žemesnėmis ribomis nei Mažas Avanpostas: vienetų riba, greitis, kasimo greitis, talpa, kasimo lygis (maks. 2, pasiekia anglį) ir kt. Keturi Mikro Avanpostai 2x2 kvadrate susilieja į Mažą Avanpostą. Dronai žūsta, kai Mikro Avanpostas sunaikinamas.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Avanposto Dronas
unit.item-liquid-teleport-outpost-micro-drone.description = Mažytis skraidantis kasybos dronas, gaminamas Mikro Avanposto. Jo rodikliai atitinka jo Mikro Avanposto tobulinimo lygius.
block.item-liquid-teleport-outpost-small.name = Mažas Avanpostas
block.item-liquid-teleport-outpost-small.description = 2x2 Avanpostas, statantis mažus kasimo dronus, vieną kas 5 sekundes, iki vienetų limito. Pasirinkite rūdos tipą bloko meniu; dronai kasa artimiausią tos rūdos telkinį ir pristato ją į branduolį. Penki tobulinimo keliai su žemesniais limitais nei Avanpostas: vienetų limitas, drono greitis, kasimo greitis, krovos talpa ir kasimo lygis (maks. 2). Dronai žūva sunaikinus Mažą Avanpostą.
unit.item-liquid-teleport-outpost-small-drone.name = Mažas Avanposto Dronas
unit.item-liquid-teleport-outpost-small-drone.description = Mažas skraidantis kasimo dronas, gaminamas Mažo Avanposto. Jo statistikos atitinka Mažo Avanposto tobulinimo lygius.
block.item-liquid-teleport-outpost-mega.name = Mega Avanpostas
block.item-liquid-teleport-outpost-mega.description = Susidaro automatiškai, kai keturi Maži Avanpostai stovi 2x2 kvadratu. Stato Mega kasybos dronus su keturis kartus didesnėmis Mažo Avanposto drono savybėmis ir patobulinimų laiptais iki šešiolikos kartų. Nuo pradžių kasa 3 lygio rūdą, po vieno patobulinimo 4 lygio. Negalima statyti tiesiogiai. Išardymas grąžina keturis Mažus Avanpostus.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega dronas
unit.item-liquid-teleport-outpost-mega-drone.description = Sunkus kasybos dronas, kurį stato Mega Avanpostas. Kasa pasirinktą rūdą ir pristato ją į branduolį.
block.item-liquid-teleport-outpost-quad.name = Quad Avanpostas
block.item-liquid-teleport-outpost-quad.description = Susidaro automatiškai, kai keturi Avanpostai stovi 2x2 kvadratu. Stato Quad kasybos dronus su keturis kartus didesnėmis Avanposto drono savybėmis ir patobulinimų laiptais iki šešiolikos kartų. Kiekvienas Quad paleidžia po vieną Mono pagalbininką kiekvienam vienetų ribos lygiui, iki keturių, kurie kasa tą pačią rūdą. Nuo pradžių kasa 3 lygio rūdą, po vieno patobulinimo 4 lygio. Negalima statyti tiesiogiai. Išardymas grąžina keturis Avanpostus.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad dronas
unit.item-liquid-teleport-outpost-quad-drone.description = Sunkus kasybos dronas, kurį stato Quad Avanpostas. Kasa pasirinktą rūdą, pristato ją į branduolį ir paleidžia iki keturių Mono pagalbininkų, kurie kasa kartu su juo.
