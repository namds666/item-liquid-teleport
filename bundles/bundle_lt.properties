block.item-liquid-teleport-chrono-item-converter.description = Paverčia pasirinktą įvesties daiktą pasirinktu išvesties daiktu su retumo santykiu, greičiu ir energijos kaina.
block.item-liquid-teleport-chrono-core.name = Chrono Branduolys
block.item-liquid-teleport-chrono-core.description = 1x1 cheat lygio branduolys, visada atrakintas, gaminantis gamma vienetus.
block.item-liquid-teleport-chrono-mender.name = Chrono Taisytojas
block.item-liquid-teleport-chrono-mender.description = Nuolat gydo visus draugiškus pastatus globaliai. Mažos bazės pilnai atstatomos kelis kartus per sekundę; didesnės bazės gydomos slenkančiu ciklu. Nereikalauja energijos ar išteklių.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Remonto Taškas
block.item-liquid-teleport-chrono-repair-point.description = Remontuoja pažeistus draugiškus vienetus globaliai, atstatydamas 50 % maks. gyvybių per sekundę nuolatiniu spinduliu.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Statybos Bokštas
block.item-liquid-teleport-chrono-build-tower.description = Automatiškai atstato struktūras globaliai ir padeda statybai standartiniu statybos bokšto principu.
block.item-liquid-teleport-chrono-booster.name = Chrono Stiprintuvas
block.item-liquid-teleport-chrono-booster.description = 1x1 perkaitinimo kupolas, priimantis papildomus daiktus ir skysčius sumuojamam nuotolio ir greičio didinimui.
block.item-liquid-teleport-chrono-buffer.name = Chrono Stiprinimo Laukas
block.item-liquid-teleport-chrono-buffer.description = Suteikia stiprinimo efektus sąjunginiams vienetams veikimo zonoje. Papildomi daiktai ir skysčiai didina spindulį, trukmę ir atrakintų būsenų skaičių.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Silpnintuvas
block.item-liquid-teleport-chrono-debuffer.description = Kaupia neigiamus efektus priešo vienetams veikimo zonoje. Papildomi daiktai ir skysčiai didina spindulį ir efektų trukmę.
