block.item-liquid-teleport-outpost.name = Avanpostas
block.item-liquid-teleport-outpost.description = Stato kasimo dronus, vieną kas 5 sekundes, iki vienetų limito. Pasirinkite rūdos tipą bloko meniu; dronai kasa artimiausią tos rūdos telkinį ir pristato ją į branduolį. Išleiskite branduolio daiktus penkiems nepriklausomiems tobulinimo keliams: vienetų limitas, drono greitis, kasimo greitis, krovos talpa ir kasimo lygis. Dronai žūva sunaikinus Avanpostą.
unit.item-liquid-teleport-outpost-drone.name = Avanposto Dronas
unit.item-liquid-teleport-outpost-drone.description = Skraidantis kasimo dronas, gaminamas Avanposto. Jo statistikos atitinka Avanposto tobulinimo lygius.
block.item-liquid-teleport-outpost-small.name = Mažas Avanpostas
block.item-liquid-teleport-outpost-small.description = 2x2 Avanpostas, statantis mažus kasimo dronus, vieną kas 5 sekundes, iki vienetų limito. Pasirinkite rūdos tipą bloko meniu; dronai kasa artimiausią tos rūdos telkinį ir pristato ją į branduolį. Penki tobulinimo keliai su žemesniais limitais nei Avanpostas: vienetų limitas, drono greitis, kasimo greitis, krovos talpa ir kasimo lygis (maks. 2). Dronai žūva sunaikinus Mažą Avanpostą.
unit.item-liquid-teleport-outpost-small-drone.name = Mažas Avanposto Dronas
unit.item-liquid-teleport-outpost-small-drone.description = Mažas skraidantis kasimo dronas, gaminamas Mažo Avanposto. Jo statistikos atitinka Mažo Avanposto tobulinimo lygius.
