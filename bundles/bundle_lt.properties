item-liquid-teleport.displayName = Daiktų ir Skysčių Teleportas
item-liquid-teleport.subtitle = v1.4.17: Chrono Hipnozė dabar 1x1, keturios susilieja į Didžioji Chrono Hipnozė
item-liquid-teleport.description = Sukčiavimo lygio Chrono blokai pasauliniam daiktų ir skysčių transportui, reljefo ir daiktų keitimui, remontui, statybai, pagreitinimui, vienetų stiprinimui ir silpninimui, minčių kontrolei ir branduolio padėjimui, taip pat Avanpostas — bazė, statanti kasybos dronus.\n\n[accent]v1.4.17[]\nChrono Hipnozė dabar 1x1. Keturios 2x2 kvadrate susilieja į Didžioji Chrono Hipnozė, kurios Didysis Yuri vienu metu pririša du taikinius. Daugiau Yuri ant vieno taikinio jį perveda greičiau: du Yuri per pusę laiko.\n\n[accent]v1.4.16[]\nTrumpesnis modo aprašymas su pakeitimais pagal versiją.\n\n[accent]v1.4.15[]\nAvanpostas, Quad Avanpostas ir Mega Avanpostas: kasybos lygio 4 patobulinimas kainuoja titano ir silicio.\n\n[accent]v1.4.14[]\nNaujas Chrono Hipnozė: Yuri perveda priešo vienetus ir pastatus į jūsų pusę.\n\n[accent]v1.4.13[]\nPapildomi Avanposto kasybos spinduliai taikosi į skirtingus rūdos langelius.
