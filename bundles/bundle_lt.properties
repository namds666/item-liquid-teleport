item-liquid-teleport.displayName = Daiktų ir Skysčių Teleportas
item-liquid-teleport.subtitle = v1.3.4: vertimai į visas 35 Mindustry kalbas, lokalizacijos patikra
item-liquid-teleport.description = Prideda cheat lygio Chrono blokus globaliam daiktų ir skysčių transportavimui, reljefo konvertavimui, daiktų konvertavimui, remontui, statybai, perkaitinimui, vienetų stiprinimui, vienetų silpninimui ir branduolio pastatymui, taip pat Avanpostą — dronų kasimo bazę.\nAtnaujinimas: visi blokų, vienetų, būsenų ir meniu tekstai išversti į visas 35 Mindustry palaikomas kalbas; patikra blokuoja commit'us be vertimo.\nAtnaujinimas: naujas Mažas Avanpostas, 2x2 mono versija su žemesniais tobulinimo limitais; rūdų pasirinkimas rodo vieną eilutę planetai; tobulinimo kaštų spalvos atnaujinamos gyvai.\nAtnaujinimas: naujas Avanposto blokas stato skraidančius kasimo dronus, kurie pristato pasirinktą rūdą į branduolį; tobulinkite vienetų limitą, greitį, kasimo greitį, krovos talpą ir kasimo lygį branduolio daiktais.
block.item-liquid-teleport-chrono-unloader.name = Chrono Iškrovėjas
block.item-liquid-teleport-chrono-unloader.description = Traukia pasirinktą daiktą iš visų sujungtų pastatų globaliai ir išveda jį per konvejerius.
block.item-liquid-teleport-chrono-pusher.name = Chrono Stūmėjas
block.item-liquid-teleport-chrono-pusher.description = Siunčia visus saugomus daiktus į sujungtus pastatus globaliai.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Skysčių Iškrovėjas
block.item-liquid-teleport-chrono-liquid-unloader.description = Traukia pasirinktą skystį iš visų sujungtų pastatų globaliai ir išveda jį per vamzdžius.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Skysčių Stūmėjas
block.item-liquid-teleport-chrono-liquid-pusher.description = Siunčia pasirinktą skystį į visus sujungtus pastatus globaliai.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Skysčių Klojėjas
block.item-liquid-teleport-chrono-liquid-tiler.description = Paverčia gretimą reljefą pasirinktu skysčio paviršiumi po vieną plytelę.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Rūdų Klojėjas
block.item-liquid-teleport-chrono-item-tiler.description = Paverčia gretimą reljefą pasirinktu rūdos sluoksniu po vieną plytelę.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Daiktų Keitiklis
block.item-liquid-teleport-chrono-item-converter.description = Paverčia pasirinktą įvesties daiktą pasirinktu išvesties daiktu su retumo santykiu, greičiu ir energijos kaina.
block.item-liquid-teleport-chrono-core.name = Chrono Branduolys
block.item-liquid-teleport-chrono-core.description = 1x1 cheat lygio branduolys, visada atrakintas, gaminantis gamma vienetus.
block.item-liquid-teleport-chrono-mender.name = Chrono Taisytojas
block.item-liquid-teleport-chrono-mender.description = Nuolat gydo visus draugiškus pastatus globaliai. Mažos bazės pilnai atstatomos kelis kartus per sekundę; didesnės bazės gydomos slenkančiu ciklu. Nereikalauja energijos ar išteklių.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Remonto Taškas
block.item-liquid-teleport-chrono-repair-point.description = Remontuoja pažeistus draugiškus vienetus globaliai, atstatydamas 50 % maks. gyvybių per sekundę nuolatiniu spinduliu.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Statybos Bokštas
block.item-liquid-teleport-chrono-build-tower.description = Automatiškai atstato struktūras globaliai ir padeda statybai standartiniu statybos bokšto principu.
block.item-liquid-teleport-chrono-booster.name = Chrono Stiprintuvas
block.item-liquid-teleport-chrono-booster.description = 1x1 perkaitinimo kupolas, priimantis papildomus daiktus ir skysčius sumuojamam nuotolio ir greičio didinimui.
block.item-liquid-teleport-chrono-buffer.name = Chrono Stiprinimo Laukas
block.item-liquid-teleport-chrono-buffer.description = Suteikia stiprinimo efektus sąjunginiams vienetams veikimo zonoje. Papildomi daiktai ir skysčiai didina spindulį, trukmę ir atrakintų būsenų skaičių.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Silpnintuvas
block.item-liquid-teleport-chrono-debuffer.description = Kaupia neigiamus efektus priešo vienetams veikimo zonoje. Papildomi daiktai ir skysčiai didina spindulį ir efektų trukmę.
