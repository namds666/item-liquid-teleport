block.item-liquid-teleport-chrono-hypno.name = Chrono Hipnozė
block.item-liquid-teleport-chrono-hypno.description = 1x1 blokas, kuris palaiko gyvą vieną Yuri. Kai Yuri žūva, blokas palaukia 10 sekundžių ir panaudoja 25 silicio iš savo sandėlio, kad jį sugrąžintų. Yuri vienu metu pririša vieną priešo vienetą ar pastatą iš 20 langelių ir po 2 sekundžių perveda jį į jūsų pusę. Daugiau Yuri ant to paties taikinio jį perveda greičiau: du Yuri per pusę laiko. Ryšys laikosi bet kokiu atstumu, kol taikinys pereina ar žūva. Branduolių pervesti negalima. Tobulinkite branduolio daiktais: kiekvienas iš 10 lygių prideda 1 langelį nuotolio ir sutrumpina laiką iki 1 sekundės. Keturios Chrono Hipnozė 2x2 kvadrate susilieja į Didžioji Chrono Hipnozė. Yuri žūva, kai Chrono Hipnozė sunaikinama.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Psichinis mechas be ginklų. Vienu metu pririša vieną priešą ir perveda jį į jūsų pusę. Daugiau Yuri ant to paties taikinio jį perveda greičiau. Vykdo komandas kaip bet kuris vienetas. Jį sukuria Chrono Hipnozė.
block.item-liquid-teleport-chrono-hypno-big.name = Didžioji Chrono Hipnozė
block.item-liquid-teleport-chrono-hypno-big.description = Susidaro savaime, kai keturios Chrono Hipnozė stovi 2x2 kvadrate. Palaiko gyvą vieną Didysis Yuri ir sugrąžina jį už 50 silicio. Didysis Yuri vienu metu pririša du priešo vienetus ar pastatus. Toks pat nuotolis, laikas ir patobulinimai kaip Chrono Hipnozė; po susiliejimo lygiai prasideda iš naujo nuo 1. Negalima pastatyti tiesiogiai.
unit.item-liquid-teleport-yuri-big.name = Didysis Yuri
unit.item-liquid-teleport-yuri-big.description = Didelis psichinis mechas be ginklų. Vienu metu pririša du priešus ir perveda juos į jūsų pusę. Daugiau Yuri ant to paties taikinio jį perveda greičiau. Vykdo komandas kaip bet kuris vienetas. Jį sukuria Didžioji Chrono Hipnozė.
