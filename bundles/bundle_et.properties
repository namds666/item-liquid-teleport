item-liquid-teleport.displayName = Esemete ja Vedelike Teleport
item-liquid-teleport.subtitle = v1.4.17: Chrono Hüpnoos on nüüd 1x1, neli ühinevad üheks Suur Chrono Hüpnoos
item-liquid-teleport.description = Petutaseme Chrono plokid esemete ja vedelike ülemaailmseks transpordiks, maastiku ja esemete muundamiseks, parandamiseks, ehitamiseks, kiirendamiseks, üksuste tugevdamiseks ja nõrgestamiseks, mõttekontrolliks ja tuuma paigutamiseks, lisaks Eelpost, baas, mis ehitab kaevandusdroone.\n\n[accent]v1.4.17[]\nChrono Hüpnoos on nüüd 1x1. Neli 2x2 ruudus ühinevad üheks Suur Chrono Hüpnoos, mille Suur Yuri seob kaks sihtmärki korraga. Rohkem Yurisid ühel sihtmärgil pööravad selle kiiremini: kaks Yurit poole ajaga.\n\n[accent]v1.4.16[]\nLühem modi kirjeldus muudatustega versiooni kaupa.\n\n[accent]v1.4.15[]\nEelpost, Quad Eelpost ja Mega Eelpost: kaevandustaseme 4 täiendus maksab titaani ja räni.\n\n[accent]v1.4.14[]\nUus Chrono Hüpnoos: Yuri pöörab vaenlase üksused ja hooned sinu poolele.\n\n[accent]v1.4.13[]\nEelposti lisakaevanduskiired sihivad erinevaid maagiruute.
