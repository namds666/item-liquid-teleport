block.item-liquid-teleport-outpost.name = Eelpost
block.item-liquid-teleport-outpost.description = Ehitab kaevandrusdroone, ühe iga 5 sekundi järel, kuni üksuste piirarvuni. Valige maagi tüüp ploki menüüst; droonid kaevandavad lähimat seda tüüpi maaki ja toimetavad selle tuuma. Kulutage tuuma esemeid viie sõltumatu täiustusraja jaoks: üksuste piirarv, drooni kiirus, kaevanduskiirus, kandevõime ja kaevanduse tase. Droonid hukkuvad Eelposti hävimisel.
unit.item-liquid-teleport-outpost-drone.name = Eelposti Droon
unit.item-liquid-teleport-outpost-drone.description = Eelposti toodetud lendav kaevandudroon. Selle näitajad järgivad Eelposti täiustustasemeid.
block.item-liquid-teleport-outpost-micro.name = Mikro Eelpost
block.item-liquid-teleport-outpost-micro.description = 1x1 eelpost, mis ehitab mikro kaevandusdroone, ühe iga 5 sekundi tagant, kuni üksuste piirini. Vali plokimenüüst maagitüüp; droonid kaevandavad lähimat sellist maaki ja toimetavad selle tuuma. Täiendusliinid madalamate piiridega kui Väike Eelpost: üksuste piir, kiirus, kaevanduskiirus, kandevõime, kaevandustase (maks. 2, jõuab kivisöeni) ja veel. Neli Mikro Eelposti 2x2 ruudus sulanduvad Väikeseks Eelpostiks. Droonid hukkuvad, kui Mikro Eelpost hävib.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Eelposti Droon
unit.item-liquid-teleport-outpost-micro-drone.description = Pisike lendav kaevandusdrooni, mida toodab Mikro Eelpost. Selle näitajad järgivad oma Mikro Eelposti täiendustasemeid.
block.item-liquid-teleport-outpost-small.name = Väike Eelpost
block.item-liquid-teleport-outpost-small.description = 2x2 Eelpost, mis ehitab väikeseid kaevandrusdroone, ühe iga 5 sekundi järel, kuni üksuste piirarvuni. Valige maagi tüüp ploki menüüst; droonid kaevandavad lähimat seda tüüpi maaki ja toimetavad selle tuuma. Viis täiustusrada madalamate piiridega kui Eelpostil: üksuste piirarv, drooni kiirus, kaevanduskiirus, kandevõime ja kaevanduse tase (maks. 2). Droonid hukkuvad Väikese Eelposti hävimisel.
unit.item-liquid-teleport-outpost-small-drone.name = Väike Eelposti Droon
unit.item-liquid-teleport-outpost-small-drone.description = Väikese Eelposti toodetud väike lendav kaevandusdroon. Selle näitajad järgivad Väikese Eelposti täiustustasemeid.
block.item-liquid-teleport-outpost-mega.name = Mega Eelpost
block.item-liquid-teleport-outpost-mega.description = Tekib automaatselt, kui neli Väikest Eelposti seisavad 2x2 ruudus. Ehitab Mega kaevandusdroone, mille näitajad on neli korda Väikese Eelposti drooni omadest ja mille täienduste redel ulatub kuueteistkümne korrani. Kaevandab algusest 3. taseme maaki, ühe täienduse järel 4. taseme maaki. Ei saa otse ehitada. Lammutamine tagastab neli Väikest Eelposti.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega droon
unit.item-liquid-teleport-outpost-mega-drone.description = Raske kaevandusdroon, mille ehitab Mega Eelpost. Kaevandab valitud maaki ja toimetab selle tuuma.
block.item-liquid-teleport-outpost-quad.name = Quad Eelpost
block.item-liquid-teleport-outpost-quad.description = Tekib automaatselt, kui neli Eelposti seisavad 2x2 ruudus. Ehitab Quad kaevandusdroone, mille näitajad on neli korda Eelposti drooni omadest ja mille täienduste redel ulatub kuueteistkümne korrani. Iga Quad saadab välja ühe Mono abilise üksuste piiri taseme kohta, kuni neli, kes kaevandavad sama maaki. Kaevandab algusest 3. taseme maaki, ühe täienduse järel 4. taseme maaki. Ei saa otse ehitada. Lammutamine tagastab neli Eelposti.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad droon
unit.item-liquid-teleport-outpost-quad-drone.description = Raske kaevandusdroon, mille ehitab Quad Eelpost. Kaevandab valitud maaki, toimetab selle tuuma ja saadab välja kuni neli Mono abilist, kes kaevandavad koos temaga.
