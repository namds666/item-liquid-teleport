item-liquid-teleport.displayName = Esemete ja Vedelike Teleport
item-liquid-teleport.subtitle = v1.3.4: tõlked kõigisse 35 Mindustry keelde, lokaliseerimiskontroll
item-liquid-teleport.description = Lisab pettustaseme Chrono plokid globaalseks esemete ja vedelike transpordiks, maastiku teisendamiseks, esemete teisendamiseks, parandamiseks, ehitamiseks, ülekiirenduseks, üksuste tugevdamiseks, üksuste nõrgestamiseks ja tuuma paigutamiseks, pluss Eelpost — droonkaevandusbaas.\nUuendus: kõik plokkide, üksuste, olekute ja menüüde tekstid on tõlgitud kõigisse 35 keelde, mida Mindustry toetab; kontroll blokeerib tõlketa commit'id.\nUuendus: uus Väike Eelpost, 2x2 mono-põhine Eelpost madalamate täiustuspiiridega; maagivalija näitab ühte rida planeedi kohta; täiustuskulude värvid uuenevad reaalajas.\nUuendus: uus Eelposti plokk ehitab lendavaid kaevandrusdroone, mis toimetavad valitud maagi tuuma; täiusta üksuste piirarvu, kiirust, kaevanduskiirust, kandevõimet ja kaevanduse taset tuuma esemetega.
block.item-liquid-teleport-chrono-unloader.name = Chrono Mahalaadija
block.item-liquid-teleport-chrono-unloader.description = Tõmbab valitud eseme kõigist ühendatud hoonetest globaalselt ja väljastab selle konveierite kaudu.
block.item-liquid-teleport-chrono-pusher.name = Chrono Lükkaja
block.item-liquid-teleport-chrono-pusher.description = Saadab kõik ladustatud esemed ühendatud hoonetesse globaalselt.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Vedeliku Mahalaadija
block.item-liquid-teleport-chrono-liquid-unloader.description = Tõmbab valitud vedeliku kõigist ühendatud hoonetest globaalselt ja väljastab selle torude kaudu.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Vedeliku Lükkaja
block.item-liquid-teleport-chrono-liquid-pusher.description = Saadab valitud vedeliku kõigisse ühendatud hoonetesse globaalselt.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Vedeliku Plaadija
block.item-liquid-teleport-chrono-liquid-tiler.description = Teisendab lähedast maastikku valitud vedelikupõrandaks ühe plaadi kaupa.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Maagi Plaadija
block.item-liquid-teleport-chrono-item-tiler.description = Teisendab lähedast maastikku valitud maagikihiks ühe plaadi kaupa.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Esemete Teisendaja
block.item-liquid-teleport-chrono-item-converter.description = Teisendab valitud sisendieseme valitud väljundesemeks harulduspõhise suhte, kiiruse ja energiakuluga.
block.item-liquid-teleport-chrono-core.name = Chrono Tuum
block.item-liquid-teleport-chrono-core.description = 1x1 pettustaseme tuum, alati avatud, toodab gamma üksusi.
block.item-liquid-teleport-chrono-mender.name = Chrono Parandaja
block.item-liquid-teleport-chrono-mender.description = Ravib pidevalt kõiki sõbralikke hooneid globaalselt. Väikesed baasid taastatakse täielikult mitu korda sekundis; suuremaid baase ravitakse järkjärgulise tsükliga. Ei vaja energiat ega ressursse.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Remondipunkt
block.item-liquid-teleport-chrono-repair-point.description = Remondib kahjustatud sõbralikke üksusi globaalselt, taastades 50% maks. tervisest sekundis pideva kiirega.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Ehitustorn
block.item-liquid-teleport-chrono-build-tower.description = Ehitab automaatselt struktuure ümber globaalselt ja aitab ehitamisel tavalise ehitustorni loogikaga.
block.item-liquid-teleport-chrono-booster.name = Chrono Võimendi
block.item-liquid-teleport-chrono-booster.description = 1x1 ülekiirenduskuppel, mis võtab vastu lisaesemeid ja -vedelikke ulatuse ja kiiruse kumulatiivseks suurendamiseks.
block.item-liquid-teleport-chrono-buffer.name = Chrono Tugevdaja
block.item-liquid-teleport-chrono-buffer.description = Rakendab tugevdavaid efekte liitlasüksustele ulatuses. Lisaesemed ja -vedelikud suurendavad raadiust, kestust ja avatud staatuste arvu.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Nõrgendaja
block.item-liquid-teleport-chrono-debuffer.description = Rakendab kuhjuvaid negatiivseid efekte vaenlasüksustele ulatuses. Lisaesemed ja -vedelikud suurendavad raadiust ja efektide kestust.
