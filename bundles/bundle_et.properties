block.item-liquid-teleport-chrono-hypno.name = Chrono Hüpnoos
block.item-liquid-teleport-chrono-hypno.description = 1x1 plokk, mis hoiab ühe Yuri elus. Kui Yuri sureb, ootab plokk 10 sekundit ja kasutab oma laost 25 räni, et ta tagasi tuua. Yuri seob korraga ühe vaenlase üksuse või hoone 20 ruudu kauguselt ja pöörab selle 2 sekundi pärast sinu poolele. Rohkem Yurisid samal sihtmärgil pööravad selle kiiremini: kaks Yurit poole ajaga. Side püsib igal kaugusel, kuni sihtmärk pöördub või sureb. Tuumasid pöörata ei saa. Täienda tuuma esemetega: iga 10 tasemest lisab 1 ruudu ulatust ja lühendab aega kuni 1 sekundini. Neli Chrono Hüpnoos 2x2 ruudus ühinevad üheks Suur Chrono Hüpnoos. Yuri sureb, kui Chrono Hüpnoos hävitatakse.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Relvadeta psüühiline mehh. Seob korraga ühe vaenlase ja pöörab selle sinu poolele. Rohkem Yurisid samal sihtmärgil pööravad selle kiiremini. Täidab käske nagu iga üksus. Loob Chrono Hüpnoos.
block.item-liquid-teleport-chrono-hypno-big.name = Suur Chrono Hüpnoos
block.item-liquid-teleport-chrono-hypno-big.description = Tekib ise, kui neli Chrono Hüpnoos seisavad 2x2 ruudus. Hoiab ühe Suur Yuri elus ja toob ta tagasi 50 räni eest. Suur Yuri seob kaks vaenlase üksust või hoonet korraga. Sama ulatus, aeg ja täiendused nagu Chrono Hüpnoos; pärast ühinemist algavad tasemed uuesti 1-st. Otse ehitada ei saa.
unit.item-liquid-teleport-yuri-big.name = Suur Yuri
unit.item-liquid-teleport-yuri-big.description = Suur relvadeta psüühiline mehh. Seob kaks vaenlast korraga ja pöörab need sinu poolele. Rohkem Yurisid samal sihtmärgil pööravad selle kiiremini. Täidab käske nagu iga üksus. Loob Suur Chrono Hüpnoos.
