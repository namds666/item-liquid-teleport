item-liquid-teleport.displayName = Esemete ja Vedelike Teleport
item-liquid-teleport.subtitle = v1.4.4: Quad Eelposti abidroonid jäävad laadimisel ellu
item-liquid-teleport.description = Lisab pettustaseme Chrono plokid globaalseks esemete ja vedelike transpordiks, maastiku teisendamiseks, esemete teisendamiseks, parandamiseks, ehitamiseks, ülekiirenduseks, üksuste tugevdamiseks, üksuste nõrgestamiseks ja tuuma paigutamiseks, pluss Eelpost — droonkaevandusbaas.\nUuendus: Quad Eelposti abidroonid jäävad pärast salvestuse laadimist oma vanemdrooniga seotuks ega sure enam maailma sisenemisel.\nUuendus: uus täiendusliin Kaevanduse ulatus pikendab droonide kaevanduskiirt igal Eelpostil; Quad Eelposti abidroonid liiguvad nüüd sama kiirusega kui nende vanemdroon.\nUuendus: Eelposti kaevandustaseme uuendused ei maksa kunagi ressursse, mis on kõrgemal tasemel kui see, mille nad avavad; Erekiril kasutab iga Eelposti uuendus Erekiri ressursse.\nUuendus: Mega ja Quad Eelpostid said oma hoonekujunduse angaariplatside, tugede ja keskse reaktoriga.\nUuendus: neli Väikest Eelposti 2x2 ruudus liituvad Mega Eelpostiks (4x4) ja neli Eelposti Quad Eelpostiks (6x6); mõlemad ehitavad raskeid droone, mille näitajad on neljakordsed ja täienduste redel ulatub kuueteistkümne korrani; Quad droonid saadavad välja Mono abilisi.\nUuendus: Eelposti maagivalik avab maagid kohe pärast kaevandustaseme uuendust; uus nupp Vähim laseb Eelpostil kaevandada saadaolevat maaki, mida tuumas on kõige vähem.\nUuendus: sisse lülitatud automaatse vargusega ühendavad mahalaadijad ainult teiste meeskondade hooneid, sealhulgas mahajäetud; oma meeskonna hooned jäetakse vahele. Sisselülitamine eemaldab lingid oma meeskonnaga; väljalülitamine eemaldab lingid teiste meeskondadega.\nUuendus: automaatne linkimine ühendab nüüd ainult allikaid, mis väljastavad valitud eseme; kategooria kontroll käib enne esemefiltrit, et vähendada viivitust; mahalaadija ja lükkaja esemevalik kasutab 8x2 ruudustikku.\nUuendus: kõik plokkide, üksuste, olekute ja menüüde tekstid on tõlgitud kõigisse 35 keelde, mida Mindustry toetab; kontroll blokeerib tõlketa commit'id.\nUuendus: uus Väike Eelpost, 2x2 mono-põhine Eelpost madalamate täiustuspiiridega; maagivalija näitab ühte rida planeedi kohta; täiustuskulude värvid uuenevad reaalajas.\nUuendus: uus Eelposti plokk ehitab lendavaid kaevandrusdroone, mis toimetavad valitud maagi tuuma; täiusta üksuste piirarvu, kiirust, kaevanduskiirust, kandevõimet ja kaevanduse taset tuuma esemetega.
block.item-liquid-teleport-chrono-unloader.name = Chrono Mahalaadija
block.item-liquid-teleport-chrono-unloader.description = Tõmbab valitud eseme kõigist ühendatud hoonetest globaalselt ja väljastab selle konveierite kaudu.
