block.item-liquid-teleport-outpost.name = Eelpost
block.item-liquid-teleport-outpost.description = Ehitab kaevandrusdroone, ühe iga 5 sekundi järel, kuni üksuste piirarvuni. Valige maagi tüüp ploki menüüst; droonid kaevandavad lähimat seda tüüpi maaki ja toimetavad selle tuuma. Kulutage tuuma esemeid viie sõltumatu täiustusraja jaoks: üksuste piirarv, drooni kiirus, kaevanduskiirus, kandevõime ja kaevanduse tase. Droonid hukkuvad Eelposti hävimisel.
unit.item-liquid-teleport-outpost-drone.name = Eelposti Droon
unit.item-liquid-teleport-outpost-drone.description = Eelposti toodetud lendav kaevandudroon. Selle näitajad järgivad Eelposti täiustustasemeid.
block.item-liquid-teleport-outpost-small.name = Väike Eelpost
block.item-liquid-teleport-outpost-small.description = 2x2 Eelpost, mis ehitab väikeseid kaevandrusdroone, ühe iga 5 sekundi järel, kuni üksuste piirarvuni. Valige maagi tüüp ploki menüüst; droonid kaevandavad lähimat seda tüüpi maaki ja toimetavad selle tuuma. Viis täiustusrada madalamate piiridega kui Eelpostil: üksuste piirarv, drooni kiirus, kaevanduskiirus, kandevõime ja kaevanduse tase (maks. 2). Droonid hukkuvad Väikese Eelposti hävimisel.
unit.item-liquid-teleport-outpost-small-drone.name = Väike Eelposti Droon
unit.item-liquid-teleport-outpost-small-drone.description = Väikese Eelposti toodetud väike lendav kaevandusdroon. Selle näitajad järgivad Väikese Eelposti täiustustasemeid.
