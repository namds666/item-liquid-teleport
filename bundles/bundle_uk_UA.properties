status.item-liquid-teleport-chrono-molten.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-lubed.name = Хроно-змащення
status.item-liquid-teleport-chrono-lubed.description = Збільшує швидкість юніта.
