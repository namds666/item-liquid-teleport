status.item-liquid-teleport-chrono-conductive.description = Збільшує швидкість юніта.
status.item-liquid-teleport-chrono-dense.name = Хроно-щільність
status.item-liquid-teleport-chrono-dense.description = Збільшує здоров'я юніта.
status.item-liquid-teleport-chrono-focus.name = Хроно-фокус
status.item-liquid-teleport-chrono-focus.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-precision.name = Хроно-точність
status.item-liquid-teleport-chrono-precision.description = Збільшує швидкість перезарядки юніта.
status.item-liquid-teleport-chrono-slip.name = Хроно-ковзання
status.item-liquid-teleport-chrono-slip.description = Збільшує швидкість юніта.
status.item-liquid-teleport-chrono-ignite.name = Хроно-займання
status.item-liquid-teleport-chrono-ignite.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-alloyed.name = Хроно-сплав
status.item-liquid-teleport-chrono-alloyed.description = Збільшує здоров'я юніта.
status.item-liquid-teleport-chrono-jagged.name = Хроно-зазублення
status.item-liquid-teleport-chrono-jagged.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-elastic.name = Хроно-пружність
status.item-liquid-teleport-chrono-elastic.description = Збільшує здоров'я юніта.
status.item-liquid-teleport-chrono-surge.name = Хроно-імпульс
status.item-liquid-teleport-chrono-surge.description = Збільшує швидкість перезарядки юніта.
status.item-liquid-teleport-chrono-pyro.name = Хроно-піро
status.item-liquid-teleport-chrono-pyro.description = Значно збільшує шкоду юніта.
status.item-liquid-teleport-chrono-blast.name = Хроно-вибух
status.item-liquid-teleport-chrono-blast.description = Багаторазово збільшує шкоду юніта.
status.item-liquid-teleport-chrono-cooled.name = Хроно-охолодження
status.item-liquid-teleport-chrono-cooled.description = Збільшує швидкість перезарядки юніта.
status.item-liquid-teleport-chrono-molten.name = Хроно-розплав
status.item-liquid-teleport-chrono-molten.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-lubed.name = Хроно-змащення
status.item-liquid-teleport-chrono-lubed.description = Збільшує швидкість юніта.
status.item-liquid-teleport-chrono-cryo.name = Хроно-кріо
status.item-liquid-teleport-chrono-cryo.description = Значно збільшує швидкість перезарядки юніта.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Будує дронів-шахтарів, по одному кожні 5 секунд, до ліміту юнітів. Оберіть тип руди в меню блоку; дрони видобувають найближчу руду цього типу і доставляють до ядра. Витрачайте предмети з ядра для покращення п'яти незалежних гілок: ліміт юнітів, швидкість дронів, швидкість видобутку, вантажомісткість і рівень видобутку. Дрони гинуть при знищенні Форпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Літаючий дрон-шахтар, вироблений Форпостом. Його характеристики залежать від рівнів покращень Форпоста.
block.item-liquid-teleport-outpost-small.name = Малий форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2, що будує малих дронів-шахтарів, по одному кожні 5 секунд, до ліміту юнітів. Оберіть тип руди в меню блоку; дрони видобувають найближчу руду цього типу і доставляють до ядра. П'ять гілок покращень зі зниженими лімітами: ліміт юнітів, швидкість дронів, швидкість видобутку, вантажомісткість і рівень видобутку (макс. 2). Дрони гинуть при знищенні Малого форпоста.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малого форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Малий літаючий дрон-шахтар, вироблений Малим форпостом. Його характеристики залежать від рівнів покращень Малого форпоста.
