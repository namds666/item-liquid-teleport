status.item-liquid-teleport-chrono-cryo.description = Значно збільшує швидкість перезарядки юніта.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Будує дронів-шахтарів, по одному кожні 5 секунд, до ліміту юнітів. Оберіть тип руди в меню блоку; дрони видобувають найближчу руду цього типу і доставляють до ядра. Витрачайте предмети з ядра для покращення п'яти незалежних гілок: ліміт юнітів, швидкість дронів, швидкість видобутку, вантажомісткість і рівень видобутку. Дрони гинуть при знищенні Форпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Літаючий дрон-шахтар, вироблений Форпостом. Його характеристики залежать від рівнів покращень Форпоста.
block.item-liquid-teleport-outpost-micro.name = Мікрофорпост
block.item-liquid-teleport-outpost-micro.description = Форпост 1x1, який будує мікродронів-видобувачів, по одному кожні 5 секунд, до ліміту юнітів. Виберіть тип руди в меню блока; дрони видобувають найближчу руду цього типу і доставляють її в ядро. Лінії покращень із меншими лімітами, ніж у Малого форпоста: ліміт юнітів, швидкість, швидкість видобутку, вантажопідйомність, рівень видобутку (макс. 2, сягає вугілля) та інші. Чотири Мікрофорпости в квадраті 2x2 зливаються в Малий форпост. Дрони гинуть, коли Мікрофорпост знищено.
unit.item-liquid-teleport-outpost-micro-drone.name = Дрон мікрофорпоста
unit.item-liquid-teleport-outpost-micro-drone.description = Крихітний літаючий дрон-видобувач, якого виробляє Мікрофорпост. Його характеристики залежать від рівнів покращень його Мікрофорпоста.
block.item-liquid-teleport-outpost-small.name = Малий форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2, що будує малих дронів-шахтарів, по одному кожні 5 секунд, до ліміту юнітів. Оберіть тип руди в меню блоку; дрони видобувають найближчу руду цього типу і доставляють до ядра. П'ять гілок покращень зі зниженими лімітами: ліміт юнітів, швидкість дронів, швидкість видобутку, вантажомісткість і рівень видобутку (макс. 2). Дрони гинуть при знищенні Малого форпоста.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малого форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Малий літаючий дрон-шахтар, вироблений Малим форпостом. Його характеристики залежать від рівнів покращень Малого форпоста.
block.item-liquid-teleport-outpost-mega.name = Мега-форпост
block.item-liquid-teleport-outpost-mega.description = Утворюється автоматично, коли чотири малі форпости стоять квадратом 2x2. Будує шахтарські дрони Mega з учетверо більшими характеристиками дрона малого форпосту та драбиною покращень до шістнадцяти разів. Від початку добуває руду 3-го рівня, після одного покращення — 4-го. Не можна побудувати напряму. Розбирання повертає вартість чотирьох малих форпостів.
unit.item-liquid-teleport-outpost-mega-drone.name = Дрон Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Важкий шахтарський дрон Мега-форпосту. Добуває обрану руду й доставляє її в ядро.
block.item-liquid-teleport-outpost-quad.name = Квад-форпост
block.item-liquid-teleport-outpost-quad.description = Утворюється автоматично, коли чотири форпости стоять квадратом 2x2. Будує шахтарські дрони Quad з учетверо більшими характеристиками дрона форпосту та драбиною покращень до шістнадцяти разів. Кожен Quad випускає по одному помічнику Mono на рівень ліміту юнітів, до чотирьох, які добувають ту саму руду. Від початку добуває руду 3-го рівня, після одного покращення — 4-го. Не можна побудувати напряму. Розбирання повертає вартість чотирьох форпостів.
unit.item-liquid-teleport-outpost-quad-drone.name = Дрон Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Важкий шахтарський дрон Квад-форпосту. Добуває обрану руду, доставляє її в ядро й випускає до чотирьох помічників Mono, які добувають разом із ним.
