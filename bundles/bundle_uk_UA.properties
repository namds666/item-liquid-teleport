block.item-liquid-teleport-chrono-hypno.name = Хроно-гіпноз
block.item-liquid-teleport-chrono-hypno.description = Підтримує життя одного Юрія. Коли Юрій гине, через 10 секунд витрачає 25 кремнію зі свого сховища, щоб повернути його. Юрій зв'язується з одним ворожим юнітом або будівлею з відстані 20 клітинок і через 2 секунди переводить його на ваш бік; зв'язок тримається на будь-якій відстані, доки ціль не перейде або не загине. Ядра перетворити не можна. Покращуйте предметами з ядра: кожен з 10 рівнів додає 1 клітинку радіуса й скорочує канал, до 1 секунди. Юрій гине, коли Хроно-гіпноз знищено.
unit.item-liquid-teleport-yuri.name = Юрій
unit.item-liquid-teleport-yuri.description = Психічний мех без зброї. Зв'язується з одним ворогом і переводить його на ваш бік. Виконує команди, як будь-який юніт. Створюється Хроно-гіпнозом.
hypno.path = Сила гіпнозу
hypno.value = {0} клітинок, {1}s
