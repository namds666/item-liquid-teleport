block.item-liquid-teleport-chrono-hypno.name = Хроно-гіпноз
block.item-liquid-teleport-chrono-hypno.description = Блок 1x1, що тримає живим одного Юрій. Коли Юрій гине, блок чекає 10 секунд і витрачає 25 кремнію зі сховища, щоб повернути його. Юрій зв'язує одну ворожу одиницю або будівлю за раз із 20 клітинок і переводить на ваш бік через 2 секунди. Кілька Юріїв на одній цілі навертають її швидше: двоє — удвічі швидше. Зв'язок тримається на будь-якій відстані, доки ціль не перейде або не загине. Ядра навернути не можна. Покращення за ресурси з ядра: кожен із 10 рівнів додає 1 клітинку радіуса і скорочує час, до 1 секунди. Чотири Хроно-гіпноз у квадраті 2x2 зливаються у Великий Хроно-гіпноз. Юрій гине, коли Хроно-гіпноз знищено.
unit.item-liquid-teleport-yuri.name = Юрій
unit.item-liquid-teleport-yuri.description = Психічний мех без зброї. Зв'язує одного ворога за раз і переводить його на ваш бік. Кілька Юріїв на одній цілі навертають її швидше. Виконує накази як будь-яка одиниця. Створюється блоком Хроно-гіпноз.
block.item-liquid-teleport-chrono-hypno-big.name = Великий Хроно-гіпноз
block.item-liquid-teleport-chrono-hypno-big.description = Утворюється сам, коли чотири Хроно-гіпноз стоять у квадраті 2x2. Тримає живим одного Великий Юрій і повертає його за 50 кремнію. Великий Юрій зв'язує дві ворожі одиниці або будівлі одночасно. Той самий радіус, час і покращення, що в Хроно-гіпноз; після злиття рівні починаються знову з 1. Не можна збудувати напряму.
unit.item-liquid-teleport-yuri-big.name = Великий Юрій
unit.item-liquid-teleport-yuri-big.description = Великий психічний мех без зброї. Зв'язує двох ворогів одночасно і переводить їх на ваш бік. Кілька Юріїв на одній цілі навертають її швидше. Виконує накази як будь-яка одиниця. Створюється блоком Великий Хроно-гіпноз.
