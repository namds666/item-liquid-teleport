status.item-liquid-teleport-chrono-alloyed.description = Збільшує здоров'я юніта.
status.item-liquid-teleport-chrono-jagged.name = Хроно-зазублення
status.item-liquid-teleport-chrono-jagged.description = Збільшує шкоду юніта.
status.item-liquid-teleport-chrono-elastic.name = Хроно-пружність
status.item-liquid-teleport-chrono-elastic.description = Збільшує здоров'я юніта.
status.item-liquid-teleport-chrono-surge.name = Хроно-імпульс
status.item-liquid-teleport-chrono-surge.description = Збільшує швидкість перезарядки юніта.
status.item-liquid-teleport-chrono-pyro.name = Хроно-піро
status.item-liquid-teleport-chrono-pyro.description = Значно збільшує шкоду юніта.
status.item-liquid-teleport-chrono-blast.name = Хроно-вибух
status.item-liquid-teleport-chrono-blast.description = Багаторазово збільшує шкоду юніта.
status.item-liquid-teleport-chrono-cooled.name = Хроно-охолодження
status.item-liquid-teleport-chrono-cooled.description = Збільшує швидкість перезарядки юніта.
