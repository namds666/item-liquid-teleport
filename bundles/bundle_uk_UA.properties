item-liquid-teleport.displayName = Телепортація предметів і рідин
item-liquid-teleport.subtitle = v1.4.0: Мега- та Квад-форпости
item-liquid-teleport.description = Додає чіт-рівневі Хроно-блоки для глобального транспортування предметів і рідин, перетворення ландшафту, конвертації предметів, ремонту, будівництва, прискорення, підсилення юнітів, ослаблення юнітів і розміщення ядра, а також базу дронів-шахтарів Форпост.\nОновлення: чотири малі форпости квадратом 2x2 зливаються в Мега-форпост (4x4), а чотири форпости — у Квад-форпост (6x6); обидва будують важкі дрони з учетверо більшими характеристиками та драбиною покращень до шістнадцяти разів; дрони Quad випускають помічників Mono.\nОновлення: вибір руди Форпосту відкриває руди одразу після підвищення рівня видобутку; нова кнопка «Найменше» змушує Форпост добувати доступну руду, якої в ядрі найменше.\nОновлення: з увімкненою автокрадіжкою розвантажувачі з'єднуються лише з будівлями інших команд, включно з покинутими; будівлі своєї команди пропускаються. Увімкнення видаляє з'єднання зі своєю командою; вимкнення видаляє з'єднання з іншими командами.\nОновлення: автозв'язок тепер з'єднує лише джерела, які видають вибраний предмет; перевірка категорії виконується перед фільтром предметів, щоб зменшити лаги; вибір предметів у розвантажувачі та штовхачі використовує сітку 8x2.\nОновлення: кожен рядок блоків, юнітів, статусів і меню перекладено на всі 35 мов, які підтримує Mindustry; перевірка блокує коміти без перекладу.\nОновлення: новий Малий форпост — версія 2x2 на mono зі зниженими лімітами покращень; вибір руди показує один рядок на планету; кольори вартості покращень оновлюються в реальному часі.\nОновлення: новий блок Форпост будує літаючих дронів-шахтарів, що доставляють обрану руду до ядра; витрачайте предмети з ядра на покращення ліміту юнітів, швидкості, швидкості видобутку, вантажомісткості та рівня видобутку.
block.item-liquid-teleport-chrono-unloader.name = Хроно-вивантажувач
block.item-liquid-teleport-chrono-unloader.description = Витягує обраний предмет з усіх пов'язаних будівель глобально і виводить його через конвеєри.
block.item-liquid-teleport-chrono-pusher.name = Хроно-завантажувач
block.item-liquid-teleport-chrono-pusher.description = Відправляє всі збережені предмети у пов'язані будівлі глобально.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно-рідинний вивантажувач
block.item-liquid-teleport-chrono-liquid-unloader.description = Витягує обрану рідину з усіх пов'язаних будівель глобально і виводить її через труби.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно-рідинний завантажувач
block.item-liquid-teleport-chrono-liquid-pusher.description = Відправляє обрану рідину в усі пов'язані будівлі глобально.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно-рідинний укладач
block.item-liquid-teleport-chrono-liquid-tiler.description = Перетворює найближчий ландшафт на обране рідинне покриття по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно-рудний укладач
block.item-liquid-teleport-chrono-item-tiler.description = Перетворює найближчий ландшафт на обране рудне покриття по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-converter.name = Хроно-конвертер
block.item-liquid-teleport-chrono-item-converter.description = Конвертує обраний вхідний предмет у обраний вихідний предмет з коефіцієнтом, швидкістю та енерговитратами залежно від рідкісності.
block.item-liquid-teleport-chrono-core.name = Хроно-ядро
block.item-liquid-teleport-chrono-core.description = Чіт-ядро розміром 1x1, завжди розблоковане, виробляє юнітів гамма.
block.item-liquid-teleport-chrono-mender.name = Хроно-лікувальник
block.item-liquid-teleport-chrono-mender.description = Безперервно лікує всі дружні будівлі глобально. Малі бази повністю відновлюються кілька разів на секунду; великі бази лікуються послідовним проходом. Не потребує енергії чи ресурсів.
block.item-liquid-teleport-chrono-repair-point.name = Хроно-ремонтна точка
block.item-liquid-teleport-chrono-repair-point.description = Ремонтує пошкоджених дружніх юнітів глобально, відновлюючи 50% макс. здоров'я за секунду безперервним променем.
block.item-liquid-teleport-chrono-build-tower.name = Хроно-будівельна вежа
block.item-liquid-teleport-chrono-build-tower.description = Автоматично відбудовує споруди глобально та допомагає будівництву за логікою стандартної будівельної вежі.
block.item-liquid-teleport-chrono-booster.name = Хроно-прискорювач
block.item-liquid-teleport-chrono-booster.description = Купол прискорення 1x1, що приймає додаткові предмети і рідини для підсумовування радіуса й швидкості.
block.item-liquid-teleport-chrono-buffer.name = Хроно-підсилювач
block.item-liquid-teleport-chrono-buffer.description = Накладає позитивні ефекти на дружніх юнітів у радіусі. Додаткові предмети і рідини збільшують радіус, тривалість та кількість доступних статусів.
block.item-liquid-teleport-chrono-debuffer.name = Хроно-ослаблювач
block.item-liquid-teleport-chrono-debuffer.description = Накладає негативні ефекти на ворожих юнітів у радіусі. Додаткові предмети і рідини збільшують радіус та тривалість ефектів.
