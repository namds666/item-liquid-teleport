block.item-liquid-teleport-outpost.name = Základna
block.item-liquid-teleport-outpost.description = Staví těžební drony, jednoho každých 5 sekund, do limitu jednotek. Zvolte typ rudy v nabídce bloku; drony těží nejbližší rudu daného typu a dodávají ji do jádra. Utratit předměty z jádra za pět nezávislých vylepšení: limit jednotek, rychlost dronu, rychlost těžby, nosnost a úroveň těžby. Drony zahynou při zničení Základny.
unit.item-liquid-teleport-outpost-drone.name = Dron Základny
unit.item-liquid-teleport-outpost-drone.description = Létající těžební dron vyráběný Základnou. Jeho statistiky odpovídají úrovním vylepšení Základny.
block.item-liquid-teleport-outpost-small.name = Malá Základna
block.item-liquid-teleport-outpost-small.description = Základna 2x2 stavějící malé těžební drony, jednoho každých 5 sekund, do limitu jednotek. Zvolte typ rudy v nabídce bloku; drony těží nejbližší rudu daného typu a dodávají ji do jádra. Pět vylepšení s nižšími limity než Základna: limit jednotek, rychlost dronu, rychlost těžby, nosnost a úroveň těžby (max. 2). Drony zahynou při zničení Malé Základny.
unit.item-liquid-teleport-outpost-small-drone.name = Malý Dron Základny
unit.item-liquid-teleport-outpost-small-drone.description = Malý létající těžební dron vyráběný Malou Základnou. Jeho statistiky odpovídají úrovním vylepšení Malé Základny.
