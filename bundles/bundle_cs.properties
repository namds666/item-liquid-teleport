block.item-liquid-teleport-outpost.name = Základna
block.item-liquid-teleport-outpost.description = Staví těžební drony, jednoho každých 5 sekund, do limitu jednotek. Zvolte typ rudy v nabídce bloku; drony těží nejbližší rudu daného typu a dodávají ji do jádra. Utratit předměty z jádra za pět nezávislých vylepšení: limit jednotek, rychlost dronu, rychlost těžby, nosnost a úroveň těžby. Drony zahynou při zničení Základny.
unit.item-liquid-teleport-outpost-drone.name = Dron Základny
unit.item-liquid-teleport-outpost-drone.description = Létající těžební dron vyráběný Základnou. Jeho statistiky odpovídají úrovním vylepšení Základny.
block.item-liquid-teleport-outpost-micro.name = Mikro Základna
block.item-liquid-teleport-outpost-micro.description = Základna 1x1, která staví mikro těžební drony, jednoho každých 5 sekund, až do limitu jednotek. Vyberte typ rudy v menu bloku; drony těží nejbližší rudu tohoto typu a doručují ji do jádra. Linie vylepšení s nižšími limity než Malá Základna: limit jednotek, rychlost, rychlost těžby, nosnost, úroveň těžby (max. 2, dosáhne uhlí) a další. Čtyři Mikro Základny ve čtverci 2x2 se sloučí v Malou Základnu. Drony zahynou, když je Mikro Základna zničena.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Dron Základny
unit.item-liquid-teleport-outpost-micro-drone.description = Drobný létající těžební dron vyráběný Mikro Základnou. Jeho hodnoty odpovídají úrovním vylepšení jeho Mikro Základny.
block.item-liquid-teleport-outpost-small.name = Malá Základna
block.item-liquid-teleport-outpost-small.description = Základna 2x2 stavějící malé těžební drony, jednoho každých 5 sekund, do limitu jednotek. Zvolte typ rudy v nabídce bloku; drony těží nejbližší rudu daného typu a dodávají ji do jádra. Pět vylepšení s nižšími limity než Základna: limit jednotek, rychlost dronu, rychlost těžby, nosnost a úroveň těžby (max. 2). Drony zahynou při zničení Malé Základny.
unit.item-liquid-teleport-outpost-small-drone.name = Malý Dron Základny
unit.item-liquid-teleport-outpost-small-drone.description = Malý létající těžební dron vyráběný Malou Základnou. Jeho statistiky odpovídají úrovním vylepšení Malé Základny.
block.item-liquid-teleport-outpost-mega.name = Mega Základna
block.item-liquid-teleport-outpost-mega.description = Vznikne automaticky, když čtyři Malé Základny stojí ve čtverci 2x2. Staví těžební drony Mega se čtyřnásobnými statistikami dronu Malé Základny a žebříkem vylepšení až na šestnáctinásobek. Od začátku těží rudu úrovně 3, po jednom vylepšení úrovně 4. Nelze postavit přímo. Rozebrání vrátí čtyři Malé Základny.
unit.item-liquid-teleport-outpost-mega-drone.name = Dron Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Těžký těžební dron postavený Mega Základnou. Těží vybranou rudu a doručuje ji do jádra.
block.item-liquid-teleport-outpost-quad.name = Quad Základna
block.item-liquid-teleport-outpost-quad.description = Vznikne automaticky, když čtyři Základny stojí ve čtverci 2x2. Staví těžební drony Quad se čtyřnásobnými statistikami dronu Základny a žebříkem vylepšení až na šestnáctinásobek. Každý Quad vysílá jednoho pomocníka Mono za každou úroveň limitu jednotek, až čtyři, kteří těží stejnou rudu. Od začátku těží rudu úrovně 3, po jednom vylepšení úrovně 4. Nelze postavit přímo. Rozebrání vrátí čtyři Základny.
unit.item-liquid-teleport-outpost-quad-drone.name = Dron Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Těžký těžební dron postavený Quad Základnou. Těží vybranou rudu, doručuje ji do jádra a vysílá až čtyři pomocníky Mono, kteří těží s ním.
