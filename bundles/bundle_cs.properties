item-liquid-teleport.displayName = Teleport Předmětů a Kapalin
item-liquid-teleport.subtitle = v1.3.4: překlady do všech 35 jazyků Mindustry, kontrola lokalizace
item-liquid-teleport.description = Přidává cheatové Chrono bloky pro globální přepravu předmětů a kapalin, konverzi terénu, konverzi předmětů, opravy, stavbu, přetaktování, posílení jednotek, oslabení jednotek a umístění jádra, plus Základna — těžební báze s drony.\nAktualizace: každý text bloků, jednotek, stavů a nabídek je přeložen do všech 35 jazyků, které Mindustry podporuje; kontrola blokuje commity bez překladu.\nAktualizace: nová Malá Základna, verze 2x2 na bázi mono s nižšími limity vylepšení; výběr rudy zobrazuje jeden řádek na planetu; barvy nákladů vylepšení se aktualizují živě.\nAktualizace: nový blok Základna staví létající těžební drony dodávající vybranou rudu do jádra; vylepšujte limit jednotek, rychlost, rychlost těžby, nosnost a úroveň těžby za předměty z jádra.
block.item-liquid-teleport-chrono-unloader.name = Chrono Vykladač
block.item-liquid-teleport-chrono-unloader.description = Odebírá zvolený předmět ze všech propojených budov globálně a vydává jej přes dopravníky.
block.item-liquid-teleport-chrono-pusher.name = Chrono Nakladač
block.item-liquid-teleport-chrono-pusher.description = Odesílá všechny uložené předměty do propojených budov globálně.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Vykladač Kapalin
block.item-liquid-teleport-chrono-liquid-unloader.description = Odebírá zvolenou kapalinu ze všech propojených budov globálně a vydává ji přes potrubí.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Nakladač Kapalin
block.item-liquid-teleport-chrono-liquid-pusher.description = Odesílá zvolenou kapalinu do všech propojených budov globálně.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Pokládač Kapalin
block.item-liquid-teleport-chrono-liquid-tiler.description = Přeměňuje okolní terén na zvolenou kapalinovou podlahu po jedné dlaždici.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Pokládač Rud
block.item-liquid-teleport-chrono-item-tiler.description = Přeměňuje okolní terén na zvolenou rudnou vrstvu po jedné dlaždici.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Konvertor Předmětů
block.item-liquid-teleport-chrono-item-converter.description = Přeměňuje zvolený vstupní předmět na zvolený výstupní předmět s poměrem, rychlostí a náklady na energii dle vzácnosti.
block.item-liquid-teleport-chrono-core.name = Chrono Jádro
block.item-liquid-teleport-chrono-core.description = Jádro 1x1 cheatové úrovně, vždy odemčené, produkující jednotky gamma.
block.item-liquid-teleport-chrono-mender.name = Chrono Opravář
block.item-liquid-teleport-chrono-mender.description = Nepřetržitě léčí všechny spojenecké budovy globálně. Malé základny jsou plně obnoveny několikrát za sekundu; větší základny se léčí postupným průchodem. Nevyžaduje energii ani zdroje.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Opravný Bod
block.item-liquid-teleport-chrono-repair-point.description = Opravuje poškozené spojenecké jednotky globálně a obnovuje 50 % max. zdraví za sekundu nepřetržitým paprskem.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Stavební Věž
block.item-liquid-teleport-chrono-build-tower.description = Automaticky obnovuje stavby globálně a pomáhá se stavbou pomocí standardní logiky stavební věže.
block.item-liquid-teleport-chrono-booster.name = Chrono Zesilovač
block.item-liquid-teleport-chrono-booster.description = Kopule přetaktování 1x1, která přijímá další předměty a kapaliny pro kumulativní bonus dosahu a rychlosti.
block.item-liquid-teleport-chrono-buffer.name = Chrono Posilovač
block.item-liquid-teleport-chrono-buffer.description = Aplikuje posílení na spojenecké jednotky v dosahu. Další předměty a kapaliny zvyšují poloměr, dobu trvání a počet odemčených statusů.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Oslabovač
block.item-liquid-teleport-chrono-debuffer.description = Aplikuje kumulativní negativní efekty na nepřátelské jednotky v dosahu. Další předměty a kapaliny zvyšují poloměr a dobu trvání efektů.
