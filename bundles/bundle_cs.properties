block.item-liquid-teleport-chrono-hypno.name = Chrono Hypnóza
block.item-liquid-teleport-chrono-hypno.description = Blok 1x1, který udržuje naživu jednoho Yuri. Když Yuri zemře, blok počká 10 sekund a použije 25 křemíku ze svého skladu, aby ho vrátil. Yuri poutá jednu nepřátelskou jednotku nebo budovu najednou ze 20 polí a po 2 sekundách ji převede na vaši stranu. Více Yuri na stejném cíli ho převede rychleji: dva Yuri za poloviční čas. Pouto drží na jakoukoli vzdálenost, dokud cíl nepřejde nebo nezemře. Jádra převést nelze. Vylepšení za předměty z jádra: každá z 10 úrovní přidá 1 pole dosahu a zkrátí čas až na 1 sekundu. Čtyři Chrono Hypnóza ve čtverci 2x2 se spojí ve Velká Chrono Hypnóza. Yuri zemře, když je Chrono Hypnóza zničena.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Psychický mech bez zbraní. Poutá jednoho nepřítele najednou a převádí ho na vaši stranu. Více Yuri na stejném cíli ho převede rychleji. Přijímá rozkazy jako každá jednotka. Vytváří ho Chrono Hypnóza.
block.item-liquid-teleport-chrono-hypno-big.name = Velká Chrono Hypnóza
block.item-liquid-teleport-chrono-hypno-big.description = Vznikne sama, když čtyři Chrono Hypnóza stojí ve čtverci 2x2. Udržuje naživu jednoho Velký Yuri a vrací ho za 50 křemíku. Velký Yuri poutá dvě nepřátelské jednotky nebo budovy najednou. Stejný dosah, čas a vylepšení jako Chrono Hypnóza; po spojení začínají úrovně znovu od 1. Nelze postavit přímo.
unit.item-liquid-teleport-yuri-big.name = Velký Yuri
unit.item-liquid-teleport-yuri-big.description = Velký psychický mech bez zbraní. Poutá dva nepřátele najednou a převádí je na vaši stranu. Více Yuri na stejném cíli ho převede rychleji. Přijímá rozkazy jako každá jednotka. Vytváří ho Velká Chrono Hypnóza.
