block.item-liquid-teleport-chrono-item-converter.name = Хроно конвертор
block.item-liquid-teleport-chrono-item-converter.description = Конвертира избран входен предмет в избран изходен предмет с коефициент, скорост и разход на енергия в зависимост от рядкостта.
block.item-liquid-teleport-chrono-core.name = Хроно ядро
block.item-liquid-teleport-chrono-core.description = Чийт-ядро с размер 1x1, винаги отключено, произвежда единици гама.
block.item-liquid-teleport-chrono-mender.name = Хроно лечител
block.item-liquid-teleport-chrono-mender.description = Непрекъснато лекува всички приятелски сгради глобално. Малките бази се възстановяват напълно няколко пъти в секунда; по-големите бази се лекуват с последователно обхождане. Не изисква енергия или ресурси.
block.item-liquid-teleport-chrono-repair-point.name = Хроно ремонтна точка
block.item-liquid-teleport-chrono-repair-point.description = Ремонтира повредени приятелски единици глобално, възстановявайки 50% макс. здраве за секунда с непрекъснат лъч.
block.item-liquid-teleport-chrono-build-tower.name = Хроно строителна кула
block.item-liquid-teleport-chrono-build-tower.description = Автоматично възстановява структури глобално и подпомага строителството по логиката на стандартната строителна кула.
block.item-liquid-teleport-chrono-booster.name = Хроно ускорител
block.item-liquid-teleport-chrono-booster.description = Купол за ускоряване 1x1, приемащ допълнителни предмети и течности за добавяне на обхват и скорост.
block.item-liquid-teleport-chrono-buffer.name = Хроно усилвател
block.item-liquid-teleport-chrono-buffer.description = Прилага положителни ефекти върху приятелски единици в обхвата. Допълнителни предмети и течности увеличават обхвата, продължителността и броя на достъпните статуси.
block.item-liquid-teleport-chrono-debuffer.name = Хроно отслабвател
block.item-liquid-teleport-chrono-debuffer.description = Прилага отрицателни ефекти върху вражески единици в обхвата. Допълнителни предмети и течности увеличават обхвата и продължителността на ефектите.
