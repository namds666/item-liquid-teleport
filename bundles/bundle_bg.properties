block.item-liquid-teleport-chrono-hypno.name = Хроно хипноза
block.item-liquid-teleport-chrono-hypno.description = Блок 1x1, който поддържа един Юри жив. Когато Юри умре, блокът чака 10 секунди и използва 25 силиций от склада си, за да го върне. Юри връзва по една вражеска единица или сграда от 30 плочки и я преминава на твоя страна след 2 секунди. Повече Юри на една цел я преобразуват по-бързо: двама Юри — за половината време. Връзката се държи на всяко разстояние, докато целта премине или умре. Ядрата не могат да се преобразуват. Подобрявай с предмети от ядрото: всяко от 10 нива скъсява времето до 1 секунда. Четири Хроно хипноза в квадрат 2x2 се сливат в Голяма хроно хипноза. Юри умира, когато Хроно хипноза бъде унищожена.
unit.item-liquid-teleport-yuri.name = Юри
unit.item-liquid-teleport-yuri.description = Психически мех без оръжия. Връзва по един враг и го преминава на твоя страна. Повече Юри на една цел я преобразуват по-бързо. Изпълнява команди като всяка единица. Създава се от Хроно хипноза.
block.item-liquid-teleport-chrono-hypno-big.name = Голяма хроно хипноза
block.item-liquid-teleport-chrono-hypno-big.description = Образува се сама, когато четири Хроно хипноза стоят в квадрат 2x2. Поддържа един Голям Юри жив и го връща за 50 силиций. Голям Юри връзва две вражески единици или сгради едновременно. Същият обхват, време и подобрения като Хроно хипноза; след сливането нивата започват отново от 1. Не може да се строи директно.
unit.item-liquid-teleport-yuri-big.name = Голям Юри
unit.item-liquid-teleport-yuri-big.description = Голям психически мех без оръжия. Връзва двама врагове едновременно и ги преминава на твоя страна. Повече Юри на една цел я преобразуват по-бързо. Изпълнява команди като всяка единица. Създава се от Голяма хроно хипноза.
