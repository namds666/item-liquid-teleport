status.item-liquid-teleport-chrono-cryo.name = Хроно крио
status.item-liquid-teleport-chrono-cryo.description = Значително увеличава скоростта на презареждане на единицата.
block.item-liquid-teleport-outpost.name = Аванпост
block.item-liquid-teleport-outpost.description = Строи дрони-миньори, по един на всеки 5 секунди, до лимита на единици. Изберете тип руда от менюто на блока; дроните копаят най-близката руда от този тип и я доставят до ядрото. Харчете предмети от ядрото за подобряване на пет независими пътя: лимит единици, скорост на дронове, скорост на копаене, товароносимост и ниво на копаене. Дроните умират при унищожаване на Аванпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон на аванпоста
unit.item-liquid-teleport-outpost-drone.description = Летящ дрон-миньор, произведен от Аванпост. Характеристиките му следват нивата на подобрения на Аванпоста.
block.item-liquid-teleport-outpost-micro.name = Микро аванпост
block.item-liquid-teleport-outpost-micro.description = Аванпост 1x1, който строи микро миньорски дронове, по един на всеки 5 секунди, до лимита на единиците. Изберете вид руда в менюто на блока; дроновете копаят най-близката руда от този вид и я доставят до ядрото. Линии за подобрения с по-ниски лимити от Малкия аванпост: лимит на единиците, скорост, скорост на копаене, товароносимост, ниво на копаене (макс. 2, достига до въглища) и други. Четири Микро аванпоста в квадрат 2x2 се сливат в Малък аванпост. Дроновете умират, когато Микро аванпостът бъде унищожен.
unit.item-liquid-teleport-outpost-micro-drone.name = Дрон на микро аванпоста
unit.item-liquid-teleport-outpost-micro-drone.description = Мъничък летящ миньорски дрон, произвеждан от Микро аванпост. Характеристиките му следват нивата на подобрение на неговия Микро аванпост.
block.item-liquid-teleport-outpost-small.name = Малък аванпост
block.item-liquid-teleport-outpost-small.description = Аванпост 2x2, който строи малки дрони-миньори, по един на всеки 5 секунди, до лимита на единици. Изберете тип руда от менюто на блока; дроните копаят най-близката руда от този тип и я доставят до ядрото. Пет пътя за подобрения с по-ниски лимити от Аванпоста: лимит единици, скорост на дронове, скорост на копаене, товароносимост и ниво на копаене (макс. 2). Дроните умират при унищожаване на Малкия аванпост.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон на малкия аванпост
unit.item-liquid-teleport-outpost-small-drone.description = Малък летящ дрон-миньор, произведен от Малък аванпост. Характеристиките му следват нивата на подобрения на Малкия аванпост.
block.item-liquid-teleport-outpost-mega.name = Мега аванпост
block.item-liquid-teleport-outpost-mega.description = Образува се автоматично, когато четири малки аванпоста стоят в квадрат 2x2. Строи миньорски дронове Mega с четири пъти характеристиките на дрон от малък аванпост и стълба от подобрения до шестнадесет пъти. Добива руда от ниво 3 от самото начало, ниво 4 след едно подобрение. Не може да се строи директно. Разграждането връща четири малки аванпоста.
unit.item-liquid-teleport-outpost-mega-drone.name = Дрон Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Тежък миньорски дрон, строен от Мега аванпоста. Добива избраната руда и я доставя до ядрото.
block.item-liquid-teleport-outpost-quad.name = Квад аванпост
block.item-liquid-teleport-outpost-quad.description = Образува се автоматично, когато четири аванпоста стоят в квадрат 2x2. Строи миньорски дронове Quad с четири пъти характеристиките на дрон от аванпост и стълба от подобрения до шестнадесет пъти. Всеки Quad пуска по един помощник Mono за всяко ниво на лимита на единици, до четири, които добиват същата руда. Добива руда от ниво 3 от началото, ниво 4 след едно подобрение. Не може да се строи директно. Разграждането връща четири аванпоста.
unit.item-liquid-teleport-outpost-quad-drone.name = Дрон Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Тежък миньорски дрон, строен от Квад аванпоста. Добива избраната руда, доставя я до ядрото и пуска до четири помощника Mono, които добиват заедно с него.
