item-liquid-teleport.displayName = Телепортация на предмети и течности
item-liquid-teleport.subtitle = v1.3.4: преводи на всички 35 езика на Mindustry, проверка за локализация
item-liquid-teleport.description = Добавя чийт-ниво Хроно блокове за глобален транспорт на предмети и течности, преобразуване на терен, конвертиране на предмети, ремонт, строителство, ускоряване, усилване на единици, отслабване на единици и поставяне на ядро, плюс дрон-миньорска база Аванпост.\nОбновление: всеки текст на блок, единица, статус и меню е преведен на всички 35 езика, поддържани от Mindustry; проверка блокира къмити без превод.\nАктуализация: нов Малък аванпост — версия 2x2 на mono с намалени лимити за подобрения; изборът на руда показва по един ред на планета; цветовете на цената за подобрения се обновяват в реално време.\nАктуализация: нов блок Аванпост строи летящи дрони-миньори, които доставят избрана руда до ядрото; харчете предмети от ядрото за подобряване на лимит единици, скорост, скорост на копаене, товароносимост и ниво на копаене.
block.item-liquid-teleport-chrono-unloader.name = Хроно разтоварач
block.item-liquid-teleport-chrono-unloader.description = Извлича избран предмет от всички свързани сгради глобално и го извежда чрез конвейери.
block.item-liquid-teleport-chrono-pusher.name = Хроно товарач
block.item-liquid-teleport-chrono-pusher.description = Изпраща всички съхранени предмети в свързаните сгради глобално.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно течен разтоварач
block.item-liquid-teleport-chrono-liquid-unloader.description = Извлича избрана течност от всички свързани сгради глобално и я извежда чрез тръби.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно течен товарач
block.item-liquid-teleport-chrono-liquid-pusher.description = Изпраща избрана течност във всички свързани сгради глобално.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно течен покривач
block.item-liquid-teleport-chrono-liquid-tiler.description = Преобразува близкия терен в избрано течно покритие по една клетка наведнъж.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно руден покривач
block.item-liquid-teleport-chrono-item-tiler.description = Преобразува близкия терен в избрано рудно покритие по една клетка наведнъж.
block.item-liquid-teleport-chrono-item-converter.name = Хроно конвертор
block.item-liquid-teleport-chrono-item-converter.description = Конвертира избран входен предмет в избран изходен предмет с коефициент, скорост и разход на енергия в зависимост от рядкостта.
block.item-liquid-teleport-chrono-core.name = Хроно ядро
block.item-liquid-teleport-chrono-core.description = Чийт-ядро с размер 1x1, винаги отключено, произвежда единици гама.
block.item-liquid-teleport-chrono-mender.name = Хроно лечител
block.item-liquid-teleport-chrono-mender.description = Непрекъснато лекува всички приятелски сгради глобално. Малките бази се възстановяват напълно няколко пъти в секунда; по-големите бази се лекуват с последователно обхождане. Не изисква енергия или ресурси.
block.item-liquid-teleport-chrono-repair-point.name = Хроно ремонтна точка
block.item-liquid-teleport-chrono-repair-point.description = Ремонтира повредени приятелски единици глобално, възстановявайки 50% макс. здраве за секунда с непрекъснат лъч.
block.item-liquid-teleport-chrono-build-tower.name = Хроно строителна кула
block.item-liquid-teleport-chrono-build-tower.description = Автоматично възстановява структури глобално и подпомага строителството по логиката на стандартната строителна кула.
block.item-liquid-teleport-chrono-booster.name = Хроно ускорител
block.item-liquid-teleport-chrono-booster.description = Купол за ускоряване 1x1, приемащ допълнителни предмети и течности за добавяне на обхват и скорост.
block.item-liquid-teleport-chrono-buffer.name = Хроно усилвател
block.item-liquid-teleport-chrono-buffer.description = Прилага положителни ефекти върху приятелски единици в обхвата. Допълнителни предмети и течности увеличават обхвата, продължителността и броя на достъпните статуси.
block.item-liquid-teleport-chrono-debuffer.name = Хроно отслабвател
block.item-liquid-teleport-chrono-debuffer.description = Прилага отрицателни ефекти върху вражески единици в обхвата. Допълнителни предмети и течности увеличават обхвата и продължителността на ефектите.
status.item-liquid-teleport-chrono-conductive.name = Хроно проводимост
status.item-liquid-teleport-chrono-conductive.description = Увеличава скоростта на единицата.
status.item-liquid-teleport-chrono-dense.name = Хроно плътност
status.item-liquid-teleport-chrono-dense.description = Увеличава здравето на единицата.
status.item-liquid-teleport-chrono-focus.name = Хроно фокус
status.item-liquid-teleport-chrono-focus.description = Увеличава щетите на единицата.
status.item-liquid-teleport-chrono-precision.name = Хроно прецизност
status.item-liquid-teleport-chrono-precision.description = Увеличава скоростта на презареждане на единицата.
status.item-liquid-teleport-chrono-slip.name = Хроно плъзгане
status.item-liquid-teleport-chrono-slip.description = Увеличава скоростта на единицата.
status.item-liquid-teleport-chrono-ignite.name = Хроно запалване
status.item-liquid-teleport-chrono-ignite.description = Увеличава щетите на единицата.
status.item-liquid-teleport-chrono-alloyed.name = Хроно сплав
status.item-liquid-teleport-chrono-alloyed.description = Увеличава здравето на единицата.
status.item-liquid-teleport-chrono-jagged.name = Хроно назъбване
status.item-liquid-teleport-chrono-jagged.description = Увеличава щетите на единицата.
status.item-liquid-teleport-chrono-elastic.name = Хроно еластичност
status.item-liquid-teleport-chrono-elastic.description = Увеличава здравето на единицата.
status.item-liquid-teleport-chrono-surge.name = Хроно импулс
status.item-liquid-teleport-chrono-surge.description = Увеличава скоростта на презареждане на единицата.
status.item-liquid-teleport-chrono-pyro.name = Хроно пиро
status.item-liquid-teleport-chrono-pyro.description = Значително увеличава щетите на единицата.
status.item-liquid-teleport-chrono-blast.name = Хроно взрив
status.item-liquid-teleport-chrono-blast.description = Многократно увеличава щетите на единицата.
status.item-liquid-teleport-chrono-cooled.name = Хроно охлаждане
status.item-liquid-teleport-chrono-cooled.description = Увеличава скоростта на презареждане на единицата.
status.item-liquid-teleport-chrono-molten.name = Хроно разтопяване
status.item-liquid-teleport-chrono-molten.description = Увеличава щетите на единицата.
status.item-liquid-teleport-chrono-lubed.name = Хроно смазване
status.item-liquid-teleport-chrono-lubed.description = Увеличава скоростта на единицата.
status.item-liquid-teleport-chrono-cryo.name = Хроно крио
status.item-liquid-teleport-chrono-cryo.description = Значително увеличава скоростта на презареждане на единицата.
block.item-liquid-teleport-outpost.name = Аванпост
block.item-liquid-teleport-outpost.description = Строи дрони-миньори, по един на всеки 5 секунди, до лимита на единици. Изберете тип руда от менюто на блока; дроните копаят най-близката руда от този тип и я доставят до ядрото. Харчете предмети от ядрото за подобряване на пет независими пътя: лимит единици, скорост на дронове, скорост на копаене, товароносимост и ниво на копаене. Дроните умират при унищожаване на Аванпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон на аванпоста
unit.item-liquid-teleport-outpost-drone.description = Летящ дрон-миньор, произведен от Аванпост. Характеристиките му следват нивата на подобрения на Аванпоста.
block.item-liquid-teleport-outpost-small.name = Малък аванпост
block.item-liquid-teleport-outpost-small.description = Аванпост 2x2, който строи малки дрони-миньори, по един на всеки 5 секунди, до лимита на единици. Изберете тип руда от менюто на блока; дроните копаят най-близката руда от този тип и я доставят до ядрото. Пет пътя за подобрения с по-ниски лимити от Аванпоста: лимит единици, скорост на дронове, скорост на копаене, товароносимост и ниво на копаене (макс. 2). Дроните умират при унищожаване на Малкия аванпост.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон на малкия аванпост
unit.item-liquid-teleport-outpost-small-drone.description = Малък летящ дрон-миньор, произведен от Малък аванпост. Характеристиките му следват нивата на подобрения на Малкия аванпост.
