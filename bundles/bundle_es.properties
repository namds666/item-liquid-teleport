block.item-liquid-teleport-outpost.name = Puesto Avanzado
block.item-liquid-teleport-outpost.description = Construye drones mineros, uno cada 5 segundos, hasta alcanzar el límite de unidades. Selecciona un tipo de mineral en el menú del bloque; los drones extraen el mineral más cercano de ese tipo y lo entregan al núcleo. Gasta objetos del núcleo para mejorar cinco vías independientes: límite de unidades, velocidad de drones, velocidad de minería, capacidad de carga y nivel de minería. Los drones mueren si el Puesto Avanzado es destruido.
unit.item-liquid-teleport-outpost-drone.name = Dron del Puesto Avanzado
unit.item-liquid-teleport-outpost-drone.description = Un dron minero volador producido por un Puesto Avanzado. Sus estadísticas siguen los niveles de mejora de su Puesto Avanzado.
block.item-liquid-teleport-outpost-small.name = Pequeño Puesto Avanzado
block.item-liquid-teleport-outpost-small.description = Un Puesto Avanzado 2x2 que construye pequeños drones mineros, uno cada 5 segundos, hasta alcanzar el límite de unidades. Selecciona un tipo de mineral en el menú del bloque; los drones extraen el mineral más cercano de ese tipo y lo entregan al núcleo. Cinco vías de mejora con límites inferiores al Puesto Avanzado: límite de unidades, velocidad de drones, velocidad de minería, capacidad de carga y nivel de minería (máx. 2). Los drones mueren si el Pequeño Puesto Avanzado es destruido.
unit.item-liquid-teleport-outpost-small-drone.name = Dron del Pequeño Puesto Avanzado
unit.item-liquid-teleport-outpost-small-drone.description = Un pequeño dron minero volador producido por un Pequeño Puesto Avanzado. Sus estadísticas siguen los niveles de mejora de su Pequeño Puesto Avanzado.
block.item-liquid-teleport-outpost-mega.name = Mega Puesto Avanzado
block.item-liquid-teleport-outpost-mega.description = Se forma automáticamente cuando cuatro Pequeños Puestos Avanzados forman un cuadrado 2x2. Construye drones mineros Mega con cuatro veces las estadísticas de un dron de Pequeño Puesto Avanzado y una escala de mejoras que llega a dieciséis veces. Extrae mineral de nivel 3 desde el inicio, nivel 4 tras una mejora. No se puede construir directamente. Desmontarlo devuelve cuatro Pequeños Puestos Avanzados.
unit.item-liquid-teleport-outpost-mega-drone.name = Dron Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Dron minero pesado construido por el Mega Puesto Avanzado. Extrae el mineral seleccionado y lo entrega al núcleo.
block.item-liquid-teleport-outpost-quad.name = Quad Puesto Avanzado
block.item-liquid-teleport-outpost-quad.description = Se forma automáticamente cuando cuatro Puestos Avanzados forman un cuadrado 2x2. Construye drones mineros Quad con cuatro veces las estadísticas de un dron de Puesto Avanzado y una escala de mejoras que llega a dieciséis veces. Cada Quad despliega un ayudante Mono por nivel del límite de unidades, hasta cuatro, que extraen el mismo mineral. Extrae mineral de nivel 3 desde el inicio, nivel 4 tras una mejora. No se puede construir directamente. Desmontarlo devuelve cuatro Puestos Avanzados.
unit.item-liquid-teleport-outpost-quad-drone.name = Dron Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Dron minero pesado construido por el Quad Puesto Avanzado. Extrae el mineral seleccionado, lo entrega al núcleo y despliega hasta cuatro ayudantes Mono que extraen junto a él.
