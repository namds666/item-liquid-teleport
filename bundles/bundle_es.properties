item-liquid-teleport.displayName = Teletransporte de Objetos y Líquidos
item-liquid-teleport.subtitle = v1.4.3: Mejora de alcance de minería del Puesto Avanzado, los drones ayudantes igualan la velocidad del padre
item-liquid-teleport.description = Añade bloques Crono de nivel trampas para el transporte global de objetos y líquidos, conversión de terreno, conversión de objetos, reparación, construcción, sobremarcha, mejoras de unidades, debilitaciones de unidades y colocación de núcleos, además del Puesto Avanzado, base minera con drones.\nActualización: nueva línea de mejora Alcance de minería que alarga el rayo de minería de los drones en cada Puesto Avanzado; los drones ayudantes del Quad Puesto Avanzado ahora se mueven a la misma velocidad que su dron padre.\nActualización: las mejoras del nivel de minado del Puesto Avanzado nunca cuestan recursos por encima del nivel que desbloquean; en Erekir cada mejora del Puesto Avanzado usa recursos de Erekir.\nActualización: los Mega y Quad Puestos Avanzados tienen su propio diseño de edificio con plataformas de hangar, puntales y un reactor central.\nActualización: cuatro Pequeños Puestos Avanzados en un cuadrado 2x2 se fusionan en un Mega Puesto Avanzado (4x4) y cuatro Puestos Avanzados en un Quad Puesto Avanzado (6x6); ambos construyen drones pesados con cuatro veces las estadísticas y una escala de mejoras que llega a dieciséis veces; los drones Quad despliegan ayudantes Mono.\nActualización: el selector de mineral del Puesto avanzado desbloquea minerales justo después de mejorar el nivel de minería; un nuevo botón Mínimo hace que el Puesto extraiga el mineral disponible del que el núcleo tiene menos.\nActualización: con el robo automático activado, los descargadores solo enlazan edificios de otros equipos, incluidos los abandonados; los edificios del propio equipo se omiten. Activarlo elimina los enlaces con el propio equipo; desactivarlo elimina los enlaces con otros equipos.\nActualización: el enlace automático ahora solo enlaza fuentes que producen el objeto seleccionado; la comprobación de categoría se hace antes del filtro de objetos para reducir el lag; los selectores de objetos del descargador y el empujador usan una cuadrícula 8x2.\nActualización: todos los textos de bloques, unidades, estados y menús están traducidos a los 35 idiomas que admite Mindustry; una comprobación bloquea los commits sin traducción.\nActualización: nuevo Pequeño Puesto Avanzado, un Puesto Avanzado 2x2 basado en mono con límites de mejora reducidos; el selector de mineral muestra una fila por planeta; los colores de coste de mejora se actualizan en directo.\nActualización: nuevo bloque Puesto Avanzado que construye drones mineros voladores que entregan un mineral seleccionado al núcleo; gasta objetos del núcleo para mejorar el límite de unidades, la velocidad, la velocidad de minería, la capacidad de carga y el nivel de minería.
block.item-liquid-teleport-chrono-unloader.name = Crono Descargador
block.item-liquid-teleport-chrono-unloader.description = Extrae un objeto elegido de todos los edificios conectados en todo el mapa y lo distribuye mediante transportadores.
block.item-liquid-teleport-chrono-pusher.name = Crono Impulsor
block.item-liquid-teleport-chrono-pusher.description = Envía todos los objetos almacenados a los edificios conectados en todo el mapa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Crono Descargador de Líquido
block.item-liquid-teleport-chrono-liquid-unloader.description = Extrae un líquido elegido de todos los edificios conectados en todo el mapa y lo distribuye mediante tuberías.
block.item-liquid-teleport-chrono-liquid-pusher.name = Crono Impulsor de Líquido
block.item-liquid-teleport-chrono-liquid-pusher.description = Envía un líquido elegido a todos los edificios conectados en todo el mapa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Crono Colocador de Líquido
block.item-liquid-teleport-chrono-liquid-tiler.description = Convierte el terreno cercano en suelo líquido seleccionado, una casilla a la vez.
block.item-liquid-teleport-chrono-item-tiler.name = Crono Colocador de Mineral
block.item-liquid-teleport-chrono-item-tiler.description = Convierte el terreno cercano en la capa de mineral seleccionada, una casilla a la vez.
block.item-liquid-teleport-chrono-item-converter.name = Crono Convertidor de Objetos
block.item-liquid-teleport-chrono-item-converter.description = Convierte un objeto de entrada elegido en un objeto de salida elegido con ratio basado en rareza, velocidad y coste energético variables.
block.item-liquid-teleport-chrono-core.name = Crono Núcleo
block.item-liquid-teleport-chrono-core.description = Un núcleo 1x1 de nivel trampas, siempre desbloqueado, que produce unidades gamma.
block.item-liquid-teleport-chrono-mender.name = Crono Reparador
block.item-liquid-teleport-chrono-mender.description = Cura continuamente todos los edificios aliados en todo el mapa. Las bases pequeñas se restauran completamente varias veces por segundo; las bases grandes se curan mediante barrido progresivo. No requiere energía ni recursos.
block.item-liquid-teleport-chrono-repair-point.name = Crono Punto de Reparación
block.item-liquid-teleport-chrono-repair-point.description = Repara unidades aliadas dañadas en todo el mapa al 50 % de su vida máxima por segundo con un haz continuo.
block.item-liquid-teleport-chrono-build-tower.name = Crono Torre de Construcción
block.item-liquid-teleport-chrono-build-tower.description = Reconstruye automáticamente estructuras en todo el mapa y asiste la construcción con la lógica estándar de torre de construcción.
block.item-liquid-teleport-chrono-booster.name = Crono Amplificador
block.item-liquid-teleport-chrono-booster.description = Una cúpula de sobremarcha 1x1 que acepta objetos y líquidos adicionales para aumentar el alcance y la velocidad.
block.item-liquid-teleport-chrono-buffer.name = Crono Potenciador
block.item-liquid-teleport-chrono-buffer.description = Aplica mejoras a las unidades aliadas en alcance. Los objetos y líquidos adicionales aumentan el radio, la duración y el número de estados personalizados desbloqueados.
block.item-liquid-teleport-chrono-debuffer.name = Crono Debilitador
block.item-liquid-teleport-chrono-debuffer.description = Aplica efectos negativos acumulados a las unidades enemigas en alcance. Los objetos y líquidos adicionales aumentan el radio y la duración de los estados.
