block.item-liquid-teleport-chrono-liquid-tiler.description = Yakındaki araziyi seçili sıvı zeminine tek tek karo olarak dönüştürür.
block.item-liquid-teleport-chrono-item-tiler.name = Krono Cevher Döşeyici
