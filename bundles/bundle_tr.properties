block.item-liquid-teleport-chrono-pusher.description = Depolanan tüm eşyaları küresel olarak bağlı binalara iter.
block.item-liquid-teleport-chrono-liquid-unloader.name = Krono Sıvı Boşaltıcı
block.item-liquid-teleport-chrono-liquid-unloader.description = Seçili sıvıyı tüm bağlı binalardan küresel olarak çeker ve borular aracılığıyla çıkış yapar.
block.item-liquid-teleport-chrono-liquid-pusher.name = Krono Sıvı İtici
block.item-liquid-teleport-chrono-liquid-pusher.description = Seçili sıvıyı küresel olarak tüm bağlı binalara iter.
