block.item-liquid-teleport-outpost.name = Karakol
block.item-liquid-teleport-outpost.description = Birim kapasitesine kadar her 5 saniyede bir madenci drone inşa eder. Blok menüsünden cevher türünü seçin; dronelar en yakın ilgili cevheri kazıp çekirdeğe teslim eder. Beş bağımsız yolu yükseltmek için çekirdekten eşya harcayın: birim kapasitesi, drone hızı, kazma hızı, taşıma kapasitesi ve kazma seviyesi. Karakol yıkıldığında dronelar ölür.
unit.item-liquid-teleport-outpost-drone.name = Karakol Dronu
unit.item-liquid-teleport-outpost-drone.description = Bir Karakol tarafından üretilen uçan madenci drone. İstatistikleri Karakolunun yükseltme seviyelerine bağlıdır.
block.item-liquid-teleport-outpost-small.name = Küçük Karakol
block.item-liquid-teleport-outpost-small.description = Her 5 saniyede bir küçük madenci drone inşa eden 2x2 Karakol. Blok menüsünden cevher türünü seçin; dronelar en yakın ilgili cevheri kazıp çekirdeğe teslim eder. Karakoldan daha düşük sınırlı beş yükseltme yolu: birim kapasitesi, drone hızı, kazma hızı, taşıma kapasitesi ve kazma seviyesi (maks. 2). Küçük Karakol yıkıldığında dronelar ölür.
unit.item-liquid-teleport-outpost-small-drone.name = Küçük Karakol Dronu
unit.item-liquid-teleport-outpost-small-drone.description = Bir Küçük Karakol tarafından üretilen küçük uçan madenci drone. İstatistikleri Küçük Karakolunun yükseltme seviyelerine bağlıdır.
