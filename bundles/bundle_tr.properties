item-liquid-teleport.displayName = Eşya ve Sıvı Işınlama
item-liquid-teleport.subtitle = v1.3.4: Mindustry'nin 35 diline çeviriler, yerelleştirme denetimi
item-liquid-teleport.description = Küresel eşya ve sıvı taşıma, arazi dönüştürme, eşya dönüştürme, onarım, inşaat, aşırı hız, birim güçlendirmeleri, birim zayıflatmaları ve çekirdek yerleştirme için hile sınıfı Krono blokları ile Karakol drone madencilik üssü ekler.\nGüncelleme: tüm blok, birim, durum ve menü metinleri Mindustry'nin desteklediği 35 dile çevrildi; bir denetim çevirisi eksik commit'leri engeller.\nGüncelleme: yeni Küçük Karakol, daha düşük yükseltme sınırlarına sahip 2x2 mono tabanlı Karakol; cevher seçici gezegene göre bir satır gösterir; yükseltme maliyetleri canlı renklenir.\nGüncelleme: yeni Karakol bloğu seçilen cevheri çekirdeğe teslim eden uçan madenci dronelar inşa eder; çekirdek eşyalarıyla birim kapasitesi, hız, kazma hızı, taşıma kapasitesi ve kazma seviyesini yükseltin.
block.item-liquid-teleport-chrono-unloader.name = Krono Boşaltıcı
block.item-liquid-teleport-chrono-unloader.description = Seçili eşyayı tüm bağlı binalardan küresel olarak çeker ve konveyörler aracılığıyla çıkış yapar.
block.item-liquid-teleport-chrono-pusher.name = Krono İtici
block.item-liquid-teleport-chrono-pusher.description = Depolanan tüm eşyaları küresel olarak bağlı binalara iter.
block.item-liquid-teleport-chrono-liquid-unloader.name = Krono Sıvı Boşaltıcı
block.item-liquid-teleport-chrono-liquid-unloader.description = Seçili sıvıyı tüm bağlı binalardan küresel olarak çeker ve borular aracılığıyla çıkış yapar.
block.item-liquid-teleport-chrono-liquid-pusher.name = Krono Sıvı İtici
block.item-liquid-teleport-chrono-liquid-pusher.description = Seçili sıvıyı küresel olarak tüm bağlı binalara iter.
block.item-liquid-teleport-chrono-liquid-tiler.name = Krono Sıvı Döşeyici
block.item-liquid-teleport-chrono-liquid-tiler.description = Yakındaki araziyi seçili sıvı zeminine tek tek karo olarak dönüştürür.
block.item-liquid-teleport-chrono-item-tiler.name = Krono Cevher Döşeyici
block.item-liquid-teleport-chrono-item-tiler.description = Yakındaki araziyi seçili cevher katmanına tek tek karo olarak dönüştürür.
block.item-liquid-teleport-chrono-item-converter.name = Krono Eşya Dönüştürücü
block.item-liquid-teleport-chrono-item-converter.description = Seçili giriş eşyasını nadirlik tabanlı oran, hız ve güç maliyetiyle seçili çıkış eşyasına dönüştürür.
block.item-liquid-teleport-chrono-core.name = Krono Çekirdek
block.item-liquid-teleport-chrono-core.description = Her zaman açık olan ve gamma birimleri üreten 1x1 hile sınıfı çekirdek.
block.item-liquid-teleport-chrono-mender.name = Krono Onarıcı
block.item-liquid-teleport-chrono-mender.description = Tüm dost binaları küresel olarak sürekli iyileştirir. Küçük üsler saniyede birkaç kez tamamen onarılır; büyük üsler dönen taramayla iyileştirilir. Güç veya kaynak gerektirmez.
block.item-liquid-teleport-chrono-repair-point.name = Krono Onarım Noktası
block.item-liquid-teleport-chrono-repair-point.description = Hasarlı dost birimleri küresel olarak sürekli bir ışınla saniyede maksimum canın %50'si oranında onarır.
block.item-liquid-teleport-chrono-build-tower.name = Krono İnşaat Kulesi
block.item-liquid-teleport-chrono-build-tower.description = Yapıları küresel olarak otomatik yeniden inşa eder ve standart inşaat kulesi mantığıyla inşaata yardım eder.
block.item-liquid-teleport-chrono-booster.name = Krono Güçlendirici
block.item-liquid-teleport-chrono-booster.description = Ek menzil ve hız artışı için ekstra eşya ve sıvı kabul eden 1x1 aşırı hız kubbesi.
block.item-liquid-teleport-chrono-buffer.name = Krono Tampon
block.item-liquid-teleport-chrono-buffer.description = Menzil içindeki dost birimlere güçlendirmeler uygular. Ekstra eşyalar ve sıvılar yarıçapı, süreyi ve açılan özel durum sayısını artırır.
block.item-liquid-teleport-chrono-debuffer.name = Krono Zayıflatıcı
block.item-liquid-teleport-chrono-debuffer.description = Menzil içindeki düşman birimlere yığılabilir olumsuz durum etkileri uygular. Ekstra eşyalar ve sıvılar yarıçapı ve durum süresini artırır.
