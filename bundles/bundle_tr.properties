block.item-liquid-teleport-outpost.name = Karakol
block.item-liquid-teleport-outpost.description = Birim kapasitesine kadar her 5 saniyede bir madenci drone inşa eder. Blok menüsünden cevher türünü seçin; dronelar en yakın ilgili cevheri kazıp çekirdeğe teslim eder. Beş bağımsız yolu yükseltmek için çekirdekten eşya harcayın: birim kapasitesi, drone hızı, kazma hızı, taşıma kapasitesi ve kazma seviyesi. Karakol yıkıldığında dronelar ölür.
unit.item-liquid-teleport-outpost-drone.name = Karakol Dronu
unit.item-liquid-teleport-outpost-drone.description = Bir Karakol tarafından üretilen uçan madenci drone. İstatistikleri Karakolunun yükseltme seviyelerine bağlıdır.
block.item-liquid-teleport-outpost-micro.name = Mikro Karakol
block.item-liquid-teleport-outpost-micro.description = Birim sınırına kadar 5 saniyede bir mikro madenci drone üreten 1x1 bir karakol. Blok menüsünden bir cevher türü seçin; dronlar o türün en yakın cevherini kazar ve çekirdeğe teslim eder. Küçük Karakol'dan daha düşük sınırlara sahip yükseltme hatları: birim sınırı, hız, kazma hızı, taşıma kapasitesi, kazma seviyesi (maks. 2, kömüre ulaşır) ve daha fazlası. 2x2 kare içindeki dört Mikro Karakol, bir Küçük Karakol'da birleşir. Mikro Karakol yok edildiğinde dronlar ölür.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Karakol Dronu
unit.item-liquid-teleport-outpost-micro-drone.description = Bir Mikro Karakol tarafından üretilen minik uçan madenci drone. Değerleri, Mikro Karakolunun yükseltme seviyelerini izler.
block.item-liquid-teleport-outpost-small.name = Küçük Karakol
block.item-liquid-teleport-outpost-small.description = Her 5 saniyede bir küçük madenci drone inşa eden 2x2 Karakol. Blok menüsünden cevher türünü seçin; dronelar en yakın ilgili cevheri kazıp çekirdeğe teslim eder. Karakoldan daha düşük sınırlı beş yükseltme yolu: birim kapasitesi, drone hızı, kazma hızı, taşıma kapasitesi ve kazma seviyesi (maks. 2). Küçük Karakol yıkıldığında dronelar ölür.
unit.item-liquid-teleport-outpost-small-drone.name = Küçük Karakol Dronu
unit.item-liquid-teleport-outpost-small-drone.description = Bir Küçük Karakol tarafından üretilen küçük uçan madenci drone. İstatistikleri Küçük Karakolunun yükseltme seviyelerine bağlıdır.
block.item-liquid-teleport-outpost-mega.name = Mega Karakol
block.item-liquid-teleport-outpost-mega.description = Dört Küçük Karakol 2x2 kare halinde durduğunda otomatik oluşur. Küçük Karakol dronunun dört katı değerlere ve on altı kata ulaşan yükseltme basamaklarına sahip Mega madenci dronları üretir. Başlangıçtan itibaren 3. seviye cevher, bir yükseltmeden sonra 4. seviye cevher çıkarır. Doğrudan inşa edilemez. Sökülmesi dört Küçük Karakol bedelini geri verir.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega Dron
unit.item-liquid-teleport-outpost-mega-drone.description = Mega Karakol'un ürettiği ağır madenci dron. Seçilen cevheri çıkarır ve çekirdeğe teslim eder.
block.item-liquid-teleport-outpost-quad.name = Quad Karakol
block.item-liquid-teleport-outpost-quad.description = Dört Karakol 2x2 kare halinde durduğunda otomatik oluşur. Karakol dronunun dört katı değerlere ve on altı kata ulaşan yükseltme basamaklarına sahip Quad madenci dronları üretir. Her Quad, birim sınırı seviyesi başına bir Mono yardımcı, en fazla dört, çıkarır; bunlar aynı cevheri kazar. Başlangıçtan itibaren 3. seviye cevher, bir yükseltmeden sonra 4. seviye cevher çıkarır. Doğrudan inşa edilemez. Sökülmesi dört Karakol bedelini geri verir.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad Dron
unit.item-liquid-teleport-outpost-quad-drone.description = Quad Karakol'un ürettiği ağır madenci dron. Seçilen cevheri çıkarır, çekirdeğe teslim eder ve yanında kazan en fazla dört Mono yardımcı çıkarır.
