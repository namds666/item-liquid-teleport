item-liquid-teleport.displayName = Eşya ve Sıvı Işınlama
item-liquid-teleport.subtitle = v1.4.18: Yuri kendi 30 karelik menzilinde hedef arar
item-liquid-teleport.description = Küresel eşya ve sıvı taşıma, arazi ve eşya dönüştürme, onarım, inşa, aşırı hızlandırma, birim güçlendirme ve zayıflatma, zihin kontrolü ve çekirdek yerleştirme için hile seviyesinde Chrono blokları, ayrıca madenci dronlar üreten bir üs olan Karakol.\n\n[accent]v1.4.18[]\nYuri artık kendi çevresindeki 30 karelik menzilde hedef arar, bu yüzden nereye yürürse çevirmeye devam eder. Yükseltmeler artık yalnızca süreyi kısaltır.\n\n[accent]v1.4.17[]\nKrono Hipnoz artık 1x1. 2x2 karede dördü birleşip Büyük Krono Hipnoz olur; onun Büyük Yuri birimi iki hedefi aynı anda bağlar. Bir hedefte daha çok Yuri onu daha hızlı çevirir: iki Yuri yarı sürede.\n\n[accent]v1.4.16[]\nSürümlere göre değişikliklerle daha kısa mod açıklaması.\n\n[accent]v1.4.15[]\nKarakol, Quad Karakol ve Mega Karakol: kazı seviyesi 4 yükseltmesi titanyum ve silisyum ister.\n\n[accent]v1.4.14[]\nYeni Krono Hipnoz: Yuri düşman birimlerini ve binalarını senin tarafına geçirir.
