block.item-liquid-teleport-chrono-hypno.name = Krono Hipnoz
block.item-liquid-teleport-chrono-hypno.description = Bir Yuri birimini hayatta tutan 1x1 blok. Yuri ölünce blok 10 saniye bekler ve onu geri getirmek için deposundan 25 silisyum kullanır. Yuri 30 kareden bir seferde bir düşman birimini veya binasını bağlar ve 2 saniye sonra senin tarafına geçirir. Aynı hedefte daha çok Yuri onu daha hızlı çevirir: iki Yuri yarı sürede. Bağ, hedef dönüşene veya ölene kadar her mesafede sürer. Çekirdekler çevrilemez. Çekirdekteki eşyalarla yükselt: 10 seviyenin her biri süreyi 1 saniyeye kadar kısaltır. 2x2 karede dört Krono Hipnoz birleşip Büyük Krono Hipnoz olur. Krono Hipnoz yok edilince Yuri ölür.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Silahsız psişik bir robot. Bir seferde bir düşmanı bağlar ve senin tarafına geçirir. Aynı hedefte daha çok Yuri onu daha hızlı çevirir. Her birim gibi emir alır. Krono Hipnoz tarafından üretilir.
block.item-liquid-teleport-chrono-hypno-big.name = Büyük Krono Hipnoz
block.item-liquid-teleport-chrono-hypno-big.description = Dört Krono Hipnoz 2x2 karede durunca kendiliğinden oluşur. Bir Büyük Yuri birimini hayatta tutar ve onu 50 silisyumla geri getirir. Büyük Yuri iki düşman birimini veya binasını aynı anda bağlar. Menzil, süre ve yükseltmeler Krono Hipnoz ile aynıdır; birleşmeden sonra seviyeler yeniden 1'den başlar. Doğrudan inşa edilemez.
unit.item-liquid-teleport-yuri-big.name = Büyük Yuri
unit.item-liquid-teleport-yuri-big.description = Silahsız büyük psişik bir robot. İki düşmanı aynı anda bağlar ve senin tarafına geçirir. Aynı hedefte daha çok Yuri onu daha hızlı çevirir. Her birim gibi emir alır. Büyük Krono Hipnoz tarafından üretilir.
