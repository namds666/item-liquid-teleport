block.item-liquid-teleport-chrono-item-converter.name = Krono Eşya Dönüştürücü
block.item-liquid-teleport-chrono-item-converter.description = Seçili giriş eşyasını nadirlik tabanlı oran, hız ve güç maliyetiyle seçili çıkış eşyasına dönüştürür.
block.item-liquid-teleport-chrono-core.name = Krono Çekirdek
block.item-liquid-teleport-chrono-core.description = Her zaman açık olan ve gamma birimleri üreten 1x1 hile sınıfı çekirdek.
block.item-liquid-teleport-chrono-mender.name = Krono Onarıcı
block.item-liquid-teleport-chrono-mender.description = Tüm dost binaları küresel olarak sürekli iyileştirir. Küçük üsler saniyede birkaç kez tamamen onarılır; büyük üsler dönen taramayla iyileştirilir. Güç veya kaynak gerektirmez.
block.item-liquid-teleport-chrono-repair-point.name = Krono Onarım Noktası
block.item-liquid-teleport-chrono-repair-point.description = Hasarlı dost birimleri küresel olarak sürekli bir ışınla saniyede maksimum canın %50'si oranında onarır.
block.item-liquid-teleport-chrono-build-tower.name = Krono İnşaat Kulesi
block.item-liquid-teleport-chrono-build-tower.description = Yapıları küresel olarak otomatik yeniden inşa eder ve standart inşaat kulesi mantığıyla inşaata yardım eder.
block.item-liquid-teleport-chrono-booster.name = Krono Güçlendirici
block.item-liquid-teleport-chrono-booster.description = Ek menzil ve hız artışı için ekstra eşya ve sıvı kabul eden 1x1 aşırı hız kubbesi.
block.item-liquid-teleport-chrono-buffer.name = Krono Tampon
block.item-liquid-teleport-chrono-buffer.description = Menzil içindeki dost birimlere güçlendirmeler uygular. Ekstra eşyalar ve sıvılar yarıçapı, süreyi ve açılan özel durum sayısını artırır.
block.item-liquid-teleport-chrono-debuffer.name = Krono Zayıflatıcı
block.item-liquid-teleport-chrono-debuffer.description = Menzil içindeki düşman birimlere yığılabilir olumsuz durum etkileri uygular. Ekstra eşyalar ve sıvılar yarıçapı ve durum süresini artırır.
