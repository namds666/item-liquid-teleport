block.item-liquid-teleport-outpost.name = Außenposten
block.item-liquid-teleport-outpost.description = Baut Abbaudrohnen, eine alle 5 Sekunden, bis zum Einheitenlimit. Wähle im Blockmenü einen Erztyp; Drohnen bauen das nächste Erz dieses Typs ab und liefern es zum Kern. Gib Gegenstände aus dem Kern aus, um fünf unabhängige Pfade aufzuwerten: Einheitenlimit, Drohnengeschwindigkeit, Abbaugeschwindigkeit, Tragekapazität und Abbaustufe. Drohnen sterben, wenn der Außenposten zerstört wird.
unit.item-liquid-teleport-outpost-drone.name = Außenposten-Drohne
unit.item-liquid-teleport-outpost-drone.description = Eine fliegende Abbaudrohne, die von einem Außenposten produziert wird. Ihre Werte richten sich nach den Upgradestufen ihres Außenpostens.
block.item-liquid-teleport-outpost-small.name = Kleiner Außenposten
block.item-liquid-teleport-outpost-small.description = Ein 2x2-Außenposten, der kleine Abbaudrohnen baut, eine alle 5 Sekunden, bis zum Einheitenlimit. Wähle im Blockmenü einen Erztyp; Drohnen bauen das nächste Erz dieses Typs ab und liefern es zum Kern. Fünf Aufwertungspfade mit niedrigeren Grenzen als der Außenposten: Einheitenlimit, Drohnengeschwindigkeit, Abbaugeschwindigkeit, Tragekapazität und Abbaustufe (max. 2). Drohnen sterben, wenn der Kleine Außenposten zerstört wird.
unit.item-liquid-teleport-outpost-small-drone.name = Kleine Außenposten-Drohne
unit.item-liquid-teleport-outpost-small-drone.description = Eine kleine fliegende Abbaudrohne, die von einem Kleinen Außenposten produziert wird. Ihre Werte richten sich nach den Upgradestufen ihres Kleinen Außenpostens.
