item-liquid-teleport.displayName = Gegenstands-Flüssigkeits-Teleport
item-liquid-teleport.subtitle = v1.4.18: Yuri sucht Ziele in seiner eigenen Reichweite von 30 Feldern
item-liquid-teleport.description = Cheat-Chrono-Blöcke für globalen Gegenstands- und Flüssigkeitstransport, Gelände- und Gegenstandsumwandlung, Reparatur, Bau, Überantrieb, Einheiten-Buffs und -Debuffs, Gedankenkontrolle und Kernplatzierung, dazu der Außenposten, eine Basis, die Abbaudrohnen baut.\n\n[accent]v1.4.18[]\nYuri sucht jetzt Ziele in seiner eigenen Reichweite von 30 Feldern um sich herum und wandelt um, wo immer er läuft. Upgrades verkürzen jetzt nur die Zeit.\n\n[accent]v1.4.17[]\nChrono-Hypnose ist jetzt 1x1. Vier in einem 2x2-Quadrat verschmelzen zu einer Große Chrono-Hypnose, deren Großer Yuri zwei Ziele gleichzeitig bindet. Mehr Yuri auf einem Ziel wandeln es schneller um: zwei Yuri brauchen die halbe Zeit.\n\n[accent]v1.4.16[]\nKürzere Mod-Beschreibung mit Änderungen nach Version.\n\n[accent]v1.4.15[]\nAußenposten, Quad-Außenposten und Mega-Außenposten: das Upgrade auf Abbaustufe 4 kostet Titan und Silizium.\n\n[accent]v1.4.14[]\nNeue Chrono-Hypnose: Yuri wandelt feindliche Einheiten und Gebäude auf deine Seite um.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Entlader
block.item-liquid-teleport-chrono-unloader.description = Zieht einen gewählten Gegenstand aus allen verbundenen Gebäuden weltweit und gibt ihn über Fließbänder aus.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Schieber
block.item-liquid-teleport-chrono-pusher.description = Schiebt alle gelagerten Gegenstände in verbundene Gebäude weltweit.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Flüssigkeitsentlader
block.item-liquid-teleport-chrono-liquid-unloader.description = Zieht eine gewählte Flüssigkeit aus allen verbundenen Gebäuden weltweit und gibt sie über Rohre aus.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Flüssigkeitsschieber
block.item-liquid-teleport-chrono-liquid-pusher.description = Schiebt eine gewählte Flüssigkeit in alle verbundenen Gebäude weltweit.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Flüssigkeitsplatzierer
block.item-liquid-teleport-chrono-liquid-tiler.description = Wandelt umliegendes Gelände Feld für Feld in den gewählten Flüssigkeitsboden um.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Erzplatzierer
block.item-liquid-teleport-chrono-item-tiler.description = Wandelt umliegendes Gelände Feld für Feld in das gewählte Erz-Overlay um.
