item-liquid-teleport.displayName = Gegenstands-Flüssigkeits-Teleport
item-liquid-teleport.subtitle = v1.3.4: Übersetzungen in alle 35 Mindustry-Sprachen, Lokalisierungsprüfung
item-liquid-teleport.description = Fügt Cheat-Chrono-Blöcke für globalen Gegenstands- und Flüssigkeitstransport, Geländeumwandlung, Gegenstandsumwandlung, Reparatur, Bau, Überantrieb, Einheiten-Buffs, Einheiten-Debuffs und Kernplatzierung hinzu, sowie die Außenposten-Drohnen-Abbaubasis.\nUpdate: Jeder Text für Blöcke, Einheiten, Statuseffekte und Menüs ist in alle 35 von Mindustry unterstützten Sprachen übersetzt; eine Prüfung blockiert Commits ohne Übersetzung.\nAktualisierung: neuer Kleiner Außenposten, ein 2x2-Mono-Außenposten mit niedrigeren Upgrade-Grenzen; Erzauswahl zeigt eine Reihe pro Planet; Upgrade-Kostenfarben aktualisieren sich in Echtzeit.\nAktualisierung: neuer Außenposten-Block baut fliegende Abbaudrohnen, die ein gewähltes Erz zum Kern liefern; Einheitenlimit, Geschwindigkeit, Abbaugeschwindigkeit, Tragekapazität und Abbaustufe mit Gegenständen aus dem Kern aufwerten.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Entlader
block.item-liquid-teleport-chrono-unloader.description = Zieht einen gewählten Gegenstand aus allen verbundenen Gebäuden weltweit und gibt ihn über Fließbänder aus.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Schieber
block.item-liquid-teleport-chrono-pusher.description = Schiebt alle gelagerten Gegenstände in verbundene Gebäude weltweit.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Flüssigkeitsentlader
block.item-liquid-teleport-chrono-liquid-unloader.description = Zieht eine gewählte Flüssigkeit aus allen verbundenen Gebäuden weltweit und gibt sie über Rohre aus.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Flüssigkeitsschieber
block.item-liquid-teleport-chrono-liquid-pusher.description = Schiebt eine gewählte Flüssigkeit in alle verbundenen Gebäude weltweit.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Flüssigkeitsplatzierer
block.item-liquid-teleport-chrono-liquid-tiler.description = Wandelt umliegendes Gelände Feld für Feld in den gewählten Flüssigkeitsboden um.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Erzplatzierer
block.item-liquid-teleport-chrono-item-tiler.description = Wandelt umliegendes Gelände Feld für Feld in das gewählte Erz-Overlay um.
block.item-liquid-teleport-chrono-item-converter.name = Chrono-Gegenstandswandler
block.item-liquid-teleport-chrono-item-converter.description = Wandelt einen gewählten Eingangsgegenstand in einen gewählten Ausgangsgegenstand mit seltenheitsbasiertem Verhältnis, Geschwindigkeit und Energiekosten um.
block.item-liquid-teleport-chrono-core.name = Chrono-Kern
block.item-liquid-teleport-chrono-core.description = Ein 1x1-Cheat-Kern, der immer freigeschaltet ist und Gamma-Einheiten produziert.
block.item-liquid-teleport-chrono-mender.name = Chrono-Heiler
block.item-liquid-teleport-chrono-mender.description = Heilt kontinuierlich alle verbündeten Gebäude weltweit. Kleine Basen werden mehrmals pro Sekunde vollständig wiederhergestellt; größere Basen werden in einer rollenden Runde geheilt. Benötigt keinen Strom und keine Ressourcen.
block.item-liquid-teleport-chrono-repair-point.name = Chrono-Reparaturpunkt
block.item-liquid-teleport-chrono-repair-point.description = Repariert beschädigte verbündete Einheiten weltweit mit 50 % maximaler Gesundheit pro Sekunde durch einen durchgehenden Strahl.
block.item-liquid-teleport-chrono-build-tower.name = Chrono-Bauturm
block.item-liquid-teleport-chrono-build-tower.description = Baut Strukturen weltweit automatisch wieder auf und unterstützt den Bau mit Standard-Bauturm-Logik.
block.item-liquid-teleport-chrono-booster.name = Chrono-Verstärker
block.item-liquid-teleport-chrono-booster.description = Eine 1x1-Überantriebskuppel, die zusätzliche Gegenstände und Flüssigkeiten für additive Reichweiten- und Geschwindigkeitsboosts akzeptiert.
block.item-liquid-teleport-chrono-buffer.name = Chrono-Buffer
block.item-liquid-teleport-chrono-buffer.description = Verleiht verbündeten Einheiten in Reichweite Buffs. Zusätzliche Gegenstände und Flüssigkeiten erhöhen Radius, Dauer und die Anzahl freigeschalteter Status.
block.item-liquid-teleport-chrono-debuffer.name = Chrono-Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Wendet gestapelte negative Statuseffekte auf feindliche Einheiten in Reichweite an. Zusätzliche Gegenstände und Flüssigkeiten erhöhen Radius und Statusdauer.
