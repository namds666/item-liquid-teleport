block.item-liquid-teleport-chrono-item-converter.name = Chrono-Gegenstandswandler
block.item-liquid-teleport-chrono-item-converter.description = Wandelt einen gewählten Eingangsgegenstand in einen gewählten Ausgangsgegenstand mit seltenheitsbasiertem Verhältnis, Geschwindigkeit und Energiekosten um.
block.item-liquid-teleport-chrono-core.name = Chrono-Kern
block.item-liquid-teleport-chrono-core.description = Ein 1x1-Cheat-Kern, der immer freigeschaltet ist und Gamma-Einheiten produziert.
block.item-liquid-teleport-chrono-mender.name = Chrono-Heiler
block.item-liquid-teleport-chrono-mender.description = Heilt kontinuierlich alle verbündeten Gebäude weltweit. Kleine Basen werden mehrmals pro Sekunde vollständig wiederhergestellt; größere Basen werden in einer rollenden Runde geheilt. Benötigt keinen Strom und keine Ressourcen.
block.item-liquid-teleport-chrono-repair-point.name = Chrono-Reparaturpunkt
block.item-liquid-teleport-chrono-repair-point.description = Repariert beschädigte verbündete Einheiten weltweit mit 50 % maximaler Gesundheit pro Sekunde durch einen durchgehenden Strahl.
block.item-liquid-teleport-chrono-build-tower.name = Chrono-Bauturm
block.item-liquid-teleport-chrono-build-tower.description = Baut Strukturen weltweit automatisch wieder auf und unterstützt den Bau mit Standard-Bauturm-Logik.
block.item-liquid-teleport-chrono-booster.name = Chrono-Verstärker
block.item-liquid-teleport-chrono-booster.description = Eine 1x1-Überantriebskuppel, die zusätzliche Gegenstände und Flüssigkeiten für additive Reichweiten- und Geschwindigkeitsboosts akzeptiert.
block.item-liquid-teleport-chrono-buffer.name = Chrono-Buffer
block.item-liquid-teleport-chrono-buffer.description = Verleiht verbündeten Einheiten in Reichweite Buffs. Zusätzliche Gegenstände und Flüssigkeiten erhöhen Radius, Dauer und die Anzahl freigeschalteter Status.
block.item-liquid-teleport-chrono-debuffer.name = Chrono-Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Wendet gestapelte negative Statuseffekte auf feindliche Einheiten in Reichweite an. Zusätzliche Gegenstände und Flüssigkeiten erhöhen Radius und Statusdauer.
