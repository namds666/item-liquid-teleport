block.item-liquid-teleport-outpost.name = Außenposten
block.item-liquid-teleport-outpost.description = Baut Abbaudrohnen, eine alle 5 Sekunden, bis zum Einheitenlimit. Wähle im Blockmenü einen Erztyp; Drohnen bauen das nächste Erz dieses Typs ab und liefern es zum Kern. Gib Gegenstände aus dem Kern aus, um fünf unabhängige Pfade aufzuwerten: Einheitenlimit, Drohnengeschwindigkeit, Abbaugeschwindigkeit, Tragekapazität und Abbaustufe. Drohnen sterben, wenn der Außenposten zerstört wird.
unit.item-liquid-teleport-outpost-drone.name = Außenposten-Drohne
unit.item-liquid-teleport-outpost-drone.description = Eine fliegende Abbaudrohne, die von einem Außenposten produziert wird. Ihre Werte richten sich nach den Upgradestufen ihres Außenpostens.
block.item-liquid-teleport-outpost-micro.name = Mikro-Außenposten
block.item-liquid-teleport-outpost-micro.description = Ein 1x1-Außenposten, der Mikro-Abbaudrohnen baut, eine alle 5 Sekunden, bis zum Einheitenlimit. Wähle im Blockmenü einen Erztyp; Drohnen bauen das nächste Erz dieses Typs ab und liefern es zum Kern. Aufwertungspfade mit niedrigeren Grenzen als der Kleine Außenposten: Einheitenlimit, Geschwindigkeit, Abbaugeschwindigkeit, Tragekapazität, Abbaustufe (max. 2, erreicht Kohle) und weitere. Vier Mikro-Außenposten in einem 2x2-Quadrat verschmelzen zu einem Kleinen Außenposten. Drohnen sterben, wenn der Mikro-Außenposten zerstört wird.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro-Außenposten-Drohne
unit.item-liquid-teleport-outpost-micro-drone.description = Eine winzige fliegende Abbaudrohne, die von einem Mikro-Außenposten produziert wird. Ihre Werte richten sich nach den Upgradestufen ihres Mikro-Außenpostens.
block.item-liquid-teleport-outpost-small.name = Kleiner Außenposten
block.item-liquid-teleport-outpost-small.description = Ein 2x2-Außenposten, der kleine Abbaudrohnen baut, eine alle 5 Sekunden, bis zum Einheitenlimit. Wähle im Blockmenü einen Erztyp; Drohnen bauen das nächste Erz dieses Typs ab und liefern es zum Kern. Fünf Aufwertungspfade mit niedrigeren Grenzen als der Außenposten: Einheitenlimit, Drohnengeschwindigkeit, Abbaugeschwindigkeit, Tragekapazität und Abbaustufe (max. 2). Drohnen sterben, wenn der Kleine Außenposten zerstört wird.
unit.item-liquid-teleport-outpost-small-drone.name = Kleine Außenposten-Drohne
unit.item-liquid-teleport-outpost-small-drone.description = Eine kleine fliegende Abbaudrohne, die von einem Kleinen Außenposten produziert wird. Ihre Werte richten sich nach den Upgradestufen ihres Kleinen Außenpostens.
block.item-liquid-teleport-outpost-mega.name = Mega-Außenposten
block.item-liquid-teleport-outpost-mega.description = Entsteht automatisch, wenn vier Kleine Außenposten in einem 2x2-Quadrat stehen. Baut Mega-Abbaudrohnen mit dem Vierfachen der Werte einer Kleinen-Außenposten-Drohne und einer Upgrade-Leiter bis zum Sechzehnfachen. Baut von Anfang an Erz der Stufe 3 ab, nach einem Upgrade Stufe 4. Kann nicht direkt gebaut werden. Abbau erstattet vier Kleine Außenposten.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega-Drohne
unit.item-liquid-teleport-outpost-mega-drone.description = Schwere Abbaudrohne des Mega-Außenpostens. Baut das gewählte Erz ab und liefert es zum Kern.
block.item-liquid-teleport-outpost-quad.name = Quad-Außenposten
block.item-liquid-teleport-outpost-quad.description = Entsteht automatisch, wenn vier Außenposten in einem 2x2-Quadrat stehen. Baut Quad-Abbaudrohnen mit dem Vierfachen der Werte einer Außenposten-Drohne und einer Upgrade-Leiter bis zum Sechzehnfachen. Jeder Quad setzt pro Einheitenlimit-Stufe einen Mono-Helfer aus, bis zu vier, die dasselbe Erz abbauen. Baut von Anfang an Erz der Stufe 3 ab, nach einem Upgrade Stufe 4. Kann nicht direkt gebaut werden. Abbau erstattet vier Außenposten.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad-Drohne
unit.item-liquid-teleport-outpost-quad-drone.description = Schwere Abbaudrohne des Quad-Außenpostens. Baut das gewählte Erz ab, liefert es zum Kern und setzt bis zu vier Mono-Helfer aus, die mit ihr abbauen.
