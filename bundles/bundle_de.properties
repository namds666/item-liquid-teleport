block.item-liquid-teleport-chrono-hypno.name = Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno.description = Ein 1x1-Block, der einen Yuri am Leben hält. Stirbt Yuri, wartet der Block 10 Sekunden und nutzt 25 Silizium aus seinem Lager, um ihn zurückzuholen. Yuri bindet jeweils eine feindliche Einheit oder ein Gebäude aus 30 Feldern und wandelt es nach 2 Sekunden auf deine Seite um. Mehr Yuri auf demselben Ziel wandeln es schneller um: zwei Yuri brauchen die halbe Zeit. Das Band hält auf jede Entfernung, bis das Ziel umgewandelt ist oder stirbt. Kerne lassen sich nicht umwandeln. Mit Gegenständen aus dem Kern aufwerten: jede der 10 Stufen verkürzt die Zeit bis auf 1 Sekunde. Vier Chrono-Hypnose in einem 2x2-Quadrat verschmelzen zu einer Große Chrono-Hypnose. Yuri stirbt, wenn die Chrono-Hypnose zerstört wird.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Ein psychischer Mech ohne Waffen. Bindet jeweils einen Feind und wandelt ihn auf deine Seite um. Mehr Yuri auf demselben Ziel wandeln es schneller um. Nimmt Befehle wie jede Einheit an. Erzeugt von einer Chrono-Hypnose.
block.item-liquid-teleport-chrono-hypno-big.name = Große Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno-big.description = Entsteht automatisch, wenn vier Chrono-Hypnose in einem 2x2-Quadrat stehen. Hält einen Großer Yuri am Leben und holt ihn für 50 Silizium zurück. Großer Yuri bindet zwei feindliche Einheiten oder Gebäude gleichzeitig. Gleiche Reichweite, Zeit und Upgrades wie die Chrono-Hypnose; nach dem Verschmelzen beginnen die Stufen wieder bei 1. Kann nicht direkt gebaut werden.
unit.item-liquid-teleport-yuri-big.name = Großer Yuri
unit.item-liquid-teleport-yuri-big.description = Ein großer psychischer Mech ohne Waffen. Bindet zwei Feinde gleichzeitig und wandelt sie auf deine Seite um. Mehr Yuri auf demselben Ziel wandeln es schneller um. Nimmt Befehle wie jede Einheit an. Erzeugt von einer Große Chrono-Hypnose.
hypno.path = Hypnosekraft
