block.item-liquid-teleport-outpost.name = 前哨站
block.item-liquid-teleport-outpost.description = 每 5 秒生產一架採礦無人機，直到達到單位上限。在方塊選單中選擇礦石類型；無人機會開採最近的該類礦石並送回核心。消耗核心中的物品可升級五條獨立路線：單位上限、無人機速度、開採速度、攜帶容量和開採等級。前哨站被摧毀時無人機一同消失。
unit.item-liquid-teleport-outpost-drone.name = 前哨無人機
unit.item-liquid-teleport-outpost-drone.description = 由前哨站生產的飛行採礦無人機。其屬性跟隨所屬前哨站的升級等級。
block.item-liquid-teleport-outpost-small.name = 小型前哨站
block.item-liquid-teleport-outpost-small.description = 2x2 的前哨站，每 5 秒生產一架小型採礦無人機，直到達到單位上限。在方塊選單中選擇礦石類型；無人機開採最近的該類礦石並送回核心。五條升級路線的上限低於前哨站：單位上限、無人機速度、開採速度、攜帶容量和開採等級（最高 2）。小型前哨站被摧毀時無人機會消亡。
unit.item-liquid-teleport-outpost-small-drone.name = 小型前哨無人機
unit.item-liquid-teleport-outpost-small-drone.description = 由小型前哨站生產的小型飛行採礦無人機。其屬性跟隨所屬小型前哨站的升級等級。
block.item-liquid-teleport-outpost-mega.name = 巨型前哨站
block.item-liquid-teleport-outpost-mega.description = 四座小型前哨站排成 2x2 方陣時自動形成。生產巨型採礦無人機，屬性為小型前哨站無人機的 4 倍，升級階梯最高可達 16 倍。初始即可開採 3 級礦石，升級一次後可開採 4 級。無法直接建造。拆除返還四座小型前哨站的材料。
unit.item-liquid-teleport-outpost-mega-drone.name = 巨型無人機
unit.item-liquid-teleport-outpost-mega-drone.description = 巨型前哨站生產的重型採礦無人機。開採所選礦石並送回核心。
block.item-liquid-teleport-outpost-quad.name = 四足前哨站
block.item-liquid-teleport-outpost-quad.description = 四座前哨站排成 2x2 方陣時自動形成。生產四足採礦無人機，屬性為前哨站無人機的 4 倍，升級階梯最高可達 16 倍。每架四足無人機按單位上限等級各釋放一架單元助手，最多四架，開採相同礦石。初始即可開採 3 級礦石，升級一次後可開採 4 級。無法直接建造。拆除返還四座前哨站的材料。
unit.item-liquid-teleport-outpost-quad-drone.name = 四足無人機
unit.item-liquid-teleport-outpost-quad-drone.description = 四足前哨站生產的重型採礦無人機。開採所選礦石並送回核心，同時釋放最多四架單元助手一同開採。
