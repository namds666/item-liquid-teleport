item-liquid-teleport.displayName = 物品液體傳送
item-liquid-teleport.subtitle = v1.3.4：支援 Mindustry 全部 35 種語言，新增在地化檢查
item-liquid-teleport.description = 新增作弊等級的時空方塊，用於全域物品和液體運輸、地形轉換、物品轉換、修復、建造、超速驅動、單位增益、單位減益和核心放置，以及前哨站無人機採礦基地。\n更新：所有方塊、單位、狀態和選單文字已翻譯為 Mindustry 支援的全部 35 種語言；缺少翻譯的提交會被檢查攔截。\n更新：新增小型前哨站，2x2 的 mono 版前哨站，升級上限更低；礦石選擇按星球分行顯示；升級費用顏色即時更新。\n更新：新增前哨站方塊，生產飛行採礦無人機，將選定礦石送回核心；消耗核心物品可升級單位上限、速度、開採速度、攜帶容量和開採等級。
block.item-liquid-teleport-chrono-unloader.name = 時空提取器
block.item-liquid-teleport-chrono-unloader.description = 從全圖已連接建築中提取選定物品，並透過相鄰傳送帶輸出。
block.item-liquid-teleport-chrono-pusher.name = 時空推送器
block.item-liquid-teleport-chrono-pusher.description = 將所有儲存的物品全域推送到已連接建築中。
block.item-liquid-teleport-chrono-liquid-unloader.name = 時空液體提取器
block.item-liquid-teleport-chrono-liquid-unloader.description = 從全圖已連接建築中提取選定液體，並透過相鄰管道輸出。
block.item-liquid-teleport-chrono-liquid-pusher.name = 時空液體推送器
block.item-liquid-teleport-chrono-liquid-pusher.description = 將選定液體全域推送到已連接的所有建築中。
block.item-liquid-teleport-chrono-liquid-tiler.name = 時空液體鋪設器
block.item-liquid-teleport-chrono-liquid-tiler.description = 將附近的地形逐格轉換為選定的液體地面。
block.item-liquid-teleport-chrono-item-tiler.name = 時空礦石鋪設器
block.item-liquid-teleport-chrono-item-tiler.description = 將附近的地形逐格轉換為選定的礦石覆蓋層。
block.item-liquid-teleport-chrono-item-converter.name = 時空物品轉換器
block.item-liquid-teleport-chrono-item-converter.description = 將選定的輸入物品按稀有度比例、速度和能量消耗轉化為選定的輸出物品。
block.item-liquid-teleport-chrono-core.name = 時空核心
block.item-liquid-teleport-chrono-core.description = 1x1 的作弊等級核心，無需科技解鎖，可生產伽瑪單位。
block.item-liquid-teleport-chrono-mender.name = 時空修復器
block.item-liquid-teleport-chrono-mender.description = 持續全域治療所有友方建築。小型基地每秒可完全修復多次；大型基地以滾動掃描方式治療。無需電力或資源。
block.item-liquid-teleport-chrono-repair-point.name = 時空單位修復點
block.item-liquid-teleport-chrono-repair-point.description = 使用持續光束全域修復受損的友方單位，每秒恢復其最大生命值的 50%。
block.item-liquid-teleport-chrono-build-tower.name = 時空建造塔
block.item-liquid-teleport-chrono-build-tower.description = 使用原版建造塔邏輯，全域自動重建建築並輔助建造。
block.item-liquid-teleport-chrono-booster.name = 時空增幅器
block.item-liquid-teleport-chrono-booster.description = 1x1 超速穹頂變體，可消耗額外物品和液體疊加範圍與速度增幅。
block.item-liquid-teleport-chrono-buffer.name = 時空增益器
block.item-liquid-teleport-chrono-buffer.description = 為範圍內友方單位施加增益狀態。額外物品和液體會提高範圍、持續時間，並解鎖更多自訂狀態。
block.item-liquid-teleport-chrono-debuffer.name = 時空減益器
block.item-liquid-teleport-chrono-debuffer.description = 對範圍內敵方單位施加多種負面狀態。額外物品和液體會提高範圍和持續時間。
