block.item-liquid-teleport-chrono-hypno.name = 時空催眠器
block.item-liquid-teleport-chrono-hypno.description = 1x1 方塊，保持一個尤里存活。尤里死亡後，等待 10 秒並消耗儲存中的 25 矽使其復活。尤里每次在 20 格內牽引一個敵方單位或建築，2 秒後將其轉化為己方。多個尤里牽引同一目標時轉化更快：兩個尤里只需一半時間。牽引在任何距離都保持，直到目標被轉化或死亡。核心無法被轉化。使用核心中的物品升級：10 級中每級增加 1 格範圍並縮短時間，最低 1 秒。2x2 排列的四個時空催眠器會合併為大型時空催眠器。時空催眠器被摧毀時尤里死亡。
unit.item-liquid-teleport-yuri.name = 尤里
unit.item-liquid-teleport-yuri.description = 沒有武器的心靈機甲。每次牽引一個敵人並將其轉化為己方。多個尤里牽引同一目標時轉化更快。像其他單位一樣接受指令。由時空催眠器生成。
block.item-liquid-teleport-chrono-hypno-big.name = 大型時空催眠器
block.item-liquid-teleport-chrono-hypno-big.description = 四個時空催眠器排成 2x2 時自動形成。保持一個大型尤里存活，並消耗 50 矽使其復活。大型尤里同時牽引兩個敵方單位或建築。範圍、時間和升級與時空催眠器相同；合併後等級從 1 級重新開始。無法直接建造。
unit.item-liquid-teleport-yuri-big.name = 大型尤里
unit.item-liquid-teleport-yuri-big.description = 沒有武器的大型心靈機甲。同時牽引兩個敵人並將其轉化為己方。多個尤里牽引同一目標時轉化更快。像其他單位一樣接受指令。由大型時空催眠器生成。
