block.item-liquid-teleport-chrono-hypno.name = Hipnose Crono
block.item-liquid-teleport-chrono-hypno.description = Um bloco 1x1 que mantém um Yuri vivo. Quando Yuri morre, espera 10 segundos e usa 25 de silício do seu estoque para trazê-lo de volta. Yuri prende uma unidade ou construção inimiga por vez a até 20 blocos e a passa para o seu lado após 2 segundos. Mais Yuri no mesmo alvo o convertem mais rápido: dois Yuri levam metade do tempo. O laço se mantém a qualquer distância até o alvo ser convertido ou morrer. Núcleos não podem ser convertidos. Melhore com itens do núcleo: cada um dos 10 níveis adiciona 1 bloco de alcance e encurta o tempo, até 1 segundo. Quatro Hipnose Crono em um quadrado 2x2 se fundem em uma Grande Hipnose Crono. Yuri morre quando a Hipnose Crono é destruída.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Um mech psíquico sem armas. Prende um inimigo por vez e o passa para o seu lado. Mais Yuri no mesmo alvo o convertem mais rápido. Aceita ordens como qualquer unidade. Criado por uma Hipnose Crono.
block.item-liquid-teleport-chrono-hypno-big.name = Grande Hipnose Crono
block.item-liquid-teleport-chrono-hypno-big.description = Forma-se sozinha quando quatro Hipnose Crono ficam em um quadrado 2x2. Mantém um Grande Yuri vivo e o traz de volta por 50 de silício. Grande Yuri prende duas unidades ou construções inimigas ao mesmo tempo. Mesmo alcance, tempo e melhorias da Hipnose Crono; após a fusão os níveis recomeçam do 1. Não pode ser construída diretamente.
unit.item-liquid-teleport-yuri-big.name = Grande Yuri
unit.item-liquid-teleport-yuri-big.description = Um grande mech psíquico sem armas. Prende dois inimigos ao mesmo tempo e os passa para o seu lado. Mais Yuri no mesmo alvo o convertem mais rápido. Aceita ordens como qualquer unidade. Criado por uma Grande Hipnose Crono.
