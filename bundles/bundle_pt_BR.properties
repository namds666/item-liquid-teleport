item-liquid-teleport.displayName = Teleporte de Itens e Líquidos
item-liquid-teleport.subtitle = v1.3.4: traduções para os 35 idiomas do Mindustry, verificação de localização
item-liquid-teleport.description = Adiciona blocos Crono de nível cheat para transporte global de itens e líquidos, conversão de terreno, conversão de itens, reparo, construção, sobrecarga, buffs de unidade, debuffs de unidade e posicionamento de núcleo, além do Posto Avançado, base de mineração com drones.\nAtualização: todos os textos de blocos, unidades, status e menus estão traduzidos para os 35 idiomas suportados pelo Mindustry; uma verificação bloqueia commits sem tradução.\nAtualização: novo Posto Avançado Pequeno, um Posto Avançado 2x2 baseado em mono com limites de melhoria mais baixos; seletor de minério mostra uma linha por planeta; cores de custo de melhoria atualizam ao vivo.\nAtualização: novo bloco Posto Avançado constrói drones de mineração voadores que entregam o minério selecionado ao núcleo; gaste itens do núcleo para melhorar limite de unidades, velocidade, velocidade de mineração, capacidade de carga e nível de mineração.
block.item-liquid-teleport-chrono-unloader.name = Descarregador Crono
block.item-liquid-teleport-chrono-unloader.description = Puxa um item escolhido de todos os edifícios conectados globalmente e o envia por esteiras.
block.item-liquid-teleport-chrono-pusher.name = Empurrador Crono
block.item-liquid-teleport-chrono-pusher.description = Empurra todos os itens armazenados para os edifícios conectados globalmente.
block.item-liquid-teleport-chrono-liquid-unloader.name = Descarregador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-unloader.description = Puxa um líquido escolhido de todos os edifícios conectados globalmente e o envia por tubulações.
block.item-liquid-teleport-chrono-liquid-pusher.name = Empurrador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-pusher.description = Empurra um líquido escolhido para todos os edifícios conectados globalmente.
block.item-liquid-teleport-chrono-liquid-tiler.name = Ladrilhador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-tiler.description = Converte o terreno próximo no piso de líquido selecionado, um ladrilho por vez.
block.item-liquid-teleport-chrono-item-tiler.name = Ladrilhador de Minério Crono
block.item-liquid-teleport-chrono-item-tiler.description = Converte o terreno próximo na camada de minério selecionada, um ladrilho por vez.
block.item-liquid-teleport-chrono-item-converter.name = Conversor de Itens Crono
block.item-liquid-teleport-chrono-item-converter.description = Converte um item de entrada escolhido em um item de saída escolhido com proporção, velocidade e custo de energia baseados na raridade.
block.item-liquid-teleport-chrono-core.name = Núcleo Crono
block.item-liquid-teleport-chrono-core.description = Um núcleo 1x1 de nível cheat que está sempre desbloqueado e produz unidades gamma.
block.item-liquid-teleport-chrono-mender.name = Reparador Crono
block.item-liquid-teleport-chrono-mender.description = Cura continuamente todos os edifícios aliados globalmente. Bases pequenas são totalmente restauradas várias vezes por segundo; bases maiores são curadas em varredura contínua. Não requer energia nem recursos.
block.item-liquid-teleport-chrono-repair-point.name = Ponto de Reparo Crono
block.item-liquid-teleport-chrono-repair-point.description = Repara unidades aliadas danificadas globalmente em 50% da vida máxima por segundo com um feixe contínuo.
block.item-liquid-teleport-chrono-build-tower.name = Torre de Construção Crono
block.item-liquid-teleport-chrono-build-tower.description = Reconstrói estruturas automaticamente em todo o mapa e auxilia na construção com a lógica padrão de torre de construção.
block.item-liquid-teleport-chrono-booster.name = Impulsionador Crono
block.item-liquid-teleport-chrono-booster.description = Uma cúpula de sobrecarga 1x1 que aceita itens e líquidos extras para aumentar alcance e velocidade de forma aditiva.
block.item-liquid-teleport-chrono-buffer.name = Buffer Crono
block.item-liquid-teleport-chrono-buffer.description = Aplica buffs a unidades aliadas no alcance. Itens e líquidos extras aumentam o raio, a duração e o número de efeitos personalizados desbloqueados.
block.item-liquid-teleport-chrono-debuffer.name = Debuffer Crono
block.item-liquid-teleport-chrono-debuffer.description = Aplica efeitos negativos acumulados a unidades inimigas no alcance. Itens e líquidos extras aumentam o raio e a duração dos efeitos.
