block.item-liquid-teleport-outpost.name = Posto Avançado
block.item-liquid-teleport-outpost.description = Constrói drones de mineração, um a cada 5 segundos, até o limite de unidades. Selecione um tipo de minério no menu do bloco; os drones mineram o minério mais próximo desse tipo e o entregam ao núcleo. Gaste itens do núcleo para melhorar cinco caminhos independentes: limite de unidades, velocidade do drone, velocidade de mineração, capacidade de carga e nível de mineração. Os drones morrem quando o Posto Avançado é destruído.
unit.item-liquid-teleport-outpost-drone.name = Drone do Posto Avançado
unit.item-liquid-teleport-outpost-drone.description = Um drone de mineração voador produzido por um Posto Avançado. Seus atributos seguem os níveis de melhoria do Posto Avançado.
block.item-liquid-teleport-outpost-micro.name = Posto Avançado Micro
block.item-liquid-teleport-outpost-micro.description = Um posto avançado 1x1 que constrói microdrones de mineração, um a cada 5 segundos, até o limite de unidades. Selecione um tipo de minério no menu do bloco; os drones extraem o minério mais próximo desse tipo e o entregam ao núcleo. Linhas de melhoria com limites menores que o Posto Avançado Pequeno: limite de unidades, velocidade, velocidade de mineração, capacidade de carga, nível de mineração (máx. 2, alcança o carvão) e mais. Quatro Postos Avançados Micro em um quadrado 2x2 se fundem em um Posto Avançado Pequeno. Os drones morrem quando o Posto Avançado Micro é destruído.
unit.item-liquid-teleport-outpost-micro-drone.name = Drone do Posto Avançado Micro
unit.item-liquid-teleport-outpost-micro-drone.description = Um minúsculo drone de mineração voador produzido por um Posto Avançado Micro. Seus atributos seguem os níveis de melhoria do seu Posto Avançado Micro.
block.item-liquid-teleport-outpost-small.name = Posto Avançado Pequeno
block.item-liquid-teleport-outpost-small.description = Um Posto Avançado 2x2 que constrói drones de mineração pequenos, um a cada 5 segundos, até o limite de unidades. Selecione um tipo de minério no menu do bloco; os drones mineram o minério mais próximo desse tipo e o entregam ao núcleo. Cinco caminhos de melhoria com limites mais baixos que o Posto Avançado: limite de unidades, velocidade do drone, velocidade de mineração, capacidade de carga e nível de mineração (máx 2). Os drones morrem quando o Posto Avançado Pequeno é destruído.
unit.item-liquid-teleport-outpost-small-drone.name = Drone do Posto Avançado Pequeno
unit.item-liquid-teleport-outpost-small-drone.description = Um pequeno drone de mineração voador produzido por um Posto Avançado Pequeno. Seus atributos seguem os níveis de melhoria do Posto Avançado Pequeno.
block.item-liquid-teleport-outpost-mega.name = Mega Posto Avançado
block.item-liquid-teleport-outpost-mega.description = Forma-se automaticamente quando quatro Postos Avançados Pequenos ficam em um quadrado 2x2. Constrói drones mineradores Mega com quatro vezes as estatísticas de um drone do Posto Avançado Pequeno e uma escada de melhorias que chega a dezesseis vezes. Minera minério de nível 3 desde o início, nível 4 após uma melhoria. Não pode ser construído diretamente. A desconstrução devolve quatro Postos Avançados Pequenos.
unit.item-liquid-teleport-outpost-mega-drone.name = Drone Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Drone minerador pesado construído pelo Mega Posto Avançado. Minera o minério selecionado e o entrega ao núcleo.
block.item-liquid-teleport-outpost-quad.name = Quad Posto Avançado
block.item-liquid-teleport-outpost-quad.description = Forma-se automaticamente quando quatro Postos Avançados ficam em um quadrado 2x2. Constrói drones mineradores Quad com quatro vezes as estatísticas de um drone do Posto Avançado e uma escada de melhorias que chega a dezesseis vezes. Cada Quad lança um ajudante Mono por nível do limite de unidades, até quatro, que mineram o mesmo minério. Minera minério de nível 3 desde o início, nível 4 após uma melhoria. Não pode ser construído diretamente. A desconstrução devolve quatro Postos Avançados.
unit.item-liquid-teleport-outpost-quad-drone.name = Drone Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Drone minerador pesado construído pelo Quad Posto Avançado. Minera o minério selecionado, entrega-o ao núcleo e lança até quatro ajudantes Mono que mineram ao seu lado.
