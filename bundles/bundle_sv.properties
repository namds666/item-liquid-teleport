block.item-liquid-teleport-outpost.name = Utpost
block.item-liquid-teleport-outpost.description = Bygger gruvdrönare, en var 5:e sekund, upp till enhetsgränsen. Välj en malmtyp i blockmenyn; drönare bryter den närmaste malmen av den typen och levererar den till kärnan. Spendera föremål från kärnan för att uppgradera fem oberoende vägar: enhetsgräns, drönarhastighet, gruvhastighet, bärkapacitet och gruvnivå. Drönare dör när Utposten förstörs.
unit.item-liquid-teleport-outpost-drone.name = Utpost-Drönare
unit.item-liquid-teleport-outpost-drone.description = En flygande gruvdrönare producerad av en Utpost. Dess statistik följer uppgraderingsnivåerna för dess Utpost.
block.item-liquid-teleport-outpost-small.name = Liten Utpost
block.item-liquid-teleport-outpost-small.description = En 2x2-Utpost som bygger små gruvdrönare, en var 5:e sekund, upp till enhetsgränsen. Välj en malmtyp i blockmenyn; drönare bryter den närmaste malmen av den typen och levererar den till kärnan. Fem uppgraderingsvägar med lägre gränser än Utposten: enhetsgräns, drönarhastighet, gruvhastighet, bärkapacitet och gruvnivå (max 2). Drönare dör när den Lilla Utposten förstörs.
unit.item-liquid-teleport-outpost-small-drone.name = Liten Utpost-Drönare
unit.item-liquid-teleport-outpost-small-drone.description = En liten flygande gruvdrönare producerad av en Liten Utpost. Dess statistik följer uppgraderingsnivåerna för dess Lilla Utpost.
block.item-liquid-teleport-outpost-mega.name = Mega Utpost
block.item-liquid-teleport-outpost-mega.description = Bildas automatiskt när fyra Små Utposter står i en 2x2-kvadrat. Bygger Mega-gruvdrönare med fyra gånger värdena hos en Liten Utpost-drönare och en uppgraderingsstege som når sexton gånger. Bryter malm av nivå 3 från start, nivå 4 efter en uppgradering. Kan inte byggas direkt. Nedmontering återbetalar fyra Små Utposter.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega-drönare
unit.item-liquid-teleport-outpost-mega-drone.description = Tung gruvdrönare byggd av Mega Utposten. Bryter den valda malmen och levererar den till kärnan.
block.item-liquid-teleport-outpost-quad.name = Quad Utpost
block.item-liquid-teleport-outpost-quad.description = Bildas automatiskt när fyra Utposter står i en 2x2-kvadrat. Bygger Quad-gruvdrönare med fyra gånger värdena hos en Utpost-drönare och en uppgraderingsstege som når sexton gånger. Varje Quad sätter ut en Mono-hjälpare per enhetsgränsnivå, upp till fyra, som bryter samma malm. Bryter malm av nivå 3 från start, nivå 4 efter en uppgradering. Kan inte byggas direkt. Nedmontering återbetalar fyra Utposter.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad-drönare
unit.item-liquid-teleport-outpost-quad-drone.description = Tung gruvdrönare byggd av Quad Utposten. Bryter den valda malmen, levererar den till kärnan och sätter ut upp till fyra Mono-hjälpare som bryter vid dess sida.
