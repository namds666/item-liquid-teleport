item-liquid-teleport.displayName = Föremåls-Vätske-Teleport
item-liquid-teleport.subtitle = v1.4.3: Utpostens gruvräckviddsuppgradering, hjälpdrönare följer förälderns hastighet
item-liquid-teleport.description = Lägger till fusk-Chrono-block för global föremåls- och vätsketransport, terrängomvandling, föremålsomvandling, reparation, konstruktion, överdrift, enhetsbuffs, enhetsdebuffs och kärnplacering, plus Utpost-drönare-gruvbas.\nUppdatering: ny uppgraderingslinje Gruvräckvidd gör drönarnas gruvstråle längre vid varje Utpost; hjälpdrönarna från Quad Utpost rör sig nu lika snabbt som sin föräldradrönare.\nUppdatering: Utpostens uppgraderingar av brytningsnivå kostar aldrig resurser över den nivå de låser upp; på Erekir använder varje Utpost-uppgradering Erekir-resurser.\nUppdatering: Mega- och Quad Utposter får en egen byggnadsdesign med hangarplattor, stag och en central reaktor.\nUppdatering: fyra Små Utposter i en 2x2-kvadrat smälter samman till en Mega Utpost (4x4) och fyra Utposter till en Quad Utpost (6x6); båda bygger tunga drönare med fyra gånger värdena och en uppgraderingsstege som når sexton gånger; Quad-drönare sätter ut Mono-hjälpare.\nUppdatering: Utpostens malmväljare låser upp malmer direkt efter en uppgradering av brytningsnivå; en ny Minst-knapp får Utposten att bryta den tillgängliga malm kärnan har minst av.\nUppdatering: med autostöld på länkar avlastarna bara byggnader från andra lag, inklusive övergivna; eget lags byggnader hoppas över. Att slå på tar bort länkar till eget lag; att slå av tar bort länkar till andra lag.\nUppdatering: autolänk kopplar nu bara källor som ger ut det valda föremålet; kategorikontrollen körs före föremålsfiltret för att minska lagg; föremålsväljarna i avlastare och skjutare använder ett 8x2-rutnät.\nUppdatering: alla texter för block, enheter, statusar och menyer är översatta till alla 35 språk som Mindustry stöder; en kontroll blockerar commits utan översättning.\nUppdatering: ny Liten Utpost, en 2x2-mono-Utpost med lägre uppgraderingsgränser; malmväljaren visar en rad per planet; uppgraderingskostnadsfärger uppdateras live.\nUppdatering: nytt Utpost-block bygger flygande gruvdrönare som levererar en vald malm till kärnan; uppgradera enhetsgräns, hastighet, gruvhastighet, bärkapacitet och gruvnivå med föremål från kärnan.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Avlastare
block.item-liquid-teleport-chrono-unloader.description = Hämtar ett valt föremål från alla länkade byggnader globalt och matar ut det via transportband.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Tryckare
block.item-liquid-teleport-chrono-pusher.description = Trycker alla lagrade föremål in i länkade byggnader globalt.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Vätskeavlastare
block.item-liquid-teleport-chrono-liquid-unloader.description = Hämtar en vald vätska från alla länkade byggnader globalt och matar ut den via rör.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Vätsketryckare
block.item-liquid-teleport-chrono-liquid-pusher.description = Trycker en vald vätska in i alla länkade byggnader globalt.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Vätskeplacerare
block.item-liquid-teleport-chrono-liquid-tiler.description = Omvandlar närliggande terräng till det valda vätskegolvet en ruta i taget.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Malmplacerare
block.item-liquid-teleport-chrono-item-tiler.description = Omvandlar närliggande terräng till det valda malmöverlägget en ruta i taget.
block.item-liquid-teleport-chrono-item-converter.name = Chrono-Föremålsomvandlare
block.item-liquid-teleport-chrono-item-converter.description = Omvandlar ett valt införemål till ett valt utföremål med sällsynhetsbaserat förhållande, hastighet och energikostnad.
block.item-liquid-teleport-chrono-core.name = Chrono-Kärna
block.item-liquid-teleport-chrono-core.description = En 1x1-fuskkärna som alltid är upplåst och producerar gamma-enheter.
block.item-liquid-teleport-chrono-mender.name = Chrono-Lagare
block.item-liquid-teleport-chrono-mender.description = Helar kontinuerligt alla allierade byggnader globalt. Små baser återställs helt flera gånger per sekund; större baser healas i en rullande svepning. Kräver ingen ström eller resurser.
block.item-liquid-teleport-chrono-repair-point.name = Chrono-Reparationspunkt
block.item-liquid-teleport-chrono-repair-point.description = Reparerar skadade allierade enheter globalt med 50 % maximal hälsa per sekund via en kontinuerlig stråle.
block.item-liquid-teleport-chrono-build-tower.name = Chrono-Byggtorn
block.item-liquid-teleport-chrono-build-tower.description = Återuppbygger automatiskt strukturer globalt och assisterar konstruktion med standard byggtornlogik.
block.item-liquid-teleport-chrono-booster.name = Chrono-Förstärkare
block.item-liquid-teleport-chrono-booster.description = En 1x1-överdriftskupol som tar emot extra föremål och vätskor för additiva räckvidds- och hastighetsökningar.
block.item-liquid-teleport-chrono-buffer.name = Chrono-Buffer
block.item-liquid-teleport-chrono-buffer.description = Ger allierade enheter inom räckvidd buffs. Extra föremål och vätskor ökar radie, varaktighet och antalet upplåsta anpassade statusar.
block.item-liquid-teleport-chrono-debuffer.name = Chrono-Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Applicerar staplade negativa statuseffekter på fientliga enheter inom räckvidd. Extra föremål och vätskor ökar radie och statusvaraktighet.
