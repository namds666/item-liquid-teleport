block.item-liquid-teleport-chrono-hypno.name = Chrono-Hypnos
block.item-liquid-teleport-chrono-hypno.description = Ett 1x1-block som håller en Yuri vid liv. När Yuri dör väntar blocket 10 sekunder och använder 25 kisel ur sitt lager för att föra tillbaka honom. Yuri binder en fientlig enhet eller byggnad åt gången från 20 rutor och omvänder den till din sida efter 2 sekunder. Fler Yuri på samma mål omvänder det snabbare: två Yuri tar halva tiden. Bandet håller på alla avstånd tills målet omvänds eller dör. Kärnor kan inte omvändas. Uppgradera med föremål från kärnan: var och en av 10 nivåer ger 1 ruta räckvidd och kortar tiden ned till 1 sekund. Fyra Chrono-Hypnos i en 2x2-kvadrat smälter samman till en Stor Chrono-Hypnos. Yuri dör när Chrono-Hypnos förstörs.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = En psykisk mech utan vapen. Binder en fiende åt gången och omvänder den till din sida. Fler Yuri på samma mål omvänder det snabbare. Tar emot order som alla enheter. Skapas av en Chrono-Hypnos.
block.item-liquid-teleport-chrono-hypno-big.name = Stor Chrono-Hypnos
block.item-liquid-teleport-chrono-hypno-big.description = Bildas av sig själv när fyra Chrono-Hypnos står i en 2x2-kvadrat. Håller en Stor Yuri vid liv och för tillbaka honom för 50 kisel. Stor Yuri binder två fientliga enheter eller byggnader samtidigt. Samma räckvidd, tid och uppgraderingar som Chrono-Hypnos; efter sammanslagningen börjar nivåerna om från 1. Kan inte byggas direkt.
unit.item-liquid-teleport-yuri-big.name = Stor Yuri
unit.item-liquid-teleport-yuri-big.description = En stor psykisk mech utan vapen. Binder två fiender samtidigt och omvänder dem till din sida. Fler Yuri på samma mål omvänder det snabbare. Tar emot order som alla enheter. Skapas av en Stor Chrono-Hypnos.
