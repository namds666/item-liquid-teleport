block.item-liquid-teleport-outpost.name = Utpost
block.item-liquid-teleport-outpost.description = Bygger gruvdrönare, en var 5:e sekund, upp till enhetsgränsen. Välj en malmtyp i blockmenyn; drönare bryter den närmaste malmen av den typen och levererar den till kärnan. Spendera föremål från kärnan för att uppgradera fem oberoende vägar: enhetsgräns, drönarhastighet, gruvhastighet, bärkapacitet och gruvnivå. Drönare dör när Utposten förstörs.
unit.item-liquid-teleport-outpost-drone.name = Utpost-Drönare
unit.item-liquid-teleport-outpost-drone.description = En flygande gruvdrönare producerad av en Utpost. Dess statistik följer uppgraderingsnivåerna för dess Utpost.
block.item-liquid-teleport-outpost-small.name = Liten Utpost
block.item-liquid-teleport-outpost-small.description = En 2x2-Utpost som bygger små gruvdrönare, en var 5:e sekund, upp till enhetsgränsen. Välj en malmtyp i blockmenyn; drönare bryter den närmaste malmen av den typen och levererar den till kärnan. Fem uppgraderingsvägar med lägre gränser än Utposten: enhetsgräns, drönarhastighet, gruvhastighet, bärkapacitet och gruvnivå (max 2). Drönare dör när den Lilla Utposten förstörs.
unit.item-liquid-teleport-outpost-small-drone.name = Liten Utpost-Drönare
unit.item-liquid-teleport-outpost-small-drone.description = En liten flygande gruvdrönare producerad av en Liten Utpost. Dess statistik följer uppgraderingsnivåerna för dess Lilla Utpost.
