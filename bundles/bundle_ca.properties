block.item-liquid-teleport-outpost.name = Avanpost
block.item-liquid-teleport-outpost.description = Construeix drons miners, un cada 5 segons, fins al límit d’unitats. Seleccioneu un tipus de mineral al menú del bloc; els drons extreuen el mineral més proper d’aquell tipus i el lliuren al nucli. Gasteu objectes del nucli per millorar cinc vies independents: límit d’unitats, velocitat dels drons, velocitat de mineria, capacitat de càrrega i nivell de mineria. Els drons moren si l’Avanpost és destruït.
unit.item-liquid-teleport-outpost-drone.name = Dron de l’Avanpost
unit.item-liquid-teleport-outpost-drone.description = Un dron miner volador produït per un Avanpost. Les seves estadístiques segueixen els nivells de millora del seu Avanpost.
block.item-liquid-teleport-outpost-small.name = Petit Avanpost
block.item-liquid-teleport-outpost-small.description = Un Avanpost 2x2 que construeix petits drons miners, un cada 5 segons, fins al límit d’unitats. Seleccioneu un tipus de mineral al menú del bloc; els drons extreuen el mineral més proper d’aquell tipus i el lliuren al nucli. Cinc vies de millora amb límits inferiors a l’Avanpost: límit d’unitats, velocitat dels drons, velocitat de mineria, capacitat de càrrega i nivell de mineria (màx. 2). Els drons moren si el Petit Avanpost és destruït.
unit.item-liquid-teleport-outpost-small-drone.name = Dron del Petit Avanpost
unit.item-liquid-teleport-outpost-small-drone.description = Un petit dron miner volador produït per un Petit Avanpost. Les seves estadístiques segueixen els nivells de millora del seu Petit Avanpost.
block.item-liquid-teleport-outpost-mega.name = Mega Avanpost
block.item-liquid-teleport-outpost-mega.description = Es forma automàticament quan quatre Petits Avanposts formen un quadrat 2x2. Construeix drons miners Mega amb quatre vegades les estadístiques d'un dron de Petit Avanpost i una escala de millores que arriba a setze vegades. Mina mineral de nivell 3 des del principi, nivell 4 després d'una millora. No es pot construir directament. Desconstruir-lo retorna quatre Petits Avanposts.
unit.item-liquid-teleport-outpost-mega-drone.name = Dron Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Dron miner pesat construït pel Mega Avanpost. Mina el mineral seleccionat i el lliura al nucli.
block.item-liquid-teleport-outpost-quad.name = Quad Avanpost
block.item-liquid-teleport-outpost-quad.description = Es forma automàticament quan quatre Avanposts formen un quadrat 2x2. Construeix drons miners Quad amb quatre vegades les estadístiques d'un dron d'Avanpost i una escala de millores que arriba a setze vegades. Cada Quad desplega un ajudant Mono per nivell de límit d'unitats, fins a quatre, que minen el mateix mineral. Mina mineral de nivell 3 des del principi, nivell 4 després d'una millora. No es pot construir directament. Desconstruir-lo retorna quatre Avanposts.
unit.item-liquid-teleport-outpost-quad-drone.name = Dron Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Dron miner pesat construït pel Quad Avanpost. Mina el mineral seleccionat, el lliura al nucli i desplega fins a quatre ajudants Mono que minen al seu costat.
