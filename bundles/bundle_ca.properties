block.item-liquid-teleport-chrono-item-converter.name = Crono Convertidor d’Objectes
block.item-liquid-teleport-chrono-item-converter.description = Converteix un objecte d’entrada triat en un objecte de sortida triat amb un ratio basat en la raresa, velocitat i cost energètic variables.
block.item-liquid-teleport-chrono-core.name = Crono Nucli
block.item-liquid-teleport-chrono-core.description = Un nucli 1x1 de nivell trampes, sempre desbloquejat, que produeix unitats gamma.
block.item-liquid-teleport-chrono-mender.name = Crono Reparador
block.item-liquid-teleport-chrono-mender.description = Cura contínuament tots els edificis aliats a tot el mapa. Les bases petites es restauren completament diverses vegades per segon; les bases grans es curen amb un escombrat progressiu. No requereix energia ni recursos.
block.item-liquid-teleport-chrono-repair-point.name = Crono Punt de Reparació
block.item-liquid-teleport-chrono-repair-point.description = Repara unitats aliades malmeses a tot el mapa al 50 % de la seva vida màxima per segon amb un feix continu.
block.item-liquid-teleport-chrono-build-tower.name = Crono Torre de Construcció
block.item-liquid-teleport-chrono-build-tower.description = Reconstrueix automàticament estructures a tot el mapa i assisteix la construcció amb la lògica estàndard de torre de construcció.
block.item-liquid-teleport-chrono-booster.name = Crono Amplificador
block.item-liquid-teleport-chrono-booster.description = Una cúpula de sobremarxa 1x1 que accepta objectes i líquids addicionals per augmentar l’abast i la velocitat.
block.item-liquid-teleport-chrono-buffer.name = Crono Potenciador
block.item-liquid-teleport-chrono-buffer.description = Aplica millores a les unitats aliades a l’abast. Els objectes i líquids addicionals augmenten el radi, la durada i el nombre d’estats personalitzats desbloquejats.
block.item-liquid-teleport-chrono-debuffer.name = Crono Debilitador
block.item-liquid-teleport-chrono-debuffer.description = Aplica efectes negatius acumulats a les unitats enemigues a l’abast. Els objectes i líquids addicionals augmenten el radi i la durada dels estats.
