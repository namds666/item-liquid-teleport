block.item-liquid-teleport-chrono-hypno.name = Crono Hipnosi
block.item-liquid-teleport-chrono-hypno.description = Manté viu un Yuri. Quan Yuri mor, espera 10 segons i gasta 25 de silici del seu emmagatzematge per tornar-lo. Yuri enllaça una unitat o edifici enemic alhora des de 20 caselles i el passa al teu bàndol al cap de 2 segons; l'enllaç aguanta a qualsevol distància fins que l'objectiu es converteix o mor. Els nuclis no es poden convertir. Millora amb elements del nucli: cada un dels 10 nivells afegeix 1 casella d'abast i escurça el canal, fins a 1 segon. Yuri mor quan es destrueix la Crono Hipnosi.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Un mecha psíquic sense armes. Enllaça un enemic alhora i el converteix al teu bàndol. Obeeix ordres com qualsevol unitat. Creat per una Crono Hipnosi.
