item-liquid-teleport.displayName = Teletransport d’Objectes i Líquids
item-liquid-teleport.subtitle = v1.3.4: traduccions a les 35 llengües de Mindustry, control de localització
item-liquid-teleport.description = Afegeix blocs Crono de nivell trampes per al transport global d’objectes i líquids, conversió de terreny, conversió d’objectes, reparació, construcció, sobremarxa, millores d’unitats, debilitacions d’unitats i col·locació de nuclis, a més de l’Avanpost, base minera amb drons.\nActualització: tots els textos de blocs, unitats, estats i menús estan traduïts a les 35 llengües que admet Mindustry; una comprovació bloqueja els commits sense traducció.\nActualització: nou Petit Avanpost, un Avanpost 2x2 basat en mono amb límits de millora reduïts; el selector de mineral mostra una fila per planeta; els colors de cost de millora s’actualitzen en directe.\nActualització: nou bloc Avanpost que construeix drons miners voladors que lliuren un mineral seleccionat al nucli; gasteu objectes del nucli per millorar el límit d’unitats, la velocitat, la velocitat de mineria, la capacitat de càrrega i el nivell de mineria.
block.item-liquid-teleport-chrono-unloader.name = Crono Descarregador
block.item-liquid-teleport-chrono-unloader.description = Extreu un objecte triat de tots els edificis connectats a tot el mapa i el distribueix pels transportadors.
block.item-liquid-teleport-chrono-pusher.name = Crono Impulsor
block.item-liquid-teleport-chrono-pusher.description = Envia tots els objectes emmagatzemats als edificis connectats a tot el mapa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Crono Descarregador de Líquid
block.item-liquid-teleport-chrono-liquid-unloader.description = Extreu un líquid triat de tots els edificis connectats a tot el mapa i el distribueix per les canonades.
block.item-liquid-teleport-chrono-liquid-pusher.name = Crono Impulsor de Líquid
block.item-liquid-teleport-chrono-liquid-pusher.description = Envia un líquid triat a tots els edificis connectats a tot el mapa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Crono Col·locador de Líquid
block.item-liquid-teleport-chrono-liquid-tiler.description = Converteix el terreny proper en sòl líquid seleccionat, una casella a la vegada.
block.item-liquid-teleport-chrono-item-tiler.name = Crono Col·locador de Mineral
block.item-liquid-teleport-chrono-item-tiler.description = Converteix el terreny proper en la capa de mineral seleccionada, una casella a la vegada.
block.item-liquid-teleport-chrono-item-converter.name = Crono Convertidor d’Objectes
block.item-liquid-teleport-chrono-item-converter.description = Converteix un objecte d’entrada triat en un objecte de sortida triat amb un ratio basat en la raresa, velocitat i cost energètic variables.
block.item-liquid-teleport-chrono-core.name = Crono Nucli
block.item-liquid-teleport-chrono-core.description = Un nucli 1x1 de nivell trampes, sempre desbloquejat, que produeix unitats gamma.
block.item-liquid-teleport-chrono-mender.name = Crono Reparador
block.item-liquid-teleport-chrono-mender.description = Cura contínuament tots els edificis aliats a tot el mapa. Les bases petites es restauren completament diverses vegades per segon; les bases grans es curen amb un escombrat progressiu. No requereix energia ni recursos.
block.item-liquid-teleport-chrono-repair-point.name = Crono Punt de Reparació
block.item-liquid-teleport-chrono-repair-point.description = Repara unitats aliades malmeses a tot el mapa al 50 % de la seva vida màxima per segon amb un feix continu.
block.item-liquid-teleport-chrono-build-tower.name = Crono Torre de Construcció
block.item-liquid-teleport-chrono-build-tower.description = Reconstrueix automàticament estructures a tot el mapa i assisteix la construcció amb la lògica estàndard de torre de construcció.
block.item-liquid-teleport-chrono-booster.name = Crono Amplificador
block.item-liquid-teleport-chrono-booster.description = Una cúpula de sobremarxa 1x1 que accepta objectes i líquids addicionals per augmentar l’abast i la velocitat.
block.item-liquid-teleport-chrono-buffer.name = Crono Potenciador
block.item-liquid-teleport-chrono-buffer.description = Aplica millores a les unitats aliades a l’abast. Els objectes i líquids addicionals augmenten el radi, la durada i el nombre d’estats personalitzats desbloquejats.
block.item-liquid-teleport-chrono-debuffer.name = Crono Debilitador
block.item-liquid-teleport-chrono-debuffer.description = Aplica efectes negatius acumulats a les unitats enemigues a l’abast. Els objectes i líquids addicionals augmenten el radi i la durada dels estats.
