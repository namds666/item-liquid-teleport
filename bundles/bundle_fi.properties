item-liquid-teleport.displayName = Tavara- ja nestekuljetus
item-liquid-teleport.subtitle = v1.4.18: Yuri etsii kohteita omalta 30 ruudun kantamaltaan
item-liquid-teleport.description = Huijaustason Chrono-palikat esineiden ja nesteiden maailmanlaajuiseen kuljetukseen, maaston ja esineiden muuntamiseen, korjaukseen, rakentamiseen, ylikierroksiin, yksiköiden vahvistuksiin ja heikennyksiin, mielenhallintaan ja ytimen sijoittamiseen, sekä Etuvartio, tukikohta joka rakentaa kaivosdrooneja.\n\n[accent]v1.4.18[]\nYuri etsii nyt kohteita omalta 30 ruudun kantamaltaan ympäriltään, joten se kääntää kohteita minne tahansa kulkee. Päivitykset lyhentävät nyt vain aikaa.\n\n[accent]v1.4.17[]\nKrono-hypnoosi on nyt 1x1. Neljä 2x2-neliössä yhdistyy yhdeksi Suuri krono-hypnoosi, jonka Suuri Yuri sitoo kaksi kohdetta kerralla. Useampi Yuri yhdessä kohteessa kääntää sen nopeammin: kaksi Yuria puolessa ajassa.\n\n[accent]v1.4.16[]\nLyhyempi modin kuvaus, muutokset versioittain.\n\n[accent]v1.4.15[]\nEtuvartio, Quad-etuvartio ja Mega-etuvartio: kaivostason 4 päivitys maksaa titaania ja piitä.\n\n[accent]v1.4.14[]\nUusi Krono-hypnoosi: Yuri kääntää vihollisen yksiköt ja rakennukset puolellesi.
block.item-liquid-teleport-chrono-unloader.name = Krono-purkaja
block.item-liquid-teleport-chrono-unloader.description = Vetää valitun tavaran kaikista linkitetyistä rakennuksista maailmanlaajuisesti ja syöttää sen kuljettimien kautta.
