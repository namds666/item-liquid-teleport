item-liquid-teleport.displayName = Tavara- ja nestekuljetus
item-liquid-teleport.subtitle = v1.3.4: käännökset kaikille 35 Mindustry-kielelle, lokalisointitarkistus
item-liquid-teleport.description = Lisää huijausluokan Krono-lohkoja maailmanlaajuiseen tavara- ja nestekuljetukseen, maastonmuutokseen, tavaranmuuntamiseen, korjaukseen, rakentamiseen, ylivauhtiin, yksikköjen vahvistuksiin, yksikköjen heikennyksiin ja ytimen sijoitukseen sekä Etuvartio-kaivausdroonitukikohdan.\nPäivitys: kaikki lohkojen, yksiköiden, tilojen ja valikoiden tekstit on käännetty kaikille 35 Mindustryn tukemalle kielelle; tarkistus estää commitit, joista käännös puuttuu.\nPäivitys: uusi Pieni etuvartio, 2x2 mono-pohjainen Etuvartio alemmilla päivitysrajoilla; malmivalitsin näyttää yhden rivin planeettaa kohti; päivityskustannusten värit päivittyvät reaaliajassa.\nPäivitys: uusi Etuvartio-lohko rakentaa lentäviä kaivausdrooneita, jotka toimittavat valitun malmin ytimeen; päivitä yksikkökatto, nopeus, kaivausnopeus, kantokapasiteetti ja kaivausaste ytimen tavaroilla.
block.item-liquid-teleport-chrono-unloader.name = Krono-purkaja
block.item-liquid-teleport-chrono-unloader.description = Vetää valitun tavaran kaikista linkitetyistä rakennuksista maailmanlaajuisesti ja syöttää sen kuljettimien kautta.
block.item-liquid-teleport-chrono-pusher.name = Krono-työntäjä
block.item-liquid-teleport-chrono-pusher.description = Työntää kaikki varastoidut tavarat linkitettyihin rakennuksiin maailmanlaajuisesti.
block.item-liquid-teleport-chrono-liquid-unloader.name = Krono-nestepurkaja
block.item-liquid-teleport-chrono-liquid-unloader.description = Vetää valitun nesteen kaikista linkitetyistä rakennuksista maailmanlaajuisesti ja syöttää sen putkien kautta.
block.item-liquid-teleport-chrono-liquid-pusher.name = Krono-nestetyöntäjä
block.item-liquid-teleport-chrono-liquid-pusher.description = Työntää valitun nesteen kaikkiin linkitettyihin rakennuksiin maailmanlaajuisesti.
block.item-liquid-teleport-chrono-liquid-tiler.name = Krono-nestelaatoittaja
block.item-liquid-teleport-chrono-liquid-tiler.description = Muuntaa lähellä olevaa maastoa valituksi nestelattiaksi ruutu kerrallaan.
block.item-liquid-teleport-chrono-item-tiler.name = Krono-malmilaatoittaja
block.item-liquid-teleport-chrono-item-tiler.description = Muuntaa lähellä olevaa maastoa valituksi malmipeittoksi ruutu kerrallaan.
block.item-liquid-teleport-chrono-item-converter.name = Krono-tavaranmuuntaja
block.item-liquid-teleport-chrono-item-converter.description = Muuntaa valitun syötetavaran valituksi tuotetavaraksi harvinaisuuteen perustuvalla suhteella, nopeudella ja tehokustannuksella.
block.item-liquid-teleport-chrono-core.name = Krono-ydin
block.item-liquid-teleport-chrono-core.description = 1x1-kokoinen huijausluokan ydin, joka on aina auki ja tuottaa gammayksiköitä.
block.item-liquid-teleport-chrono-mender.name = Krono-korjaaja
block.item-liquid-teleport-chrono-mender.description = Parantaa jatkuvasti kaikkia ystävällisiä rakennuksia maailmanlaajuisesti. Pienet tukikohdat palautetaan kokonaan useita kertoja sekunnissa; suuremmat tukikohdat parannetaan pyörivällä skannauksella. Ei vaadi tehoa tai resursseja.
block.item-liquid-teleport-chrono-repair-point.name = Krono-korjauspiste
block.item-liquid-teleport-chrono-repair-point.description = Korjaa vahingoittuneita ystävällisiä yksiköitä maailmanlaajuisesti 50 % enimmäisterveydestä sekunnissa jatkuvalla säteellä.
block.item-liquid-teleport-chrono-build-tower.name = Krono-rakennustorni
block.item-liquid-teleport-chrono-build-tower.description = Uudelleenrakentaa rakenteita automaattisesti maailmanlaajuisesti ja avustaa rakentamista perusrakennustornilogiikalla.
block.item-liquid-teleport-chrono-booster.name = Krono-vahvistin
block.item-liquid-teleport-chrono-booster.description = 1x1-kokoinen ylivauhti-kupoli, joka hyväksyy ylimääräisiä tavaroita ja nesteitä lisäkantaman ja -nopeuden saamiseksi.
block.item-liquid-teleport-chrono-buffer.name = Krono-puskuri
block.item-liquid-teleport-chrono-buffer.description = Antaa liittolaisyksiköille vahvistuksia kantaman sisällä. Ylimääräiset tavarat ja nesteet kasvattavat sädettä, kestoa ja avattujen mukautettujen tilojen määrää.
block.item-liquid-teleport-chrono-debuffer.name = Krono-heikentäjä
block.item-liquid-teleport-chrono-debuffer.description = Kohdistaa kasautuvia negatiivisia tilavaikutuksia vihollisyksiköihin kantaman sisällä. Ylimääräiset tavarat ja nesteet kasvattavat sädettä ja tilan kestoa.
