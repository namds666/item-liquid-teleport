block.item-liquid-teleport-outpost.name = Etuvartio
block.item-liquid-teleport-outpost.description = Rakentaa kaivausdrooneita, yhden 5 sekunnin välein, yksikkökatton mukaan. Valitse malmityyppi lohkovalikossa; droonit kaivavat lähimmän kyseisen malmin ja toimittavat sen ytimeen. Käytä ytimen tavaroita viiden itsenäisen polun päivittämiseen: yksikkökatto, drooninopeus, kaivausnopeus, kantokapasiteetti ja kaivausaste. Droonit kuolevat Etuvartion tuhoutuessa.
unit.item-liquid-teleport-outpost-drone.name = Etuvartio-drooni
unit.item-liquid-teleport-outpost-drone.description = Etuvartion tuottama lentävä kaivausdrooni. Sen ominaisuudet seuraavat Etuvartion päivitystasoja.
block.item-liquid-teleport-outpost-micro.name = Mikroetuvartio
block.item-liquid-teleport-outpost-micro.description = 1x1-etuvartio, joka rakentaa mikrokaivosdroonit, yhden 5 sekunnin välein yksikkörajaansa asti. Valitse malmityyppi lohkovalikosta; droonit louhivat lähimmän kyseisen tyypin malmin ja toimittavat sen ytimeen. Päivityslinjat pienemmillä rajoilla kuin Pieni etuvartio: yksikköraja, nopeus, louhintanopeus, kantokyky, louhintataso (enintään 2, yltää hiileen) ja muita. Neljä Mikroetuvartiota 2x2-neliössä yhdistyy Pieneksi etuvartioksi. Droonit kuolevat, kun Mikroetuvartio tuhotaan.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikroetuvartio-drooni
unit.item-liquid-teleport-outpost-micro-drone.description = Pieni lentävä kaivosdrooni, jonka Mikroetuvartio valmistaa. Sen arvot noudattavat Mikroetuvartion päivitystasoja.
block.item-liquid-teleport-outpost-small.name = Pieni etuvartio
block.item-liquid-teleport-outpost-small.description = 2x2-kokoinen Etuvartio, joka rakentaa pieniä kaivausdrooneita, yhden 5 sekunnin välein, yksikkökatton mukaan. Valitse malmityyppi lohkovalikossa; droonit kaivavat lähimmän kyseisen malmin ja toimittavat sen ytimeen. Viisi päivityspolkua alemmilla rajoilla kuin Etuvartio: yksikkökatto, drooninopeus, kaivausnopeus, kantokapasiteetti ja kaivausaste (enintään 2). Droonit kuolevat Pienen etuvartion tuhoutuessa.
unit.item-liquid-teleport-outpost-small-drone.name = Pieni etuvartio-drooni
unit.item-liquid-teleport-outpost-small-drone.description = Pienen etuvartion tuottama pieni lentävä kaivausdrooni. Sen ominaisuudet seuraavat Pienen etuvartion päivitystasoja.
block.item-liquid-teleport-outpost-mega.name = Mega-etuvartio
block.item-liquid-teleport-outpost-mega.description = Muodostuu automaattisesti, kun neljä pientä etuvartiota seisoo 2x2-ruudukossa. Rakentaa Mega-kaivosdrooneja, joiden arvot ovat nelinkertaiset pienen etuvartion drooniin nähden ja joiden päivitysportaat ulottuvat kuusitoistakertaisiin. Kaivaa tason 3 malmia alusta alkaen, tason 4 yhden päivityksen jälkeen. Ei voi rakentaa suoraan. Purkaminen palauttaa neljä pientä etuvartiota.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega-drooni
unit.item-liquid-teleport-outpost-mega-drone.description = Mega-etuvartion rakentama raskas kaivosdrooni. Kaivaa valittua malmia ja toimittaa sen ytimeen.
block.item-liquid-teleport-outpost-quad.name = Quad-etuvartio
block.item-liquid-teleport-outpost-quad.description = Muodostuu automaattisesti, kun neljä etuvartiota seisoo 2x2-ruudukossa. Rakentaa Quad-kaivosdrooneja, joiden arvot ovat nelinkertaiset etuvartion drooniin nähden ja joiden päivitysportaat ulottuvat kuusitoistakertaisiin. Jokainen Quad lähettää yhden Mono-apurin yksikkörajan tasoa kohti, enintään neljä, jotka kaivavat samaa malmia. Kaivaa tason 3 malmia alusta alkaen, tason 4 yhden päivityksen jälkeen. Ei voi rakentaa suoraan. Purkaminen palauttaa neljä etuvartiota.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad-drooni
unit.item-liquid-teleport-outpost-quad-drone.description = Quad-etuvartion rakentama raskas kaivosdrooni. Kaivaa valittua malmia, toimittaa sen ytimeen ja lähettää enintään neljä Mono-apuria kaivamaan sen rinnalla.
