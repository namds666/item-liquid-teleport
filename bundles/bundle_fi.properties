block.item-liquid-teleport-chrono-item-converter.description = Muuntaa valitun syötetavaran valituksi tuotetavaraksi harvinaisuuteen perustuvalla suhteella, nopeudella ja tehokustannuksella.
block.item-liquid-teleport-chrono-core.name = Krono-ydin
block.item-liquid-teleport-chrono-core.description = 1x1-kokoinen huijausluokan ydin, joka on aina auki ja tuottaa gammayksiköitä.
block.item-liquid-teleport-chrono-mender.name = Krono-korjaaja
block.item-liquid-teleport-chrono-mender.description = Parantaa jatkuvasti kaikkia ystävällisiä rakennuksia maailmanlaajuisesti. Pienet tukikohdat palautetaan kokonaan useita kertoja sekunnissa; suuremmat tukikohdat parannetaan pyörivällä skannauksella. Ei vaadi tehoa tai resursseja.
block.item-liquid-teleport-chrono-repair-point.name = Krono-korjauspiste
block.item-liquid-teleport-chrono-repair-point.description = Korjaa vahingoittuneita ystävällisiä yksiköitä maailmanlaajuisesti 50 % enimmäisterveydestä sekunnissa jatkuvalla säteellä.
block.item-liquid-teleport-chrono-build-tower.name = Krono-rakennustorni
block.item-liquid-teleport-chrono-build-tower.description = Uudelleenrakentaa rakenteita automaattisesti maailmanlaajuisesti ja avustaa rakentamista perusrakennustornilogiikalla.
block.item-liquid-teleport-chrono-booster.name = Krono-vahvistin
block.item-liquid-teleport-chrono-booster.description = 1x1-kokoinen ylivauhti-kupoli, joka hyväksyy ylimääräisiä tavaroita ja nesteitä lisäkantaman ja -nopeuden saamiseksi.
block.item-liquid-teleport-chrono-buffer.name = Krono-puskuri
block.item-liquid-teleport-chrono-buffer.description = Antaa liittolaisyksiköille vahvistuksia kantaman sisällä. Ylimääräiset tavarat ja nesteet kasvattavat sädettä, kestoa ja avattujen mukautettujen tilojen määrää.
block.item-liquid-teleport-chrono-debuffer.name = Krono-heikentäjä
block.item-liquid-teleport-chrono-debuffer.description = Kohdistaa kasautuvia negatiivisia tilavaikutuksia vihollisyksiköihin kantaman sisällä. Ylimääräiset tavarat ja nesteet kasvattavat sädettä ja tilan kestoa.
