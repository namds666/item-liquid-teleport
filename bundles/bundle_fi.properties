block.item-liquid-teleport-chrono-hypno.name = Krono-hypnoosi
block.item-liquid-teleport-chrono-hypno.description = 1x1-palikka, joka pitää yhden Yuri hengissä. Kun Yuri kuolee, palikka odottaa 10 sekuntia ja käyttää varastostaan 25 piitä tuodakseen hänet takaisin. Yuri sitoo yhden vihollisen yksikön tai rakennuksen kerrallaan 30 ruudun päästä ja kääntää sen puolellesi 2 sekunnissa. Useampi Yuri samassa kohteessa kääntää sen nopeammin: kaksi Yuria puolessa ajassa. Side pitää millä tahansa etäisyydellä, kunnes kohde kääntyy tai kuolee. Ytimiä ei voi kääntää. Päivitä ytimen esineillä: jokainen 10 tasosta lyhentää aikaa 1 sekuntiin asti. Neljä Krono-hypnoosi 2x2-neliössä yhdistyy yhdeksi Suuri krono-hypnoosi. Yuri kuolee, kun Krono-hypnoosi tuhoutuu.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Aseeton psyykkinen mekaani. Sitoo yhden vihollisen kerrallaan ja kääntää sen puolellesi. Useampi Yuri samassa kohteessa kääntää sen nopeammin. Ottaa käskyjä kuten mikä tahansa yksikkö. Syntyy Krono-hypnoosista.
block.item-liquid-teleport-chrono-hypno-big.name = Suuri krono-hypnoosi
block.item-liquid-teleport-chrono-hypno-big.description = Syntyy itsestään, kun neljä Krono-hypnoosi on 2x2-neliössä. Pitää yhden Suuri Yuri hengissä ja tuo hänet takaisin 50 piillä. Suuri Yuri sitoo kaksi vihollisen yksikköä tai rakennusta kerralla. Sama kantama, aika ja päivitykset kuin Krono-hypnoosi; yhdistymisen jälkeen tasot alkavat uudelleen tasolta 1. Ei voi rakentaa suoraan.
unit.item-liquid-teleport-yuri-big.name = Suuri Yuri
unit.item-liquid-teleport-yuri-big.description = Suuri aseeton psyykkinen mekaani. Sitoo kaksi vihollista kerralla ja kääntää ne puolellesi. Useampi Yuri samassa kohteessa kääntää sen nopeammin. Ottaa käskyjä kuten mikä tahansa yksikkö. Syntyy Suuri krono-hypnoosista.
