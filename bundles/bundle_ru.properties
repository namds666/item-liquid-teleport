block.item-liquid-teleport-chrono-hypno.name = Хроно-гипноз
block.item-liquid-teleport-chrono-hypno.description = Блок 1x1, который держит живым одного Юрий. Когда Юрий погибает, блок ждёт 10 секунд и тратит 25 кремния из хранилища, чтобы вернуть его. Юрий связывает одну вражескую единицу или здание за раз с 20 клеток и переводит на вашу сторону через 2 секунды. Несколько Юриев на одной цели обращают её быстрее: двое — вдвое быстрее. Связь держится на любом расстоянии, пока цель не перейдёт или не погибнет. Ядра обратить нельзя. Улучшение за ресурсы из ядра: каждый из 10 уровней добавляет 1 клетку радиуса и сокращает время, до 1 секунды. Четыре Хроно-гипноз в квадрате 2x2 сливаются в Большой Хроно-гипноз. Юрий погибает, когда Хроно-гипноз уничтожен.
unit.item-liquid-teleport-yuri.name = Юрий
unit.item-liquid-teleport-yuri.description = Психический мех без оружия. Связывает одного врага за раз и переводит его на вашу сторону. Несколько Юриев на одной цели обращают её быстрее. Выполняет приказы как любая единица. Создаётся блоком Хроно-гипноз.
block.item-liquid-teleport-chrono-hypno-big.name = Большой Хроно-гипноз
block.item-liquid-teleport-chrono-hypno-big.description = Образуется сам, когда четыре Хроно-гипноз стоят в квадрате 2x2. Держит живым одного Большой Юрий и возвращает его за 50 кремния. Большой Юрий связывает две вражеские единицы или здания одновременно. Тот же радиус, время и улучшения, что у Хроно-гипноз; после слияния уровни начинаются заново с 1. Нельзя построить напрямую.
unit.item-liquid-teleport-yuri-big.name = Большой Юрий
unit.item-liquid-teleport-yuri-big.description = Большой психический мех без оружия. Связывает двух врагов одновременно и переводит их на вашу сторону. Несколько Юриев на одной цели обращают её быстрее. Выполняет приказы как любая единица. Создаётся блоком Большой Хроно-гипноз.
hypno.path = Сила гипноза
