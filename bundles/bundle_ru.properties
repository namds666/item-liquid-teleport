item-liquid-teleport.displayName = Телепортация предметов и жидкостей
item-liquid-teleport.subtitle = v1.4.6: Дроны форпоста добывают из любой точки в пределах дальности
item-liquid-teleport.description = Добавляет чит-уровневые Хроно-блоки для глобальной транспортировки предметов и жидкостей, преобразования ландшафта, конвертации предметов, ремонта, строительства, ускорения, усиления юнитов, ослабления юнитов и размещения ядра, а также базу дронов-шахтёров Форпост.\nОбновление: дроны форпоста теперь остаются на месте в любой точке в пределах дальности добычи и подлетают ближе, только если оказались дальше, поэтому больше не толкают друг друга за одно место.\nОбновление: каждая линия улучшений грузоподъёмности форпоста снижена до четверти; дроны-помощники Квад-форпоста теперь увеличивают грузоподъёмность вместе с уровнем родительского дрона.\nОбновление: дроны-помощники Квад-форпоста остаются связаны со своим родительским дроном после загрузки сохранения и больше не погибают при входе в мир.\nОбновление: новая линия улучшений «Дальность добычи» удлиняет луч добычи дронов у каждого форпоста; дроны-помощники Квад-форпоста теперь движутся с той же скоростью, что и их родительский дрон.\nОбновление: улучшения уровня добычи Форпоста никогда не требуют ресурсов выше уровня, который они открывают; на Erekir каждое улучшение Форпоста использует ресурсы Erekir.\nОбновление: Мега- и Квад-форпосты получили собственный дизайн здания с ангарными площадками, опорами и центральным реактором.\nОбновление: четыре малых форпоста квадратом 2x2 сливаются в Мега-форпост (4x4), а четыре форпоста — в Квад-форпост (6x6); оба строят тяжёлые дроны с учетверёнными характеристиками и лестницей улучшений до шестнадцати раз; дроны Quad выпускают помощников Mono.\nОбновление: выбор руды Форпоста открывает руды сразу после повышения уровня добычи; новая кнопка «Меньше всего» заставляет Форпост добывать доступную руду, которой в ядре меньше всего.\nОбновление: при включённой автокраже разгрузчики связываются только со зданиями других команд, включая заброшенные; здания своей команды пропускаются. Включение удаляет связи со своей командой; выключение удаляет связи с другими командами.\nОбновление: автосвязь теперь соединяет только источники, которые выдают выбранный предмет; проверка категории выполняется до фильтра предметов, чтобы снизить лаги; выбор предметов в разгрузчике и толкателе использует сетку 8x2.\nОбновление: каждая строка блоков, юнитов, статусов и меню переведена на все 35 языков, поддерживаемых Mindustry; проверка блокирует коммиты без перевода.\nОбновление: новый Малый форпост — 2x2 версия на mono с уменьшенными лимитами улучшений; выбор руды показывает по одной строке на планету; цвета стоимости улучшений обновляются в реальном времени.\nОбновление: новый блок Форпост строит летающих дронов-шахтёров, доставляющих выбранную руду в ядро; тратьте предметы из ядра на улучшение лимита юнитов, скорости, скорости добычи, грузоподъёмности и уровня добычи.
block.item-liquid-teleport-chrono-unloader.name = Хроно-разгрузчик
block.item-liquid-teleport-chrono-unloader.description = Извлекает выбранный предмет из всех связанных зданий глобально и выводит его через конвейеры.
block.item-liquid-teleport-chrono-pusher.name = Хроно-загрузчик
block.item-liquid-teleport-chrono-pusher.description = Отправляет все хранимые предметы в связанные здания глобально.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно-жидкостный разгрузчик
block.item-liquid-teleport-chrono-liquid-unloader.description = Извлекает выбранную жидкость из всех связанных зданий глобально и выводит её через трубы.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно-жидкостный загрузчик
block.item-liquid-teleport-chrono-liquid-pusher.description = Отправляет выбранную жидкость во все связанные здания глобально.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно-жидкостный укладчик
block.item-liquid-teleport-chrono-liquid-tiler.description = Преобразует ближайший ландшафт в выбранное жидкостное покрытие по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно-рудный укладчик
block.item-liquid-teleport-chrono-item-tiler.description = Преобразует ближайший ландшафт в выбранное рудное наложение по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-converter.name = Хроно-конвертер
block.item-liquid-teleport-chrono-item-converter.description = Конвертирует выбранный входной предмет в выбранный выходной предмет с коэффициентом, скоростью и энергозатратами, зависящими от редкости.
block.item-liquid-teleport-chrono-core.name = Хроно-ядро
block.item-liquid-teleport-chrono-core.description = Чит-ядро размером 1x1, всегда разблокировано, производит юнитов гамма.
block.item-liquid-teleport-chrono-mender.name = Хроно-ремонтник
block.item-liquid-teleport-chrono-mender.description = Непрерывно лечит все дружественные здания глобально. Маленькие базы полностью восстанавливаются несколько раз в секунду; крупные базы лечатся последовательным проходом. Не требует энергии и ресурсов.
block.item-liquid-teleport-chrono-repair-point.name = Хроно-ремонтная точка
block.item-liquid-teleport-chrono-repair-point.description = Ремонтирует повреждённых дружественных юнитов глобально, восстанавливая 50% макс. здоровья в секунду непрерывным лучом.
block.item-liquid-teleport-chrono-build-tower.name = Хроно-строительная башня
block.item-liquid-teleport-chrono-build-tower.description = Автоматически восстанавливает строения глобально и помогает строительству по логике стандартной строительной башни.
block.item-liquid-teleport-chrono-booster.name = Хроно-ускоритель
block.item-liquid-teleport-chrono-booster.description = Купол ускорения 1x1, принимающий дополнительные предметы и жидкости для суммирования радиуса и скорости.
block.item-liquid-teleport-chrono-buffer.name = Хроно-усилитель
block.item-liquid-teleport-chrono-buffer.description = Накладывает положительные эффекты на дружественных юнитов в радиусе. Дополнительные предметы и жидкости увеличивают радиус, длительность и число доступных статусов.
block.item-liquid-teleport-chrono-debuffer.name = Хроно-ослабитель
block.item-liquid-teleport-chrono-debuffer.description = Накладывает отрицательные эффекты на вражеских юнитов в радиусе. Дополнительные предметы и жидкости увеличивают радиус и длительность эффектов.
