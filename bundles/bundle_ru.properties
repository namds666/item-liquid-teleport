status.item-liquid-teleport-chrono-cryo.description = Значительно увеличивает скорость перезарядки юнита.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Строит дронов-шахтёров, по одному каждые 5 секунд, до лимита юнитов. Выберите тип руды в меню блока; дроны добывают ближайшую руду этого типа и доставляют в ядро. Тратьте предметы из ядра для улучшения пяти независимых веток: лимит юнитов, скорость дронов, скорость добычи, грузоподъёмность и уровень добычи. Дроны гибнут при уничтожении Форпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Летающий дрон-шахтёр, произведённый Форпостом. Его характеристики зависят от уровней улучшений Форпоста.
block.item-liquid-teleport-outpost-micro.name = Микрофорпост
block.item-liquid-teleport-outpost-micro.description = Форпост 1x1, который строит микро-дронов-добытчиков, по одному каждые 5 секунд, до лимита юнитов. Выберите тип руды в меню блока; дроны добывают ближайшую руду этого типа и доставляют её в ядро. Линии улучшений с меньшими лимитами, чем у Малого форпоста: лимит юнитов, скорость, скорость добычи, грузоподъёмность, уровень добычи (макс. 2, доходит до угля) и другие. Четыре Микрофорпоста в квадрате 2x2 сливаются в Малый форпост. Дроны погибают, когда Микрофорпост уничтожен.
unit.item-liquid-teleport-outpost-micro-drone.name = Дрон микрофорпоста
unit.item-liquid-teleport-outpost-micro-drone.description = Крошечный летающий дрон-добытчик, производимый Микрофорпостом. Его характеристики зависят от уровней улучшений его Микрофорпоста.
block.item-liquid-teleport-outpost-small.name = Малый форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2, строит малых дронов-шахтёров, по одному каждые 5 секунд, до лимита юнитов. Выберите тип руды в меню блока; дроны добывают ближайшую руду этого типа и доставляют в ядро. Пять веток улучшений с уменьшенными лимитами: лимит юнитов, скорость дронов, скорость добычи, грузоподъёмность и уровень добычи (макс. 2). Дроны гибнут при уничтожении Малого форпоста.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малого форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Малый летающий дрон-шахтёр, произведённый Малым форпостом. Его характеристики зависят от уровней улучшений Малого форпоста.
block.item-liquid-teleport-outpost-mega.name = Мега-форпост
block.item-liquid-teleport-outpost-mega.description = Образуется автоматически, когда четыре малых форпоста стоят квадратом 2x2. Строит шахтёрские дроны Mega с учетверёнными характеристиками дрона малого форпоста и лестницей улучшений до шестнадцати раз. С самого начала добывает руду 3-го уровня, после одного улучшения — 4-го. Нельзя построить напрямую. Разбор возвращает стоимость четырёх малых форпостов.
unit.item-liquid-teleport-outpost-mega-drone.name = Дрон Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Тяжёлый шахтёрский дрон Мега-форпоста. Добывает выбранную руду и доставляет её в ядро.
block.item-liquid-teleport-outpost-quad.name = Квад-форпост
block.item-liquid-teleport-outpost-quad.description = Образуется автоматически, когда четыре форпоста стоят квадратом 2x2. Строит шахтёрские дроны Quad с учетверёнными характеристиками дрона форпоста и лестницей улучшений до шестнадцати раз. Каждый Quad выпускает по одному помощнику Mono на уровень лимита юнитов, до четырёх, которые добывают ту же руду. С самого начала добывает руду 3-го уровня, после одного улучшения — 4-го. Нельзя построить напрямую. Разбор возвращает стоимость четырёх форпостов.
unit.item-liquid-teleport-outpost-quad-drone.name = Дрон Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Тяжёлый шахтёрский дрон Квад-форпоста. Добывает выбранную руду, доставляет её в ядро и выпускает до четырёх помощников Mono, которые добывают вместе с ним.
