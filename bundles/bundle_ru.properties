item-liquid-teleport.displayName = Телепортация предметов и жидкостей
item-liquid-teleport.subtitle = v1.3.4: переводы на все 35 языков Mindustry, проверка локализации
item-liquid-teleport.description = Добавляет чит-уровневые Хроно-блоки для глобальной транспортировки предметов и жидкостей, преобразования ландшафта, конвертации предметов, ремонта, строительства, ускорения, усиления юнитов, ослабления юнитов и размещения ядра, а также базу дронов-шахтёров Форпост.\nОбновление: каждая строка блоков, юнитов, статусов и меню переведена на все 35 языков, поддерживаемых Mindustry; проверка блокирует коммиты без перевода.\nОбновление: новый Малый форпост — 2x2 версия на mono с уменьшенными лимитами улучшений; выбор руды показывает по одной строке на планету; цвета стоимости улучшений обновляются в реальном времени.\nОбновление: новый блок Форпост строит летающих дронов-шахтёров, доставляющих выбранную руду в ядро; тратьте предметы из ядра на улучшение лимита юнитов, скорости, скорости добычи, грузоподъёмности и уровня добычи.
block.item-liquid-teleport-chrono-unloader.name = Хроно-разгрузчик
block.item-liquid-teleport-chrono-unloader.description = Извлекает выбранный предмет из всех связанных зданий глобально и выводит его через конвейеры.
block.item-liquid-teleport-chrono-pusher.name = Хроно-загрузчик
block.item-liquid-teleport-chrono-pusher.description = Отправляет все хранимые предметы в связанные здания глобально.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно-жидкостный разгрузчик
block.item-liquid-teleport-chrono-liquid-unloader.description = Извлекает выбранную жидкость из всех связанных зданий глобально и выводит её через трубы.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно-жидкостный загрузчик
block.item-liquid-teleport-chrono-liquid-pusher.description = Отправляет выбранную жидкость во все связанные здания глобально.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно-жидкостный укладчик
block.item-liquid-teleport-chrono-liquid-tiler.description = Преобразует ближайший ландшафт в выбранное жидкостное покрытие по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно-рудный укладчик
block.item-liquid-teleport-chrono-item-tiler.description = Преобразует ближайший ландшафт в выбранное рудное наложение по одному тайлу за раз.
block.item-liquid-teleport-chrono-item-converter.name = Хроно-конвертер
block.item-liquid-teleport-chrono-item-converter.description = Конвертирует выбранный входной предмет в выбранный выходной предмет с коэффициентом, скоростью и энергозатратами, зависящими от редкости.
block.item-liquid-teleport-chrono-core.name = Хроно-ядро
block.item-liquid-teleport-chrono-core.description = Чит-ядро размером 1x1, всегда разблокировано, производит юнитов гамма.
block.item-liquid-teleport-chrono-mender.name = Хроно-ремонтник
block.item-liquid-teleport-chrono-mender.description = Непрерывно лечит все дружественные здания глобально. Маленькие базы полностью восстанавливаются несколько раз в секунду; крупные базы лечатся последовательным проходом. Не требует энергии и ресурсов.
block.item-liquid-teleport-chrono-repair-point.name = Хроно-ремонтная точка
block.item-liquid-teleport-chrono-repair-point.description = Ремонтирует повреждённых дружественных юнитов глобально, восстанавливая 50% макс. здоровья в секунду непрерывным лучом.
block.item-liquid-teleport-chrono-build-tower.name = Хроно-строительная башня
block.item-liquid-teleport-chrono-build-tower.description = Автоматически восстанавливает строения глобально и помогает строительству по логике стандартной строительной башни.
block.item-liquid-teleport-chrono-booster.name = Хроно-ускоритель
block.item-liquid-teleport-chrono-booster.description = Купол ускорения 1x1, принимающий дополнительные предметы и жидкости для суммирования радиуса и скорости.
block.item-liquid-teleport-chrono-buffer.name = Хроно-усилитель
block.item-liquid-teleport-chrono-buffer.description = Накладывает положительные эффекты на дружественных юнитов в радиусе. Дополнительные предметы и жидкости увеличивают радиус, длительность и число доступных статусов.
block.item-liquid-teleport-chrono-debuffer.name = Хроно-ослабитель
block.item-liquid-teleport-chrono-debuffer.description = Накладывает отрицательные эффекты на вражеских юнитов в радиусе. Дополнительные предметы и жидкости увеличивают радиус и длительность эффектов.
status.item-liquid-teleport-chrono-conductive.name = Хроно-проводимость
status.item-liquid-teleport-chrono-conductive.description = Увеличивает скорость юнита.
status.item-liquid-teleport-chrono-dense.name = Хроно-плотность
status.item-liquid-teleport-chrono-dense.description = Увеличивает здоровье юнита.
status.item-liquid-teleport-chrono-focus.name = Хроно-фокус
status.item-liquid-teleport-chrono-focus.description = Увеличивает урон юнита.
status.item-liquid-teleport-chrono-precision.name = Хроно-точность
status.item-liquid-teleport-chrono-precision.description = Увеличивает скорость перезарядки юнита.
status.item-liquid-teleport-chrono-slip.name = Хроно-скольжение
status.item-liquid-teleport-chrono-slip.description = Увеличивает скорость юнита.
status.item-liquid-teleport-chrono-ignite.name = Хроно-воспламенение
status.item-liquid-teleport-chrono-ignite.description = Увеличивает урон юнита.
status.item-liquid-teleport-chrono-alloyed.name = Хроно-сплав
status.item-liquid-teleport-chrono-alloyed.description = Увеличивает здоровье юнита.
status.item-liquid-teleport-chrono-jagged.name = Хроно-зазубрина
status.item-liquid-teleport-chrono-jagged.description = Увеличивает урон юнита.
status.item-liquid-teleport-chrono-elastic.name = Хроно-упругость
status.item-liquid-teleport-chrono-elastic.description = Увеличивает здоровье юнита.
status.item-liquid-teleport-chrono-surge.name = Хроно-импульс
status.item-liquid-teleport-chrono-surge.description = Увеличивает скорость перезарядки юнита.
status.item-liquid-teleport-chrono-pyro.name = Хроно-пиро
status.item-liquid-teleport-chrono-pyro.description = Значительно увеличивает урон юнита.
status.item-liquid-teleport-chrono-blast.name = Хроно-взрыв
status.item-liquid-teleport-chrono-blast.description = Многократно увеличивает урон юнита.
status.item-liquid-teleport-chrono-cooled.name = Хроно-охлаждение
status.item-liquid-teleport-chrono-cooled.description = Увеличивает скорость перезарядки юнита.
status.item-liquid-teleport-chrono-molten.name = Хроно-расплав
status.item-liquid-teleport-chrono-molten.description = Увеличивает урон юнита.
status.item-liquid-teleport-chrono-lubed.name = Хроно-смазка
status.item-liquid-teleport-chrono-lubed.description = Увеличивает скорость юнита.
status.item-liquid-teleport-chrono-cryo.name = Хроно-крио
status.item-liquid-teleport-chrono-cryo.description = Значительно увеличивает скорость перезарядки юнита.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Строит дронов-шахтёров, по одному каждые 5 секунд, до лимита юнитов. Выберите тип руды в меню блока; дроны добывают ближайшую руду этого типа и доставляют в ядро. Тратьте предметы из ядра для улучшения пяти независимых веток: лимит юнитов, скорость дронов, скорость добычи, грузоподъёмность и уровень добычи. Дроны гибнут при уничтожении Форпоста.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Летающий дрон-шахтёр, произведённый Форпостом. Его характеристики зависят от уровней улучшений Форпоста.
block.item-liquid-teleport-outpost-small.name = Малый форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2, строит малых дронов-шахтёров, по одному каждые 5 секунд, до лимита юнитов. Выберите тип руды в меню блока; дроны добывают ближайшую руду этого типа и доставляют в ядро. Пять веток улучшений с уменьшенными лимитами: лимит юнитов, скорость дронов, скорость добычи, грузоподъёмность и уровень добычи (макс. 2). Дроны гибнут при уничтожении Малого форпоста.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малого форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Малый летающий дрон-шахтёр, произведённый Малым форпостом. Его характеристики зависят от уровней улучшений Малого форпоста.
