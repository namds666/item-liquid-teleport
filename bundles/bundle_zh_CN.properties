block.item-liquid-teleport-outpost.name = 前哨站
block.item-liquid-teleport-outpost.description = 每 5 秒生产一架采矿无人机，直到达到单位上限。在方块菜单中选择矿石类型；无人机会开采最近的该类矿石并送回核心。消耗核心中的物品可升级五条独立路线：单位上限、无人机速度、开采速度、携带容量和开采等级。前哨站被摧毁时无人机一同消失。
unit.item-liquid-teleport-outpost-drone.name = 前哨无人机
unit.item-liquid-teleport-outpost-drone.description = 由前哨站生产的飞行采矿无人机。其属性跟随所属前哨站的升级等级。
block.item-liquid-teleport-outpost-micro.name = 微型前哨站
block.item-liquid-teleport-outpost-micro.description = 1x1 的前哨站，每 5 秒建造一架微型采矿无人机，最多达到单位上限。在方块菜单中选择矿石类型；无人机会开采该类型最近的矿石并送往核心。升级线的上限低于小型前哨站：单位上限、速度、采矿速度、载货量、采矿等级（最高 2，可采煤）等。四个微型前哨站排成 2x2 方形会合并为一个小型前哨站。微型前哨站被摧毁时，无人机会死亡。
unit.item-liquid-teleport-outpost-micro-drone.name = 微型前哨无人机
unit.item-liquid-teleport-outpost-micro-drone.description = 由微型前哨站生产的小巧飞行采矿无人机。其属性随所属微型前哨站的升级等级变化。
block.item-liquid-teleport-outpost-small.name = 小型前哨站
block.item-liquid-teleport-outpost-small.description = 2x2 的前哨站，每 5 秒生产一架小型采矿无人机，直到达到单位上限。在方块菜单中选择矿石类型；无人机开采最近的该类矿石并送回核心。五条升级路线的上限低于前哨站：单位上限、无人机速度、开采速度、携带容量和开采等级（最高 2）。小型前哨站被摧毁时无人机会死亡。
unit.item-liquid-teleport-outpost-small-drone.name = 小型前哨无人机
unit.item-liquid-teleport-outpost-small-drone.description = 由小型前哨站生产的小型飞行采矿无人机。其属性跟随所属小型前哨站的升级等级。
block.item-liquid-teleport-outpost-mega.name = 巨型前哨站
block.item-liquid-teleport-outpost-mega.description = 四座小型前哨站排成 2x2 方阵时自动形成。生产巨型采矿无人机，属性为小型前哨站无人机的 4 倍，升级阶梯最高可达 16 倍。初始即可开采 3 级矿石，升级一次后可开采 4 级。无法直接建造。拆除返还四座小型前哨站的材料。
unit.item-liquid-teleport-outpost-mega-drone.name = 巨型无人机
unit.item-liquid-teleport-outpost-mega-drone.description = 巨型前哨站生产的重型采矿无人机。开采所选矿石并送回核心。
block.item-liquid-teleport-outpost-quad.name = 四足前哨站
block.item-liquid-teleport-outpost-quad.description = 四座前哨站排成 2x2 方阵时自动形成。生产四足采矿无人机，属性为前哨站无人机的 4 倍，升级阶梯最高可达 16 倍。每架四足无人机按单位上限等级各释放一架单元助手，最多四架，开采相同矿石。初始即可开采 3 级矿石，升级一次后可开采 4 级。无法直接建造。拆除返还四座前哨站的材料。
unit.item-liquid-teleport-outpost-quad-drone.name = 四足无人机
unit.item-liquid-teleport-outpost-quad-drone.description = 四足前哨站生产的重型采矿无人机。开采所选矿石并送回核心，同时释放最多四架单元助手一同开采。
