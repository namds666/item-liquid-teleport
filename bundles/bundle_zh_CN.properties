block.item-liquid-teleport-chrono-hypno.name = 时空催眠器
block.item-liquid-teleport-chrono-hypno.description = 1x1 方块，保持一个尤里存活。尤里死亡后，等待 10 秒并消耗存储中的 25 硅使其复活。尤里每次在 20 格内牵引一个敌方单位或建筑，2 秒后将其转化为己方。多个尤里牵引同一目标时转化更快：两个尤里只需一半时间。牵引在任何距离都保持，直到目标被转化或死亡。核心无法被转化。使用核心中的物品升级：10 级中每级增加 1 格范围并缩短时间，最低 1 秒。2x2 排列的四个时空催眠器会合并为大型时空催眠器。时空催眠器被摧毁时尤里死亡。
unit.item-liquid-teleport-yuri.name = 尤里
unit.item-liquid-teleport-yuri.description = 没有武器的心灵机甲。每次牵引一个敌人并将其转化为己方。多个尤里牵引同一目标时转化更快。像其他单位一样接受指令。由时空催眠器生成。
block.item-liquid-teleport-chrono-hypno-big.name = 大型时空催眠器
block.item-liquid-teleport-chrono-hypno-big.description = 四个时空催眠器排成 2x2 时自动形成。保持一个大型尤里存活，并消耗 50 硅使其复活。大型尤里同时牵引两个敌方单位或建筑。范围、时间和升级与时空催眠器相同；合并后等级从 1 级重新开始。无法直接建造。
unit.item-liquid-teleport-yuri-big.name = 大型尤里
unit.item-liquid-teleport-yuri-big.description = 没有武器的大型心灵机甲。同时牵引两个敌人并将其转化为己方。多个尤里牵引同一目标时转化更快。像其他单位一样接受指令。由大型时空催眠器生成。
hypno.path = 催眠能力
