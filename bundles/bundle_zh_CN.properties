block.item-liquid-teleport-chrono-item-converter.name = 时空物品转换器
block.item-liquid-teleport-chrono-item-converter.description = 将选定的输入物品按稀有度比例、速度和能量消耗转化为选定的输出物品。
block.item-liquid-teleport-chrono-liquid-tiler.name = 时空液体放置器
block.item-liquid-teleport-chrono-liquid-tiler.description = 将附近的地形逐格转换为选定的液体地面。
block.item-liquid-teleport-chrono-item-tiler.name = 时空矿石放置器
block.item-liquid-teleport-chrono-item-tiler.description = 将附近的地形逐格转换为选定的矿石覆盖层。
block.item-liquid-teleport-outpost.name = 前哨站
block.item-liquid-teleport-outpost.description = 每 5 秒生产一架采矿无人机，直到达到单位上限。在方块菜单中选择矿石类型；无人机会开采最近的该类矿石并送回核心。消耗核心中的物品可升级五条独立路线：单位上限、无人机速度、开采速度、携带容量和开采等级。前哨站被摧毁时无人机一同消失。
unit.item-liquid-teleport-outpost-drone.name = 前哨无人机
unit.item-liquid-teleport-outpost-drone.description = 由前哨站生产的飞行采矿无人机。其属性跟随所属前哨站的升级等级。
