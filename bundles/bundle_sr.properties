status.item-liquid-teleport-chrono-focus.description = Повећава штету јединице.
status.item-liquid-teleport-chrono-precision.name = Хроно прецизност
status.item-liquid-teleport-chrono-precision.description = Повећава брзину пуњења јединице.
status.item-liquid-teleport-chrono-slip.name = Хроно клизање
status.item-liquid-teleport-chrono-slip.description = Повећава брзину јединице.
status.item-liquid-teleport-chrono-ignite.name = Хроно паљење
status.item-liquid-teleport-chrono-ignite.description = Повећава штету јединице.
status.item-liquid-teleport-chrono-alloyed.name = Хроно легура
status.item-liquid-teleport-chrono-alloyed.description = Повећава здравље јединице.
status.item-liquid-teleport-chrono-jagged.name = Хроно назубљеност
status.item-liquid-teleport-chrono-jagged.description = Повећава штету јединице.
status.item-liquid-teleport-chrono-elastic.name = Хроно еластичност
status.item-liquid-teleport-chrono-elastic.description = Повећава здравље јединице.
status.item-liquid-teleport-chrono-surge.name = Хроно импулс
status.item-liquid-teleport-chrono-surge.description = Повећава брзину пуњења јединице.
status.item-liquid-teleport-chrono-pyro.name = Хроно пиро
status.item-liquid-teleport-chrono-pyro.description = Значајно повећава штету јединице.
status.item-liquid-teleport-chrono-blast.name = Хроно експлозија
status.item-liquid-teleport-chrono-blast.description = Вишеструко повећава штету јединице.
status.item-liquid-teleport-chrono-cooled.name = Хроно хлађење
status.item-liquid-teleport-chrono-cooled.description = Повећава брзину пуњења јединице.
status.item-liquid-teleport-chrono-molten.name = Хроно растоп
status.item-liquid-teleport-chrono-molten.description = Повећава штету јединице.
status.item-liquid-teleport-chrono-lubed.name = Хроно подмазивање
status.item-liquid-teleport-chrono-lubed.description = Повећава брзину јединице.
status.item-liquid-teleport-chrono-cryo.name = Хроно крио
status.item-liquid-teleport-chrono-cryo.description = Значајно повећава брзину пуњења јединице.
block.item-liquid-teleport-outpost.name = Форпост
block.item-liquid-teleport-outpost.description = Гради дронове-рударе, по једног сваких 5 секунди, до лимита јединица. Изаберите тип руде у менију блока; дронови копају најближу руду тог типа и испоручују је у језгро. Трошите предмете из језгра за унапређење пет независних путања: лимит јединица, брзина дронова, брзина копања, носивост и ниво копања. Дронови гину кад се Форпост уништи.
unit.item-liquid-teleport-outpost-drone.name = Дрон форпоста
unit.item-liquid-teleport-outpost-drone.description = Летећи дрон-рудар произведен Форпостом. Његове карактеристике прате нивое унапређења Форпоста.
block.item-liquid-teleport-outpost-small.name = Мали форпост
block.item-liquid-teleport-outpost-small.description = Форпост 2x2 који гради мале дронове-рударе, по једног сваких 5 секунди, до лимита јединица. Изаберите тип руде у менију блока; дронови копају најближу руду тог типа и испоручују је у језгро. Пет путања унапређења са нижим лимитима од Форпоста: лимит јединица, брзина дронова, брзина копања, носивост и ниво копања (макс. 2). Дронови гину кад се Мали форпост уништи.
unit.item-liquid-teleport-outpost-small-drone.name = Дрон малог форпоста
unit.item-liquid-teleport-outpost-small-drone.description = Мали летећи дрон-рудар произведен Малим форпостом. Његове карактеристике прате нивое унапређења Малог форпоста.
