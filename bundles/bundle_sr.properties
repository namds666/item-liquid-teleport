item-liquid-teleport.displayName = Телепортација предмета и течности
item-liquid-teleport.subtitle = v1.3.4: преводи на свих 35 језика Mindustry-ја, провера локализације
item-liquid-teleport.description = Додаје чит-нивоа Хроно блокове за глобални транспорт предмета и течности, претварање терена, конверзију предмета, поправку, изградњу, убрзање, појачавање јединица, слабљење јединица и постављање језгра, плюс базу дронова-рудара Форпост.\nАжурирање: сваки текст блокова, јединица, статуса и менија преведен је на свих 35 језика које Mindustry подржава; провера блокира комитове без превода.\nАжурирање: нови Мали форпост — верзија 2x2 на mono са нижим лимитима унапређења; избор руде приказује по један ред по планети; боје трошкова унапређења се ажурирају уживо.\nАжурирање: нови блок Форпост гради летеће дронове-рударе који испоручују изабрану руду у језгро; трошите предмете из језгра за унапређење лимита јединица, брзине, брзине копања, носивости и нивоа копања.
block.item-liquid-teleport-chrono-unloader.name = Хроно истоваривач
block.item-liquid-teleport-chrono-unloader.description = Извлачи изабрани предмет из свих повезаних зграда глобално и испоручује га кроз транспортере.
block.item-liquid-teleport-chrono-pusher.name = Хроно утоваривач
block.item-liquid-teleport-chrono-pusher.description = Шаље све ускладиштене предмете у повезане зграде глобално.
block.item-liquid-teleport-chrono-liquid-unloader.name = Хроно течни истоваривач
block.item-liquid-teleport-chrono-liquid-unloader.description = Извлачи изабрану течност из свих повезаних зграда глобално и испоручује је кроз цеви.
block.item-liquid-teleport-chrono-liquid-pusher.name = Хроно течни утоваривач
block.item-liquid-teleport-chrono-liquid-pusher.description = Шаље изабрану течност у све повезане зграде глобално.
block.item-liquid-teleport-chrono-liquid-tiler.name = Хроно течни полагач
block.item-liquid-teleport-chrono-liquid-tiler.description = Претвара оближњи терен у изабрано течно покривање по једну плочицу.
block.item-liquid-teleport-chrono-item-tiler.name = Хроно рудни полагач
block.item-liquid-teleport-chrono-item-tiler.description = Претвара оближњи терен у изабрани рудни слој по једну плочицу.
block.item-liquid-teleport-chrono-item-converter.name = Хроно конвертор
block.item-liquid-teleport-chrono-item-converter.description = Конвертује изабрани улазни предмет у изабрани излазни предмет са коефицијентом, брзином и потрошњом енергије на основу реткости.
block.item-liquid-teleport-chrono-core.name = Хроно језгро
block.item-liquid-teleport-chrono-core.description = Чит-језгро величине 1x1, увек откључано, производи гама јединице.
block.item-liquid-teleport-chrono-mender.name = Хроно лечилац
block.item-liquid-teleport-chrono-mender.description = Непрекидно лечи све пријатељске зграде глобално. Мале базе се потпуно обнављају неколико пута у секунди; веће базе се лече секвенцијалним проласком. Не захтева енергију нити ресурсе.
block.item-liquid-teleport-chrono-repair-point.name = Хроно поправна тачка
block.item-liquid-teleport-chrono-repair-point.description = Поправља оштећене пријатељске јединице глобално, обнављајући 50% макс. здравља у секунди непрекидним зраком.
block.item-liquid-teleport-chrono-build-tower.name = Хроно грађевинска кула
block.item-liquid-teleport-chrono-build-tower.description = Аутоматски обнавља структуре глобално и помаже изградњу по логици стандардне грађевинске куле.
block.item-liquid-teleport-chrono-booster.name = Хроно убрзивач
block.item-liquid-teleport-chrono-booster.description = Купола за убрзање 1x1 која прима додатне предмете и течности за сабирање домета и брзине.
block.item-liquid-teleport-chrono-buffer.name = Хроно појачивач
block.item-liquid-teleport-chrono-buffer.description = Примењује позитивне ефекте на пријатељске јединице у домету. Додатни предмети и течности повећавају домет, трајање и број доступних статуса.
block.item-liquid-teleport-chrono-debuffer.name = Хроно ослабљивач
block.item-liquid-teleport-chrono-debuffer.description = Примењује негативне ефекте на непријатељске јединице у домету. Додатни предмети и течности повећавају домет и трајање ефеката.
