block.item-liquid-teleport-chrono-hypno.name = Chrono Hipnózis
block.item-liquid-teleport-chrono-hypno.description = Egy Yurit tart életben. Amikor Yuri meghal, 10 másodpercet vár, majd 25 szilíciumot használ el a raktárából, hogy visszahozza. Yuri egyszerre egy ellenséges egységet vagy épületet köt meg 20 mezőről, és 2 másodperc után a te oldaladra állítja; a kötés bármilyen távolságban megmarad, amíg a cél át nem vált vagy meg nem hal. A magokat nem lehet átállítani. Fejlessz a magból származó tárgyakkal: a 10 szint mindegyike 1 mezővel növeli a hatótávot és rövidíti a csatornázást, egészen 1 másodpercig. Yuri meghal, ha a Chrono Hipnózis megsemmisül.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Pszichikus mech fegyverek nélkül. Egyszerre egy ellenséget köt meg, és a te oldaladra állítja. Parancsokat fogad, mint bármely egység. Chrono Hipnózis hozza létre.
