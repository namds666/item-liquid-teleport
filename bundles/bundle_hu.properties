item-liquid-teleport.displayName = Tárgy- és Folyadékteleport
item-liquid-teleport.subtitle = v1.3.4: fordítások a Mindustry mind a 35 nyelvére, lokalizációs ellenőrzés
item-liquid-teleport.description = Cheat szintű Chrono blokkokat ad hozzá a globális tárgy- és folyadékszállításhoz, terepátalakításhoz, tárgyátalakításhoz, javításhoz, építéshez, túlhajtáshoz, egységerősítéshez, egységgyengítéshez és maghelyezéshez, plusz az Előőrs drónbányász bázist.\nFrissítés: minden blokk-, egység-, státusz- és menüszöveg le van fordítva a Mindustry által támogatott 35 nyelvre; egy ellenőrzés blokkolja a fordítás nélküli commitokat.\nFrissítés: új Kis Előőrs, 2x2-es mono alapú Előőrs alacsonyabb fejlesztési korlátokkal; az ércválasztó bolygónként egy sort mutat; a fejlesztési költségek színei élőben frissülnek.\nFrissítés: az új Előőrs blokk repülő bányászdrónokat épít, amelyek a kiválasztott ércet a magba szállítják; fejleszd az egységkorlátot, sebességet, bányászsebességet, teherbírást és bányászszintet a mag tárgyaiból.
block.item-liquid-teleport-chrono-unloader.name = Chrono Kirakodó
block.item-liquid-teleport-chrono-unloader.description = Kiválasztott tárgyat húz ki az összes csatolt épületből globálisan, és szállítószalagon keresztül adja ki.
block.item-liquid-teleport-chrono-pusher.name = Chrono Betöltő
block.item-liquid-teleport-chrono-pusher.description = Az összes tárolt tárgyat elküldi a csatolt épületekbe globálisan.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Folyadékkiakodó
block.item-liquid-teleport-chrono-liquid-unloader.description = Kiválasztott folyadékot húz ki az összes csatolt épületből globálisan, és csöveken keresztül adja ki.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Folyadékbetöltő
block.item-liquid-teleport-chrono-liquid-pusher.description = Kiválasztott folyadékot küld az összes csatolt épületbe globálisan.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Folyadéklerakó
block.item-liquid-teleport-chrono-liquid-tiler.description = A közeli terepet a kiválasztott folyadékpadlóra alakítja, csempénként.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Érclerakó
block.item-liquid-teleport-chrono-item-tiler.description = A közeli terepet a kiválasztott ércrétegre alakítja, csempénként.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Tárgyátalakító
block.item-liquid-teleport-chrono-item-converter.description = A kiválasztott bemeneti tárgyat a kiválasztott kimeneti tárggyá alakítja ritkaságalapú aránnyal, sebességgel és energiaköltséggel.
block.item-liquid-teleport-chrono-core.name = Chrono Mag
block.item-liquid-teleport-chrono-core.description = Cheat szintű 1x1 mag, mindig feloldva, gamma egységeket termel.
block.item-liquid-teleport-chrono-mender.name = Chrono Javító
block.item-liquid-teleport-chrono-mender.description = Folyamatosan gyógyítja az összes szövetséges épületet globálisan. Kis bázisok másodpercenként többször teljesen helyreállnak; nagyobb bázisoknál gördülő söprés történik. Nem igényel energiát vagy erőforrásokat.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Javítópont
block.item-liquid-teleport-chrono-repair-point.description = Sérült szövetséges egységeket javít globálisan, másodpercenként max. életerő 50%-át állítja helyre folyamatos sugárral.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Építőtorony
block.item-liquid-teleport-chrono-build-tower.description = Automatikusan újraépíti a struktúrákat globálisan, és segíti az építkezést a hagyományos építőtorony logikájával.
block.item-liquid-teleport-chrono-booster.name = Chrono Erősítő
block.item-liquid-teleport-chrono-booster.description = 1x1-es túlhajtó kupola, amely extra tárgyakat és folyadékokat fogad a hatótáv és sebesség halmozódó növeléséhez.
block.item-liquid-teleport-chrono-buffer.name = Chrono Erősítőmező
block.item-liquid-teleport-chrono-buffer.description = Szövetséges egységekre erősítő hatásokat alkalmaz hatótávon belül. Extra tárgyak és folyadékok növelik a sugarat, időtartamot és a feloldott státuszok számát.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Gyengítő
block.item-liquid-teleport-chrono-debuffer.description = Halmozódó negatív hatásokat alkalmaz az ellenséges egységekre hatótávon belül. Extra tárgyak és folyadékok növelik a sugarat és a hatások időtartamát.
