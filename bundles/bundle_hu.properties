block.item-liquid-teleport-outpost.name = Előőrs
block.item-liquid-teleport-outpost.description = Bányászdrónokat épít, 5 másodpercenként egyet, az egységkorlátjáig. Válaszd ki az érctípust a blokk menüjében; a drónok a legközelebbi ilyen ércet bányásszák és a magba szállítják. Költsd el a mag tárgyait öt független fejlesztési útvonalra: egységkorlát, drónsebssége, bányászsebesség, teherbírás és bányászszint. A drónok elpusztulnak az Előőrs megsemmisülésekor.
unit.item-liquid-teleport-outpost-drone.name = Előőrs Drón
unit.item-liquid-teleport-outpost-drone.description = Az Előőrs által gyártott repülő bányászdrón. Statisztikái az Előőrs fejlesztési szintjeit követik.
block.item-liquid-teleport-outpost-small.name = Kis Előőrs
block.item-liquid-teleport-outpost-small.description = 2x2-es Előőrs, amely kis bányászdrónokat épít, 5 másodpercenként egyet, az egységkorlátjáig. Válaszd ki az érctípust a blokk menüjében; a drónok a legközelebbi ilyen ércet bányásszák és a magba szállítják. Öt fejlesztési útvonal alacsonyabb korlátokkal, mint az Előőrs: egységkorlát, drónsebesség, bányászsebesség, teherbírás és bányászszint (max. 2). A drónok elpusztulnak a Kis Előőrs megsemmisülésekor.
unit.item-liquid-teleport-outpost-small-drone.name = Kis Előőrs Drón
unit.item-liquid-teleport-outpost-small-drone.description = A Kis Előőrs által gyártott kis repülő bányászdrón. Statisztikái a Kis Előőrs fejlesztési szintjeit követik.
