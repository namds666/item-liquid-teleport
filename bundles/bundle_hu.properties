item-liquid-teleport.displayName = Tárgy- és Folyadékteleport
item-liquid-teleport.subtitle = v1.4.16: Rövidebb mod leírás, változások verziónként
item-liquid-teleport.description = Csalás szintű Chrono blokkok tárgyak és folyadékok globális szállítására, terep és tárgy átalakítására, javításra, építésre, túlhajtásra, egységek erősítésére és gyengítésére, elmekontrollra és mag lerakására, valamint az Előőrs, egy bázis, amely bányászdrónokat épít.\n\n[accent]v1.4.16[]\nRövidebb mod leírás, változások verziónként.\n\n[accent]v1.4.15[]\nElőőrs, Quad Előőrs és Mega Előőrs: a 4-es bányászati szint fejlesztése titánba és szilíciumba kerül.\n\n[accent]v1.4.14[]\nÚj Chrono Hipnózis: Yuri a te oldaladra állítja az ellenséges egységeket és épületeket.\n\n[accent]v1.4.13[]\nAz Előőrs extra bányászsugarai különböző érc mezőkre céloznak.\n\n[accent]v1.4.11 - 1.4.12[]\nChrono Érclerakó és Chrono Folyadéklerakó egy négyzetet fest és mutatja a sugarát.
block.item-liquid-teleport-chrono-unloader.name = Chrono Kirakodó
block.item-liquid-teleport-chrono-unloader.description = Kiválasztott tárgyat húz ki az összes csatolt épületből globálisan, és szállítószalagon keresztül adja ki.
block.item-liquid-teleport-chrono-pusher.name = Chrono Betöltő
block.item-liquid-teleport-chrono-pusher.description = Az összes tárolt tárgyat elküldi a csatolt épületekbe globálisan.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Folyadékkiakodó
block.item-liquid-teleport-chrono-liquid-unloader.description = Kiválasztott folyadékot húz ki az összes csatolt épületből globálisan, és csöveken keresztül adja ki.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Folyadékbetöltő
block.item-liquid-teleport-chrono-liquid-pusher.description = Kiválasztott folyadékot küld az összes csatolt épületbe globálisan.
