block.item-liquid-teleport-outpost.name = Előőrs
block.item-liquid-teleport-outpost.description = Bányászdrónokat épít, 5 másodpercenként egyet, az egységkorlátjáig. Válaszd ki az érctípust a blokk menüjében; a drónok a legközelebbi ilyen ércet bányásszák és a magba szállítják. Költsd el a mag tárgyait öt független fejlesztési útvonalra: egységkorlát, drónsebssége, bányászsebesség, teherbírás és bányászszint. A drónok elpusztulnak az Előőrs megsemmisülésekor.
unit.item-liquid-teleport-outpost-drone.name = Előőrs Drón
unit.item-liquid-teleport-outpost-drone.description = Az Előőrs által gyártott repülő bányászdrón. Statisztikái az Előőrs fejlesztési szintjeit követik.
block.item-liquid-teleport-outpost-micro.name = Mikro Előőrs
block.item-liquid-teleport-outpost-micro.description = Egy 1x1-es előőrs, amely mikro bányászdrónokat épít, 5 másodpercenként egyet, az egységkorlátig. Válassz érctípust a blokkmenüben; a drónok a legközelebbi ilyen ércet bányásszák és a magba szállítják. Fejlesztési vonalak a Kis Előőrsnél alacsonyabb korlátokkal: egységkorlát, sebesség, bányászati sebesség, szállítókapacitás, bányászati szint (max. 2, elér a szénig) és további. Négy Mikro Előőrs 2x2-es négyzetben Kis Előőrssé olvad össze. A drónok elpusztulnak, ha a Mikro Előőrs megsemmisül.
unit.item-liquid-teleport-outpost-micro-drone.name = Mikro Előőrs Drón
unit.item-liquid-teleport-outpost-micro-drone.description = Egy apró repülő bányászdrón, amelyet a Mikro Előőrs gyárt. Értékei a Mikro Előőrs fejlesztési szintjeit követik.
block.item-liquid-teleport-outpost-small.name = Kis Előőrs
block.item-liquid-teleport-outpost-small.description = 2x2-es Előőrs, amely kis bányászdrónokat épít, 5 másodpercenként egyet, az egységkorlátjáig. Válaszd ki az érctípust a blokk menüjében; a drónok a legközelebbi ilyen ércet bányásszák és a magba szállítják. Öt fejlesztési útvonal alacsonyabb korlátokkal, mint az Előőrs: egységkorlát, drónsebesség, bányászsebesség, teherbírás és bányászszint (max. 2). A drónok elpusztulnak a Kis Előőrs megsemmisülésekor.
unit.item-liquid-teleport-outpost-small-drone.name = Kis Előőrs Drón
unit.item-liquid-teleport-outpost-small-drone.description = A Kis Előőrs által gyártott kis repülő bányászdrón. Statisztikái a Kis Előőrs fejlesztési szintjeit követik.
block.item-liquid-teleport-outpost-mega.name = Mega Előőrs
block.item-liquid-teleport-outpost-mega.description = Automatikusan létrejön, ha négy Kis Előőrs 2x2-es négyzetben áll. Mega bányászdrónokat épít a Kis Előőrs drónjának négyszeres értékeivel és tizenhatszorosig érő fejlesztési lépcsővel. Kezdettől 3. szintű ércet bányászik, egy fejlesztés után 4. szintűt. Közvetlenül nem építhető. Lebontása négy Kis Előőrsöt térít vissza.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega drón
unit.item-liquid-teleport-outpost-mega-drone.description = A Mega Előőrs által épített nehéz bányászdrón. A kiválasztott ércet bányássza és a magba szállítja.
block.item-liquid-teleport-outpost-quad.name = Quad Előőrs
block.item-liquid-teleport-outpost-quad.description = Automatikusan létrejön, ha négy Előőrs 2x2-es négyzetben áll. Quad bányászdrónokat épít az Előőrs drónjának négyszeres értékeivel és tizenhatszorosig érő fejlesztési lépcsővel. Minden Quad egységlimit-szintenként egy Mono segítőt bocsát ki, legfeljebb négyet, amelyek ugyanazt az ércet bányásszák. Kezdettől 3. szintű ércet bányászik, egy fejlesztés után 4. szintűt. Közvetlenül nem építhető. Lebontása négy Előőrsöt térít vissza.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad drón
unit.item-liquid-teleport-outpost-quad-drone.description = A Quad Előőrs által épített nehéz bányászdrón. A kiválasztott ércet bányássza, a magba szállítja, és legfeljebb négy Mono segítőt bocsát ki, amelyek vele együtt bányásznak.
