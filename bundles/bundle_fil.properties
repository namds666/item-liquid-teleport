block.item-liquid-teleport-chrono-hypno.name = Chrono Hypno
block.item-liquid-teleport-chrono-hypno.description = Pinananatiling buhay ang isang Yuri. Kapag namatay si Yuri, maghihintay ng 10 segundo at gagamit ng 25 silicon mula sa imbakan nito para ibalik siya. Nagtatali si Yuri ng isang kaaway na unit o gusali sa bawat pagkakataon mula sa 20 tile at ibinabalik ito sa panig mo pagkatapos ng 2 segundo; nananatili ang tali sa anumang layo hanggang sa mabago o mamatay ang target. Hindi maaaring i-convert ang mga core. I-upgrade gamit ang mga item mula sa core: bawat isa sa 10 antas ay nagdaragdag ng 1 tile na saklaw at nagpapaikli ng channel, hanggang 1 segundo. Namamatay si Yuri kapag nawasak ang Chrono Hypno.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Isang psychic mech na walang armas. Nagtatali ng isang kaaway at kino-convert ito sa panig mo. Sumusunod sa utos tulad ng ibang unit. Ginagawa ng isang Chrono Hypno.
