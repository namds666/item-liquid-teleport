item-liquid-teleport.displayName = Teleport ng Bagay at Likido
item-liquid-teleport.subtitle = v1.3.4: mga salin sa lahat ng 35 wika ng Mindustry, pagsuri ng localization
item-liquid-teleport.description = Nagdadagdag ng mga Chrono block na antas-cheat para sa pandaigdigang transportasyon ng bagay at likido, pagbabago ng terrain, pagpapalit ng bagay, pagkukumpuni, pagtatayo, overdrive, mga buff ng yunit, mga debuff ng yunit, at paglalagay ng core, kasama ang Outpost na base ng pagmimina gamit ang mga drone.\nUpdate: bawat teksto ng block, unit, status, at menu ay isinalin sa lahat ng 35 wikang sinusuportahan ng Mindustry; hinaharang ng isang pagsuri ang mga commit na kulang sa salin.\nUpdate: bagong Maliit na Outpost, isang 2x2 Outpost na nakabase sa mono na may mas mababang limitasyon sa pag-upgrade; nagpapakita ng isang hilera ng mineral bawat planeta; mga kulay ng gastos sa pag-upgrade na nag-a-update nang live.\nUpdate: bagong Outpost block na gumagawa ng mga lumilipad na drone na nagmimina at naghahatid ng napiling mineral sa core; gumastos ng mga bagay mula sa core para i-upgrade ang limitasyon ng yunit, bilis, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina.
block.item-liquid-teleport-chrono-unloader.name = Chrono Unloader
block.item-liquid-teleport-chrono-unloader.description = Kumukuha ng napiling bagay mula sa lahat ng nakakonektang gusali sa buong mapa at ini-output ito sa mga conveyor.
block.item-liquid-teleport-chrono-pusher.name = Chrono Pusher
block.item-liquid-teleport-chrono-pusher.description = Itinutulak ang lahat ng nakaimbak na bagay sa mga nakakonektang gusali sa buong mapa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Liquid Unloader
block.item-liquid-teleport-chrono-liquid-unloader.description = Kumukuha ng napiling likido mula sa lahat ng nakakonektang gusali sa buong mapa at ini-output ito sa mga tubo.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Liquid Pusher
block.item-liquid-teleport-chrono-liquid-pusher.description = Itinutulak ang napiling likido sa lahat ng nakakonektang gusali sa buong mapa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Liquid Tiler
block.item-liquid-teleport-chrono-liquid-tiler.description = Binabago ang kalapit na terrain sa napiling sahig ng likido, isang tile sa bawat pagkakataon.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Item Tiler
block.item-liquid-teleport-chrono-item-tiler.description = Binabago ang kalapit na terrain sa napiling patong ng mineral, isang tile sa bawat pagkakataon.
block.item-liquid-teleport-chrono-item-converter.name = Chrono Item Converter
block.item-liquid-teleport-chrono-item-converter.description = Nagpapalit ng napiling input na bagay sa napiling output na bagay na may ratio, bilis, at gastos ng kuryente batay sa kabihasnaan.
block.item-liquid-teleport-chrono-core.name = Chrono Core
block.item-liquid-teleport-chrono-core.description = Isang 1x1 na core na antas-cheat na palaging naka-unlock at gumagawa ng mga gamma na yunit.
block.item-liquid-teleport-chrono-mender.name = Chrono Mender
block.item-liquid-teleport-chrono-mender.description = Patuloy na nagpapagaling sa lahat ng kaalyado na gusali sa buong mapa. Ang maliliit na base ay ganap na naibabalik nang maraming beses bawat segundo; ang mas malalaking base ay ginagamot sa paikot na pagsisiyasat. Hindi nangangailangan ng kuryente o mapagkukunan.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Repair Point
block.item-liquid-teleport-chrono-repair-point.description = Inaayos ang mga napinsalang kaalyado na yunit sa buong mapa sa 50% ng pinakamataas na buhay bawat segundo gamit ang tuloy-tuloy na sinag.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Build Tower
block.item-liquid-teleport-chrono-build-tower.description = Awtomatikong muling nagtatayo ng mga istruktura sa buong mapa at tumutulong sa pagtatayo gamit ang karaniwang lohika ng build tower.
block.item-liquid-teleport-chrono-booster.name = Chrono Booster
block.item-liquid-teleport-chrono-booster.description = Isang 1x1 na overdrive dome na tumatanggap ng mga dagdag na bagay at likido para sa dagdag na saklaw at bilis.
block.item-liquid-teleport-chrono-buffer.name = Chrono Buffer
block.item-liquid-teleport-chrono-buffer.description = Nagbibigay ng mga buff sa mga kaalyado na yunit sa saklaw. Ang mga dagdag na bagay at likido ay nagpapalaki ng radius, tagal, at bilang ng mga na-unlock na custom na kalagayan.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Nagbibigay ng mga nakapatong na negatibong epekto sa mga kaaway na yunit sa saklaw. Ang mga dagdag na bagay at likido ay nagpapalaki ng radius at tagal ng mga epekto.
