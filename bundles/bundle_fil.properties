item-liquid-teleport.displayName = Teleport ng Bagay at Likido
item-liquid-teleport.subtitle = v1.4.14: bagong Chrono Hypno, kino-convert ni Yuri ang mga kalaban sa panig mo
item-liquid-teleport.description = Nagdadagdag ng mga Chrono block na antas-cheat para sa pandaigdigang transportasyon ng bagay at likido, pagbabago ng terrain, pagpapalit ng bagay, pagkukumpuni, pagtatayo, overdrive, mga buff ng yunit, mga debuff ng yunit, pagkontrol ng isip, at paglalagay ng core, kasama ang Outpost na base ng pagmimina gamit ang mga drone.\nUpdate: bagong Chrono Hypno ang nagpapanatiling buhay kay Yuri; kinakabit ni Yuri ang isang kalabang yunit o gusali nang paisa-isa at kino-convert ito sa panig mo; 10 antas ng upgrade ang nagdaragdag ng saklaw at nagpapabilis ng conversion.\nUpdate: bagong Micro na Outpost, isang 1x1 na Outpost na nagmimina ng tier 1 na ore at coal pagkatapos ng isang upgrade; apat na Micro na Outpost sa 2x2 na parisukat ay nagsasama bilang isang Maliit na Outpost.\nUpdate: ang mga drone ng Outpost ay nananatili na sa puwesto saanman sa loob ng kanilang abot ng pagmimina at lumalapit lamang kapag mas malayo sila kaysa sa abot, kaya hindi na sila nagtutulakan para sa isang puwesto.\nUpdate: bawat upgrade line ng carry capacity ng Outpost ay ibinaba sa isang-kapat; ang mga helper drone ng Quad Outpost ay sumasabay na ngayon ang carry capacity sa antas ng capacity ng kanilang parent drone.\nUpdate: ang mga helper drone ng Quad Outpost ay nananatiling nakakabit sa kanilang parent drone pagkatapos mag-load ng save at hindi na namamatay kapag pumasok ka sa isang mundo.\nUpdate: bagong upgrade line na Abot ng pagmimina na nagpapahaba sa mining beam ng mga drone sa bawat Outpost; ang mga helper drone ng Quad Outpost ay gumagalaw na ngayon sa parehong bilis ng kanilang parent drone.\nUpdate: ang mine tier upgrade ng Outpost ay hindi kailanman nagkakahalaga ng resources na mas mataas sa tier na ina-unlock nito; sa Erekir bawat upgrade ng Outpost ay gumagamit ng Erekir resources.\nUpdate: ang Mega at Quad Outpost ay may sariling disenyo ng gusali na may hangar pad, mga suporta, at gitnang reactor.\nUpdate: apat na Maliit na Outpost sa 2x2 na parisukat ay nagsasama sa isang Mega Outpost (4x4) at apat na Outpost sa isang Quad Outpost (6x6); pareho silang gumagawa ng mabibigat na drone na may apat na beses ng stats at hagdan ng upgrade na umaabot sa labing-anim na beses; ang Quad drone ay naglalabas ng Mono na katulong.\nUpdate: agad na nabubukas ang mga ore sa ore picker ng Outpost pagkatapos ng upgrade ng mine tier; ang bagong button na Pinakakaunti ay nagpapamina sa Outpost ng available na ore na pinakakaunti sa core.\nUpdate: kapag naka-on ang auto steal, ang mga unloader ay nagkokonekta lamang sa mga gusali ng ibang team, kabilang ang mga inabandona; nilalaktawan ang mga gusali ng sariling team. Ang pag-on ay nag-aalis ng mga link sa sariling team; ang pag-off ay nag-aalis ng mga link sa ibang team.\nUpdate: ang auto link ay nagkokonekta na lamang sa mga pinagmulan na naglalabas ng napiling item; ang pagsusuri ng kategorya ay tumatakbo bago ang item filter para mabawasan ang lag; ang mga item picker ng unloader at pusher ay gumagamit ng 8x2 grid.\nUpdate: bawat teksto ng block, unit, status, at menu ay isinalin sa lahat ng 35 wikang sinusuportahan ng Mindustry; hinaharang ng isang pagsuri ang mga commit na kulang sa salin.\nUpdate: bagong Maliit na Outpost, isang 2x2 Outpost na nakabase sa mono na may mas mababang limitasyon sa pag-upgrade; nagpapakita ng isang hilera ng mineral bawat planeta; mga kulay ng gastos sa pag-upgrade na nag-a-update nang live.\nUpdate: bagong Outpost block na gumagawa ng mga lumilipad na drone na nagmimina at naghahatid ng napiling mineral sa core; gumastos ng mga bagay mula sa core para i-upgrade ang limitasyon ng yunit, bilis, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina.
block.item-liquid-teleport-chrono-unloader.name = Chrono Unloader
block.item-liquid-teleport-chrono-unloader.description = Kumukuha ng napiling bagay mula sa lahat ng nakakonektang gusali sa buong mapa at ini-output ito sa mga conveyor.
block.item-liquid-teleport-chrono-pusher.name = Chrono Pusher
block.item-liquid-teleport-chrono-pusher.description = Itinutulak ang lahat ng nakaimbak na bagay sa mga nakakonektang gusali sa buong mapa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono Liquid Unloader
block.item-liquid-teleport-chrono-liquid-unloader.description = Kumukuha ng napiling likido mula sa lahat ng nakakonektang gusali sa buong mapa at ini-output ito sa mga tubo.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono Liquid Pusher
block.item-liquid-teleport-chrono-liquid-pusher.description = Itinutulak ang napiling likido sa lahat ng nakakonektang gusali sa buong mapa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono Liquid Tiler
block.item-liquid-teleport-chrono-liquid-tiler.description = Binabago ang kalapit na terrain sa napiling sahig ng likido, isang tile sa bawat pagkakataon.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono Item Tiler
block.item-liquid-teleport-chrono-item-tiler.description = Binabago ang kalapit na terrain sa napiling patong ng mineral, isang tile sa bawat pagkakataon.
