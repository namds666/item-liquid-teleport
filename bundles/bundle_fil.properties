block.item-liquid-teleport-chrono-hypno.name = Chrono Hypno
block.item-liquid-teleport-chrono-hypno.description = Isang 1x1 na block na nagpapanatiling buhay sa isang Yuri. Kapag namatay si Yuri, maghihintay ito ng 10 segundo at gagamit ng 25 silicon mula sa imbakan nito para ibalik siya. Tinatalian ni Yuri ang isang kaaway na unit o gusali sa bawat pagkakataon mula 20 tile at ginagawa itong kakampi pagkalipas ng 2 segundo. Mas maraming Yuri sa iisang target ang mas mabilis na nagko-convert nito: kalahati ng oras para sa dalawang Yuri. Nananatili ang tali sa anumang layo hanggang ma-convert o mamatay ang target. Hindi ma-convert ang mga core. Mag-upgrade gamit ang mga item mula sa core: bawat isa sa 10 level ay nagdadagdag ng 1 tile ng saklaw at nagpapaikli ng oras, hanggang 1 segundo. Ang apat na Chrono Hypno sa 2x2 na parisukat ay nagsasama bilang isang Malaking Chrono Hypno. Mamamatay si Yuri kapag nasira ang Chrono Hypno.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Isang psychic mech na walang armas. Tinatalian ang isang kaaway sa bawat pagkakataon at ginagawa itong kakampi. Mas maraming Yuri sa iisang target ang mas mabilis na nagko-convert nito. Tumatanggap ng utos gaya ng anumang unit. Ginagawa ng Chrono Hypno.
block.item-liquid-teleport-chrono-hypno-big.name = Malaking Chrono Hypno
block.item-liquid-teleport-chrono-hypno-big.description = Kusang nabubuo kapag apat na Chrono Hypno ang nasa 2x2 na parisukat. Pinapanatiling buhay ang isang Malaking Yuri at ibinabalik siya sa halagang 50 silicon. Tinatalian ni Malaking Yuri ang dalawang kaaway na unit o gusali nang sabay. Parehong saklaw, oras, at upgrade gaya ng Chrono Hypno; pagkatapos magsama, nagsisimula muli ang mga level sa 1. Hindi maitatayo nang direkta.
unit.item-liquid-teleport-yuri-big.name = Malaking Yuri
unit.item-liquid-teleport-yuri-big.description = Isang malaking psychic mech na walang armas. Tinatalian ang dalawang kaaway nang sabay at ginagawa silang kakampi. Mas maraming Yuri sa iisang target ang mas mabilis na nagko-convert nito. Tumatanggap ng utos gaya ng anumang unit. Ginagawa ng Malaking Chrono Hypno.
