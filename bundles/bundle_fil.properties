block.item-liquid-teleport-chrono-item-converter.name = Chrono Item Converter
block.item-liquid-teleport-chrono-item-converter.description = Nagpapalit ng napiling input na bagay sa napiling output na bagay na may ratio, bilis, at gastos ng kuryente batay sa kabihasnaan.
block.item-liquid-teleport-chrono-core.name = Chrono Core
block.item-liquid-teleport-chrono-core.description = Isang 1x1 na core na antas-cheat na palaging naka-unlock at gumagawa ng mga gamma na yunit.
block.item-liquid-teleport-chrono-mender.name = Chrono Mender
block.item-liquid-teleport-chrono-mender.description = Patuloy na nagpapagaling sa lahat ng kaalyado na gusali sa buong mapa. Ang maliliit na base ay ganap na naibabalik nang maraming beses bawat segundo; ang mas malalaking base ay ginagamot sa paikot na pagsisiyasat. Hindi nangangailangan ng kuryente o mapagkukunan.
block.item-liquid-teleport-chrono-repair-point.name = Chrono Repair Point
block.item-liquid-teleport-chrono-repair-point.description = Inaayos ang mga napinsalang kaalyado na yunit sa buong mapa sa 50% ng pinakamataas na buhay bawat segundo gamit ang tuloy-tuloy na sinag.
block.item-liquid-teleport-chrono-build-tower.name = Chrono Build Tower
block.item-liquid-teleport-chrono-build-tower.description = Awtomatikong muling nagtatayo ng mga istruktura sa buong mapa at tumutulong sa pagtatayo gamit ang karaniwang lohika ng build tower.
block.item-liquid-teleport-chrono-booster.name = Chrono Booster
block.item-liquid-teleport-chrono-booster.description = Isang 1x1 na overdrive dome na tumatanggap ng mga dagdag na bagay at likido para sa dagdag na saklaw at bilis.
block.item-liquid-teleport-chrono-buffer.name = Chrono Buffer
block.item-liquid-teleport-chrono-buffer.description = Nagbibigay ng mga buff sa mga kaalyado na yunit sa saklaw. Ang mga dagdag na bagay at likido ay nagpapalaki ng radius, tagal, at bilang ng mga na-unlock na custom na kalagayan.
block.item-liquid-teleport-chrono-debuffer.name = Chrono Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Nagbibigay ng mga nakapatong na negatibong epekto sa mga kaaway na yunit sa saklaw. Ang mga dagdag na bagay at likido ay nagpapalaki ng radius at tagal ng mga epekto.
