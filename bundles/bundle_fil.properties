block.item-liquid-teleport-outpost.name = Outpost
block.item-liquid-teleport-outpost.description = Gumagawa ng mga drone na nagmimina, isa bawat 5 segundo, hanggang sa limitasyon ng yunit. Pumili ng uri ng mineral sa menu ng block; ang mga drone ay nagmimina ng pinakamalapit na mineral ng uri na iyon at inihahatid ito sa core. Gumastos ng mga bagay mula sa core para i-upgrade ang limang independiyenteng landas: limitasyon ng yunit, bilis ng drone, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina. Namamatay ang mga drone kapag nasira ang Outpost.
unit.item-liquid-teleport-outpost-drone.name = Drone ng Outpost
unit.item-liquid-teleport-outpost-drone.description = Isang lumilipad na drone na nagmimina na ginawa ng isang Outpost. Ang mga stats nito ay sumusunod sa mga antas ng pag-upgrade ng Outpost nito.
block.item-liquid-teleport-outpost-small.name = Maliit na Outpost
block.item-liquid-teleport-outpost-small.description = Isang 2x2 na Outpost na gumagawa ng maliliit na drone na nagmimina, isa bawat 5 segundo, hanggang sa limitasyon ng yunit. Pumili ng uri ng mineral sa menu ng block; ang mga drone ay nagmimina ng pinakamalapit na mineral ng uri na iyon at inihahatid ito sa core. Limang landas ng pag-upgrade na may mas mababang limitasyon kaysa sa Outpost: limitasyon ng yunit, bilis ng drone, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina (max 2). Namamatay ang mga drone kapag nasira ang Maliit na Outpost.
unit.item-liquid-teleport-outpost-small-drone.name = Drone ng Maliit na Outpost
unit.item-liquid-teleport-outpost-small-drone.description = Isang maliit na lumilipad na drone na nagmimina na ginawa ng isang Maliit na Outpost. Ang mga stats nito ay sumusunod sa mga antas ng pag-upgrade ng Maliit na Outpost nito.
