block.item-liquid-teleport-outpost.name = Outpost
block.item-liquid-teleport-outpost.description = Gumagawa ng mga drone na nagmimina, isa bawat 5 segundo, hanggang sa limitasyon ng yunit. Pumili ng uri ng mineral sa menu ng block; ang mga drone ay nagmimina ng pinakamalapit na mineral ng uri na iyon at inihahatid ito sa core. Gumastos ng mga bagay mula sa core para i-upgrade ang limang independiyenteng landas: limitasyon ng yunit, bilis ng drone, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina. Namamatay ang mga drone kapag nasira ang Outpost.
unit.item-liquid-teleport-outpost-drone.name = Drone ng Outpost
unit.item-liquid-teleport-outpost-drone.description = Isang lumilipad na drone na nagmimina na ginawa ng isang Outpost. Ang mga stats nito ay sumusunod sa mga antas ng pag-upgrade ng Outpost nito.
block.item-liquid-teleport-outpost-micro.name = Micro na Outpost
block.item-liquid-teleport-outpost-micro.description = Isang 1x1 na Outpost na gumagawa ng micro na mining drone, isa bawat 5 segundo, hanggang sa limitasyon ng unit nito. Pumili ng uri ng ore sa block menu; ang mga drone ay nagmimina ng pinakamalapit na ore ng uri na iyon at inihahatid ito sa core. Mga upgrade line na may mas mababang limitasyon kaysa sa Maliit na Outpost: limitasyon ng unit, bilis, bilis ng pagmimina, kapasidad ng dala, antas ng pagmimina (max. 2, umaabot sa coal) at iba pa. Apat na Micro na Outpost sa 2x2 na parisukat ay nagsasama bilang isang Maliit na Outpost. Namamatay ang mga drone kapag nasira ang Micro na Outpost.
unit.item-liquid-teleport-outpost-micro-drone.name = Drone ng Micro na Outpost
unit.item-liquid-teleport-outpost-micro-drone.description = Isang napakaliit na lumilipad na mining drone na gawa ng isang Micro na Outpost. Ang mga stat nito ay sumusunod sa mga antas ng upgrade ng Micro na Outpost nito.
block.item-liquid-teleport-outpost-small.name = Maliit na Outpost
block.item-liquid-teleport-outpost-small.description = Isang 2x2 na Outpost na gumagawa ng maliliit na drone na nagmimina, isa bawat 5 segundo, hanggang sa limitasyon ng yunit. Pumili ng uri ng mineral sa menu ng block; ang mga drone ay nagmimina ng pinakamalapit na mineral ng uri na iyon at inihahatid ito sa core. Limang landas ng pag-upgrade na may mas mababang limitasyon kaysa sa Outpost: limitasyon ng yunit, bilis ng drone, bilis ng pagmimina, kapasidad ng pagdadala, at antas ng pagmimina (max 2). Namamatay ang mga drone kapag nasira ang Maliit na Outpost.
unit.item-liquid-teleport-outpost-small-drone.name = Drone ng Maliit na Outpost
unit.item-liquid-teleport-outpost-small-drone.description = Isang maliit na lumilipad na drone na nagmimina na ginawa ng isang Maliit na Outpost. Ang mga stats nito ay sumusunod sa mga antas ng pag-upgrade ng Maliit na Outpost nito.
block.item-liquid-teleport-outpost-mega.name = Mega Outpost
block.item-liquid-teleport-outpost-mega.description = Awtomatikong nabubuo kapag apat na Maliit na Outpost ang nakatayo sa 2x2 na parisukat. Gumagawa ng Mega mining drone na may apat na beses ng stats ng drone ng Maliit na Outpost at hagdan ng upgrade na umaabot sa labing-anim na beses. Nagmimina ng tier 3 na ore mula sa simula, tier 4 pagkatapos ng isang upgrade. Hindi maaaring itayo nang direkta. Ang pagbuwag ay nagbabalik ng apat na Maliit na Outpost.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega Drone
unit.item-liquid-teleport-outpost-mega-drone.description = Mabigat na mining drone na ginawa ng Mega Outpost. Nagmimina ng napiling ore at inihahatid ito sa core.
block.item-liquid-teleport-outpost-quad.name = Quad Outpost
block.item-liquid-teleport-outpost-quad.description = Awtomatikong nabubuo kapag apat na Outpost ang nakatayo sa 2x2 na parisukat. Gumagawa ng Quad mining drone na may apat na beses ng stats ng drone ng Outpost at hagdan ng upgrade na umaabot sa labing-anim na beses. Bawat Quad ay naglalabas ng isang Mono na katulong kada antas ng unit cap, hanggang apat, na nagmimina ng parehong ore. Nagmimina ng tier 3 na ore mula sa simula, tier 4 pagkatapos ng isang upgrade. Hindi maaaring itayo nang direkta. Ang pagbuwag ay nagbabalik ng apat na Outpost.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad Drone
unit.item-liquid-teleport-outpost-quad-drone.description = Mabigat na mining drone na ginawa ng Quad Outpost. Nagmimina ng napiling ore, inihahatid ito sa core, at naglalabas ng hanggang apat na Mono na katulong na nagmimina kasama nito.
