item-liquid-teleport.displayName = Teletrasporto Oggetti e Liquidi
item-liquid-teleport.subtitle = v1.3.4: traduzioni in tutte le 35 lingue di Mindustry, controllo di localizzazione
item-liquid-teleport.description = Aggiunge blocchi Crono di livello cheat per il trasporto globale di oggetti e liquidi, conversione del terreno, conversione di oggetti, riparazione, costruzione, overdrive, potenziamenti unità, indebolimenti unità e posizionamento del nucleo, oltre all’Avamposto, base mineraria con droni.\nAggiornamento: tutti i testi di blocchi, unità, stati e menu sono tradotti nelle 35 lingue supportate da Mindustry; un controllo blocca i commit senza traduzione.\nAggiornamento: nuovo Piccolo Avamposto, un Avamposto 2x2 basato su mono con limiti di potenziamento ridotti; il selettore dei minerali mostra una riga per pianeta; i colori dei costi di potenziamento si aggiornano in tempo reale.\nAggiornamento: nuovo blocco Avamposto che costruisce droni minerari volanti che consegnano un minerale selezionato al nucleo; spendi oggetti dal nucleo per potenziare il limite unità, la velocità, la velocità di estrazione, la capacità di carico e il livello di estrazione.
block.item-liquid-teleport-chrono-unloader.name = Crono Scaricatore
block.item-liquid-teleport-chrono-unloader.description = Estrae un oggetto scelto da tutti gli edifici collegati su tutta la mappa e lo distribuisce tramite nastri trasportatori.
block.item-liquid-teleport-chrono-pusher.name = Crono Spintore
block.item-liquid-teleport-chrono-pusher.description = Invia tutti gli oggetti immagazzinati negli edifici collegati su tutta la mappa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Crono Scaricatore di Liquidi
block.item-liquid-teleport-chrono-liquid-unloader.description = Estrae un liquido scelto da tutti gli edifici collegati su tutta la mappa e lo distribuisce tramite condotti.
block.item-liquid-teleport-chrono-liquid-pusher.name = Crono Spintore di Liquidi
block.item-liquid-teleport-chrono-liquid-pusher.description = Invia un liquido scelto a tutti gli edifici collegati su tutta la mappa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Crono Posatore di Liquidi
block.item-liquid-teleport-chrono-liquid-tiler.description = Converte il terreno circostante nel pavimento liquido selezionato, una casella alla volta.
block.item-liquid-teleport-chrono-item-tiler.name = Crono Posatore di Minerale
block.item-liquid-teleport-chrono-item-tiler.description = Converte il terreno circostante nello strato di minerale selezionato, una casella alla volta.
block.item-liquid-teleport-chrono-item-converter.name = Crono Convertitore di Oggetti
block.item-liquid-teleport-chrono-item-converter.description = Converte un oggetto in ingresso scelto in un oggetto in uscita scelto con rapporto basato sulla rarità, velocità e costo energetico variabili.
block.item-liquid-teleport-chrono-core.name = Crono Nucleo
block.item-liquid-teleport-chrono-core.description = Un nucleo 1x1 di livello cheat, sempre sbloccato, che produce unità gamma.
block.item-liquid-teleport-chrono-mender.name = Crono Riparatore
block.item-liquid-teleport-chrono-mender.description = Cura continuamente tutti gli edifici alleati su tutta la mappa. Le basi piccole vengono ripristinate completamente più volte al secondo; le basi grandi vengono curate con una scansione progressiva. Non richiede energia né risorse.
block.item-liquid-teleport-chrono-repair-point.name = Crono Punto di Riparazione
block.item-liquid-teleport-chrono-repair-point.description = Ripara le unità alleate danneggiate su tutta la mappa al 50 % della salute massima al secondo con un raggio continuo.
block.item-liquid-teleport-chrono-build-tower.name = Crono Torre di Costruzione
block.item-liquid-teleport-chrono-build-tower.description = Ricostruisce automaticamente le strutture su tutta la mappa e assiste la costruzione con la logica standard della torre di costruzione.
block.item-liquid-teleport-chrono-booster.name = Crono Amplificatore
block.item-liquid-teleport-chrono-booster.description = Una cupola di overdrive 1x1 che accetta oggetti e liquidi aggiuntivi per aumentare il raggio e la velocità.
block.item-liquid-teleport-chrono-buffer.name = Crono Potenziatore
block.item-liquid-teleport-chrono-buffer.description = Applica potenziamenti alle unità alleate nel raggio. Oggetti e liquidi aggiuntivi aumentano il raggio, la durata e il numero di stati personalizzati sbloccati.
block.item-liquid-teleport-chrono-debuffer.name = Crono Indebolimento
block.item-liquid-teleport-chrono-debuffer.description = Applica effetti negativi cumulati alle unità nemiche nel raggio. Oggetti e liquidi aggiuntivi aumentano il raggio e la durata degli stati.
