item-liquid-teleport.displayName = Teletrasporto Oggetti e Liquidi
item-liquid-teleport.subtitle = v1.4.16: Descrizione della mod più breve con le modifiche per versione
item-liquid-teleport.description = Blocchi Chrono da cheat per il trasporto globale di oggetti e liquidi, conversione di terreno e oggetti, riparazione, costruzione, sovraccarico, potenziamenti e indebolimenti delle unità, controllo mentale e piazzamento di nuclei, più l'Avamposto, una base che costruisce droni minatori.\n\n[accent]v1.4.16[]\nDescrizione della mod più breve con le modifiche per versione.\n\n[accent]v1.4.15[]\nAvamposto, Quad Avamposto e Mega Avamposto: il potenziamento al livello di estrazione 4 costa titanio e silicio.\n\n[accent]v1.4.14[]\nNuova Crono Ipnosi: Yuri converte unità ed edifici nemici dalla tua parte.\n\n[accent]v1.4.13[]\nI raggi di estrazione extra dell'Avamposto puntano a caselle di minerale diverse.\n\n[accent]v1.4.11 - 1.4.12[]\nCrono Posatore di Minerale e Crono Posatore di Liquidi dipingono un quadrato e mostrano il loro raggio.
block.item-liquid-teleport-chrono-unloader.name = Crono Scaricatore
block.item-liquid-teleport-chrono-unloader.description = Estrae un oggetto scelto da tutti gli edifici collegati su tutta la mappa e lo distribuisce tramite nastri trasportatori.
block.item-liquid-teleport-chrono-pusher.name = Crono Spintore
block.item-liquid-teleport-chrono-pusher.description = Invia tutti gli oggetti immagazzinati negli edifici collegati su tutta la mappa.
block.item-liquid-teleport-chrono-liquid-unloader.name = Crono Scaricatore di Liquidi
block.item-liquid-teleport-chrono-liquid-unloader.description = Estrae un liquido scelto da tutti gli edifici collegati su tutta la mappa e lo distribuisce tramite condotti.
block.item-liquid-teleport-chrono-liquid-pusher.name = Crono Spintore di Liquidi
block.item-liquid-teleport-chrono-liquid-pusher.description = Invia un liquido scelto a tutti gli edifici collegati su tutta la mappa.
block.item-liquid-teleport-chrono-liquid-tiler.name = Crono Posatore di Liquidi
block.item-liquid-teleport-chrono-liquid-tiler.description = Converte il terreno circostante nel pavimento liquido selezionato, una casella alla volta.
block.item-liquid-teleport-chrono-item-tiler.name = Crono Posatore di Minerale
block.item-liquid-teleport-chrono-item-tiler.description = Converte il terreno circostante nello strato di minerale selezionato, una casella alla volta.
