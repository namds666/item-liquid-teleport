block.item-liquid-teleport-chrono-hypno.name = Crono Ipnosi
block.item-liquid-teleport-chrono-hypno.description = Mantiene in vita un Yuri. Quando Yuri muore, attende 10 secondi e usa 25 silicio dal proprio deposito per riportarlo in vita. Yuri aggancia una sola unità o struttura nemica alla volta da 20 caselle e la porta dalla tua parte dopo 2 secondi; il legame regge a qualsiasi distanza finché il bersaglio non viene convertito o muore. I nuclei non possono essere convertiti. Potenzia con oggetti dal nucleo: ciascuno dei 10 livelli aggiunge 1 casella di raggio e accorcia il canale, fino a 1 secondo. Yuri muore quando la Crono Ipnosi viene distrutta.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Un mech psichico senza armi. Aggancia un nemico alla volta e lo converte dalla tua parte. Esegue gli ordini come ogni unità. Creato da una Crono Ipnosi.
