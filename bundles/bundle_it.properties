block.item-liquid-teleport-outpost.name = Avamposto
block.item-liquid-teleport-outpost.description = Costruisce droni minerari, uno ogni 5 secondi, fino al limite di unità. Seleziona un tipo di minerale nel menu del blocco; i droni estraggono il minerale più vicino di quel tipo e lo consegnano al nucleo. Spendi oggetti dal nucleo per potenziare cinque percorsi indipendenti: limite unità, velocità dei droni, velocità di estrazione, capacità di carico e livello di estrazione. I droni muoiono se l’Avamposto viene distrutto.
unit.item-liquid-teleport-outpost-drone.name = Drone dell’Avamposto
unit.item-liquid-teleport-outpost-drone.description = Un drone minerario volante prodotto da un Avamposto. Le sue statistiche seguono i livelli di potenziamento del suo Avamposto.
block.item-liquid-teleport-outpost-micro.name = Micro Avamposto
block.item-liquid-teleport-outpost-micro.description = Un avamposto 1x1 che costruisce micro droni minatori, uno ogni 5 secondi, fino al suo limite di unità. Seleziona un tipo di minerale nel menu del blocco; i droni estraggono il minerale più vicino di quel tipo e lo consegnano al nucleo. Linee di potenziamento con limiti più bassi del Piccolo Avamposto: limite di unità, velocità, velocità di estrazione, capacità di carico, livello di estrazione (max. 2, arriva al carbone) e altro. Quattro Micro Avamposti in un quadrato 2x2 si fondono in un Piccolo Avamposto. I droni muoiono quando il Micro Avamposto viene distrutto.
unit.item-liquid-teleport-outpost-micro-drone.name = Drone del Micro Avamposto
unit.item-liquid-teleport-outpost-micro-drone.description = Un minuscolo drone minatore volante prodotto da un Micro Avamposto. Le sue statistiche seguono i livelli di potenziamento del suo Micro Avamposto.
block.item-liquid-teleport-outpost-small.name = Piccolo Avamposto
block.item-liquid-teleport-outpost-small.description = Un Avamposto 2x2 che costruisce piccoli droni minerari, uno ogni 5 secondi, fino al limite di unità. Seleziona un tipo di minerale nel menu del blocco; i droni estraggono il minerale più vicino di quel tipo e lo consegnano al nucleo. Cinque percorsi di potenziamento con limiti inferiori all’Avamposto: limite unità, velocità dei droni, velocità di estrazione, capacità di carico e livello di estrazione (max 2). I droni muoiono se il Piccolo Avamposto viene distrutto.
unit.item-liquid-teleport-outpost-small-drone.name = Drone del Piccolo Avamposto
unit.item-liquid-teleport-outpost-small-drone.description = Un piccolo drone minerario volante prodotto da un Piccolo Avamposto. Le sue statistiche seguono i livelli di potenziamento del suo Piccolo Avamposto.
block.item-liquid-teleport-outpost-mega.name = Mega Avamposto
block.item-liquid-teleport-outpost-mega.description = Si forma automaticamente quando quattro Piccoli Avamposti stanno in un quadrato 2x2. Costruisce droni minatori Mega con quattro volte le statistiche di un drone del Piccolo Avamposto e una scala di miglioramenti che arriva a sedici volte. Estrae minerale di livello 3 fin dall'inizio, livello 4 dopo un miglioramento. Non può essere costruito direttamente. La demolizione rimborsa quattro Piccoli Avamposti.
unit.item-liquid-teleport-outpost-mega-drone.name = Drone Mega
unit.item-liquid-teleport-outpost-mega-drone.description = Drone minatore pesante costruito dal Mega Avamposto. Estrae il minerale selezionato e lo consegna al nucleo.
block.item-liquid-teleport-outpost-quad.name = Quad Avamposto
block.item-liquid-teleport-outpost-quad.description = Si forma automaticamente quando quattro Avamposti stanno in un quadrato 2x2. Costruisce droni minatori Quad con quattro volte le statistiche di un drone dell'Avamposto e una scala di miglioramenti che arriva a sedici volte. Ogni Quad dispiega un aiutante Mono per livello del limite unità, fino a quattro, che estraggono lo stesso minerale. Estrae minerale di livello 3 fin dall'inizio, livello 4 dopo un miglioramento. Non può essere costruito direttamente. La demolizione rimborsa quattro Avamposti.
unit.item-liquid-teleport-outpost-quad-drone.name = Drone Quad
unit.item-liquid-teleport-outpost-quad-drone.description = Drone minatore pesante costruito dal Quad Avamposto. Estrae il minerale selezionato, lo consegna al nucleo e dispiega fino a quattro aiutanti Mono che estraggono al suo fianco.
