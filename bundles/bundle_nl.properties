block.item-liquid-teleport-chrono-hypno.name = Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno.description = Een 1x1-blok dat één Yuri in leven houdt. Als Yuri sterft, wacht het blok 10 seconden en gebruikt het 25 silicium uit zijn opslag om hem terug te brengen. Yuri bindt één vijandelijke eenheid of gebouw tegelijk vanaf 30 tegels en bekeert het na 2 seconden naar jouw kant. Meer Yuri op hetzelfde doel bekeren het sneller: twee Yuri doen er de helft van de tijd over. De band houdt op elke afstand tot het doel bekeerd is of sterft. Kernen kunnen niet bekeerd worden. Upgrade met items uit de kern: elk van de 10 niveaus verkort de tijd tot 1 seconde. Vier Chrono-Hypnose in een 2x2-vierkant smelten samen tot een Grote Chrono-Hypnose. Yuri sterft als de Chrono-Hypnose vernietigd wordt.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Een psychische mech zonder wapens. Bindt één vijand tegelijk en bekeert die naar jouw kant. Meer Yuri op hetzelfde doel bekeren het sneller. Neemt bevelen aan zoals elke eenheid. Gemaakt door een Chrono-Hypnose.
block.item-liquid-teleport-chrono-hypno-big.name = Grote Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno-big.description = Ontstaat vanzelf als vier Chrono-Hypnose in een 2x2-vierkant staan. Houdt één Grote Yuri in leven en brengt hem terug voor 50 silicium. Grote Yuri bindt twee vijandelijke eenheden of gebouwen tegelijk. Zelfde bereik, tijd en upgrades als de Chrono-Hypnose; na het samensmelten beginnen de niveaus opnieuw bij 1. Kan niet direct gebouwd worden.
unit.item-liquid-teleport-yuri-big.name = Grote Yuri
unit.item-liquid-teleport-yuri-big.description = Een grote psychische mech zonder wapens. Bindt twee vijanden tegelijk en bekeert ze naar jouw kant. Meer Yuri op hetzelfde doel bekeren het sneller. Neemt bevelen aan zoals elke eenheid. Gemaakt door een Grote Chrono-Hypnose.
