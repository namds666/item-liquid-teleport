item-liquid-teleport.displayName = Item-Vloeistof-Teleport
item-liquid-teleport.subtitle = v1.4.18: Yuri zoekt doelen binnen zijn eigen bereik van 30 tegels
item-liquid-teleport.description = Cheat-niveau Chrono-blokken voor wereldwijd transport van items en vloeistoffen, terrein- en itemconversie, reparatie, bouw, overdrive, buffs en debuffs voor eenheden, gedachtecontrole en het plaatsen van kernen, plus de Buitenpost, een basis die mijndrones bouwt.\n\n[accent]v1.4.18[]\nYuri zoekt nu doelen binnen zijn eigen bereik van 30 tegels om zich heen, dus hij bekeert overal waar hij loopt. Upgrades verkorten nu alleen de tijd.\n\n[accent]v1.4.17[]\nChrono-Hypnose is nu 1x1. Vier in een 2x2-vierkant smelten samen tot een Grote Chrono-Hypnose, waarvan de Grote Yuri twee doelen tegelijk bindt. Meer Yuri op één doel bekeren het sneller: twee Yuri doen er de helft van de tijd over.\n\n[accent]v1.4.16[]\nKortere modbeschrijving met wijzigingen per versie.\n\n[accent]v1.4.15[]\nBuitenpost, Quad Buitenpost en Mega Buitenpost: de mijnniveau 4-upgrade kost titanium en silicium.\n\n[accent]v1.4.14[]\nNieuwe Chrono-Hypnose: Yuri bekeert vijandelijke eenheden en gebouwen naar jouw kant.
