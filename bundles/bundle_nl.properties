block.item-liquid-teleport-chrono-hypno.name = Chrono-Hypnose
block.item-liquid-teleport-chrono-hypno.description = Houdt één Yuri in leven. Als Yuri sterft, wacht het 10 seconden en gebruikt 25 silicium uit de eigen opslag om hem terug te brengen. Yuri koppelt telkens één vijandelijke eenheid of gebouw vanaf 20 vakjes en zet het na 2 seconden om naar jouw kant; de koppeling houdt op elke afstand stand tot het doelwit is omgezet of sterft. Kernen kunnen niet worden omgezet. Upgrade met items uit de kern: elk van de 10 niveaus voegt 1 vakje bereik toe en verkort het kanaal, tot 1 seconde. Yuri sterft als de Chrono-Hypnose wordt vernietigd.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Een psychische mech zonder wapens. Koppelt één vijand tegelijk en zet hem om naar jouw kant. Voert bevelen uit zoals elke eenheid. Gemaakt door een Chrono-Hypnose.
hypno.path = Hypnosekracht
hypno.value = {0} tegels, {1}s
