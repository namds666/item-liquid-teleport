block.item-liquid-teleport-outpost.name = Buitenpost
block.item-liquid-teleport-outpost.description = Bouwt mijndrones, één elke 5 seconden, tot aan het eenheidslimiet. Kies een ertstype in het blokmenu; drones delven het dichtstbijzijnde erts van dat type en brengen het naar de kern. Besteed items uit de kern om vijf onafhankelijke paden te upgraden: eenheidslimiet, dronesnelheid, mijnsnelheid, draagcapaciteit en mijnniveau. Drones sterven wanneer de Buitenpost wordt vernietigd.
unit.item-liquid-teleport-outpost-drone.name = Buitenpost-Drone
unit.item-liquid-teleport-outpost-drone.description = Een vliegende mijndrone geproduceerd door een Buitenpost. De statistieken volgen de upgradeniveaus van de bijbehorende Buitenpost.
block.item-liquid-teleport-outpost-micro.name = Micro Buitenpost
block.item-liquid-teleport-outpost-micro.description = Een 1x1-buitenpost die micro mijndrones bouwt, één per 5 seconden, tot zijn eenheidslimiet. Kies een ertstype in het blokmenu; drones delven het dichtstbijzijnde erts van dat type en leveren het af bij de kern. Upgradelijnen met lagere limieten dan de Kleine Buitenpost: eenheidslimiet, snelheid, mijnsnelheid, draagcapaciteit, mijnniveau (max. 2, bereikt kolen) en meer. Vier Micro Buitenposten in een 2x2-vierkant smelten samen tot een Kleine Buitenpost. Drones sterven wanneer de Micro Buitenpost wordt vernietigd.
unit.item-liquid-teleport-outpost-micro-drone.name = Micro Buitenpost-Drone
unit.item-liquid-teleport-outpost-micro-drone.description = Een piepkleine vliegende mijndrone, geproduceerd door een Micro Buitenpost. De waarden volgen de upgradeniveaus van zijn Micro Buitenpost.
block.item-liquid-teleport-outpost-small.name = Kleine Buitenpost
block.item-liquid-teleport-outpost-small.description = Een 2x2-Buitenpost die kleine mijndrones bouwt, één elke 5 seconden, tot aan het eenheidslimiet. Kies een ertstype in het blokmenu; drones delven het dichtstbijzijnde erts van dat type en brengen het naar de kern. Vijf upgradepaden met lagere limieten dan de Buitenpost: eenheidslimiet, dronesnelheid, mijnsnelheid, draagcapaciteit en mijnniveau (max. 2). Drones sterven wanneer de Kleine Buitenpost wordt vernietigd.
unit.item-liquid-teleport-outpost-small-drone.name = Kleine Buitenpost-Drone
unit.item-liquid-teleport-outpost-small-drone.description = Een kleine vliegende mijndrone geproduceerd door een Kleine Buitenpost. De statistieken volgen de upgradeniveaus van de bijbehorende Kleine Buitenpost.
block.item-liquid-teleport-outpost-mega.name = Mega Buitenpost
block.item-liquid-teleport-outpost-mega.description = Ontstaat automatisch wanneer vier Kleine Buitenposten in een 2x2-vierkant staan. Bouwt Mega-delfdrones met vier keer de waarden van een Kleine Buitenpost-drone en een upgradeladder tot zestien keer. Delft vanaf het begin erts van niveau 3, niveau 4 na één upgrade. Kan niet direct worden gebouwd. Afbreken geeft vier Kleine Buitenposten terug.
unit.item-liquid-teleport-outpost-mega-drone.name = Mega-drone
unit.item-liquid-teleport-outpost-mega-drone.description = Zware delfdrone gebouwd door de Mega Buitenpost. Delft het gekozen erts en levert het aan de kern.
block.item-liquid-teleport-outpost-quad.name = Quad Buitenpost
block.item-liquid-teleport-outpost-quad.description = Ontstaat automatisch wanneer vier Buitenposten in een 2x2-vierkant staan. Bouwt Quad-delfdrones met vier keer de waarden van een Buitenpost-drone en een upgradeladder tot zestien keer. Elke Quad zet per eenheidslimiet-niveau één Mono-helper in, tot vier, die hetzelfde erts delven. Delft vanaf het begin erts van niveau 3, niveau 4 na één upgrade. Kan niet direct worden gebouwd. Afbreken geeft vier Buitenposten terug.
unit.item-liquid-teleport-outpost-quad-drone.name = Quad-drone
unit.item-liquid-teleport-outpost-quad-drone.description = Zware delfdrone gebouwd door de Quad Buitenpost. Delft het gekozen erts, levert het aan de kern en zet tot vier Mono-helpers in die naast hem delven.
