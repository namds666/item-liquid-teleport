item-liquid-teleport.displayName = Item-Vloeistof-Teleport
item-liquid-teleport.subtitle = v1.4.16: Kortere modbeschrijving met wijzigingen per versie
item-liquid-teleport.description = Cheat-niveau Chrono-blokken voor wereldwijd transport van items en vloeistoffen, terrein- en itemconversie, reparatie, bouw, overdrive, buffs en debuffs voor eenheden, gedachtecontrole en het plaatsen van kernen, plus de Buitenpost, een basis die mijndrones bouwt.\n\n[accent]v1.4.16[]\nKortere modbeschrijving met wijzigingen per versie.\n\n[accent]v1.4.15[]\nBuitenpost, Quad Buitenpost en Mega Buitenpost: de mijnniveau 4-upgrade kost titanium en silicium.\n\n[accent]v1.4.14[]\nNieuwe Chrono-Hypnose: Yuri bekeert vijandelijke eenheden en gebouwen naar jouw kant.\n\n[accent]v1.4.13[]\nExtra mijnstralen van de Buitenpost richten op verschillende ertstegels.\n\n[accent]v1.4.11 - 1.4.12[]\nChrono-Ertsplaatser en Chrono-Vloeistofplaatser kleuren een vierkant en tonen hun straal.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Ontlader
block.item-liquid-teleport-chrono-unloader.description = Haalt een gekozen item uit alle verbonden gebouwen wereldwijd en voert het af via transportbanden.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Duwer
block.item-liquid-teleport-chrono-pusher.description = Duwt alle opgeslagen items in verbonden gebouwen wereldwijd.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Vloeistofontlader
block.item-liquid-teleport-chrono-liquid-unloader.description = Haalt een gekozen vloeistof uit alle verbonden gebouwen wereldwijd en voert deze af via buizen.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Vloeistofduwer
block.item-liquid-teleport-chrono-liquid-pusher.description = Duwt een gekozen vloeistof in alle verbonden gebouwen wereldwijd.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Vloeistofplaatser
block.item-liquid-teleport-chrono-liquid-tiler.description = Zet nabijgelegen terrein tegel voor tegel om in de gekozen vloeistofvloer.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Ertsplaatser
block.item-liquid-teleport-chrono-item-tiler.description = Zet nabijgelegen terrein tegel voor tegel om in de gekozen erts-overlay.
