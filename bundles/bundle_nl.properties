item-liquid-teleport.displayName = Item-Vloeistof-Teleport
item-liquid-teleport.subtitle = v1.4.3: Mijnbereik-upgrade van de Buitenpost, hulpdrones volgen de snelheid van de ouder
item-liquid-teleport.description = Voegt cheat-Chrono-blokken toe voor wereldwijd item- en vloeistoftransport, terreinconversie, itemconversie, reparatie, bouw, overdrive, eenheidsbuffs, eenheidsdebuffs en kernplaatsing, plus de Buitenpost-drone-mijnbasis.\nUpdate: nieuwe upgradelijn Mijnbereik maakt de mijnstraal van de drones bij elke Buitenpost langer; de hulpdrones van de Quad Buitenpost bewegen nu even snel als hun ouderdrone.\nUpdate: upgrades van het mijnniveau van de Buitenpost kosten nooit grondstoffen boven het niveau dat ze ontgrendelen; op Erekir gebruikt elke Buitenpost-upgrade Erekir-grondstoffen.\nUpdate: Mega- en Quad Buitenposten krijgen een eigen gebouwontwerp met hangarplatforms, steunen en een centrale reactor.\nUpdate: vier Kleine Buitenposten in een 2x2-vierkant versmelten tot een Mega Buitenpost (4x4) en vier Buitenposten tot een Quad Buitenpost (6x6); beide bouwen zware drones met vier keer de waarden en een upgradeladder tot zestien keer; Quad-drones zetten Mono-helpers in.\nUpdate: de ertskiezer van de Buitenpost ontgrendelt ertsen direct na een upgrade van het delfniveau; een nieuwe knop Minste laat de Buitenpost het beschikbare erts delven waarvan de kern het minst heeft.\nUpdate: met autostelen aan koppelen de uitladers alleen gebouwen van andere teams, inclusief verlaten; gebouwen van het eigen team worden overgeslagen. Aanzetten verwijdert koppelingen naar het eigen team; uitzetten verwijdert koppelingen naar andere teams.\nUpdate: automatisch koppelen verbindt nu alleen bronnen die het gekozen item uitvoeren; de categoriecontrole loopt vóór het itemfilter om lag te verminderen; de itemkiezers van uitlader en duwer gebruiken een 8x2-raster.\nUpdate: elke tekst van blokken, eenheden, statussen en menu's is vertaald in alle 35 talen die Mindustry ondersteunt; een controle blokkeert commits zonder vertaling.\nUpdate: nieuwe Kleine Buitenpost, een 2x2-mono-Buitenpost met lagere upgradelimieten; ertskeuze toont één rij per planeet; upgradekostkleuren worden live bijgewerkt.\nUpdate: nieuw Buitenpost-blok bouwt vliegende mijndrones die een gekozen erts naar de kern brengen; eenheidslimiet, snelheid, mijnsnelheid, draagcapaciteit en mijnniveau upgraden met items uit de kern.
block.item-liquid-teleport-chrono-unloader.name = Chrono-Ontlader
block.item-liquid-teleport-chrono-unloader.description = Haalt een gekozen item uit alle verbonden gebouwen wereldwijd en voert het af via transportbanden.
block.item-liquid-teleport-chrono-pusher.name = Chrono-Duwer
block.item-liquid-teleport-chrono-pusher.description = Duwt alle opgeslagen items in verbonden gebouwen wereldwijd.
block.item-liquid-teleport-chrono-liquid-unloader.name = Chrono-Vloeistofontlader
block.item-liquid-teleport-chrono-liquid-unloader.description = Haalt een gekozen vloeistof uit alle verbonden gebouwen wereldwijd en voert deze af via buizen.
block.item-liquid-teleport-chrono-liquid-pusher.name = Chrono-Vloeistofduwer
block.item-liquid-teleport-chrono-liquid-pusher.description = Duwt een gekozen vloeistof in alle verbonden gebouwen wereldwijd.
block.item-liquid-teleport-chrono-liquid-tiler.name = Chrono-Vloeistofplaatser
block.item-liquid-teleport-chrono-liquid-tiler.description = Zet nabijgelegen terrein tegel voor tegel om in de gekozen vloeistofvloer.
block.item-liquid-teleport-chrono-item-tiler.name = Chrono-Ertsplaatser
block.item-liquid-teleport-chrono-item-tiler.description = Zet nabijgelegen terrein tegel voor tegel om in de gekozen erts-overlay.
block.item-liquid-teleport-chrono-item-converter.name = Chrono-Itemomzetter
block.item-liquid-teleport-chrono-item-converter.description = Zet een gekozen invoeritem om in een gekozen uitvoeritem met op zeldzaamheid gebaseerde verhouding, snelheid en energiekosten.
block.item-liquid-teleport-chrono-core.name = Chrono-Kern
block.item-liquid-teleport-chrono-core.description = Een 1x1-cheat-kern die altijd ontgrendeld is en gamma-eenheden produceert.
block.item-liquid-teleport-chrono-mender.name = Chrono-Hersteller
block.item-liquid-teleport-chrono-mender.description = Herstelt continu alle geallieerde gebouwen wereldwijd. Kleine bases worden meerdere keren per seconde volledig gerepareerd; grotere bases worden in een rollende ronde geheeld. Vereist geen stroom of grondstoffen.
block.item-liquid-teleport-chrono-repair-point.name = Chrono-Reparatiepunt
block.item-liquid-teleport-chrono-repair-point.description = Repareert beschadigde geallieerde eenheden wereldwijd met 50% maximale gezondheid per seconde via een doorlopende straal.
block.item-liquid-teleport-chrono-build-tower.name = Chrono-Bouwtoren
block.item-liquid-teleport-chrono-build-tower.description = Herbouwt structuren wereldwijd automatisch en ondersteunt de bouw met standaard bouwtorenlogica.
block.item-liquid-teleport-chrono-booster.name = Chrono-Versterker
block.item-liquid-teleport-chrono-booster.description = Een 1x1-overdrivekoepel die extra items en vloeistoffen accepteert voor additieve bereik- en snelheidsboosts.
block.item-liquid-teleport-chrono-buffer.name = Chrono-Buffer
block.item-liquid-teleport-chrono-buffer.description = Geeft geallieerde eenheden in bereik buffs. Extra items en vloeistoffen verhogen straal, duur en het aantal ontgrendelde aangepaste statussen.
block.item-liquid-teleport-chrono-debuffer.name = Chrono-Debuffer
block.item-liquid-teleport-chrono-debuffer.description = Past gestapelde negatieve statuseffecten toe op vijandige eenheden in bereik. Extra items en vloeistoffen verhogen straal en statusduur.
