block.item-liquid-teleport-outpost.name = Avanpost
block.item-liquid-teleport-outpost.description = Construiește drone de minerit, una la fiecare 5 secunde, până la limita de unități. Selectează un tip de minereu în meniul blocului; dronele minerează cel mai apropiat minereu de acel tip și îl livrează la nucleu. Cheltuiește obiecte din nucleu pentru a îmbunătăți cinci căi independente: limita de unități, viteza dronei, viteza de minerit, capacitatea de transport și nivelul de minerit. Dronele mor când Avanpostul este distrus.
unit.item-liquid-teleport-outpost-drone.name = Dronă de Avanpost
unit.item-liquid-teleport-outpost-drone.description = O dronă de minerit zburatoare produsă de un Avanpost. Statisticile ei urmează nivelurile de îmbunătățire ale Avanpostului.
block.item-liquid-teleport-outpost-small.name = Avanpost Mic
block.item-liquid-teleport-outpost-small.description = Un Avanpost 2x2 care construiește drone de minerit mici, una la fiecare 5 secunde, până la limita de unități. Selectează un tip de minereu în meniul blocului; dronele minerează cel mai apropiat minereu de acel tip și îl livrează la nucleu. Cinci căi de îmbunătățire cu limite mai mici decât Avanpostul: limita de unități, viteza dronei, viteza de minerit, capacitatea de transport și nivelul de minerit (max 2). Dronele mor când Avanpostul Mic este distrus.
unit.item-liquid-teleport-outpost-small-drone.name = Dronă de Avanpost Mic
unit.item-liquid-teleport-outpost-small-drone.description = O dronă mică de minerit zburatoare produsă de un Avanpost Mic. Statisticile ei urmează nivelurile de îmbunătățire ale Avanpostului Mic.
