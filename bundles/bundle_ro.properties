item-liquid-teleport.displayName = Teleportare Obiecte și Lichide
item-liquid-teleport.subtitle = v1.4.3: Îmbunătățire a razei de minerit a Avanpostului, dronele ajutătoare au viteza părintelui
item-liquid-teleport.description = Adaugă blocuri Crono de nivel cheat pentru transport global de obiecte și lichide, conversie de teren, conversie de obiecte, reparare, construcție, supraîncărcare, bonusuri de unitate, penalizări de unitate și plasare de nucleu, plus Avanpostul, bază de minerit cu drone.\nActualizare: noua linie de îmbunătățire Rază de minerit lungește raza de minerit a dronelor la fiecare Avanpost; dronele ajutătoare ale Quad Avanpostului se mișcă acum cu aceeași viteză ca drona părinte.\nActualizare: îmbunătățirile nivelului de minerit al Avanpostului nu costă niciodată resurse peste nivelul pe care îl deblochează; pe Erekir fiecare îmbunătățire a Avanpostului folosește resurse de pe Erekir.\nActualizare: Mega și Quad Avanposturile au propriul design de clădire cu platforme de hangar, contravântuiri și un reactor central.\nActualizare: patru Avanposturi Mici într-un pătrat 2x2 se unesc într-un Mega Avanpost (4x4) și patru Avanposturi într-un Quad Avanpost (6x6); ambele construiesc drone grele cu de patru ori statisticile și o scară de îmbunătățiri care ajunge la șaisprezece ori; dronele Quad lansează ajutoare Mono.\nActualizare: selectorul de minereu al Avanpostului deblochează minereurile imediat după o îmbunătățire a nivelului de minare; un nou buton Cel mai puțin face Avanpostul să extragă minereul disponibil de care nucleul are cel mai puțin.\nActualizare: cu furtul automat activat, descărcătoarele leagă doar clădiri ale altor echipe, inclusiv abandonate; clădirile propriei echipe sunt omise. Activarea elimină legăturile cu propria echipă; dezactivarea elimină legăturile cu alte echipe.\nActualizare: legarea automată leagă acum doar sursele care produc obiectul selectat; verificarea categoriei rulează înaintea filtrului de obiecte pentru a reduce lag-ul; selectoarele de obiecte ale descărcătorului și împingătorului folosesc o grilă 8x2.\nActualizare: fiecare text pentru blocuri, unități, stări și meniuri este tradus în toate cele 35 de limbi acceptate de Mindustry; o verificare blochează commit-urile fără traducere.\nActualizare: nou Avanpost Mic, un Avanpost 2x2 bazat pe mono cu limite de îmbunătățire mai mici; selectorul de minereu arată un rând per planetă; culorile costului de îmbunătățire se actualizează în timp real.\nActualizare: nou bloc Avanpost construiește drone de minerit zburatoare care livrează minereu selectat la nucleu; cheltuiește obiecte din nucleu pentru a îmbunătăți limita de unități, viteza, viteza de minerit, capacitatea de transport și nivelul de minerit.
block.item-liquid-teleport-chrono-unloader.name = Descărcător Crono
block.item-liquid-teleport-chrono-unloader.description = Extrage un obiect ales din toate clădirile conectate la nivel global și îl trimite prin benzi transportoare.
block.item-liquid-teleport-chrono-pusher.name = Împîngător Crono
block.item-liquid-teleport-chrono-pusher.description = Împîng toate obiectele stocate în clădirile conectate la nivel global.
block.item-liquid-teleport-chrono-liquid-unloader.name = Descărcător de Lichide Crono
block.item-liquid-teleport-chrono-liquid-unloader.description = Extrage un lichid ales din toate clădirile conectate la nivel global și îl trimite prin conducte.
block.item-liquid-teleport-chrono-liquid-pusher.name = Împîngător de Lichide Crono
block.item-liquid-teleport-chrono-liquid-pusher.description = Împîng un lichid ales în toate clădirile conectate la nivel global.
block.item-liquid-teleport-chrono-liquid-tiler.name = Placar de Lichide Crono
block.item-liquid-teleport-chrono-liquid-tiler.description = Convertește terenul din apropiere în podeaua de lichid selectată, o plăcuță pe rând.
block.item-liquid-teleport-chrono-item-tiler.name = Placar de Minereu Crono
block.item-liquid-teleport-chrono-item-tiler.description = Convertește terenul din apropiere în stratul de minereu selectat, o plăcuță pe rând.
block.item-liquid-teleport-chrono-item-converter.name = Convertor de Obiecte Crono
block.item-liquid-teleport-chrono-item-converter.description = Convertește un obiect de intrare ales într-un obiect de ieșire ales cu proporție, viteză și cost energetic bazate pe raritate.
block.item-liquid-teleport-chrono-core.name = Nucleu Crono
block.item-liquid-teleport-chrono-core.description = Un nucleu 1x1 de nivel cheat care este mereu deblocat și produce unități gamma.
block.item-liquid-teleport-chrono-mender.name = Reparator Crono
block.item-liquid-teleport-chrono-mender.description = Vindecă continuu toate clădirile aliate la nivel global. Bazele mici sunt restaurate complet de mai multe ori pe secundă; bazele mai mari sunt vindecate printr-o scanare continuă. Nu necesită energie sau resurse.
block.item-liquid-teleport-chrono-repair-point.name = Punct de Reparare Crono
block.item-liquid-teleport-chrono-repair-point.description = Repară unitățile aliate avariate la nivel global cu 50% din viața maximă pe secundă printr-un fascicul continuu.
block.item-liquid-teleport-chrono-build-tower.name = Turn de Construcție Crono
block.item-liquid-teleport-chrono-build-tower.description = Reconstruiește automat structuri la nivel global și asistă construcția cu logica standard a turnului de construcție.
block.item-liquid-teleport-chrono-booster.name = Amplificator Crono
block.item-liquid-teleport-chrono-booster.description = O cupolă de supraîncărcare 1x1 care acceptă obiecte și lichide suplimentare pentru creșterea aditivă a razei și vitezei.
block.item-liquid-teleport-chrono-buffer.name = Buffer Crono
block.item-liquid-teleport-chrono-buffer.description = Aplică bonusuri unităților aliate în rază. Obiectele și lichidele suplimentare cresc raza, durata și numărul de efecte personalizate deblocate.
block.item-liquid-teleport-chrono-debuffer.name = Debuffer Crono
block.item-liquid-teleport-chrono-debuffer.description = Aplică efecte negative cumulate unităților inamice în rază. Obiectele și lichidele suplimentare cresc raza și durata efectelor.
