block.item-liquid-teleport-chrono-hypno.name = 크로노 최면
block.item-liquid-teleport-chrono-hypno.description = 유리 한 명을 유지합니다. 유리가 죽으면 10초 후 저장고의 실리콘 25개를 써서 되살립니다. 유리는 20칸 범위의 적 유닛이나 건물을 한 번에 하나씩 묶어 2초 뒤 아군으로 바꿉니다. 연결은 거리와 상관없이 대상이 전환되거나 죽을 때까지 유지됩니다. 코어는 전환할 수 없습니다. 코어의 아이템으로 업그레이드하며, 10단계마다 범위가 1칸 늘고 채널링이 최대 1초까지 짧아집니다. 크로노 최면이 파괴되면 유리도 죽습니다.
unit.item-liquid-teleport-yuri.name = 유리
unit.item-liquid-teleport-yuri.description = 무기가 없는 초능력 메카. 적 하나씩 묶어 아군으로 전환합니다. 다른 유닛처럼 명령을 받습니다. 크로노 최면이 생성합니다.
hypno.path = 최면 능력
hypno.value = {0}타일, {1}s
