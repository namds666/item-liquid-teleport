status.item-liquid-teleport-chrono-surge.description = 유닛 장전 속도를 증가시킵니다.
status.item-liquid-teleport-chrono-pyro.name = 크로노 파이로
status.item-liquid-teleport-chrono-pyro.description = 유닛 공격력을 크게 증가시킵니다.
status.item-liquid-teleport-chrono-blast.name = 크로노 블래스트
status.item-liquid-teleport-chrono-blast.description = 유닛 공격력을 대폭 증가시킵니다.
