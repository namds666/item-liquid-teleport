status.item-liquid-teleport-chrono-molten.description = 유닛 공격력을 증가시킵니다.
status.item-liquid-teleport-chrono-lubed.name = 크로노 윤활
status.item-liquid-teleport-chrono-lubed.description = 유닛 속도를 증가시킵니다.
status.item-liquid-teleport-chrono-cryo.name = 크로노 극냉
status.item-liquid-teleport-chrono-cryo.description = 유닛 장전 속도를 크게 증가시킵니다.
block.item-liquid-teleport-outpost.name = 전초기지
block.item-liquid-teleport-outpost.description = 5초마다 채굴 드론을 1기씩 생산하여 유닛 상한까지 늘립니다. 블록 메뉴에서 광석 종류를 선택하면 드론이 가장 가까운 해당 광석을 채굴하여 코어로 운반합니다. 코어 아이템을 소비하여 5가지 독립 경로를 업그레이드할 수 있습니다: 유닛 상한, 드론 속도, 채굴 속도, 적재량, 채굴 등급. 전초기지가 파괴되면 드론도 소멸합니다.
unit.item-liquid-teleport-outpost-drone.name = 전초 드론
unit.item-liquid-teleport-outpost-drone.description = 전초기지가 생산하는 비행 채굴 드론입니다. 능력치는 소속 전초기지의 업그레이드 수준을 따릅니다.
block.item-liquid-teleport-outpost-micro.name = 초소형 전초기지
block.item-liquid-teleport-outpost-micro.description = 유닛 한도까지 5초마다 초소형 채굴 드론을 하나씩 만드는 1x1 전초기지입니다. 블록 메뉴에서 광석 종류를 선택하면 드론이 해당 종류의 가장 가까운 광석을 채굴해 코어로 운반합니다. 소형 전초기지보다 한도가 낮은 강화 라인(유닛 한도, 속도, 채굴 속도, 운반 용량, 채굴 등급(최대 2, 석탄까지 도달) 등)이 있습니다. 2x2 정사각형으로 놓은 초소형 전초기지 4개는 소형 전초기지로 합쳐집니다. 초소형 전초기지가 파괴되면 드론도 죽습니다.
unit.item-liquid-teleport-outpost-micro-drone.name = 초소형 전초 드론
unit.item-liquid-teleport-outpost-micro-drone.description = 초소형 전초기지가 생산하는 아주 작은 비행 채굴 드론입니다. 능력치는 소속 초소형 전초기지의 강화 단계를 따릅니다.
block.item-liquid-teleport-outpost-small.name = 소형 전초기지
block.item-liquid-teleport-outpost-small.description = 5초마다 소형 채굴 드론을 1기 생산하는 2x2 전초기지입니다. 블록 메뉴에서 광석을 선택하면 드론이 가장 가까운 해당 광석을 채굴하여 코어로 운반합니다. 전초기지보다 상한이 낮은 5가지 업그레이드 경로: 유닛 상한, 드론 속도, 채굴 속도, 적재량, 채굴 등급(최대 2). 소형 전초기지가 파괴되면 드론이 소멸합니다.
unit.item-liquid-teleport-outpost-small-drone.name = 소형 전초 드론
unit.item-liquid-teleport-outpost-small-drone.description = 소형 전초기지가 생산하는 소형 비행 채굴 드론입니다. 능력치는 소속 소형 전초기지의 업그레이드 수준을 따릅니다.
block.item-liquid-teleport-outpost-mega.name = 메가 전초기지
block.item-liquid-teleport-outpost-mega.description = 소형 전초기지 4개가 2x2 정사각형으로 놓이면 자동으로 형성됩니다. 소형 전초기지 드론의 4배 능력치와 최대 16배에 이르는 업그레이드 단계를 가진 메가 채굴 드론을 생산합니다. 처음부터 3단계 광석을 채굴하고, 한 번 업그레이드하면 4단계가 됩니다. 직접 건설할 수 없습니다. 해체하면 소형 전초기지 4개 비용을 환급합니다.
unit.item-liquid-teleport-outpost-mega-drone.name = 메가 드론
unit.item-liquid-teleport-outpost-mega-drone.description = 메가 전초기지가 생산하는 중형 채굴 드론입니다. 선택한 광석을 채굴하여 코어로 운반합니다.
block.item-liquid-teleport-outpost-quad.name = 쿼드 전초기지
block.item-liquid-teleport-outpost-quad.description = 전초기지 4개가 2x2 정사각형으로 놓이면 자동으로 형성됩니다. 전초기지 드론의 4배 능력치와 최대 16배에 이르는 업그레이드 단계를 가진 쿼드 채굴 드론을 생산합니다. 각 쿼드는 유닛 상한 레벨당 모노 보조기 1기, 최대 4기를 전개하여 같은 광석을 채굴합니다. 처음부터 3단계 광석을 채굴하고, 한 번 업그레이드하면 4단계가 됩니다. 직접 건설할 수 없습니다. 해체하면 전초기지 4개 비용을 환급합니다.
unit.item-liquid-teleport-outpost-quad-drone.name = 쿼드 드론
unit.item-liquid-teleport-outpost-quad-drone.description = 쿼드 전초기지가 생산하는 중형 채굴 드론입니다. 선택한 광석을 채굴하여 코어로 운반하고, 함께 채굴하는 모노 보조기를 최대 4기 전개합니다.
