item-liquid-teleport.displayName = 아이템 액체 텔레포트
item-liquid-teleport.subtitle = v1.4.17: 크로노 최면가 1x1로, 넷이 대형 크로노 최면로 합쳐짐
item-liquid-teleport.description = 아이템과 액체의 전역 운송, 지형과 아이템 변환, 수리, 건설, 오버드라이브, 유닛 강화와 약화, 정신 지배, 코어 배치를 위한 치트급 크로노 블록과 채굴 드론을 만드는 기지 전초기지를 추가합니다.\n\n[accent]v1.4.17[]\n크로노 최면가 이제 1x1입니다. 2x2로 놓인 넷은 대형 크로노 최면로 합쳐지며, 그 대형 유리는 대상 둘을 동시에 묶습니다. 한 대상에 유리가 더 많으면 더 빨리 전환합니다: 유리 둘이면 절반의 시간입니다.\n\n[accent]v1.4.16[]\n모드 설명을 줄이고 변경 사항을 버전별로 표시.\n\n[accent]v1.4.15[]\n전초기지, 쿼드 전초기지, 메가 전초기지: 채굴 티어 4 업그레이드에 티타늄과 실리콘을 소모합니다.\n\n[accent]v1.4.14[]\n새 크로노 최면: 유리가 적 유닛과 건물을 아군으로 전환합니다.\n\n[accent]v1.4.13[]\n전초기지의 추가 채굴 광선이 서로 다른 광석 타일을 겨냥합니다.
block.item-liquid-teleport-chrono-unloader.name = 크로노 언로더
block.item-liquid-teleport-chrono-unloader.description = 전역의 연결된 모든 건물에서 선택한 아이템을 꺼내 컨베이어로 출력합니다.
block.item-liquid-teleport-chrono-pusher.name = 크로노 푸셔
block.item-liquid-teleport-chrono-pusher.description = 보관된 모든 아이템을 전역의 연결된 건물로 보냅니다.
block.item-liquid-teleport-chrono-liquid-unloader.name = 크로노 액체 언로더
block.item-liquid-teleport-chrono-liquid-unloader.description = 전역의 연결된 모든 건물에서 선택한 액체를 꺼내 파이프로 출력합니다.
block.item-liquid-teleport-chrono-liquid-pusher.name = 크로노 액체 푸셔
block.item-liquid-teleport-chrono-liquid-pusher.description = 선택한 액체를 전역의 연결된 모든 건물로 보냅니다.
block.item-liquid-teleport-chrono-liquid-tiler.name = 크로노 액체 타일러
block.item-liquid-teleport-chrono-liquid-tiler.description = 주변 지형을 선택한 액체 바닥으로 한 타일씩 변환합니다.
block.item-liquid-teleport-chrono-item-tiler.name = 크로노 광석 타일러
block.item-liquid-teleport-chrono-item-tiler.description = 주변 지형을 선택한 광석 오버레이로 한 타일씩 변환합니다.
tiler.radius = 반경: {0} ({1}x{1})
tiler.item = 광석
tiler.liquid = 액체
tiler.tile = 타일
block.item-liquid-teleport-chrono-item-converter.name = 크로노 아이템 변환기
block.item-liquid-teleport-chrono-item-converter.description = 선택한 입력 아이템을 희귀도 기반 비율, 속도, 전력 비용으로 선택한 출력 아이템으로 변환합니다.
block.item-liquid-teleport-chrono-core.name = 크로노 코어
block.item-liquid-teleport-chrono-core.description = 항상 해금된 치트급 1x1 코어로, 감마 유닛을 생산합니다.
block.item-liquid-teleport-chrono-mender.name = 크로노 멘더
block.item-liquid-teleport-chrono-mender.description = 전역의 모든 아군 건물을 지속적으로 치유합니다. 소규모 기지는 매초 여러 번 완전히 복구되며, 대규모 기지는 순환 스윕으로 치유됩니다. 전력이나 자원이 필요 없습니다.
block.item-liquid-teleport-chrono-repair-point.name = 크로노 수리 포인트
block.item-liquid-teleport-chrono-repair-point.description = 전역의 손상된 아군 유닛을 연속 빔으로 매초 최대 체력의 50%를 수리합니다.
block.item-liquid-teleport-chrono-build-tower.name = 크로노 건설 타워
block.item-liquid-teleport-chrono-build-tower.description = 바닐라 건설 타워 로직으로 전역의 구조물을 자동 재건하고 건설을 지원합니다.
block.item-liquid-teleport-chrono-booster.name = 크로노 부스터
block.item-liquid-teleport-chrono-booster.description = 추가 아이템과 액체로 범위와 속도를 가산 강화하는 1x1 오버드라이브 돔입니다.
block.item-liquid-teleport-chrono-buffer.name = 크로노 버퍼
block.item-liquid-teleport-chrono-buffer.description = 범위 내 아군 유닛에 버프를 부여합니다. 추가 아이템과 액체로 범위, 지속 시간이 증가하고 커스텀 상태가 해금됩니다.
block.item-liquid-teleport-chrono-debuffer.name = 크로노 디버퍼
block.item-liquid-teleport-chrono-debuffer.description = 범위 내 적 유닛에 중첩되는 부정적 상태 효과를 부여합니다. 추가 아이템과 액체로 범위와 지속 시간이 증가합니다.
