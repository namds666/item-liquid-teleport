block.item-liquid-teleport-chrono-hypno.name = 크로노 최면
block.item-liquid-teleport-chrono-hypno.description = 유리 하나를 살려 두는 1x1 블록입니다. 유리가 죽으면 10초 기다린 뒤 저장고의 실리콘 25를 써서 되살립니다. 유리는 20타일 안의 적 유닛이나 건물 하나를 묶어 2초 뒤 아군으로 전환합니다. 같은 대상에 유리가 더 많으면 더 빨리 전환합니다: 유리 둘이면 절반의 시간입니다. 묶음은 대상이 전환되거나 죽을 때까지 거리와 상관없이 유지됩니다. 코어는 전환할 수 없습니다. 코어의 아이템으로 업그레이드: 10레벨 각각이 사거리를 1타일 늘리고 시간을 최소 1초까지 줄입니다. 2x2로 놓인 크로노 최면 넷은 대형 크로노 최면로 합쳐집니다. 크로노 최면가 파괴되면 유리도 죽습니다.
unit.item-liquid-teleport-yuri.name = 유리
unit.item-liquid-teleport-yuri.description = 무기가 없는 초능력 메크입니다. 적 하나를 묶어 아군으로 전환합니다. 같은 대상에 유리가 더 많으면 더 빨리 전환합니다. 다른 유닛처럼 명령을 받습니다. 크로노 최면가 생성합니다.
block.item-liquid-teleport-chrono-hypno-big.name = 대형 크로노 최면
block.item-liquid-teleport-chrono-hypno-big.description = 크로노 최면 넷이 2x2로 놓이면 자동으로 만들어집니다. 대형 유리 하나를 살려 두고 실리콘 50으로 되살립니다. 대형 유리는 적 유닛이나 건물 둘을 동시에 묶습니다. 사거리, 시간, 업그레이드는 크로노 최면와 같으며, 합쳐진 뒤 레벨은 1부터 다시 시작합니다. 직접 건설할 수 없습니다.
unit.item-liquid-teleport-yuri-big.name = 대형 유리
unit.item-liquid-teleport-yuri-big.description = 무기가 없는 대형 초능력 메크입니다. 적 둘을 동시에 묶어 아군으로 전환합니다. 같은 대상에 유리가 더 많으면 더 빨리 전환합니다. 다른 유닛처럼 명령을 받습니다. 대형 크로노 최면가 생성합니다.
