block.item-liquid-teleport-chrono-hypno.name = Hipnose Crono
block.item-liquid-teleport-chrono-hypno.description = Mantém um Yuri vivo. Quando o Yuri morre, espera 10 segundos e gasta 25 de silício do seu armazenamento para o trazer de volta. O Yuri prende uma unidade ou construção inimiga de cada vez a 20 blocos e passa-a para o teu lado após 2 segundos; a ligação mantém-se a qualquer distância até o alvo ser convertido ou morrer. Os núcleos não podem ser convertidos. Melhora com itens do núcleo: cada um dos 10 níveis acrescenta 1 bloco de alcance e encurta o canal, até 1 segundo. O Yuri morre quando a Hipnose Crono é destruída.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Um mecha psíquico sem armas. Prende um inimigo de cada vez e converte-o para o teu lado. Aceita ordens como qualquer unidade. Criado por uma Hipnose Crono.
hypno.path = Poder de hipnose
hypno.value = {0} blocos, {1}s
