block.item-liquid-teleport-chrono-hypno.name = Hipnose Crono
block.item-liquid-teleport-chrono-hypno.description = Um bloco 1x1 que mantém um Yuri vivo. Quando Yuri morre, espera 10 segundos e usa 25 de silício do seu armazém para o trazer de volta. Yuri prende uma unidade ou edifício inimigo de cada vez a até 20 blocos e passa-o para o seu lado após 2 segundos. Mais Yuri no mesmo alvo convertem-no mais depressa: dois Yuri demoram metade do tempo. O laço mantém-se a qualquer distância até o alvo ser convertido ou morrer. Os núcleos não podem ser convertidos. Melhore com itens do núcleo: cada um dos 10 níveis acrescenta 1 bloco de alcance e encurta o tempo, até 1 segundo. Quatro Hipnose Crono num quadrado 2x2 fundem-se numa Grande Hipnose Crono. Yuri morre quando a Hipnose Crono é destruída.
unit.item-liquid-teleport-yuri.name = Yuri
unit.item-liquid-teleport-yuri.description = Um mech psíquico sem armas. Prende um inimigo de cada vez e passa-o para o seu lado. Mais Yuri no mesmo alvo convertem-no mais depressa. Aceita ordens como qualquer unidade. Criado por uma Hipnose Crono.
block.item-liquid-teleport-chrono-hypno-big.name = Grande Hipnose Crono
block.item-liquid-teleport-chrono-hypno-big.description = Forma-se sozinha quando quatro Hipnose Crono estão num quadrado 2x2. Mantém um Grande Yuri vivo e trá-lo de volta por 50 de silício. Grande Yuri prende duas unidades ou edifícios inimigos ao mesmo tempo. Mesmo alcance, tempo e melhorias da Hipnose Crono; após a fusão os níveis recomeçam no 1. Não pode ser construída diretamente.
unit.item-liquid-teleport-yuri-big.name = Grande Yuri
unit.item-liquid-teleport-yuri-big.description = Um grande mech psíquico sem armas. Prende dois inimigos ao mesmo tempo e passa-os para o seu lado. Mais Yuri no mesmo alvo convertem-no mais depressa. Aceita ordens como qualquer unidade. Criado por uma Grande Hipnose Crono.
hypno.path = Poder de hipnose
