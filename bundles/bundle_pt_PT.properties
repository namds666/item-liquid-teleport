item-liquid-teleport.displayName = Teleporte de Itens e Líquidos
item-liquid-teleport.subtitle = v1.4.17: Hipnose Crono é agora 1x1, quatro fundem-se numa Grande Hipnose Crono
item-liquid-teleport.description = Blocos Chrono de nível batota para transporte global de itens e líquidos, conversão de terreno e itens, reparação, construção, sobrecarga, bónus e penalizações de unidades, controlo mental e colocação de núcleos, além do Posto Avançado, uma base que constrói drones mineiros.\n\n[accent]v1.4.17[]\nHipnose Crono é agora 1x1. Quatro num quadrado 2x2 fundem-se numa Grande Hipnose Crono, cujo Grande Yuri prende dois alvos ao mesmo tempo. Mais Yuri num alvo convertem-no mais depressa: dois Yuri demoram metade do tempo.\n\n[accent]v1.4.16[]\nDescrição do mod mais curta com alterações por versão.\n\n[accent]v1.4.15[]\nPosto Avançado, Quad Posto Avançado e Mega Posto Avançado: a melhoria para nível de mineração 4 custa titânio e silício.\n\n[accent]v1.4.14[]\nNova Hipnose Crono: Yuri converte unidades e edifícios inimigos para o seu lado.\n\n[accent]v1.4.13[]\nOs raios de mineração extra do Posto Avançado apontam a blocos de minério diferentes.
block.item-liquid-teleport-chrono-unloader.name = Descarregador Crono
block.item-liquid-teleport-chrono-unloader.description = Retira um item escolhido de todos os edifícios ligados globalmente e envia-o por tapetes transportadores.
block.item-liquid-teleport-chrono-pusher.name = Empurrador Crono
block.item-liquid-teleport-chrono-pusher.description = Empurra todos os itens armazenados para os edifícios ligados globalmente.
block.item-liquid-teleport-chrono-liquid-unloader.name = Descarregador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-unloader.description = Retira um líquido escolhido de todos os edifícios ligados globalmente e envia-o por tubagens.
block.item-liquid-teleport-chrono-liquid-pusher.name = Empurrador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-pusher.description = Empurra um líquido escolhido para todos os edifícios ligados globalmente.
block.item-liquid-teleport-chrono-liquid-tiler.name = Ladrilhador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-tiler.description = Converte o terreno próximo no piso de líquido selecionado, um ladrilho de cada vez.
block.item-liquid-teleport-chrono-item-tiler.name = Ladrilhador de Minério Crono
block.item-liquid-teleport-chrono-item-tiler.description = Converte o terreno próximo na camada de minério selecionada, um ladrilho de cada vez.
