item-liquid-teleport.displayName = Teleporte de Itens e Líquidos
item-liquid-teleport.subtitle = v1.4.14: nova Hipnose Crono, Yuri converte inimigos para o teu lado
item-liquid-teleport.description = Adiciona blocos Crono de nível batota para transporte global de itens e líquidos, conversão de terreno, conversão de itens, reparação, construção, sobrecarregamento, bónus de unidade, penalidades de unidade, controlo mental e colocação de núcleo, mais o Posto Avançado, base de mineração com drones.\nAtualização: a nova Hipnose Crono mantém um Yuri vivo; Yuri prende um inimigo, unidade ou construção, de cada vez e converte-o para o teu lado; 10 níveis de melhoria aumentam o alcance e aceleram a conversão.\nAtualização: novo Posto Avançado Micro, um posto avançado 1x1 que minera minério de nível 1 e carvão após uma melhoria; quatro Postos Avançados Micro num quadrado 2x2 fundem-se num Posto Avançado Pequeno.\nAtualização: os drones do Posto Avançado ficam agora parados em qualquer ponto dentro do alcance de mineração e só se aproximam quando estão mais longe do que o alcance, por isso já não se empurram por um só lugar.\nAtualização: cada linha de melhoria de capacidade de carga do Posto Avançado foi reduzida a um quarto; os drones ajudantes do Quad Posto Avançado passam a escalar a capacidade com o nível de capacidade do drone pai.\nAtualização: os drones ajudantes do Quad Posto Avançado continuam ligados ao drone pai depois de carregar um jogo guardado e já não morrem ao entrar num mundo.\nAtualização: nova linha de melhoria Alcance de mineração torna o raio de mineração dos drones mais longo em cada Posto Avançado; os drones ajudantes do Quad Posto Avançado deslocam-se agora à mesma velocidade que o drone pai.\nAtualização: as melhorias do nível de mineração do Posto Avançado nunca custam recursos acima do nível que desbloqueiam; em Erekir cada melhoria do Posto Avançado usa recursos de Erekir.\nAtualização: os Mega e Quad Postos Avançados têm um design de edifício próprio com plataformas de hangar, escoras e um reator central.\nAtualização: quatro Postos Avançados Pequenos num quadrado 2x2 fundem-se num Mega Posto Avançado (4x4) e quatro Postos Avançados num Quad Posto Avançado (6x6); ambos constroem drones pesados com quatro vezes as estatísticas e uma escada de melhorias que chega a dezasseis vezes; os drones Quad lançam ajudantes Mono.\nAtualização: o seletor de minério do Posto Avançado desbloqueia minérios logo após uma melhoria do nível de mineração; um novo botão Mínimo faz o Posto extrair o minério disponível de que o núcleo tem menos.\nAtualização: com o roubo automático ativado, os descarregadores ligam apenas edifícios de outras equipas, incluindo abandonados; os edifícios da própria equipa são ignorados. Ativá-lo remove as ligações à própria equipa; desativá-lo remove as ligações a outras equipas.\nAtualização: a ligação automática agora só liga fontes que produzem o item selecionado; a verificação de categoria corre antes do filtro de itens para reduzir o lag; os seletores de itens do descarregador e do empurrador usam uma grelha 8x2.\nAtualização: todos os textos de blocos, unidades, estados e menus estão traduzidos para os 35 idiomas suportados pelo Mindustry; uma verificação bloqueia commits sem tradução.\nAtualização: novo Posto Avançado Pequeno, um Posto Avançado 2x2 baseado em mono com limites de melhoria inferiores; seletor de minério mostra uma linha por planeta; cores de custo de melhoria atualizam em tempo real.\nAtualização: novo bloco Posto Avançado constrói drones de mineração voadores que entregam o minério selecionado ao núcleo; gaste itens do núcleo para melhorar limite de unidades, velocidade, velocidade de mineração, capacidade de carga e nível de mineração.
block.item-liquid-teleport-chrono-unloader.name = Descarregador Crono
block.item-liquid-teleport-chrono-unloader.description = Retira um item escolhido de todos os edifícios ligados globalmente e envia-o por tapetes transportadores.
block.item-liquid-teleport-chrono-pusher.name = Empurrador Crono
block.item-liquid-teleport-chrono-pusher.description = Empurra todos os itens armazenados para os edifícios ligados globalmente.
block.item-liquid-teleport-chrono-liquid-unloader.name = Descarregador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-unloader.description = Retira um líquido escolhido de todos os edifícios ligados globalmente e envia-o por tubagens.
block.item-liquid-teleport-chrono-liquid-pusher.name = Empurrador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-pusher.description = Empurra um líquido escolhido para todos os edifícios ligados globalmente.
block.item-liquid-teleport-chrono-liquid-tiler.name = Ladrilhador de Líquidos Crono
block.item-liquid-teleport-chrono-liquid-tiler.description = Converte o terreno próximo no piso de líquido selecionado, um ladrilho de cada vez.
block.item-liquid-teleport-chrono-item-tiler.name = Ladrilhador de Minério Crono
block.item-liquid-teleport-chrono-item-tiler.description = Converte o terreno próximo na camada de minério selecionada, um ladrilho de cada vez.
