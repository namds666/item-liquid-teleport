item-liquid-teleport.displayName = Teleportasi Barang dan Cairan
item-liquid-teleport.subtitle = v1.3.4: terjemahan ke semua 35 bahasa Mindustry, pemeriksaan lokalisasi
item-liquid-teleport.description = Menambahkan blok Krono tingkat cheat untuk transportasi barang dan cairan global, konversi medan, konversi barang, perbaikan, konstruksi, overdrive, buff unit, debuff unit, dan penempatan inti, ditambah Pos Depan, basis penambangan drone.\nPembaruan: setiap teks blok, unit, status, dan menu diterjemahkan ke semua 35 bahasa yang didukung Mindustry; sebuah pemeriksaan memblokir commit yang kehilangan terjemahan.\nPembaruan: Pos Depan Kecil baru, Pos Depan 2x2 berbasis mono dengan batas peningkatan lebih rendah; pemilih bijih menampilkan satu baris per planet; warna biaya peningkatan diperbarui secara langsung.\nPembaruan: blok Pos Depan baru membangun drone penambangan terbang yang mengantarkan bijih terpilih ke inti; gunakan barang dari inti untuk meningkatkan batas unit, kecepatan, kecepatan tambang, kapasitas angkut, dan tingkat tambang.
block.item-liquid-teleport-chrono-unloader.name = Pembongkar Krono
block.item-liquid-teleport-chrono-unloader.description = Menarik barang pilihan dari semua bangunan terhubung secara global dan mengeluarkannya melalui konveyor.
block.item-liquid-teleport-chrono-pusher.name = Pendorong Krono
block.item-liquid-teleport-chrono-pusher.description = Mendorong semua barang tersimpan ke bangunan terhubung secara global.
block.item-liquid-teleport-chrono-liquid-unloader.name = Pembongkar Cairan Krono
block.item-liquid-teleport-chrono-liquid-unloader.description = Menarik cairan pilihan dari semua bangunan terhubung secara global dan mengeluarkannya melalui pipa.
block.item-liquid-teleport-chrono-liquid-pusher.name = Pendorong Cairan Krono
block.item-liquid-teleport-chrono-liquid-pusher.description = Mendorong cairan pilihan ke semua bangunan terhubung secara global.
block.item-liquid-teleport-chrono-liquid-tiler.name = Penurap Cairan Krono
block.item-liquid-teleport-chrono-liquid-tiler.description = Mengubah medan sekitar menjadi lantai cairan yang dipilih, satu ubin per waktu.
block.item-liquid-teleport-chrono-item-tiler.name = Penurap Bijih Krono
block.item-liquid-teleport-chrono-item-tiler.description = Mengubah medan sekitar menjadi lapisan bijih yang dipilih, satu ubin per waktu.
block.item-liquid-teleport-chrono-item-converter.name = Pengubah Barang Krono
block.item-liquid-teleport-chrono-item-converter.description = Mengubah barang masukan pilihan menjadi barang keluaran pilihan dengan rasio, kecepatan, dan biaya daya berdasarkan kelangkaan.
block.item-liquid-teleport-chrono-core.name = Inti Krono
block.item-liquid-teleport-chrono-core.description = Inti 1x1 tingkat cheat yang selalu terbuka dan memproduksi unit gamma.
block.item-liquid-teleport-chrono-mender.name = Pemulih Krono
block.item-liquid-teleport-chrono-mender.description = Terus-menerus menyembuhkan semua bangunan sekutu secara global. Basis kecil dipulihkan sepenuhnya beberapa kali per detik; basis lebih besar disembuhkan dalam sapuan bergulir. Tidak memerlukan daya atau sumber daya.
block.item-liquid-teleport-chrono-repair-point.name = Titik Perbaikan Krono
block.item-liquid-teleport-chrono-repair-point.description = Memperbaiki unit sekutu yang rusak secara global sebesar 50% nyawa maksimum per detik dengan sinar berkelanjutan.
block.item-liquid-teleport-chrono-build-tower.name = Menara Konstruksi Krono
block.item-liquid-teleport-chrono-build-tower.description = Secara otomatis membangun kembali struktur secara global dan membantu konstruksi dengan logika menara konstruksi standar.
block.item-liquid-teleport-chrono-booster.name = Penguat Krono
block.item-liquid-teleport-chrono-booster.description = Kubah overdrive 1x1 yang menerima barang dan cairan tambahan untuk peningkatan jangkauan dan kecepatan secara aditif.
block.item-liquid-teleport-chrono-buffer.name = Buffer Krono
block.item-liquid-teleport-chrono-buffer.description = Memberikan buff pada unit sekutu dalam jangkauan. Barang dan cairan tambahan meningkatkan radius, durasi, dan jumlah status kustom yang terbuka.
block.item-liquid-teleport-chrono-debuffer.name = Debuffer Krono
block.item-liquid-teleport-chrono-debuffer.description = Memberikan efek negatif bertumpuk pada unit musuh dalam jangkauan. Barang dan cairan tambahan meningkatkan radius dan durasi efek.
