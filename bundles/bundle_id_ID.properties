status.item-liquid-teleport-chrono-lubed.description = Meningkatkan kecepatan unit.
status.item-liquid-teleport-chrono-cryo.name = Krono Krio
status.item-liquid-teleport-chrono-cryo.description = Sangat meningkatkan kecepatan muat ulang unit.
block.item-liquid-teleport-outpost.name = Pos Depan
block.item-liquid-teleport-outpost.description = Membangun drone penambangan, satu setiap 5 detik, hingga batas unit. Pilih jenis bijih di menu blok; drone menambang bijih terdekat dari jenis itu dan mengantarkannya ke inti. Gunakan barang dari inti untuk meningkatkan lima jalur independen: batas unit, kecepatan drone, kecepatan tambang, kapasitas angkut, dan tingkat tambang. Drone mati saat Pos Depan dihancurkan.
unit.item-liquid-teleport-outpost-drone.name = Drone Pos Depan
unit.item-liquid-teleport-outpost-drone.description = Drone penambangan terbang yang diproduksi oleh Pos Depan. Statistiknya mengikuti tingkat peningkatan Pos Depan-nya.
block.item-liquid-teleport-outpost-small.name = Pos Depan Kecil
block.item-liquid-teleport-outpost-small.description = Pos Depan 2x2 yang membangun drone penambangan kecil, satu setiap 5 detik, hingga batas unit. Pilih jenis bijih di menu blok; drone menambang bijih terdekat dari jenis itu dan mengantarkannya ke inti. Lima jalur peningkatan dengan batas lebih rendah dari Pos Depan: batas unit, kecepatan drone, kecepatan tambang, kapasitas angkut, dan tingkat tambang (maks 2). Drone mati saat Pos Depan Kecil dihancurkan.
unit.item-liquid-teleport-outpost-small-drone.name = Drone Pos Depan Kecil
unit.item-liquid-teleport-outpost-small-drone.description = Drone penambangan terbang kecil yang diproduksi oleh Pos Depan Kecil. Statistiknya mengikuti tingkat peningkatan Pos Depan Kecil-nya.
